name: yallapp
description: "Yallapp: the white-label app for a client's WordPress academy."
publish_to: 'none'

# The build config (config/*.json) sets the real version through
# tool/apply_config.dart; this value is the fallback for local runs.
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  background_downloader: 9.6.3
  cryptography: 2.9.0
  device_info_plus: 13.2.0
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  go_router: ^17.5.0
  html: ^0.15.7
  # 46 The store's own rating prompt (Google Play In-App Review, SKStoreReviewController).
  in_app_review: 2.0.12
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  package_info_plus: 10.2.1
  path_provider: ^2.1.6
  qr_flutter: 4.1.0
  re_highlight: ^0.0.3
  share_plus: 13.3.0
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  video_player: 2.14.0
  web: ^1.1.1
  webview_flutter: ^4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Interface strings: lib/l10n/app_*.arb (English is the template).
  generate: true

  fonts:
    # Variable fonts from github.com/google/fonts (SIL OFL 1.1, licence files
    # next to each font). Bundled so the app never downloads fonts at runtime.
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/bricolagegrotesque/BricolageGrotesque-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plusjakartasans/PlusJakartaSans-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dmsans/DMSans-Variable.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/lexend/Lexend-Variable.ttf
    # Arabic letters for every font above (they have Latin only): the
    # theme's fallback, so Arabic looks the same on Android and iOS.
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/readexpro/ReadexPro-Variable.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Variable.ttf

# Transitive packages held back to releases that are at least two weeks old
# (project rule). Remove an entry once its newer release has aged.
dependency_overrides:
  jni: 1.0.3
  jni_flutter: 1.0.3
  video_player_avfoundation: 2.12.0
