<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#CBC3B4;position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF;transition:left .15s}
.sw:checked{background:#0E0D24}
.sw:checked::after{left:21px}
.sw:focus-visible{outline:2px solid #0E0D24;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFE6; font-family: 'Bricolage Grotesque', sans-serif; color: #0E0D24; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 32px 20px 12px; display: flex; align-items: center; gap: 12px">
    <a href="Profile.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
      <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">chevron_left</span>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Settings</h1>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5E5B70; padding: 0 4px">Display</span>
      <div style="background: #FFFFFF; border: 1px solid #E4DDD0; border-radius: 16px; overflow: hidden">
        <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 12px; font-size: 15px">
            <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">dark_mode</span>
            <span>Appearance</span>
          </div>
          <div role="radiogroup" aria-label="Appearance" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #E9E2D5; border-radius: 10px; padding: 3px; gap: 3px">
            <button type="button" role="radio" aria-checked="true" style="height: 34px; border: none; border-radius: 8px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; color: #0E0D24">System</button>
            <button type="button" role="radio" aria-checked="false" style="height: 34px; border: none; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; color: #5E5B70">Light</button>
            <button type="button" role="radio" aria-checked="false" style="height: 34px; border: none; border-radius: 8px; background: transparent; font-family: inherit; font-size: 13px; color: #5E5B70">Dark</button>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5E5B70; padding: 0 4px">Video</span>
      <div style="background: #FFFFFF; border: 1px solid #E4DDD0; border-radius: 16px; overflow: hidden">
        <a href="#quality" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0E0D24; border-bottom: 1px solid #EDE7DC; font-size: 15px">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">hd</span>
          <span style="flex: 1">Default quality</span>
          <span style="font-size: 14px; color: #5E5B70">Auto</span>
        </a>
        <a href="#speed" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0E0D24; border-bottom: 1px solid #EDE7DC; font-size: 15px">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">schedule</span>
          <span style="flex: 1">Playback speed</span>
          <span style="font-size: 14px; color: #5E5B70">1x</span>
        </a>
        <label style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 15px">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">autoplay</span>
          <span style="flex: 1">Autoplay next lesson</span>
          <input class="sw" type="checkbox" role="switch" checked>
        </label>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5E5B70; padding: 0 4px">Notifications</span>
      <div style="background: #FFFFFF; border: 1px solid #E4DDD0; border-radius: 16px; overflow: hidden">
        <label style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; border-bottom: 1px solid #EDE7DC">
          <span style="flex: 1">New lessons in my courses</span>
          <input class="sw" type="checkbox" role="switch" checked>
        </label>
        <label style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 15px; border-bottom: 1px solid #EDE7DC">
          <span style="flex: 1">Instructor announcements</span>
          <input class="sw" type="checkbox" role="switch" checked>
        </label>
        <label style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 15px">
          <span style="flex: 1">Daily study reminder</span>
          <input class="sw" type="checkbox" role="switch">
        </label>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5E5B70; padding: 0 4px">Security</span>
      <div style="background: #FFFFFF; border: 1px solid #E4DDD0; border-radius: 16px; overflow: hidden">
        <a href="#devices" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0E0D24; border-bottom: 1px solid #EDE7DC; font-size: 15px">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">devices</span>
          <span style="flex: 1">Registered devices</span>
          <span style="font-size: 14px; color: #5E5B70">1 of 2</span>
        </a>
        <a href="#delete" style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #B3261E; font-size: 15px">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">delete</span>
          <span style="flex: 1">Delete account</span>
        </a>
      </div>
    </div>

    <span style="font-size: 12px; color: #5E5B70; text-align: center">Version [version number]</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
