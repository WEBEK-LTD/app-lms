<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>06a · Opening a complaint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .lead { margin: 2px 16px 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
  .lead .ph { width: 40px; height: 40px; border-radius: 12px; }
  .lbl { padding: 13px 16px 7px; font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .lbl span { font-weight: 600; font-size: 12px; color: var(--muted); }
  .reasons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 16px; }
  .rs { height: 62px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 700; text-align: center; line-height: 1.15; padding: 0 4px; }
  .rs .i { font-size: 22px; color: var(--muted); }
  .rs.on { background: var(--tint); border-color: var(--accent); color: var(--tint-ink); box-shadow: 0 0 0 1px var(--accent) inset; }
  .rs.on .i { color: var(--accent); font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
  .items { margin: 0 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); padding: 2px 12px; }
  .it { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
  .it:last-child { border-bottom: 0; }
  .it .ph { width: 34px; height: 34px; border-radius: 10px; flex: none; }
  .it .nm { font-weight: 700; font-size: 13px; }
  .photos { display: flex; gap: 8px; padding: 0 16px; }
  .shot { width: 64px; height: 64px; border-radius: 16px; position: relative; flex: none; }
  .shot .x { position: absolute; top: -6px; inset-inline-end: -6px; width: 22px; height: 22px; border-radius: 11px; background: var(--ink); color: var(--page); display: grid; place-items: center; }
  .shot .x .i { font-size: 15px; }
  .addshot { width: 64px; height: 64px; border-radius: 16px; border: 1.5px dashed var(--accent); color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; gap: 2px; flex: none; }
  .text { margin: 0 16px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--accent); padding: 11px 13px 8px; font-size: 13.5px; line-height: 1.45; }
  .text .count { text-align: end; font: 600 11px/1 var(--display); color: var(--faint); margin-top: 6px; }
  .dock { padding: 10px 16px 28px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const R = [
  ["inventory_2", t("Missing items", "أصناف ناقصة")], ["swap_horiz", t("Wrong items", "أصناف خاطئة")], ["sentiment_dissatisfied", t("Quality", "الجودة"), 1], ["broken_image", t("Damaged", "تالف")],
  ["schedule", t("Late", "تأخر")], ["receipt_long", t("Charged wrong", "خطأ في المبلغ")], ["two_wheeler", t("The courier", "المندوب")], ["more_horiz", t("Something else", "سبب آخر")],
];
const it = (img, name, qty, on) => `<div class="it"><span class="check${on ? " on" : ""}"></span><span class="ph" style="${bg(img)}"></span><span class="grow nm ellipsis">${name}</span><span class="muted small num">${qty}</span></div>`;
mount(`
<div class="phone">
  ${statusBar()}
  <div class="scroll">
    <div class="appbar">
      <div class="round flat">${icon("close")}</div>
      <div class="grow"><h1 style="font:700 19px/1.1 var(--display)">${t("Report a problem", "الإبلاغ عن مشكلة")}</h1><div class="small muted" style="margin-top:2px">${t("Zad Market", "زاد ماركت")} · ${n("#4821")} · ${t("arrived 19:52", "وصل 19:52")}</div></div>
      <span class="pill amber" style="height:26px;font-size:11.5px">${icon("timer", "f")}${t("47 h left", "متبقٍ 47 ساعة")}</span>
    </div>
    <div class="lbl">${t("What went wrong?", "ما المشكلة؟")}</div>
    <div class="reasons">${R.map(([ic, l, on]) => `<div class="rs${on ? " on" : ""}">${icon(ic)}${l}</div>`).join("")}</div>

    <div class="lbl">${t("Which items?", "أي الأصناف؟")}<span>${t("Or the whole order", "أو الطلب كله")}</span></div>
    <div class="items">
      ${it("white-cheese.jpg", t("White cheese, sliced", "جبنة بيضاء، شرائح"), grams(780), true)}
      ${it("bananas.jpg", t("Bananas", "موز"), grams(1050), true)}
      ${it("eggs.jpg", t("Eggs, 15", "بيض، 15 بيضة"), "×2", false)}
    </div>

    <div class="lbl">${t("Photos", "الصور")}<span>${t("2 of 5", "2 من 5")}</span></div>
    <div class="photos">
      <div class="shot ph" style="${bg("bananas.jpg")}"><span class="x">${icon("close")}</span></div>
      <div class="shot ph" style="${bg("white-cheese.jpg")}"><span class="x">${icon("close")}</span></div>
      <div class="addshot">${icon("add_a_photo")}${t("Add", "إضافة")}</div>
    </div>

    <div class="lbl">${t("Tell us more", "أخبرنا بالمزيد")}</div>
    <div class="text">${t("The bananas are bruised and soft, and the cheese tastes sour, as if it were old.", "الموز مكدوم وطري، والجبنة طعمها حامض كأنها قديمة.")}<div class="count">${t("82 / 2,000", "2,000 / 52")}</div></div>
  </div>
  <div class="dock">
    <div class="small muted" style="text-align:center;margin-bottom:8px">${icon("lock", "", "font-size:15px")} ${t("Zad support answers here in the app. The store never sees your phone.", "يرد عليك دعم زاد هنا في التطبيق، ولا يرى المتجر رقم هاتفك.")}</div>
    <div class="btn">${icon("send", "flip")}${t("Send to support", "أرسل إلى الدعم")}</div>
  </div>
  ${homeInd()}
</div>`);
</script>
</body>
</html>
