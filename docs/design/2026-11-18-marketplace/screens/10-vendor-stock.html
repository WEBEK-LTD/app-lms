<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>10 · Vendor app: stock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .vsearch { display: flex; gap: 8px; margin-top: 12px; }
  .vsearch .field { flex: 1; background: rgba(255,255,255,.12); color: rgba(255,255,255,.75); height: 46px; }
  .vsearch .scan { width: 46px; height: 46px; border-radius: 15px; background: var(--amber); color: #241700; display: grid; place-items: center; flex: none; }
  .filters { display: flex; gap: 6px; padding: 12px 16px 2px; overflow: hidden; }
  .filters > span { flex: none; height: 32px; border-radius: 16px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
  .filters > span b { font: 700 11px/1 "Lexend", sans-serif; opacity: .6; }
  .filters > span.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .filters > span.warn { color: var(--danger); }
  .list { padding: 8px 16px 0; }
  .pr { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 18px; padding: 9px 10px; margin-bottom: 7px; box-shadow: var(--shadow); }
  .pr .ph { width: 46px; height: 46px; border-radius: 13px; flex: none; }
  .pr.out .ph { filter: grayscale(1); opacity: .5; }
  .pr .nm { font-weight: 700; font-size: 13.5px; }
  .pr .sku { font: 500 10.5px/1.2 var(--mono); color: var(--faint); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr .stock { font-size: 11px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .price { height: 32px; border-radius: 10px; border: 1px solid var(--line); padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font: 700 12.5px/1 "Lexend", sans-serif; white-space: nowrap; }
  .price .i { font-size: 14px; color: var(--muted); }
  .edit { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-strong); border: 2px solid var(--accent); padding: 12px; margin-bottom: 7px; }
  .pin { display: flex; gap: 8px; margin-top: 10px; }
  .pin .f { flex: 1; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); padding: 7px 11px; }
  .pin .f.on { border: 2px solid var(--accent); background: var(--surface); }
  .pin .f small { font-size: 10.5px; color: var(--muted); font-weight: 700; display: block; }
  .pin .f b { font: 800 19px/1.25 "Lexend", sans-serif; letter-spacing: -.5px; }
  .pin .f .caret { display: inline-block; width: 2px; height: 18px; background: var(--accent); vertical-align: -2px; margin-inline-start: 2px; }
  .eacts { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 45; border-radius: 18px; background: var(--ink); color: var(--page); padding: 11px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-strong); }
  .toast .ph { width: 32px; height: 32px; border-radius: 9px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const row = ({ img, name, sku, price, unit, stock, on, out }) => `
  <div class="pr${out ? " out" : ""}">
    <div class="ph" style="${bg(img)}"></div>
    <div class="grow"><div class="nm ellipsis">${name}</div><div class="sku">${sku}</div><div class="stock" style="color:${out ? "var(--danger)" : "var(--ok)"}">${stock}</div></div>
    <span class="price">${price}${unit ? `<span style="font:600 10px/1 var(--font);color:var(--muted)">/${unit}</span>` : ""}${icon("edit")}</span>
    <span class="toggle${on ? " on" : ""}"></span>
  </div>`;
mount(`
<div class="phone">
  ${statusBar(true)}
  <div class="vhead">
    <div class="row"><div class="grow"><div style="font:700 20px/1.1 var(--display)">${t("Stock", "المخزون")}</div><div class="small" style="opacity:.75;margin-top:3px">${t("Zad Market · 30 products · 2 out", "زاد ماركت · 30 منتجًا · 2 غير متوفرين")}</div></div><span class="round" style="width:38px;height:38px;background:rgba(255,255,255,.12);box-shadow:none;color:#fff">${icon("add")}</span></div>
    <div class="vsearch"><div class="field">${icon("search")}${t("Name, SKU or barcode", "الاسم أو SKU أو الباركود")}</div><div class="scan">${icon("barcode_scanner")}</div></div>
  </div>
  <div class="filters">
    <span class="on">${t("All", "الكل")} <b>30</b></span>
    <span class="warn">${icon("block", "", "font-size:15px")}${t("Out of stock", "غير متوفر")} <b>2</b></span>
    <span>${icon("scale", "", "font-size:15px")}${t("By weight", "بالوزن")} <b>9</b></span>
    <span>${icon("sell", "", "font-size:15px")}${t("Offers", "العروض")} <b>2</b></span>
  </div>
  <div class="list">
    <div class="edit">
      <div class="row" style="gap:10px">
        <div class="ph" style="${bg("bananas.jpg")};width:46px;height:46px;border-radius:13px;flex:none"></div>
        <div class="grow"><div class="nm" style="font-weight:800;font-size:14px">${t("Bananas", "موز")}</div><div class="sku" style="font:500 10.5px/1 var(--mono);color:var(--faint);margin-top:3px">FRT-BAN <span style="font-family:var(--font)">· ${t("per kg", "للكيلو")}</span></div></div>
        <span class="toggle on"></span>
      </div>
      <div class="pin">
        <div class="f on"><small>${t("New price / kg", "السعر الجديد / كغ")}</small><b>32.00<span class="caret"></span></b></div>
        <div class="f"><small>${t("Shown as was", "يظهر قبل الخصم")}</small><b class="strike" style="font-weight:700">35.00</b></div>
      </div>
      <div class="eacts">
        <span class="row small" style="gap:6px;font-weight:700"><span class="check on"></span>${t("Show as an offer", "اعرضه كعرض")}</span>
        <span class="grow"></span>
        <span class="btn ghost sm">${t("Cancel", "إلغاء")}</span>
        <span class="btn sm">${t("Save", "حفظ")}</span>
      </div>
      <div class="small muted" style="margin-top:8px">${icon("info", "", "font-size:15px")} ${t("Applies at once to new orders, not to the 2 already placed.", "يسري فورًا على الطلبات الجديدة، لا على الطلبين القائمين.")}</div>
    </div>
    ${row({ img: "oranges.jpg", name: t("Oranges", "برتقال"), sku: "FRT-ORA", price: money(25), unit: t("kg", "كغ"), stock: t("In stock", "متوفر"), on: true })}
    ${row({ img: "egyptian-rice.jpg", name: t("Egyptian rice, 1 kg", "أرز مصري، 1 كغ"), sku: "PAN-RIC · 6221034500127", price: money(38), stock: t("Out since 19:21", "غير متوفر منذ 19:21"), on: false, out: true })}
    ${row({ img: "eggs.jpg", name: t("Eggs, 30", "بيض، 30 بيضة"), sku: "DAI-EGG · 6224008211306", price: money(165), stock: t("In stock · 40 left", "متوفر · بقي 40"), on: true })}
    ${row({ img: "mineral-water.jpg", name: t("Mineral water, 1.5 l", "مياه معدنية، 1.5 لتر"), sku: "DRK-WAT", price: money(8), stock: t("In stock", "متوفر"), on: true })}
  </div>
  <div class="toast"><span class="ph" style="${bg("egyptian-rice.jpg")}"></span><span class="grow">${t("Scanned: Egyptian rice, 1 kg", "تمت القراءة: أرز مصري، 1 كغ")}</span><span style="color:var(--amber);font-weight:800">${t("Open", "فتح")}</span></div>
  ${vtabs("stock", 2)}
  ${homeInd()}
</div>`);
</script>
</body>
</html>
