<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>02 · A department</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .top { padding: 6px 16px 0; display: flex; align-items: center; gap: 10px; }
  .title { flex: 1; }
  .title h1 { font: 700 21px/1.1 var(--display); letter-spacing: -.4px; }
  .title div { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .aisles { margin-top: 14px; }
  .aisle-chip { flex: none; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px 0 5px; border-radius: 23px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 13.5px; }
  [dir="rtl"] .aisle-chip { padding: 0 5px 0 14px; }
  .aisle-chip .ph { width: 36px; height: 36px; border-radius: 18px; }
  .aisle-chip.on { background: var(--fill); color: var(--on-fill); border-color: var(--fill); }
  .aisle-chip.all { padding: 0 16px; }
  .tools { overflow: hidden; display: flex; gap: 8px; padding: 12px 16px 0; align-items: center; }
  .tool { white-space: nowrap; flex: none; height: 32px; border-radius: 10px; padding: 0 10px; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; background: var(--field); color: var(--ink); }
  .tool .i { font-size: 17px; }
  .tool.on { background: var(--amber-soft); color: var(--amber-ink); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px 0; }
  .p { background: var(--surface); border-radius: 22px; padding: 6px 6px 11px; box-shadow: var(--shadow); position: relative; }
  .p .img { height: 118px; border-radius: 17px; position: relative; }
  .p .badge { position: absolute; top: 8px; inset-inline-start: 8px; height: 24px; border-radius: 8px; padding: 0 8px; display: flex; align-items: center; gap: 4px; font: 800 11.5px/1 var(--display); }
  .p .badge.offer { background: var(--amber); color: #241700; }
  .p .badge.kg { background: rgba(9,19,14,.66); color: #fff; backdrop-filter: blur(6px); font-family: var(--font); font-weight: 700; }
  .p .badge .i { font-size: 14px; }
  .p .ctl { position: absolute; bottom: 8px; inset-inline-end: 8px; }
  .p .ctl .step { box-shadow: var(--shadow-strong); }
  .p .ctl .step b { min-width: 48px; font-size: 13px; }
  .p .name { font-weight: 700; font-size: 14px; margin: 10px 6px 0; }
  .p .meta { font-size: 11.5px; color: var(--muted); margin: 2px 6px 0; }
  .p .price { display: flex; align-items: baseline; gap: 5px; margin: 7px 6px 0; white-space: nowrap; }
  .p .price .strike { font-size: 11px; }
  .p .price b { font: 700 15px/1 var(--display); }
  .p .price .unit { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .p.out .img { filter: grayscale(.9); opacity: .55; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 16px 0; font-size: 12.5px; color: var(--muted); }
  .pager .bar { width: 90px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .pager .bar i { display: block; width: 44%; height: 100%; background: var(--accent); }
  .cartbar { position: absolute; left: 16px; right: 16px; bottom: 24px; height: 62px; border-radius: 31px; background: var(--poster); color: #fff; display: flex; align-items: center; padding: 0 8px 0 10px; gap: 10px; box-shadow: var(--shadow-strong); z-index: 20; }
  [dir="rtl"] .cartbar { padding: 0 10px 0 8px; }
  .cartbar .count { width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,.14); display: grid; place-items: center; font: 800 16px/1 "Lexend", sans-serif; }
  .cartbar .go { height: 46px; border-radius: 23px; background: var(--amber); color: #241700; display: flex; align-items: center; gap: 6px; padding: 0 16px; font-weight: 800; }
  .free { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 19; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 9px 12px; display: flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; }
  .free .meter { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .free .meter i { display: block; height: 100%; width: 72%; background: linear-gradient(90deg, var(--accent), var(--amber)); border-radius: 3px; }
  [dir="rtl"] .free .meter i { background: linear-gradient(270deg, var(--accent), var(--amber)); margin-inline-start: auto; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const card = ({ img, name, meta, price, was, unit, badge, ctl, out }) => `
  <div class="p${out ? " out" : ""}">
    <div class="img ph" style="${bg(img)}">
      ${badge || ""}
      <div class="ctl">${ctl}</div>
    </div>
    <div class="name ellipsis">${name}</div>
    <div class="meta ellipsis">${meta}</div>
    <div class="price"><b>${price}</b>${unit ? `<span class="unit">/${unit}</span>` : ""}${was ? `<span class="strike small num">${was}</span>` : ""}</div>
  </div>`;
const kg = t("kg", "كغ");
const add = `<div class="add">${icon("add")}</div>`;
const stepper = (v) => `<div class="step">${icon("remove")}<b>${v}</b>${icon("add")}</div>`;
mount(`
<div class="phone">
  ${statusBar()}
  <div class="scroll">
    <div class="top">
      <div class="round flat">${icon("arrow_back", "flip")}</div>
      <div class="title"><h1>${t("Fruit & vegetables", "فاكهة وخضار")}</h1><div>${t("Zad Market · 9 products in 2 aisles", "زاد ماركت · 9 منتجات في ممرين")}</div></div>
      <div class="round flat">${icon("search")}</div>
      <div class="round flat">${icon("barcode_scanner")}</div>
    </div>
    <div class="chips aisles">
      <div class="aisle-chip all on">${t("All", "الكل")} <span class="num small" style="opacity:.6">9</span></div>
      <div class="aisle-chip"><span class="ph" style="${bg("oranges.jpg")}"></span>${t("Fresh fruit", "فاكهة طازجة")} <span class="num small" style="opacity:.7">4</span></div>
      <div class="aisle-chip"><span class="ph" style="${bg("tomatoes.jpg")}"></span>${t("Vegetables", "خضروات")} <span class="num small" style="opacity:.6">5</span></div>
    </div>
    <div class="tools">
      <span class="tool">${icon("swap_vert")}${t("Popular", "الأكثر طلبًا")}</span>
      <span class="tool">${icon("sell")}${t("Offers", "العروض")}</span>
      <span class="tool">${icon("scale")}${t("By weight", "بالوزن")}</span>
      <span class="tool">${icon("inventory_2")}${t("In stock", "متوفر")}</span>
    </div>
    <div class="grid">
      ${card({ img: "bananas.jpg", name: t("Bananas", "موز"), meta: t("Egyptian · about 6 a kilo", "مصري · نحو 6 حبات في الكيلو"), price: money(35), unit: kg,
        badge: `<span class="badge kg">${icon("scale")}${t("By weight", "بالوزن")}</span>`, ctl: stepper(grams(1000)) })}
      ${card({ img: "oranges.jpg", name: t("Oranges", "برتقال"), meta: t("Baladi, for juice", "بلدي، للعصير"), price: money(25), unit: kg,
        badge: `<span class="badge kg">${icon("scale")}${t("By weight", "بالوزن")}</span>`, ctl: add })}
      ${card({ img: "tomatoes.jpg", name: t("Tomatoes", "طماطم"), meta: t("Red, firm", "حمراء، متماسكة"), price: money(18), was: money(22), unit: kg,
        badge: `<span class="badge offer">${n("−18%")}</span>`, ctl: stepper(grams(1500)) })}
      ${card({ img: "potatoes.jpg", name: t("Potatoes", "بطاطس"), meta: t("For frying and baking", "للقلي والخَبز"), price: money(15), unit: kg,
        badge: `<span class="badge kg">${icon("scale")}${t("By weight", "بالوزن")}</span>`, ctl: add })}
    </div>
    <div class="pager"><span>${t("4 of 9 shown", "عُرض 4 من 9")}</span><span class="bar"><i></i></span><span style="color:var(--accent);font-weight:700">${t("Loading more…", "جارٍ تحميل المزيد…")}</span></div>
  </div>
  <div class="free">${icon("local_shipping", "f", "color:var(--accent);font-size:20px")}<span>${t("Add", "أضف")} ${n(money(35.5))} ${t("for free delivery", "للتوصيل المجاني")}</span><span class="meter"><i></i></span></div>
  <div class="cartbar">
    <div class="count">6</div>
    <div class="grow"><div style="font-weight:800;font-size:15px">${t("View cart", "عرض السلة")}</div><div class="small" style="opacity:.8">${t("Estimated", "تقديريًا")} <span class="num">${money(114.5)}</span></div></div>
    <div class="go">${t("Checkout", "الدفع")}${icon("arrow_forward", "flip", "font-size:18px")}</div>
  </div>
  ${homeInd()}
</div>`);
</script>
</body>
</html>
