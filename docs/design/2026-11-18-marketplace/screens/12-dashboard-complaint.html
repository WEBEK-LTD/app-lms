<!doctype html>
<html data-size="dashboard">
<head>
<meta charset="utf-8">
<title>12 · Dashboard: a complaint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/dash.css">
<script src="../kit/kit.js"></script>
<script src="../kit/studio-shell.js"></script>
<style>
  .head { display: flex; align-items: flex-end; gap: 12px; margin-top: 6px; }
  .meta { display: flex; gap: 14px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .cols { display: grid; grid-template-columns: 300px 1fr 352px; gap: 14px; margin-top: 16px; align-items: start; }
  .sec { padding: 14px 16px; }
  .sec h3 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  [lang="ar"] .sec h3 { letter-spacing: 0; font-size: 13.5px; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .kv b { font-weight: 600; }
  .item { display: flex; gap: 9px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line-soft); font-size: 12.5px; }
  .item .ph { width: 32px; height: 32px; border-radius: 8px; flex: none; }
  .item.hit { background: var(--peach-soft); margin: 0 -16px; padding: 7px 16px; }
  .item .tag { font-size: 10.5px; font-weight: 700; color: var(--accent); }
  .shots { display: flex; gap: 6px; margin-top: 10px; }
  .shots span { width: 80px; height: 60px; border-radius: 9px; }
  .toggle { width: 38px; height: 22px; border-radius: 11px; background: var(--line-strong); position: relative; flex: none; }
  .toggle::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 8px; background: #fff; }
  .conv { display: flex; flex-direction: column; height: 820px; }
  .conv .top { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .thread { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .m { max-width: 78%; font-size: 13.5px; line-height: 1.45; }
  .m .b { padding: 10px 13px; border-radius: 14px; }
  .m .w { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; }
  .m.c { align-self: flex-start; }
  .m.c .b { background: var(--sand); border: 1px solid var(--line-soft); }
  .m.s { align-self: flex-end; }
  .m.s .w { justify-content: flex-end; }
  .m.s .b { background: var(--zad); color: #fff; }
  :root[data-theme="dark"] .m.s .b { color: #09130E; }
  .ev { align-self: center; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .ev .i { font-size: 16px; }
  .compose { border-top: 1px solid var(--line); padding: 12px 16px; }
  .qr { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .qr span { height: 28px; line-height: 26px; border-radius: 14px; border: 1px solid var(--line); padding: 0 10px; display: block; font-size: 12px; font-weight: 600; max-width: 300px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .box { border: 1.5px solid var(--line-strong); border-radius: 12px; padding: 10px 12px; min-height: 64px; font-size: 13px; color: var(--faint); }
  .opt { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .o { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .o .r { width: 16px; height: 16px; border-radius: 8px; border: 2px solid var(--line-strong); flex: none; }
  .o.on { border-color: var(--midnight); background: var(--sand); box-shadow: 0 0 0 1px var(--midnight) inset; }
  .o.on .r { border: 5px solid var(--midnight); }
  .lbl { font-size: 12.5px; font-weight: 600; margin: 12px 0 6px; }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .input { border: 1px solid var(--line-strong); border-radius: 10px; height: 40px; display: flex; align-items: center; padding: 0 12px; font-weight: 700; font-size: 15px; background: var(--white); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg span { flex: 1; text-align: center; padding: 8px 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-inline-end: 1px solid var(--line); }
  .seg span:last-child { border: 0; }
  .seg span.on { background: var(--midnight); color: var(--ivory); }
  .note { padding: 9px 11px; border-radius: 10px; background: var(--warn-bg); font-size: 12.5px; margin-top: 8px; }
  .note .w { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const logo = (f) => `../../../../platform/web/public/brand/${f}`;
const navItem = (ic, label, on, count) => `<div class="nav${on ? " on" : ""}">${icon(ic, on ? "f" : "")}<span>${label}</span>${count ? `<span class="count">${count}</span>` : ""}</div>`;
const side = `
  <aside class="side">
    <img class="logo l" src="${logo("yallapp-logo-primary-transparent.svg")}" alt="Yallapp">
    <img class="logo d" src="${logo("yallapp-logo-reversed-transparent.svg")}" alt="Yallapp">
    <div class="appcard"><span class="ic">${t("Z", "ز")}</span><div class="grow"><div style="font-weight:700">${t("Zad", "زاد")}</div><div class="small muted"><span class="dot"></span> ${t("Marketplace · Active", "السوق الإلكتروني · نشط")}</div></div>${icon("unfold_more", "", "color:var(--faint)")}</div>
    <div style="height:12px"></div>
    ${navItem("dashboard", t("Overview", "نظرة عامة"))}
    <div class="navh">${t("Your marketplace", "سوقك الإلكتروني")}</div>
    ${navItem("receipt_long", t("Marketplace orders", "طلبات السوق"))}
    ${navItem("support_agent", t("Complaints", "الشكاوى"), true, 6)}
    ${navItem("storefront", t("Vendors", "التجار"))}
    ${navItem("how_to_reg", t("Joining", "الانضمام"))}
    ${navItem("sell", t("Offers & club", "العروض والنادي"))}
    ${navItem("two_wheeler", t("Courier jobs", "مهام المناديب"))}
    ${navItem("tune", t("Marketplace settings", "إعدادات السوق"))}
    <div class="navh">${t("Publish", "النشر")}</div>
    ${navItem("build", t("Builds & downloads", "الإصدارات والتنزيلات"))}
    ${navItem("publish", t("Publishing", "النشر على المتاجر"))}
    <div class="me"><span class="av">${t("N", "ن")}</span><div class="grow"><div style="font-weight:600">${t("Nour, support", "نور، الدعم")}</div><div class="small muted">${t("Zad team", "فريق زاد")}</div></div>${icon("logout", "flip", "color:var(--faint)")}</div>
  </aside>`;
const item = (img, name, sub, price, hit) => `<div class="item${hit ? " hit" : ""}"><span class="ph" style="${bg(img)}"></span><div class="grow"><div style="font-weight:600" class="ellipsis">${name}</div><div class="muted" style="font-size:11.5px">${sub}${hit ? ` · <span class="tag">${t("in the complaint", "ضمن الشكوى")}</span>` : ""}</div></div><b style="font-weight:600;white-space:nowrap">${money(price)}</b></div>`;
mount(`
${studioShell(t("Complaints", "الشكاوى"), `
    <div class="crumbs">${icon("arrow_back", "flip", "font-size:17px")}${t("Back to complaints", "العودة إلى الشكاوى")}</div>
    <div class="head">
      <h1 class="grow">${t("Complaint", "الشكوى")} ${n("C-1093")}</h1>
      <span class="btn">${t("Status", "الحالة")}: <b>${t("In review", "قيد المراجعة")}</b>${icon("expand_more", "", "font-size:18px")}</span>
      <span class="btn"><span class="avs" style="background:#2F6F5E;width:22px;height:22px;font-size:10.5px">${t("N", "ن")}</span>${t("Assigned to", "مسندة إلى")} ${t("Nour", "نور")}${icon("expand_more", "", "font-size:18px")}</span>
    </div>
    <div class="meta">
      <span class="chip c-review">${t("Quality", "الجودة")}</span>
      <span>${icon("schedule", "", "font-size:17px")} ${t("Open 41 min", "مفتوحة منذ 41 د")}</span>
      <span class="t-ok" style="font-weight:600">${icon("chat", "", "font-size:17px")} ${t("Customer replied 3 min ago", "ردّ العميل منذ 3 د")}</span>
      <span>${icon("timer", "", "font-size:17px")} ${t("Can be opened until tomorrow 19:52", "يمكن فتح الشكاوى حتى الغد 19:52")}</span>
    </div>

    <div class="cols">
      <div class="col" style="display:flex;flex-direction:column;gap:14px">
        <div class="card sec">
          <h3>${t("The order", "الطلب")}<span class="chip c-ok" style="text-transform:none;letter-spacing:0">${t("Delivered", "تم التوصيل")}</span></h3>
          <div style="font-weight:700;font-size:15px">${n("#4821")} · ${t("Zad Market", "زاد ماركت")}</div>
          <div class="small muted" style="margin-top:2px">${t("Mona · placed 19:08 · arrived 19:52 · Karim", "منى · أُرسل 19:08 · وصل 19:52 · كريم")}</div>
          <div style="margin-top:10px">
            ${item("white-cheese.jpg", t("White cheese, sliced", "جبنة بيضاء، شرائح"), grams(780), 120, true)}
            ${item("bananas.jpg", t("Bananas", "موز"), grams(950), 33.25, true)}
            ${item("eggs.jpg", t("Eggs, 15", "بيض، 15 بيضة"), "×2", 160)}
            ${item("egyptian-rice.jpg", t("Short-grain rice, 1 kg", "أرز قصير الحبة، 1 كغ"), t("×2 · swap, accepted", "×2 · بديل بموافقة العميل"), 76)}
          </div>
          <div style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px">
            <div class="kv"><span class="muted">${t("Order total", "إجمالي الطلب")}</span><b>${money(389.25)}</b></div>
            <div class="kv"><span class="muted">${t("Paid with", "الدفع")}</span><b>${t("Card", "بطاقة")} •• 4242</b></div>
            <div class="kv"><span class="muted">${t("Refunded after weighing", "رُدّ بعد الوزن")}</span><b>${money(6.75)}</b></div>
            <div class="kv"><span class="muted">${t("Can still be refunded", "المتاح استرداده")}</span><b class="t-ok">${money(389.25)}</b></div>
          </div>
        </div>
        <div class="card sec">
          <h3>${t("Photos", "الصور")}<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">2</span></h3>
          <div class="shots"><span class="ph" style="${bg("bananas.jpg")}"></span><span class="ph" style="${bg("white-cheese.jpg")}"></span></div>
          <div class="row" style="margin-top:14px;font-size:13px"><span class="grow"><b style="font-weight:600">${t("Share with the place", "المشاركة مع المحل")}</b><div class="hint">${t("The place can't see this complaint.", "لا يرى المحل هذه الشكوى.")}</div></span><span class="toggle"></span></div>
        </div>
      </div>

      <div class="card conv">
        <div class="top"><span class="i f" style="color:var(--zad)">forum</span><b class="grow">${t("Conversation with the customer", "المحادثة مع العميل")}</b><span class="small muted">${t("In the app's chat", "في محادثة التطبيق")}</span></div>
        <div class="thread">
          <div class="m c"><div class="w"><b>${t("Customer", "العميل")}</b> · 20:05</div><div class="b">${t("The bananas are bruised and soft, and the cheese tastes sour, as if it were old.", "الموز مكدوم وطري، والجبنة طعمها حامض كأنها قديمة.")}<div class="shots" style="margin-top:8px"><span class="ph" style="${bg("bananas.jpg")};width:64px;height:48px"></span><span class="ph" style="${bg("white-cheese.jpg")};width:64px;height:48px"></span></div></div></div>
          <div class="ev">${icon("person_add")}${t("Nour took it · 20:11", "تولّتها نور · 20:11")}</div>
          <div class="m s"><div class="w">${t("Support", "الدعم")} · ${t("Nour", "نور")} · 20:12</div><div class="b">${t("I'm sorry about this. Was the cheese in a sealed pack, and do you see its date on it?", "نأسف لذلك. هل كانت الجبنة في عبوة مغلقة، وهل ترى تاريخها عليها؟")}</div></div>
          <div class="m c"><div class="w"><b>${t("Customer", "العميل")}</b> · 20:14</div><div class="b">${t("Sealed, yes. It says 16 November.", "نعم، مغلقة. التاريخ 16 نوفمبر.")}</div></div>
          <div class="m s"><div class="w">${t("Support", "الدعم")} · ${t("Nour", "نور")} · 20:16</div><div class="b">${t("Thank you, that helps. I'm checking with the store now; you'll see the decision here in a few minutes.", "شكرًا لك، هذا يساعدنا. أراجع الأمر مع المتجر الآن، وسترى القرار هنا خلال دقائق.")}</div></div>
          <div class="ev">${icon("sync_alt")}${t("Status: In review · 20:16", "الحالة: قيد المراجعة · 20:16")}</div>
        </div>
        <div class="compose">
          <div class="small muted" style="font-weight:600;margin-bottom:6px">${t("Ready replies", "ردود جاهزة")}</div>
          <div class="qr">
            <span>${t("We've added the amount to your wallet. You can use it on your next order.", "أضفنا المبلغ إلى محفظتك، ويمكنك استخدامه في طلبك القادم.")}</span>
            <span>${t("Thank you for telling us. We've passed this on so it doesn't happen again.", "شكرًا لإخبارنا. أبلغنا المتجر حتى لا يتكرر ذلك.")}</span>
            <span>${t("Could you send a photo of the items, so we can sort this out quickly?", "هل يمكنك إرسال صورة للمنتجات لنحل الأمر بسرعة؟")}</span>
          </div>
          <div class="box">${t("Write to the customer…", "اكتب للعميل…")}</div>
          <div class="row" style="margin-top:8px"><span class="btn">${icon("attach_file", "", "font-size:18px")}</span><span class="grow"></span><span class="btn dark">${icon("send", "flip", "font-size:17px")}${t("Send", "إرسال")}</span></div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card sec" style="border:1.5px solid var(--midnight)">
          <h3>${t("Decision", "القرار")}</h3>
          <div class="lbl" style="margin-top:0">${t("What you decide", "قرارك")}</div>
          <div class="opt">
            <div class="o"><span class="r"></span>${t("Full refund", "استرداد كامل")}</div>
            <div class="o on"><span class="r"></span>${t("Part refund", "استرداد جزئي")}</div>
            <div class="o"><span class="r"></span>${t("Compensation", "تعويض")}</div>
            <div class="o"><span class="r"></span>${t("No refund", "دون استرداد")}</div>
          </div>
          <div class="lbl">${t("Amount (EGP)", "المبلغ (ج.م)")}</div>
          <div class="input num">153.25<span class="grow"></span><span class="small muted" style="font-weight:500">${t("cheese + bananas", "الجبنة + الموز")}</span></div>
          <div class="lbl">${t("Give it", "يُردّ إلى")}</div>
          <div class="seg"><span>${t("Back to how they paid", "وسيلة الدفع نفسها")}</span><span class="on">${t("To their wallet", "محفظة العميل")}</span><span>${t("As a coupon", "قسيمة خصم")}</span></div>
          <div class="lbl">${t("Who bears it", "من يتحمله")}</div>
          <div class="seg"><span>${t("You", "أنت")}</span><span class="on">${t("The place", "المحل")}</span></div>
          <div class="lbl">${t("What the customer reads", "ما يقرؤه العميل")}</div>
          <div class="box" style="color:var(--midnight);min-height:54px">${t("We've added EGP 153.25 to your wallet for the cheese and the bananas.", "أضفنا 153.25 ج.م إلى محفظتك عن الجبنة والموز.")}</div>
          <div class="hint">${t("Needed for no refund. Customers read it in the app.", "مطلوب عند رفض الاسترداد، ويقرؤه العميل في التطبيق.")}</div>
          <div class="btn zad" style="width:100%;justify-content:center;margin-top:12px;height:42px">${icon("gavel", "", "font-size:18px")}${t("Decide", "اعتماد القرار")}</div>
        </div>
        <div class="card sec">
          <h3>${t("Team notes", "ملاحظات الفريق")}<span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px">${t("Only your team sees these.", "لا يراها إلا فريقك.")}</span></h3>
          <div class="note"><div class="w">${t("Nour · 20:18", "نور · 20:18")}</div>${t("Asked Zad Market about the cheese batch. Third complaint on it this week.", "سألت زاد ماركت عن دفعة الجبنة. ثالث شكوى عنها هذا الأسبوع.")}</div>
          <div class="box" style="margin-top:8px;min-height:40px">${t("A note for the team…", "ملاحظة للفريق…")}</div>
        </div>
      </div>
    </div>
`)}`);
</script>
</body>
</html>
