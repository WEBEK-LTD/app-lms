<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>07a · The wallet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .bal { margin: 4px 16px 0; border-radius: 30px; background: var(--poster); color: #fff; padding: 20px 18px 16px; position: relative; overflow: hidden; }
  .bal .arch1, .bal .arch2 { position: absolute; border-radius: 999px 999px 0 0; border: 2px solid rgba(242,169,59,.35); border-bottom: 0; }
  .bal .arch1 { width: 150px; height: 170px; bottom: -40px; inset-inline-end: -20px; }
  .bal .arch2 { width: 100px; height: 120px; bottom: -40px; inset-inline-end: 5px; border-color: rgba(242,169,59,.6); }
  .bal .big { font: 800 44px/1 "Lexend", sans-serif; letter-spacing: -2px; margin-top: 8px; }
  .bal .big small { font-size: 20px; letter-spacing: 0; opacity: .7; margin-inline-start: 4px; }
  .use { margin-top: 16px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.1); border-radius: 16px; padding: 10px 12px; position: relative; }
  .use .toggle.on { background: var(--amber); }
  :root .use .toggle.on::after, :root[data-theme="dark"] .use .toggle.on::after { background: #fff; }
  .facts { display: flex; gap: 8px; margin: 12px 16px 0; }
  .facts div { flex: 1; display: flex; gap: 8px; align-items: center; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 9px 10px; font-size: 11.5px; font-weight: 600; line-height: 1.25; }
  .facts .i { color: var(--accent); font-size: 20px; }
  .list { margin: 4px 16px 0; }
  .day { font-size: 12px; font-weight: 800; color: var(--muted); padding: 12px 2px 6px; }
  .en { display: flex; gap: 11px; align-items: center; background: var(--surface); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 8px; }
  .en .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; }
  .en .ic.in { background: var(--ok-soft); color: var(--ok); }
  .en .ic.out { background: var(--field); color: var(--muted); }
  .en .ic.gift { background: var(--amber-soft); color: var(--amber-ink); }
  .en .nm { font-weight: 700; font-size: 13.5px; }
  .en .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .en .amt { font: 700 14px/1 var(--display); white-space: nowrap; }
  .en .amt.in { color: var(--ok); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const entry = (kind, ic, name, sub, amt) => `<div class="en"><span class="ic ${kind}">${icon(ic, "f")}</span><div class="grow"><div class="nm ellipsis">${name}</div><div class="sub ellipsis">${sub}</div></div><span class="amt ${kind === "out" ? "" : "in"}">${kind === "out" ? "−" : "+"}${money(amt)}</span></div>`;
mount(`
<div class="phone">
  ${statusBar()}
  <div class="scroll">
    <div class="appbar">
      <div class="round flat">${icon("arrow_back", "flip")}</div>
      <h1>${t("Wallet", "المحفظة")}</h1>
      <div class="round flat">${icon("help")}</div>
    </div>
    <div class="bal">
      <span class="arch1"></span><span class="arch2"></span>
      <div class="kicker" style="color:#FFD27A">${t("Your balance", "رصيدك")}</div>
      <div class="big">${AR ? `201.65<small>ج.م</small>` : `<small style="margin:0 4px 0 0">EGP</small>201.65`}</div>
      <div class="small" style="opacity:.8;margin-top:6px;position:relative">${t("Pays all or part of any order in Zad", "تدفع به الطلب كله أو جزءًا منه في زاد")}</div>
      <div class="use"><span class="i f" style="color:var(--amber)">account_balance_wallet</span><div class="grow" style="font-weight:700;font-size:13px">${t("Use it at checkout first", "استخدمه أولًا عند الدفع")}</div><span class="toggle on"></span></div>
    </div>
    <div class="facts">
      <div>${icon("bolt", "f")}${t("Refunds land here at once", "تصل المبالغ المستردة فورًا")}</div>
      <div>${icon("all_inclusive")}${t("Your balance never expires", "رصيدك لا تنتهي صلاحيته")}</div>
    </div>
    <div class="list">
      <div class="day">${t("Today", "اليوم")}</div>
      ${entry("in", "undo", t("Refund · complaint C-1093", "استرداد · الشكوى C-1093"), t("Zad Market · order #4821 · 20:41", "زاد ماركت · الطلب ‎#4821 · 20:41"), 151.65)}
      <div class="day">${t("14 November", "14 نوفمبر")}</div>
      ${entry("out", "shopping_bag", t("Paid toward order #4790", "دُفع من الطلب ‎#4790"), t("Bab El Sharq Grill · the rest by card", "مشويات باب الشرق · والباقي بالبطاقة"), 120)}
      <div class="day">${t("2 November", "2 نوفمبر")}</div>
      ${entry("gift", "redeem", t("Credit from Zad", "رصيد من زاد"), t("Welcome to Zad Club", "أهلًا بك في نادي زاد"), 50)}
      <div class="day">${t("28 October", "28 أكتوبر")}</div>
      ${entry("in", "undo", t("Refund · order #4655 cancelled", "استرداد · أُلغي الطلب ‎#4655"), t("Nile Pizza Co.", "نايل بيتزا"), 120)}
    </div>
  </div>
  ${tabbar("account")}
  ${homeInd()}
</div>`);
</script>
</body>
</html>
