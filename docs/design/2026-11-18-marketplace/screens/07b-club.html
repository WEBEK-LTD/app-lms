<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>07b · The delivery club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .member { margin: 4px 16px 0; height: 192px; border-radius: 28px; position: relative; overflow: hidden; color: #fff; padding: 18px; background: linear-gradient(135deg, #134A36 0%, #0B2E21 55%, #1B644C 100%); box-shadow: var(--shadow-strong); }
  .member::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px); }
  .member .ring { position: absolute; width: 230px; height: 230px; border-radius: 50%; border: 26px solid rgba(242,169,59,.16); top: -60px; inset-inline-end: -80px; }
  .member .brand { display: flex; align-items: center; gap: 8px; position: relative; }
  .member .brand b { font: 800 20px/1 "Lexend", sans-serif; letter-spacing: -.5px; }
  [lang="ar"] .member .brand b { font-family: "Readex Pro", sans-serif; letter-spacing: 0; }
  .member .bolt { width: 34px; height: 34px; border-radius: 17px; background: var(--amber); color: #241700; display: grid; place-items: center; }
  .member .since { position: absolute; bottom: 16px; inset-inline-start: 18px; right: auto; font-size: 11.5px; opacity: .8; }
  [dir="rtl"] .member .since { left: auto; }
  .member .since b { display: block; font: 700 15px/1.3 var(--font); opacity: 1; color: #fff; }
  .member .plan { position: absolute; bottom: 16px; inset-inline-end: 18px; text-align: end; font-size: 11.5px; opacity: .9; }
  .member .plan b { display: block; font: 700 15px/1.3 var(--display); color: #FFD27A; }
  .save { margin: 12px 16px 0; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); padding: 14px 16px; }
  .save .big { font: 800 34px/1 "Lexend", sans-serif; letter-spacing: -1.2px; color: var(--accent); margin-top: 6px; }
  .bars { display: flex; gap: 8px; margin-top: 12px; }
  .bars div { flex: 1; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line-2); padding: 8px 10px; font-size: 11px; color: var(--muted); }
  .bars b { display: block; font: 700 14px/1.2 var(--display); color: var(--ink); margin-top: 2px; }
  .x { display: inline-flex; align-items: center; height: 24px; border-radius: 8px; padding: 0 8px; background: var(--amber-soft); color: var(--amber-ink); font: 800 12px/1 var(--display); }
  .plans { display: flex; gap: 10px; margin: 12px 16px 0; }
  .pl { flex: 1; border-radius: 22px; padding: 13px; background: var(--surface); border: 1.5px solid var(--line); position: relative; }
  .pl.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .pl .nm { font-weight: 800; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }
  .pl .pr { font: 800 20px/1 "Lexend", sans-serif; letter-spacing: -.6px; margin-top: 8px; }
  .pl .pr small { font: 600 11.5px/1 var(--font); color: var(--muted); letter-spacing: 0; }
  .pl .tag { position: absolute; top: -10px; inset-inline-end: 12px; height: 22px; border-radius: 11px; padding: 0 9px; background: var(--amber); color: #241700; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; }
  .perks { margin: 12px 16px 0; display: flex; flex-direction: column; gap: 7px; }
  .perk { display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; }
  .perk .i { width: 30px; height: 30px; border-radius: 10px; background: var(--tint); color: var(--tint-ink); display: grid; place-items: center; font-size: 18px; flex: none; }
  .foot { margin: 12px 16px 0; font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
mount(`
<div class="phone">
  ${statusBar()}
  <div class="scroll">
    <div class="appbar">
      <div class="round flat">${icon("arrow_back", "flip")}</div>
      <h1>${t("Zad Club", "نادي زاد")}</h1>
      <span class="pill ok" style="height:26px;font-size:11.5px">${icon("check_circle", "f")}${t("Member", "عضو")}</span>
    </div>
    <div class="member">
      <span class="ring"></span>
      <div class="brand"><span class="bolt">${icon("bolt", "f")}</span><b>${t("Zad Club", "نادي زاد")}</b></div>
      <div style="position:relative;margin-top:12px;font:700 16px/1.25 var(--display);max-width:250px">${t("Free delivery on orders over " + money(150, { whole: true }), "توصيل مجاني للطلبات فوق " + money(150, { whole: true }))}</div>
      <div class="since">${t("Member since", "عضو منذ")}<b>${t("2 September", "2 سبتمبر")}</b></div>
      <div class="plan">${t("Next payment 2 December", "الدفعة التالية 2 ديسمبر")}<b>${t("Monthly", "شهري")} · ${money(49, { whole: true })}</b></div>
    </div>

    <div class="save">
      <div class="row"><span class="kicker">${t("You've saved", "وفّرت")}</span><span class="grow"></span><span class="x">${t("3.5× what you paid", "3.5 أضعاف ما دفعت")}</span></div>
      <div class="big">${money(512)}</div>
      <div class="small muted" style="margin-top:4px">${t("since you joined, for", "منذ انضمامك، مقابل")} ${money(147)} ${t("in fees", "رسومًا")}</div>
      <div class="bars">
        <div>${t("This month", "هذا الشهر")}<b>${money(186)}</b></div>
        <div>${t("Free deliveries", "توصيلات مجانية")}<b>${t("16 of 19", "16 من 19")}</b></div>
        <div>${t("Members' offers", "عروض الأعضاء")}<b>${money(112)}</b></div>
      </div>
    </div>

    <div class="plans">
      <div class="pl on"><div class="nm">${t("Monthly", "شهري")}<span class="radio on"></span></div><div class="pr">${money(49, { whole: true })} <small>/ ${t("month", "شهر")}</small></div></div>
      <div class="pl"><span class="tag">${t("Two months free", "شهران مجانًا")}</span><div class="nm">${t("Yearly", "سنوي")}<span class="radio"></span></div><div class="pr">${money(490, { whole: true })} <small>/ ${t("year", "سنة")}</small></div></div>
    </div>
    <div class="perks">
      <div class="perk">${icon("local_shipping", "f")}${t("Free delivery by the app's couriers over " + money(150, { whole: true }), "توصيل مجاني بمندوبي التطبيق فوق " + money(150, { whole: true }))}</div>
      <div class="perk">${icon("sell", "f")}${t("Members' offers first", "عروض الأعضاء أولًا")}</div>
    </div>
    <div class="foot"><span>${t("We remind you on 30 November with a link to pay. Nothing is charged by itself.", "نذكّرك في 30 نوفمبر برابط للدفع، ولا يُخصم شيء تلقائيًا.")}</span><span class="see" style="font-size:12px">${t("End membership", "إنهاء العضوية")}</span></div>
  </div>
  ${tabbar("account")}
  ${homeInd()}
</div>`);
</script>
</body>
</html>
