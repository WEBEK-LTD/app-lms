<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>03 · A product sold by weight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .photo { position: absolute; inset: 0 0 auto 0; height: 282px; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,22,15,.45), transparent 40%); }
  .hbar { position: absolute; top: 52px; left: 16px; right: 16px; display: flex; gap: 10px; z-index: 5; }
  .dots { position: absolute; top: 232px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 5; }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.55); }
  .dots i.on { width: 18px; background: #fff; }
  .sheet { position: absolute; top: 254px; left: 0; right: 0; bottom: 0; background: var(--page); border-radius: 30px 30px 0 0; padding: 20px 16px 0; }
  .name { font: 700 24px/1.1 var(--display); letter-spacing: -.5px; }
  [lang="ar"] .name { letter-spacing: 0; }
  .priceline { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; }
  .priceline b { font: 800 26px/1 "Lexend", sans-serif; letter-spacing: -.8px; color: var(--accent); }
  .weigh { margin-top: 14px; background: var(--surface); border-radius: 26px; box-shadow: var(--shadow); padding: 14px; }
  .big-step { display: flex; align-items: center; justify-content: space-between; }
  .big-step .b { width: 52px; height: 52px; border-radius: 26px; display: grid; place-items: center; background: var(--tint); color: var(--tint-ink); }
  .big-step .b .i { font-size: 26px; font-variation-settings: "FILL" 0, "wght" 700, "GRAD" 0, "opsz" 24; }
  .big-step .b.plus { background: var(--fill); color: var(--on-fill); }
  .wt { text-align: center; }
  .wt b { font: 800 40px/1 "Lexend", sans-serif; letter-spacing: -1.5px; }
  .wt em { font: 700 18px/1 var(--display); font-style: normal; color: var(--muted); margin-inline-start: 4px; }
  .wt span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ruler { position: relative; height: 26px; margin: 12px 4px 0; direction: ltr; }
  .ruler .ticks { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 100%); background-size: 8.6% 10px; background-repeat: repeat-x; background-position: 0 bottom; }
  .ruler .fillbar { position: absolute; left: 0; bottom: 0; height: 4px; width: 38%; border-radius: 2px; background: var(--accent); }
  .ruler .knob { position: absolute; left: 38%; bottom: -5px; width: 14px; height: 14px; border-radius: 7px; background: var(--accent); transform: translateX(-50%); box-shadow: 0 0 0 4px var(--tint); }
  [dir="rtl"] .ruler { transform: scaleX(-1); }
  .quick { display: flex; gap: 6px; margin-top: 14px; }
  .quick span { flex: 1; height: 34px; border-radius: 12px; display: grid; place-items: center; font: 700 12.5px/1 var(--display); background: var(--surface-2); border: 1px solid var(--line-2); }
  .quick span.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .est { margin-top: 12px; display: flex; gap: 10px; }
  .est .box { flex: 1; border-radius: 20px; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); }
  .est .box.hi { background: var(--poster); border-color: var(--poster); color: #fff; }
  .est .box b { display: block; font: 800 19px/1.1 "Lexend", sans-serif; margin-top: 4px; letter-spacing: -.5px; }
  .note { margin-top: 10px; display: flex; gap: 9px; align-items: flex-start; padding: 11px 12px; border-radius: 16px; background: var(--amber-soft); color: var(--ink); font-size: 12.2px; line-height: 1.4; }
  .note .i { color: var(--amber-ink); font-size: 20px; }
  .opts { display: flex; gap: 6px; margin-top: 12px; }
  .opts .chip { height: 34px; font-size: 12.5px; padding: 0 11px; }
  .dock { padding: 12px 16px 28px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
mount(`
<div class="phone">
  ${statusBar(true)}
  <div class="photo ph" style="${bg("white-cheese.jpg")}"></div>
  <div class="hbar">
    <div class="round glass">${icon("close")}</div>
    <div class="grow"></div>
    <div class="round glass">${icon("favorite")}</div>
  </div>
  <div class="dots"><i class="on"></i><i></i><i></i></div>
  <div class="sheet">
    <div class="row"><div class="name grow">${t("White cheese", "جبنة بيضاء")}</div><span class="pill tint">${icon("scale", "f")}${t("Sold by weight", "يُباع بالوزن")}</span></div>
    <div class="priceline"><b>${money(160)}</b><span class="muted" style="font-weight:700">/ ${t("kg", "كغ")}</span><span class="faint small">· ${money(16)} / ${grams(100)}</span></div>

    <div class="weigh">
      <div class="big-step">
        <div class="b">${icon("remove")}</div>
        <div class="wt"><b>750</b><em>${t("g", "غ")}</em><span>${t("in steps of 250 g", "بخطوات 250 غ")}</span></div>
        <div class="b plus">${icon("add")}</div>
      </div>
      <div class="ruler"><div class="ticks"></div><div class="fillbar"></div><div class="knob"></div></div>
      <div class="quick"><span>${grams(250)}</span><span>${grams(500)}</span><span class="on">${grams(750)}</span><span>${grams(1000)}</span><span>${grams(2000)}</span></div>
    </div>

    <div class="est">
      <div class="box hi"><span class="small" style="opacity:.8">${t("Estimated price", "السعر التقديري")}</span><b>${money(120)}</b></div>
      <div class="box"><span class="small muted">${t("Paying cash: at most", "عند الدفع نقدًا: بحد أقصى")}</span><b>${money(132)}</b></div>
    </div>
    <div class="note">${icon("info", "f")}<span>${t("The final price comes after weighing. By card or wallet, you pay the estimate now; if it weighs less, we refund the difference. In cash, you pay what the scale reads, never more than 10% over.", "يُحدَّد السعر النهائي بعد الوزن. بالبطاقة أو المحفظة تدفع السعر التقديري الآن، وإذا جاء الوزن أقل نردّ إليك الفرق. ونقدًا تدفع ما يقرؤه الميزان، دون أن يزيد عن التقدير بأكثر من 10%.")}</span></div>
    <div class="opts">
      <span class="chip on">${icon("check", "", "font-size:16px")}${t("Sliced", "شرائح")}</span>
      <span class="chip">${t("One piece", "قطعة واحدة")}</span>
      <span class="chip">${icon("edit_note", "", "font-size:17px")}${t("Note", "ملاحظة")}</span>
    </div>
  </div>
  <div class="dock">
    <div class="btn">${icon("add_shopping_cart")}${t("Add", "أضف")} ${grams(750)} · ${t("about", "نحو")} ${money(120)}</div>
  </div>
  ${homeInd()}
</div>`);
</script>
</body>
</html>
