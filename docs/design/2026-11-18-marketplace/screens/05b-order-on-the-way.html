<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>05b · On the way, weighed and final</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/kit.js"></script>
<style>
  .map { position: absolute; inset: 0 0 auto 0; height: 340px; background: #E8E4D8; overflow: hidden; }
  :root[data-theme="dark"] .map { background: #0E1A15; }
  .map svg { position: absolute; inset: 0; }
  .mbar { position: absolute; top: 52px; left: 16px; right: 16px; display: flex; gap: 10px; z-index: 5; }
  .eta { position: absolute; top: 112px; inset-inline-start: 16px; z-index: 5; background: var(--surface); border-radius: 18px; padding: 8px 14px; box-shadow: var(--shadow-strong); }
  .eta b { font: 800 30px/1 "Lexend", sans-serif; letter-spacing: -1px; color: var(--accent); }
  .sheet { position: absolute; top: 300px; left: 0; right: 0; bottom: 0; background: var(--page); border-radius: 30px 30px 0 0; padding: 10px 16px 0; box-shadow: 0 -10px 30px rgba(0,0,0,.12); }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .courier { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
  .av { width: 50px; height: 50px; border-radius: 25px; background: var(--amber); color: #241700; display: grid; place-items: center; font: 800 19px/1 "Lexend", sans-serif; position: relative; flex: none; }
  .av .i { position: absolute; bottom: -4px; inset-inline-end: -4px; width: 24px; height: 24px; border-radius: 12px; background: var(--fill); color: var(--on-fill); font-size: 14px; display: grid; place-items: center; border: 2px solid var(--surface); }
  .plate { font: 700 11px/1 var(--mono); border: 1.5px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .final { margin-top: 12px; border-radius: 24px; background: var(--surface); border: 1px solid var(--line); padding: 14px; }
  .cmp { display: flex; align-items: stretch; gap: 8px; margin-top: 10px; }
  .cmp .b { flex: 1; border-radius: 16px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line-2); }
  .cmp .b.f { background: var(--poster); border-color: var(--poster); color: #fff; }
  .cmp .b span { font-size: 11.5px; opacity: .8; }
  .cmp .b b { display: block; font: 800 19px/1.1 "Lexend", sans-serif; letter-spacing: -.5px; margin-top: 3px; }
  .ln { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
  .ln:last-child { border-bottom: 0; }
  .ln b { font: 700 12.5px/1.2 var(--display); white-space: nowrap; }
  .ln .up { color: var(--amber-ink); }
  .ln .dn { color: var(--ok); }
  .meter { height: 8px; border-radius: 4px; background: var(--field); position: relative; margin: 12px 0 4px; }
  .meter i { position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 95%; border-radius: 4px; background: var(--accent); }
  .meter em { position: absolute; top: -4px; bottom: -4px; inset-inline-start: 91%; width: 2px; background: var(--amber); }
  .pay { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const dark = THEME === "dark";
const road = dark ? "#1E2E26" : "#FFFFFF", block = dark ? "#13221B" : "#DCD6C6", water = dark ? "#0F2A33" : "#BFD9E2", green = dark ? "#12291F" : "#CFE3C8";
const route = dark ? "#8FDDB9" : "#1B644C";
mount(`
<div class="phone">
  ${statusBar()}
  <div class="map">
    <svg viewBox="0 0 390 340" width="390" height="340" style="direction:ltr">
      <path d="M-20 250 C 80 230, 120 300, 220 290 S 360 250, 420 270 L 420 340 L -20 340 Z" fill="${water}"/>
      <rect x="20" y="40" width="110" height="80" rx="10" fill="${block}"/><rect x="150" y="30" width="90" height="100" rx="10" fill="${green}"/>
      <rect x="260" y="50" width="120" height="70" rx="10" fill="${block}"/><rect x="10" y="140" width="80" height="80" rx="10" fill="${block}"/>
      <rect x="110" y="150" width="130" height="70" rx="10" fill="${block}"/><rect x="260" y="140" width="110" height="90" rx="10" fill="${green}"/>
      <path d="M0 132 H390 M140 0 V250 M250 0 V250 M0 228 C 100 222, 200 236, 390 236" stroke="${road}" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M95 0 V140 M0 30 H390" stroke="${road}" stroke-width="5" fill="none"/>
      <path d="M58 92 H140 V132 H250 V200 H320" stroke="${route}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
      <path d="M58 92 H140 V132 H196" stroke="${route}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
      <circle cx="58" cy="92" r="9" fill="${dark ? "#12201A" : "#fff"}" stroke="${route}" stroke-width="4"/>
      <circle cx="320" cy="200" r="22" fill="${route}" opacity=".18"/><circle cx="320" cy="200" r="11" fill="#F2A93B" stroke="#fff" stroke-width="3"/>
      <circle cx="196" cy="132" r="24" fill="${route}" opacity=".18"/>
      <circle cx="196" cy="132" r="16" fill="${route}"/>
      <text x="196" y="138" text-anchor="middle" font-family="Material Symbols Rounded" font-size="19" fill="${dark ? "#09130E" : "#fff"}">two_wheeler</text>
    </svg>
  </div>
  <div class="mbar"><div class="round">${icon("arrow_back", "flip")}</div><div class="grow"></div><div class="round">${icon("support_agent")}</div></div>
  <div class="eta"><div class="small muted" style="font-weight:700">${t("On the way", "في الطريق")}</div><div class="row" style="gap:5px;align-items:baseline"><b>9</b><span style="font-weight:800">${t("min", "دقائق")}</span></div></div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="courier">
      <div class="av">${t("K", "ك")}<span class="i f">two_wheeler</span></div>
      <div class="grow">
        <div style="font-weight:800;font-size:15px">${t("Karim is bringing it", "كريم في طريقه إليك")}</div>
        <div class="row small muted" style="gap:6px;margin-top:3px">${icon("star", "f", "font-size:14px;color:var(--amber)")}<b class="num" style="color:var(--ink)">4.9</b>· ${t("Motorbike", "دراجة نارية")} <span class="plate">${t("ق ر ط 4821", "ق ر ط 4821")}</span></div>
      </div>
      <div class="round flat" style="background:var(--tint);color:var(--tint-ink);border:0">${icon("call", "f")}</div>
    </div>

    <div class="final">
      <div class="row"><span class="i f" style="color:var(--accent)">scale</span><div class="grow" style="font-weight:800;font-size:14.5px">${t("Weighed and final", "تم الوزن والسعر نهائي")}</div><span class="pill ok" style="height:24px;font-size:11px">${icon("verified", "f")}${t("Within 10%", "ضمن 10%")}</span></div>
      <div class="cmp">
        <div class="b"><span>${t("You were told", "التقدير")}</span><b class="strike" style="color:var(--muted)">${money(396)}</b></div>
        <div class="b f"><span>${t("Final price", "السعر النهائي")}</span><b>${money(415.55)}</b></div>
      </div>
      <div class="meter"><i></i><em></em></div>
      <div class="small muted">${t("Weighed items came to", "بلغت الأصناف الموزونة")} ${money(161.55)} ${t("of the limit of", "من حد")} ${money(170.5)}</div>
      <div style="margin-top:6px">
        <div class="ln"><span>${t("White cheese", "جبنة بيضاء")} · ${grams(780)} <span class="faint">${t("not", "بدل")} ${grams(750)}</span></span><b class="up">+${money(4.8)}</b></div>
        <div class="ln"><span>${t("Bananas", "موز")} · ${grams(1050)} <span class="faint">${t("not", "بدل")} ${grams(1000)}</span></span><b class="up">+${money(1.75)}</b></div>
        <div class="ln"><span>${t("Short-grain rice ×2, you accepted", "أرز قصير الحبة ×2، بموافقتك")}</span><b class="up">+${money(8)}</b></div>
        <div class="ln"><span>${t("Eggs, 15 ×2, your choice", "بيض 15 ×2، باختيارك")}</span><b class="up">+${money(5)}</b></div>
      </div>
      <div class="pay">${icon("credit_card", "", "font-size:18px")}<span>${t("Card •• 4242 is charged the final price when it arrives.", "تُخصم القيمة النهائية من البطاقة •• 4242 عند الوصول.")}</span></div>
    </div>
    <div class="row" style="margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--field)">${icon("report", "", "color:var(--muted)")}<span class="grow" style="font-size:13px;font-weight:600">${t("Something wrong with this order?", "مشكلة في هذا الطلب؟")}</span><span class="see">${t("Tell us", "أخبرنا")}</span></div>
  </div>
  ${homeInd()}
</div>`);
</script>
</body>
</html>
