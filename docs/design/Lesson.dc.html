    <div style="flex: 1; display: flex; align-items: center; justify-content: center">

    <div style="padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px">

          <button type="button" style="height: 28px; padding: 0 10px; border-radius: 8px; border: none; background: #24223F; color: #FFFFFF; font-family: inherit; font-size: 12px">1x</button>

          <button type="button" aria-label="Full screen" style="width: 28px; height: 28px; border-radius: 8px; border: none; background: #24223F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
            <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 16px; flex: none">fullscreen</span>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">

      <h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Lesson 7: Functions &amp; Variables</h1>
    </div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #E9E2D5; border-radius: 12px; padding: 4px; gap: 4px">
      <button type="button" role="tab" aria-selected="true" style="height: 38px; border: none; border-radius: 9px; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0E0D24">Lessons</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #5E5B70">Attachments</button>
      <button type="button" role="tab" aria-selected="false" style="height: 38px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 14px; color: #5E5B70">Q&amp;A</button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4DDD0; border-radius: 16px; overflow: hidden">
      <div style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDE7DC">

        <span style="flex: 1; font-size: 14px; color: #5E5B70">Lesson 6: Data types</span>
      </div>
      <div style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: #FFEDE4; border-bottom: 1px solid #EDE7DC">
        <span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #0E0D24; box-sizing: border-box; flex: none; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #0E0D24"></span></span>
        <span style="flex: 1; font-size: 14px; font-weight: 700; color: #0E0D24">Lesson 7: Functions &amp; Variables</span>
      </div>
      <a href="Quiz.dc.html" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0E0D24">
        <span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #CBC3B4; box-sizing: border-box; flex: none"></span>
        <span style="flex: 1; font-size: 14px">Module 2 quiz</span>
        <span style="font-size: 12px; color: #5E5B70">10 questions</span>
      </a>
    </div>
  </div>

  <div style="flex: none; background: #FFFFFF; border-top: 1px solid #E4DDD0; padding: 12px 20px 20px; display: flex; gap: 10px">
    <a href="#prev" aria-label="Previous lesson" style="width: 54px; height: 54px; flex: none; border-radius: 14px; background: #F4EFE6; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
      <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">chevron_left</span>
    </a>
    <button type="button" style="flex: 1; height: 54px; border-radius: 14px; border: none; background: #0E0D24; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 20px; flex: none">check</span>
      Mark as complete
    </button>
    <a href="Quiz.dc.html" aria-label="Next lesson" style="width: 54px; height: 54px; flex: none; border-radius: 14px; background: #F4EFE6; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
      <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">chevron_right</span>
    </a>
  </div>
</div>
