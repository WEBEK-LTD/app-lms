<!doctype html>
<html data-app="courier" data-variants="job,push">
<head>
<meta charset="utf-8">
<title>06 · Yallapp Courier: the job, and reaching the customer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="../kit/contact.css">
<link rel="stylesheet" href="../kit/courier.css">
<script src="../kit/kit.js"></script>
<script src="../kit/contact.js"></script>
<style>
  .mini { margin: 0 16px; border-radius: 22px; overflow: hidden; height: 150px; position: relative; }
  .mini .go { position: absolute; bottom: 10px; inset-inline-end: 10px; }
  .job { margin: 12px 16px 0; padding: 14px; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
  .cust { width: 46px; height: 46px; border-radius: 23px; background: var(--tint); color: var(--tint-ink); display: grid; place-items: center; font: 800 18px/1 var(--display); flex: none; }
  .kv { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line-2); font-size: 13px; }
  .kv .i { font-size: 19px; color: var(--muted); }
  .cash { margin: 12px 16px 0; padding: 12px 14px; border-radius: 18px; background: var(--amber-soft); color: var(--amber-ink); display: flex; gap: 10px; align-items: center; font-weight: 800; }
  .push { position: absolute; top: 50px; left: 10px; right: 10px; z-index: 90; border-radius: 22px; padding: 12px 14px; background: rgba(250,248,244,.94); color: #0E0D24; box-shadow: 0 10px 30px rgba(0,0,0,.25); backdrop-filter: blur(18px); display: flex; gap: 10px; }
  :root[data-theme="dark"] .push { background: rgba(40,38,60,.94); color: #F4EFE6; }
  .push .ic { width: 38px; height: 38px; border-radius: 10px; background: #0E0D24; color: #FF5A1F; display: grid; place-items: center; flex: none; font: 800 14px/1 "Bricolage", sans-serif; }
  :root[data-theme="dark"] .push .ic { background: #F4EFE6; color: #C2410C; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const push = V === "push";
mount(`
<div class="phone">
  ${statusBar()}
  ${push ? `<div class="push"><span class="ic">yc</span><div class="grow"><div class="row" style="gap:6px"><b style="font-size:13.5px">${t("Mona · Order", "منى · الطلب")} ${n("#4821")}</b><span class="grow"></span><span class="small" style="opacity:.6">${t("now", "الآن")}</span></div><div style="font-size:13.5px;margin-top:2px">${t("Leave it at the door", "اتركه عند الباب")}</div><div class="small" style="opacity:.6;margin-top:2px">${t("Zad · Yallapp Courier", "زاد · Yallapp Courier")}</div></div></div>` : ""}
  <div class="scroll">
    <div class="ychead">
      <div class="round flat" style="width:40px;height:40px">${icon("arrow_back", "flip")}</div>
      <span class="co">${t("Z", "ز")}</span>
      <div class="grow"><div style="font-weight:800;font-size:16px">${t("Zad", "زاد")}</div><div class="small muted">${t("Job", "المهمة")} ${n("J-2207")} · ${t("Order", "الطلب")} ${n("#4821")}</div></div>
      <span class="duty">${t("On duty", "في الخدمة")}</span>
    </div>
    <div class="mini">${map(358, 150)}<div class="btn sm go" style="height:38px">${icon("navigation", "f")}${t("Directions", "الاتجاهات")}</div></div>
    <div class="job">
      <div class="row" style="gap:12px">
        <span class="cust">${t("M", "م")}</span>
        <div class="grow"><div class="small muted" style="font-weight:700">${t("Deliver to", "التسليم إلى")}</div><div style="font-weight:800;font-size:17px">${t("Mona", "منى")}</div></div>
        <span class="pill tint" style="height:26px;font-size:11.5px">${t("On the way", "في الطريق")}</span>
      </div>
      <div class="contact" style="--ways:3">
        <div class="way main">${icon("chat", "f")}${t("Chat", "مراسلة")}${push ? `<span class="badge">1</span>` : ""}</div>
        <div class="way">${icon("wifi_calling_3", "f")}${t("App call", "اتصال بالتطبيق")}<small>${t("Over the internet", "عبر الإنترنت")}</small></div>
        <div class="way">${icon("call", "f")}${t("Phone call", "اتصال هاتفي")}<small>${t("Number hidden", "الرقم مخفي")}</small></div>
      </div>
      <div class="kv" style="margin-top:12px">${icon("location_on")}<div class="grow"><b>${t("14 Shagaret El Dor St, flat 6", "14 شارع شجرة الدر، شقة 6")}</b><div class="small muted">${t("Zamalek · 2.1 km · entrance on the side street", "الزمالك · 2.1 كم · المدخل من الشارع الجانبي")}</div></div></div>
      <div class="kv">${icon("storefront")}<div class="grow"><b>${t("From Zad Market", "من زاد ماركت")}</b><div class="small muted">${t("12 items in 3 bags · collected 20:27", "12 صنفًا في 3 أكياس · استُلمت 20:27")}</div></div></div>
      <div class="kv">${icon("lock")}<div class="grow small muted">${t("Mona's number is hidden. Calls show Zad's number on both phones, and work only until the order is delivered.", "رقم منى مخفي. تُظهر المكالمات رقم زاد على الهاتفين، وتعمل فقط حتى تسليم الطلب.")}</div></div>
    </div>
    <div class="cash">${icon("payments", "f")}<span class="grow">${t("Collect in cash", "حصّل نقدًا")}</span><span class="num">${money(415.55)}</span></div>
  </div>
  <div class="dock"><div class="btn">${icon("where_to_vote", "f")}${t("Delivered", "تم التسليم")}</div></div>
  ${homeInd()}
</div>`);
</script>
</body>
</html>
