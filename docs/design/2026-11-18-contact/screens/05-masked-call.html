<!doctype html>
<html data-variants="ringing,error">
<head>
<meta charset="utf-8">
<title>05 · A masked phone call: the click-to-call bridge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="../kit/contact.css">
<script src="../kit/kit.js"></script>
<script src="../kit/contact.js"></script>
<style>
  .under { position: absolute; inset: 0; filter: saturate(.9); }
  .ring { width: 64px; height: 64px; border-radius: 32px; background: var(--tint); color: var(--tint-ink); display: grid; place-items: center; margin: 4px auto 0; box-shadow: 0 0 0 10px color-mix(in srgb, var(--tint) 45%, transparent); }
  .ring .i { font-size: 30px; }
  .ring.bad { background: var(--danger-soft); color: var(--danger); box-shadow: none; }
  h3 { font: 700 21px/1.25 var(--display); text-align: center; margin-top: 18px; letter-spacing: -.3px; }
  [lang="ar"] h3 { letter-spacing: 0; }
  .lead { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 6px; line-height: 1.45; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const err = V === "error";
const sheet = err
  ? `<div class="ring bad">${icon("phone_disabled", "f")}</div>
     <h3>${t("Phone calls aren't working right now", "الاتصال الهاتفي لا يعمل حاليًا")}</h3>
     <div class="lead">${t("We couldn't place the call. Nothing was charged to you. Write to Karim instead, or call him over the internet.", "تعذّر إجراء الاتصال، ولم يُحتسب عليك أي شيء. راسل كريم بدلًا من ذلك، أو اتصل به عبر الإنترنت.")}</div>
     <div class="btn" style="margin-top:20px">${icon("chat", "f")}${t("Chat with Karim", "مراسلة كريم")}</div>
     <div class="btn ghost" style="margin-top:10px">${icon("wifi_calling_3", "f")}${t("App call", "اتصال بالتطبيق")}</div>`
  : `<div class="ring">${icon("phone_in_talk", "f")}</div>
     <h3>${t("We're calling your phone now", "نتصل بهاتفك الآن")}</h3>
     <div class="lead">${t("A normal phone call: no internet needed. Karim won't see your number.", "مكالمة هاتفية عادية لا تحتاج إلى إنترنت. لن يرى كريم رقمك.")}</div>
     <div class="steps">
       <div class="stp now"><span class="n">1</span><div><b>${t("Answer the call from Zad", "أجب على مكالمة زاد")}</b><span>${t("It comes from this number:", "تصلك من هذا الرقم:")}</span><br><span class="numbox">${icon("call", "f", "font-size:16px;color:var(--accent)")}${OWNER_NUMBER}</span></div></div>
       <div class="stp"><span class="n">2</span><div><b>${t("We connect you to Karim", "نصلك بكريم")}</b><span>${t("His phone shows the same Zad number, not yours.", "يظهر على هاتفه رقم زاد نفسه، لا رقمك.")}</span></div></div>
     </div>
     <div class="notice" style="margin-top:12px">${icon("info")}<span>${t("We're calling +20 10•• ••• 4417, the number on your account. Your carrier's usual rates apply to incoming calls, if any.", "سنتصل بالرقم ‎+20 10•• ••• 4417‎ المسجّل في حسابك. تُطبَّق تعرفة شركة الاتصالات المعتادة على المكالمات الواردة، إن وُجدت.")}</span></div>
     <div class="btn ghost" style="margin-top:14px">${icon("close")}${t("Cancel the call", "إلغاء المكالمة")}</div>`;
mount(`
<div class="phone">
  ${statusBar()}
  <div class="under">${map(390, 844)}</div>
  <div class="scrim"></div>
  <div class="bsheet"><div class="grab"></div>${sheet}</div>
  ${homeInd()}
</div>`);
</script>
</body>
</html>
