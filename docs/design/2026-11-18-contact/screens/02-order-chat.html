<!doctype html>
<html data-variants="open,closed">
<head>
<meta charset="utf-8">
<title>02 · The order's chat, customer and courier</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0">
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="../kit/contact.css">
<script src="../kit/kit.js"></script>
<script src="../kit/contact.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const closed = V === "closed";
const tick = (read) => icon(read ? "done_all" : "check", "", read ? "color:inherit;opacity:1" : "");
mount(`
<div class="phone">
  ${statusBar()}
  <div class="scroll thread" style="--below:${closed ? "176px" : "140px"}">
    <div class="ctop">
      <div class="round flat" style="width:38px;height:38px">${icon("arrow_back", "flip")}</div>
      <div class="cav">${t("K", "ك")}<span class="i f">two_wheeler</span></div>
      <div class="grow"><div style="font-weight:800;font-size:15px">${t("Karim · your courier", "كريم · مندوب التوصيل")}</div><div class="small muted">${closed ? t("Delivered at 20:41", "سُلِّم الساعة 20:41") : t("On the way · 9 min", "في الطريق · 9 دقائق")}</div></div>
      ${closed ? "" : `<div class="round flat" style="width:42px;height:42px">${icon("wifi_calling_3", "f", "color:var(--accent)")}</div><div class="round flat" style="width:42px;height:42px">${icon("call", "f", "color:var(--accent)")}</div>`}
    </div>
    <div class="ordercard">
      <div class="thumb">${icon("storefront", "f")}</div>
      <div class="grow"><div style="font-weight:800;font-size:13px">${t("Zad Market", "زاد ماركت")} · ${t("Order", "الطلب")} ${n("#4821")}</div><div class="small muted">${t("To 14 Shagaret El Dor St, flat 6", "إلى 14 شارع شجرة الدر، شقة 6")}</div></div>
      <span class="pill tint" style="height:26px;font-size:11.5px">${closed ? t("Delivered", "تم التسليم") : t("On the way", "في الطريق")}</span>
    </div>

    <div class="chat">
      <div class="event">${icon("lock", "f")}${t("Only you and Karim see this chat. Zad's support can read it if you ask for help.", "لا يرى هذه المحادثة إلا أنت وكريم. ويمكن لدعم زاد قراءتها إن طلبت المساعدة.")}</div>
      <div class="msg them">${t("Hello Mona, I've collected your order from Zad Market. I'll be there in about 10 minutes.", "مرحبًا منى، استلمت طلبك من زاد ماركت. سأصل خلال 10 دقائق تقريبًا.")}<time>20:28</time></div>
      <div class="msg me"><span class="quickmsg">${icon("door_front", "f")}${t("Leave it at the door", "اتركه عند الباب")}</span><time>20:29 ${tick(true)}</time></div>
      <div class="msg me">
        <div class="loc">${map(220, 96, { pin: [200, 170] })}<div class="cap">${icon("location_on", "f", "font-size:16px")}${t("My location", "موقعي")}</div></div>
        ${t("The entrance is on the side street, next to the pharmacy.", "المدخل من الشارع الجانبي، بجانب الصيدلية.")}<time>20:30 ${tick(true)}</time>
      </div>
      <div class="msg them">${t("Got it, thank you.", "حسنًا، شكرًا لك.")}<time>20:31</time></div>
      ${closed
        ? `<div class="msg them"><span class="quickmsg">${icon("door_front", "f", "color:var(--accent)")}${t("I've left it at the door", "تركته عند الباب")}</span><time>20:41</time></div>
           <div class="event">${icon("check_circle", "f")}${t("Delivered at 20:41", "سُلِّم الساعة 20:41")}</div>
           <div class="msg me">${t("Thank you Karim!", "شكرًا يا كريم!")}<time>20:44 ${tick(true)}</time></div>
           <div class="event">${icon("schedule", "f")}${t("This chat closed at 22:41, two hours after delivery.", "أُغلقت هذه المحادثة الساعة 22:41، بعد ساعتين من التسليم.")}</div>`
        : `<div class="msg them"><span class="quickmsg">${icon("near_me", "f", "color:var(--accent)")}${t("I'm 5 minutes away", "سأصل خلال 5 دقائق")}</span><time>20:36</time></div>
           <div class="msg me">${t("Perfect, I'm home.", "ممتاز، أنا في البيت.")}<time>20:36 ${tick(true)}</time></div>
           <div class="seen">${icon("done_all")}${t("Read by Karim", "قرأها كريم")}</div>`}
    </div>
  </div>
  ${closed
    ? `<div class="closed">
         <div class="notice">${icon("lock_clock")}<span>${t("You can no longer write here. For anything about this order, Zad's support is one tap away.", "لم يعد بإمكانك الكتابة هنا. لأي أمر يخص هذا الطلب، دعم زاد على بُعد نقرة.")}</span></div>
         <div class="btn ghost" style="margin-top:10px;height:48px">${icon("support_agent")}${t("Contact support", "تواصل مع الدعم")}</div>
       </div>`
    : `<div class="quick">
         <span>${icon("door_front")}${t("Leave it at the door", "اتركه عند الباب")}</span>
         <span>${icon("call")}${t("Call me", "اتصل بي")}</span>
         <span>${icon("my_location")}${t("Share location", "مشاركة الموقع")}</span>
       </div>
       <div class="composer">
         <div class="field">${t("Write to Karim…", "اكتب إلى كريم…")}</div>
         <div class="send">${icon("send", "f flip")}</div>
       </div>`}
  ${homeInd()}
</div>`);
</script>
</body>
</html>
