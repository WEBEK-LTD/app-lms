<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson with embedded app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; color: #0E0D24; display: flex; flex-direction: column; overflow: hidden">

  <sc-if value="{{ isInline }}" hint-placeholder-val="{{ true }}">
    <div style="flex: none; padding: 24px 20px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDE7DC">
      <a href="TextLesson.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #F4EFE6; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">chevron_left</span>
      </a>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 12px; color: #5E5B70">Python Programming Basics · Module 2</span>
        <span style="font-size: 15px; font-weight: 700">Lesson 9 of 20</span>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3">Lesson 9: Practice challenge</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #24223A">Tap Start to try the interactive challenge below.</p>

      <figure style="margin: 0; flex: 1; min-height: 0; border: 1px solid #D9D1C3; border-radius: 16px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: #FAF7F1">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center">
          <span style="font-size: 12px; color: #8C889A">[Live content from the iframe]</span>
          <span style="font-size: 22px; font-weight: 600">[Embedded app title]</span>
          <span style="height: 50px; padding: 0 40px; border-radius: 10px; background: #5B6CF9; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center">Start</span>
        </div>
        <figcaption style="flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #E4DDD0; background: #FFFFFF; font-size: 12px; color: #5E5B70">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 14px; flex: none">language</span>
          <span style="flex: 1">[embedded-site.com]</span>
          <span>Interactive</span>
        </figcaption>
        <a href="#fullscreen" aria-label="Open full screen" style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
          <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 18px; flex: none">fullscreen</span>
        </a>
      </figure>
    </div>

    <div style="flex: none; background: #FFFFFF; border-top: 1px solid #E4DDD0; padding: 12px 20px 20px; display: flex; gap: 10px">
      <a href="TextLesson.dc.html" aria-label="Previous lesson" style="width: 54px; height: 54px; flex: none; border-radius: 14px; background: #F4EFE6; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">chevron_left</span>
      </a>
      <button type="button" style="flex: 1; height: 54px; border-radius: 14px; border: none; background: #0E0D24; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 20px; flex: none">check</span>
        Mark as complete
      </button>
      <a href="Quiz.dc.html" aria-label="Next lesson" style="width: 54px; height: 54px; flex: none; border-radius: 14px; background: #F4EFE6; border: 1px solid #E4DDD0; color: #0E0D24; display: flex; align-items: center; justify-content: center">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 22px; flex: none">chevron_right</span>
      </a>
    </div>
  </sc-if>

  <sc-if value="{{ isFullscreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex: none; height: 64px; padding: 0 12px; background: #0E0D24; color: #FFFFFF; display: flex; align-items: center; gap: 10px">
      <a href="#close" aria-label="Exit full screen" style="width: 44px; height: 44px; border-radius: 12px; background: #24223F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 20px; flex: none">close</span>
      </a>
      <span style="flex: 1; font-size: 14px; font-weight: 600">Lesson 9: Practice challenge</span>
      <button type="button" aria-label="Rotate screen" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #24223F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
        <span class="material-symbols-rounded" aria-hidden="true" style="font-size: 20px; flex: none">screen_rotation</span>
      </button>
    </div>
    <div style="flex: 1; background: #FAF7F1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; text-align: center">
      <span style="font-size: 12px; color: #8C889A">[Live content from the iframe, full screen]</span>
      <span style="font-size: 26px; font-weight: 600">[Embedded app title]</span>
      <span style="height: 54px; padding: 0 48px; border-radius: 12px; background: #5B6CF9; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center">Start</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["inline","fullscreen"],"default":"inline","section":"Embed view"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.mode ?? 'inline';
return { isInline: m === 'inline', isFullscreen: m === 'fullscreen' };
}
}
</script>
</body>
</html>
