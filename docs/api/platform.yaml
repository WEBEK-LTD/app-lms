openapi: 3.1.0
info:
  title: Yallapp platform API (license and updates)
  version: 1.0.0
  summary: What the Yallapp WordPress plugin calls on yallapp.com.tr.
  description: |
    Served by the Yallapp platform on Netlify. The plugin is the only client,
    except for the app preview's config (tag Preview), which the app reads
    when it runs as the preview in the Yallapp dashboard.

    - The plugin checks its license on activation, then every 12 hours.
    - If the platform can't be reached, the plugin keeps its last known status
      for a 72-hour grace period before treating the license as inactive.
    - Only the site URL, plugin version, WordPress version and LMS are sent.
      No student data ever reaches the platform, except for sign-in codes sent
      by Yallapp (tag Sign-in codes): the phone number and the code pass
      through to be delivered, and neither is stored.
  license:
    name: Proprietary, WEBEK LTD
    url: https://yallapp.com.tr
  contact:
    name: Yallapp
    email: info@yallapp.com.tr
servers:
  - url: https://yallapp.com.tr/api/v1
security: []
tags:
  - name: Licenses
    description: Activate, check and deactivate a site's license.
  - name: Updates
    description: Plugin update information for the WordPress updater.
  - name: Layout
    description: |
      The app's pages, tabs, look and languages, as the client published them
      in the Yallapp dashboard. The plugin fetches the layout every 15 minutes
      (and when the site admin presses "Refresh" in the plugin), keeps the last
      copy it got, and serves it to the app as `GET /pages` and
      `Config.appearance`. Lists in a page are filled by the plugin from the
      site's own courses, products and posts.
  - name: Sign-in codes
    description: |
      "Sent by Yallapp": the plugin makes each sign-in code itself (6 digits,
      kept hashed on the site, valid for 5 minutes, at most 5 attempts) and
      asks the platform to deliver it on WhatsApp through Yallapp's own
      sender, with the app's name in the message. So a WordPress site needs no
      SMS gateway and no Digits REST API add-on. The platform keeps neither
      the number nor the code; it counts requests per license and per number
      (as a one-way hash) to stop abuse, and keeps a daily count of codes sent
      per license for the Yallapp team.
  - name: Preview
    description: |
      The app preview: the client's app running in a browser, in the Yallapp
      dashboard ("Preview your app") or on a phone through its QR code. The
      dashboard makes a preview token for one app; it expires after an hour.

paths:
  /licenses/activate:
    post:
      tags: [Licenses]
      operationId: activateLicense
      summary: Activate a license on a site
      description: Binds the license to one site URL. A license can be active on one site at a time. Each app of a Yallapp account has its own license, plan and site.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInfo' }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /licenses/check:
    post:
      tags: [Licenses]
      operationId: checkLicense
      summary: Check a license
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInfo' }
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /licenses/deactivate:
    post:
      tags: [Licenses]
      operationId: deactivateLicense
      summary: Release a license from a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, site_url]
              properties:
                license_key: { type: string }
                site_url: { type: string, format: uri }
      responses:
        '204': { description: Released }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /plugin/update:
    get:
      tags: [Updates]
      operationId: getPluginUpdate
      summary: Get the latest plugin version
      description: Returns 204 when the site already has the latest version or the license is not active.
      parameters:
        - name: license_key
          in: query
          required: true
          schema: { type: string }
        - name: site_url
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: version
          in: query
          required: true
          description: The installed plugin version.
          schema: { type: string, example: 0.1.0 }
      responses:
        '200':
          description: A newer version is available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRelease' }
        '204': { description: 'Up to date, or license not active' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /apps/layout:
    post:
      tags: [Layout]
      operationId: getAppLayout
      summary: Get the published layout of the license's app
      description: |
        The license key names the app (each app of an account has its own key).
        The layout follows the app's plan: at most the plan's number of
        languages, no lists from content sources beyond the plan's, and on a
        plan without the full page editor the ready-made pages and tabs for
        the app type (with the published look). A plan change gives a new
        `version`.
        Returns 204 when the client hasn't published a layout yet; the plugin
        then serves the default pages. Send the last `version` as
        `If-None-Match` to get 304 when nothing changed.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInfo' }
      responses:
        '200':
          description: The published layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Layout' }
        '204': { description: Nothing published yet }
        '304': { description: Not changed since `If-None-Match` }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The license isn't active on this site.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sign-in-codes/send:
    post:
      tags: [Sign-in codes]
      operationId: sendSignInCode
      summary: Send a sign-in code made by the plugin
      description: |
        Delivers `code` to `phone` on WhatsApp, in a message with the app's
        name (the app the license key names; `app_name` only when that app has
        no name yet). It goes out from the app owner's own WhatsApp number when
        they connected one (WABEK, on the dashboard's App sign-in page), else
        through the platform's sign-in code sender. The license
        must be active on this site (not expired, suspended or bound to
        another site). Available on every plan.

        Limits: 120 requests a minute per IP; per license 300 an hour and
        2000 a day; per phone number (across all sites) one every 30 seconds
        and 10 an hour. A request over a limit gets 429 with
        `retry_after_seconds` and a `Retry-After` header.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInCodeRequest' }
      responses:
        '204': { description: The code was handed to the sender. }
        '400':
          description: The request is invalid (`invalid_request`), or the phone number isn't a valid mobile number (`invalid_phone`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The license isn't active on this site (`license_inactive`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The message couldn't be sent, or no sender is set up (`provider_error`). The plugin tells the person to try again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /preview/{token}/config:
    servers:
      - url: https://yallapp.com.tr/api
    get:
      tags: [Preview]
      operationId: getPreviewConfig
      summary: Get the app preview's build config
      description: |
        The app's build config (`docs/build-config.schema.json`) as a build
        would get it from the app's current setup, also before the setup is
        complete: values it doesn't have yet are placeholders, listed in
        `preview.placeholders`. No Firebase files: the preview has no push
        notifications. The token is the only access: it names one app and
        reads nothing else. Rate limited per IP. Cross-origin requests are
        allowed from the platform's own addresses only.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The preview token the dashboard put in the preview link.
          schema: { type: string }
      responses:
        '200':
          description: The preview config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewConfig' }
        '403':
          description: The token isn't valid (`invalid_token`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The app doesn't exist anymore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The token expired (`preview_expired`). The client opens the preview again from the dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown license key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The license is active on another site.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [invalid_request, license_not_found, license_in_use, rate_limited, invalid_token, preview_expired, license_inactive, invalid_phone, provider_error]
        message: { type: string }
        retry_after_seconds: { type: integer, minimum: 1, description: 'With `rate_limited`: seconds until another request can succeed.' }

    SiteInfo:
      type: object
      required: [license_key, site_url, plugin_version]
      properties:
        license_key: { type: string, example: YALL-7K2D-9QWE-4MNB }
        site_url: { type: string, format: uri, example: 'https://your-academy.com' }
        plugin_version: { type: string, example: 0.1.0 }
        wp_version: { type: string, example: 7.1.3 }
        lms: { type: string, example: tutor }

    SignInCodeRequest:
      allOf:
        - $ref: '#/components/schemas/SiteInfo'
        - type: object
          required: [phone, code]
          properties:
            phone: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', description: The person's mobile number in E.164., example: '+905321234567' }
            code: { type: string, pattern: '^[0-9]{6}$', description: The code the plugin made. Sent once and never stored., example: '482913' }
            app_name: { type: string, maxLength: 60, description: "The app's name on the site, used only when the license's app has no name on the platform yet.", example: Nour Academy }

    LicenseStatus:
      type: object
      required: [status, checked_at]
      properties:
        status:
          type: string
          enum: [active, expired, suspended, invalid]
        plan: { type: [string, 'null'], enum: [starter, growth, pro, business, null], description: "The app's plan. Plans before Phase 13 were starter and pro; the old Starter became Growth." }
        features:
          type: array
          description: |
            Plan features the plugin may enable (only while the license is
            active). `push`: push notifications; `offline_downloads`: offline
            mode in the app; `auto_publish`: we publish to the stores; `ios`:
            the iOS app; `page_editor`: the full page editor (without it the
            app gets the ready-made pages); `card_payments`: card payments in
            the app through Yallapp's payment page; `auto_rebuild`: new builds
            start when the app's settings change. Unknown values are ignored.
          items: { type: string, enum: [push, offline_downloads, auto_publish, ios, page_editor, card_payments, auto_rebuild] }
        limits:
          type: object
          description: The plan's limits; null means unlimited. Missing on older platforms.
          properties:
            app_users: { type: [integer, 'null'], description: "App users on the hosted API. A WordPress site keeps its own users: no limit applies there." }
            languages: { type: [integer, 'null'], description: "App languages, English included. The layout endpoint already sends at most this many." }
            sources: { type: [integer, 'null'], description: "Connected content sources the app's pages can list (the app's main content, plus blog posts on WordPress). The layout endpoint already leaves out blocks beyond it." }
        sign_in_methods:
          type: [array, 'null']
          items: { type: string, enum: [phone, email] }
          description: |
            How people sign in to the app, as its owner chose on the dashboard's
            App sign-in page: `phone`, `email` or both. Null when the owner hasn't
            chosen: the plugin's own setting applies. The plugin serves it as
            `Config.auth.methods` (email signs in with the WordPress password);
            a change reaches the site at its next check (every 12 hours) or at once
            with "Check now". Missing on older platforms.
        app_type:
          type: [string, 'null']
          enum: [lms, store, booking, real_estate, null]
          description: |
            The app's type, as its owner chose it in the dashboard: the module
            its build includes. The plugin uses it instead of guessing from the
            plugins it finds (for the pages an app gets before any are
            published). Null when the license has no app yet. Unknown values
            are treated as null. Missing on older platforms.
        vertical:
          type: [string, 'null']
          enum: [restaurant, clinic, fitness, charity, null]
          description: |
            The kind of business, on top of `app_type` (`Config.vertical` in the
            app API): wording and defaults only. Null when the app has none.
            Unknown values are treated as null. Missing on older platforms.
        expires_at: { type: [string, 'null'], format: date-time }
        checked_at: { type: string, format: date-time }
        message: { type: [string, 'null'], description: Shown to the site admin. }

    PluginRelease:
      type: object
      required: [version, download_url, requires, requires_php, tested]
      properties:
        version: { type: string, example: 0.2.0 }
        download_url: { type: string, format: uri, description: Signed and expiring. }
        requires: { type: string, description: Minimum WordPress version., example: '6.0' }
        requires_php: { type: string, example: '7.4' }
        tested: { type: string, example: 7.1.3 }
        changelog_html: { type: string }

    Layout:
      type: object
      description: |
        The same shapes as the app API (`docs/api/openapi.yaml`): `appearance`
        is `Appearance`, `languages` is `Languages`. Texts are in the default
        language; `translations` holds the other languages, and any missing
        text falls back to the default.
      required: [version, appearance, languages, tabs, pages]
      properties:
        version: { type: string, example: '2026-10-13T18:00:00Z.4' }
        appearance:
          type: object
          description: '`Appearance` in the app API.'
        languages:
          type: object
          description: '`Languages` in the app API.'
          required: [default, available]
          properties:
            default: { type: string, example: en }
            available:
              type: array
              items: { type: string, example: ar }
        tabs:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: object
            required: [id, label, icon, target]
            properties:
              id: { type: string }
              label: { type: string }
              icon: { type: string }
              target:
                type: object
                description: '`Action` in the app API.'
              translations: { $ref: '#/components/schemas/Translations' }
        pages:
          type: array
          items: { $ref: '#/components/schemas/LayoutPage' }

    LayoutPage:
      type: object
      required: [slug, title, show_title, updated_at, blocks]
      properties:
        slug: { type: string, example: home }
        title: { type: string, example: Home }
        show_title: { type: boolean }
        updated_at: { type: string, format: date-time }
        translations: { $ref: '#/components/schemas/Translations' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/LayoutBlock' }

    LayoutBlock:
      type: object
      description: |
        A `Block` from the app API without the parts the plugin fills in:
        `items` blocks carry a `query` instead of `items`, `categories` blocks
        carry no `categories`, and `continue_learning` carries no `course`.
        The plugin drops blocks whose source it can't serve (for example
        `listings`) and blocks hidden from the current user by `visibility`.
      required: [id, type, visibility]
      additionalProperties: true
      properties:
        id: { type: string }
        type: { type: string, example: items }
        visibility: { type: string, enum: [everyone, signed_in, signed_out] }
        query:
          type: object
          description: For `items` blocks.
          required: [limit]
          properties:
            category_id: { type: [string, 'null'] }
            featured: { type: boolean }
            sort: { type: string, enum: [newest, popular, price_asc, price_desc], default: newest }
            limit: { type: integer, minimum: 1, maximum: 30 }
            ids:
              type: array
              description: Hand-picked entries, in this order. Overrides the other filters.
              items: { type: string }
        translations: { $ref: '#/components/schemas/Translations' }

    PreviewConfig:
      type: object
      required: [config, preview]
      properties:
        config:
          type: object
          description: The build config, `docs/build-config.schema.json`, with placeholders where the setup has no value yet.
          required: [schema_version, app_type, app_name, short_name, site_url, android_package, ios_bundle_id, version_name, version_code, branding]
          properties:
            schema_version: { const: 1 }
            app_type: { type: string, enum: [lms, store, booking, real_estate] }
            app_name: { type: string, minLength: 1 }
            short_name: { type: string, minLength: 1 }
            site_url: { type: string, format: uri }
            api_base_url: { type: string, format: uri }
            android_package: { type: string }
            ios_bundle_id: { type: string }
            version_name: { type: string, example: 1.0.0 }
            version_code: { type: integer }
            branding:
              type: object
              required: [primary_color, splash_color, template, font]
              properties:
                primary_color: { type: string, example: '#0E0D24' }
                splash_color: { type: string, example: '#F4EFE6' }
                template: { type: string, enum: [classic, bold, minimal] }
                font: { type: string, example: Bricolage Grotesque }
                icon_url: { type: string, format: uri }
                logo_url: { type: string, format: uri }
        preview:
          type: object
          required: [app_id, expires_at, content_source, draft, api_token, placeholders, missing_steps]
          properties:
            app_id: { type: string, format: uuid }
            expires_at: { type: string, format: date-time, description: When the token stops working. }
            content_source:
              type: string
              enum: [wordpress, custom_api, hosted, none]
              description: Where the app's content comes from; `none` until the Website step chose it. The app then shows how to connect it.
            draft: { type: boolean, description: "The preview shows the Pages & look draft (hosted API only); otherwise the published pages." }
            api_token:
              type: [string, 'null']
              description: For the hosted API only. The app sends it as `X-Yallapp-Preview` with every request to the hosted API.
            placeholders:
              type: array
              description: Build config fields filled with placeholders, e.g. `app_name`, `short_name`, `android_package`, `site_url`, `branding.icon_url`.
              items: { type: string }
            missing_steps:
              type: array
              description: Setup steps that aren't complete yet.
              items:
                type: object
                required: [step, label]
                properties:
                  step: { type: string, enum: [app-type, website, branding, listing, publishing] }
                  label: { type: string, example: Branding }

    Translations:
      type: object
      description: 'Texts in other languages, keyed by language code then field name, e.g. `{"ar": {"heading": "..."}}`.'
      additionalProperties:
        type: object
        additionalProperties: { type: string }
