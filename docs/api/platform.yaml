openapi: 3.1.0
info:
  title: Yallapp platform API (license and updates)
  version: 1.0.0
  summary: What the Yallapp WordPress plugin and the apps call on yallapp.com.tr.
  description: |
    Served by the Yallapp platform on Netlify. The plugin is the main client;
    the app reads the app preview's config (tag Preview) when it runs as the
    preview in the Yallapp dashboard, and every installed app sends its usage
    statistics (tag Analytics), whatever its backend (WordPress, the hosted
    API, a connected platform or its own API).

    - The plugin checks its license on activation, then every 12 hours.
      When the app's owner saves something the license status carries
      (the app type, how people sign in, the plan) or publishes the app's
      pages, the platform asks the site to check now (`POST /license/refresh`
      on the plugin, docs/api/openapi.yaml, signed with the license key): a
      request of at most 5 seconds that never holds up the owner's save, sent
      only to the https address of the site the license is active on, never
      to a private network. The site then calls `/licenses/check` and
      `/apps/layout` as usual (roadmap 31).
    - If the platform can't be reached, the plugin keeps its last known status
      for a 72-hour grace period before treating the license as inactive.
    - Videos from the app's Media library (tag Media, roadmap 51) play from
      links the plugin asks for per request, after checking the student may
      open the lesson; no student data is sent with it.
    - Only the site URL, plugin version, WordPress version and LMS are sent.
      No student data ever reaches the platform, except for sign-in codes sent
      by Yallapp (tag Sign-in codes): the phone number and the code pass
      through to be delivered, and neither is stored.
  license:
    name: Proprietary, Yallapp
    url: https://yallapp.com.tr
  contact:
    name: Yallapp
    email: info@yallapp.com.tr
servers:
  - url: https://yallapp.com.tr/api/v1
security: []
tags:
  - name: Licenses
    description: Activate, check and deactivate a site's license.
  - name: Updates
    description: Plugin update information for the WordPress updater.
  - name: Layout
    description: |
      The app's pages, tabs, look and languages, as the client published them
      in the Yallapp dashboard. The plugin fetches the layout every 15 minutes
      (and when the site admin presses "Refresh" in the plugin), keeps the last
      copy it got, and serves it to the app as `GET /pages` and
      `Config.appearance`. Lists in a page are filled by the plugin from the
      site's own courses, products and posts.
  - name: Sign-in codes
    description: |
      "Sent by Yallapp": the plugin makes each sign-in code itself (6 digits,
      kept hashed on the site, valid for 5 minutes, at most 5 attempts) and
      asks the platform to deliver it on WhatsApp through Yallapp's own
      sender, with the app's name in the message. So a WordPress site needs no
      SMS gateway and no Digits REST API add-on. The platform keeps neither
      the number nor the code; it counts requests per license and per number
      (as a one-way hash) to stop abuse, and keeps a daily count of codes sent
      per license for the Yallapp team.
  - name: Media
    description: |
      Roadmap 51. Videos, pictures and PDFs the app's owner uploaded to the
      Media library in the Yallapp dashboard, kept on Yallapp's own server
      (not a third-party host) and played straight from it with HTTP range
      requests, through links the platform signs. Each file has a Yallapp
      link, `https://yallapp.com.tr/m/<id>`: pictures (and files the owner
      shared) open from it for anyone; a lesson's video plays only from links
      signed for a student who may open the lesson. Storage comes with the
      plan, and the owner can buy storage packs.
  - name: Preview
    description: |
      The app preview: the client's app running in a browser, in the Yallapp
      dashboard ("Preview your app") or on a phone through its QR code. The
      dashboard makes a preview token for one app; it expires after an hour.
  - name: Analytics
    description: |
      Usage statistics for the app's owner (roadmap 44): first-party, no
      third-party analytics SDK, no advertising ID, no fingerprinting. Each
      install makes a random install ID (a version 4 UUID) the first time it
      sends; it is not the device ID the app registers with its backend, not
      tied to the account, and a new one is made when the person turns
      "Share usage statistics" off and on again. The person can turn sending
      off in the app's Settings (on by default): the app then stops sending and
      forgets the events it hadn't sent yet. The app preview never sends.

      The platform reads the country from the request's IP when the batch
      arrives and never stores the IP. Search texts are only counted per day
      (never stored with the install ID); the dashboard lists a search only
      once it was made at least twice. Raw events are kept for 40 days (long
      enough to count monthly active users and 30-day returns, also for events
      a phone sent up to a week late), then only daily totals remain; all of
      it is deleted with the app. Reports show totals only, never one install.

paths:
  /licenses/activate:
    post:
      tags: [Licenses]
      operationId: activateLicense
      summary: Activate a license on a site
      description: Binds the license to one site URL. A license can be active on one site at a time. Each app of a Yallapp account has its own license, plan and site.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInfo' }
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /licenses/check:
    post:
      tags: [Licenses]
      operationId: checkLicense
      summary: Check a license
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInfo' }
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /licenses/deactivate:
    post:
      tags: [Licenses]
      operationId: deactivateLicense
      summary: Release a license from a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, site_url]
              properties:
                license_key: { type: string }
                site_url: { type: string, format: uri }
      responses:
        '204': { description: Released }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /plugin/update:
    get:
      tags: [Updates]
      operationId: getPluginUpdate
      summary: Get the latest plugin version
      description: Returns 204 when the site already has the latest version or the license is not active.
      parameters:
        - name: license_key
          in: query
          required: true
          schema: { type: string }
        - name: site_url
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: version
          in: query
          required: true
          description: The installed plugin version.
          schema: { type: string, example: 0.1.0 }
      responses:
        '200':
          description: A newer version is available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginRelease' }
        '204': { description: 'Up to date, or license not active' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /apps/layout:
    post:
      tags: [Layout]
      operationId: getAppLayout
      summary: Get the published layout of the license's app
      description: |
        The license key names the app (each app of an account has its own key).
        The layout follows the app's plan: at most the plan's number of
        languages, no lists from content sources beyond the plan's, and on a
        plan without the full page editor the ready-made pages and tabs for
        the app type (with the published look). A plan change gives a new
        `version`.
        Returns 204 when the client hasn't published a layout yet; the plugin
        then serves the default pages. Send the last `version` as
        `If-None-Match` to get 304 when nothing changed.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteInfo' }
      responses:
        '200':
          description: The published layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Layout' }
        '204': { description: Nothing published yet }
        '304': { description: Not changed since `If-None-Match` }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The license isn't active on this site.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sign-in-codes/send:
    post:
      tags: [Sign-in codes]
      operationId: sendSignInCode
      summary: Send a sign-in code made by the plugin
      description: |
        Delivers `code` to `phone` on WhatsApp, in a message with the app's
        name (the app the license key names; `app_name` only when that app has
        no name yet). It goes out from the app owner's own WhatsApp number when
        they connected one (WABEK, on the dashboard's App sign-in page), else
        through the platform's sign-in code sender. The license
        must be active on this site (not expired, suspended or bound to
        another site). Available on every plan.

        With `channel: email`, delivers `code` to `email` instead, in the
        "Sign-in code" email with the app's name: through the app owner's own
        email server when they set one (App sign-in, "Your app's email"),
        else from Yallapp's address. When the own server fails, Yallapp's
        sends that email once more and the owner is told. Used by sites whose
        email sign-in works with a code (`LicenseStatus.email_sign_in`).

        Limits: 120 requests a minute per IP; per license 300 an hour and
        2000 a day (phone and email together); per phone number or email
        address (across all sites) one every 30 seconds and 10 an hour. A
        request over a limit gets 429 with `retry_after_seconds` and a
        `Retry-After` header. Numbers and addresses are kept only as keyed
        hashes in the counters, and the code is never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInCodeRequest' }
      responses:
        '204': { description: The code was handed to the sender. }
        '400':
          description: The request is invalid (`invalid_request`), the phone number isn't a valid mobile number (`invalid_phone`), or the email address isn't valid (`invalid_email`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The license isn't active on this site (`license_inactive`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The message couldn't be sent, or no sender is set up (`provider_error`). The plugin tells the person to try again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /licenses/media:
    post:
      tags: [Media]
      operationId: mediaLinks
      summary: Signed links to play or save videos from the app's Media library
      description: |
        A Tutor LMS, LearnPress or other lesson whose video is a Yallapp
        media link (the lesson's video address, the plugin's "Yallapp video"
        box, or the `[yallapp_video]` shortcode): the plugin checks that the
        student may open the lesson, then asks here, with the license, for a
        link signed for that request, and gives it to the app as
        `Video.source: upload` with its `expires_at` (or, for `download`, as
        the lesson's video file in `POST /lessons/{lesson_id}/download`).
        Only files of the license's own app that finished uploading; others
        come back in `missing`. `play` links work for 4 hours, `download`
        links for 15 minutes (as an attachment). The license must be active
        on this site. Limits: 120 requests a minute per IP, 3000 an hour per
        license.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaLinksRequest' }
      responses:
        '200':
          description: The signed links
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaLinks' }
        '400':
          description: The request is invalid (`invalid_request`), such as a link that isn't a Yallapp media link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The license isn't active, or not on this site (`license_inactive`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: Media isn't available right now (`media_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /preview/{token}/config:
    servers:
      - url: https://yallapp.com.tr/api
    get:
      tags: [Preview]
      operationId: getPreviewConfig
      summary: Get the app preview's build config
      description: |
        The app's build config (`docs/build-config.schema.json`) as a build
        would get it from the app's current setup, also before the setup is
        complete: values it doesn't have yet are placeholders, listed in
        `preview.placeholders`. No Firebase files: the preview has no push
        notifications. The token is the only access: it names one app and
        reads nothing else. Rate limited per IP. Cross-origin requests are
        allowed from the platform's own addresses only.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The preview token the dashboard put in the preview link.
          schema: { type: string }
      responses:
        '200':
          description: The preview config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewConfig' }
        '403':
          description: The token isn't valid (`invalid_token`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: The app doesn't exist anymore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: The token expired (`preview_expired`). The client opens the preview again from the dashboard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /apps/{app_id}/events:
    post:
      tags: [Analytics]
      operationId: sendAnalyticsEvents
      summary: Send a batch of usage events
      description: |
        The app batches events in memory and on the phone, and sends them
        every 30 seconds and when it goes to the background, at most 100 per
        request. A batch that fails is sent again later with a growing pause;
        events older than 7 days are dropped on the phone and here.

        **Key.** `X-Yallapp-Analytics-Key` is the app's analytics key from its
        build config (`analytics.key`, docs/build-config.schema.json): a keyed
        hash of the app's ID made by the platform, the same in every build of
        the app. It is in every copy of the app, so it isn't a secret: it
        keeps out requests made up from an app ID alone, and the limits below
        cap what a copied key can do. The platform can change it with its
        signing secret; older builds then stop counting.

        **Limits.** At most 100 events and 64 KB per request. 60 requests a
        minute per IP, 30 per 10 minutes per install, 3000 a minute per app.
        Over a limit: 429 with `retry_after_seconds` and `Retry-After`; the
        app keeps the batch and tries later.

        **Sessions.** The app sends `app_open` when it starts and when it comes
        back after 30 minutes or more in the background; each `app_open` is a
        session. `first_open` is true once per install: installs are counted
        when the app is first opened (store downloads aren't known here).

        **What counts.** An event whose `at` is more than 7 days ago or more
        than 10 minutes ahead is skipped (counted in `dropped`); an invalid
        event fails the whole batch with 400, so a broken build is noticed.
      parameters:
        - name: app_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Yallapp-Analytics-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsBatch' }
      responses:
        '202':
          description: The events were taken.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, dropped]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  dropped: { type: integer, minimum: 0, description: Events skipped for their time (too old or ahead). }
        '400':
          description: The batch isn't valid (`invalid_request`, with the first problem in `message`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The analytics key isn't this app's (`invalid_key`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No app with this ID (`not_found`). The app stops sending until it starts again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: More than 64 KB (`invalid_request`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown license key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The license is active on another site.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Too many requests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [invalid_request, invalid_key, not_found, license_not_found, license_in_use, rate_limited, invalid_token, preview_expired, license_inactive, invalid_phone, provider_error]
        message: { type: string }
        retry_after_seconds: { type: integer, minimum: 1, description: 'With `rate_limited`: seconds until another request can succeed.' }

    SiteInfo:
      type: object
      required: [license_key, site_url, plugin_version]
      properties:
        license_key: { type: string, example: YALL-7K2D-9QWE-4MNB }
        site_url: { type: string, format: uri, example: 'https://your-academy.com' }
        plugin_version: { type: string, example: 0.1.0 }
        wp_version: { type: string, example: 7.1.3 }
        lms: { type: string, example: tutor }
        store: { type: string, description: 'The shop plugin the site runs (woocommerce), or empty.', example: woocommerce }
        bookings: { type: string, description: 'The booking plugin the plugin reads (amelia, bookly, latepoint...), or empty.', example: '' }
        link_paths:
          type: array
          maxItems: 20
          description: |
            Roadmap 48. The paths of the site's own pages that open the app on
            Android: the permalink bases of what the app shows that start with
            a fixed folder (`/courses/`, `/product/`, `/product-category/`,
            `/blog/`), and the pages with a booking form, each with the site's
            folder before it. The next build of the app lists them in its App
            Links intent filters (`links.site_paths` in the build config).
            Permalinks at the root of the site (`/%postname%/`) aren't listed:
            an intent filter can't leave out the site's other pages. Missing
            on older plugins.
          items: { type: string, maxLength: 100, pattern: '^/([A-Za-z0-9._~%-]+/)+$', example: /courses/ }

    SignInCodeRequest:
      allOf:
        - $ref: '#/components/schemas/SiteInfo'
        - type: object
          required: [code]
          properties:
            channel:
              type: string
              enum: [whatsapp, email]
              default: whatsapp
              description: "`whatsapp` (the default) sends to `phone`; `email` sends to `email`. Missing on plugins before 0.3.5."
            phone: { type: string, pattern: '^\+[1-9][0-9]{6,14}$', description: "The person's mobile number in E.164. Required with `channel: whatsapp`.", example: '+905321234567' }
            email: { type: string, format: email, maxLength: 191, description: "The person's email address. Required with `channel: email`.", example: sara@example.com }
            code: { type: string, pattern: '^[0-9]{6}$', description: The code the plugin made. Sent once and never stored., example: '482913' }
            app_name: { type: string, maxLength: 60, description: "The app's name on the site, used only when the license's app has no name on the platform yet.", example: Nour Academy }

    MediaLinksRequest:
      allOf:
        - $ref: '#/components/schemas/SiteInfo'
        - type: object
          required: [media]
          properties:
            media:
              type: array
              minItems: 1
              maxItems: 20
              description: Yallapp media links (`https://yallapp.com.tr/m/<id>`) or their IDs.
              items: { type: string, maxLength: 200 }
              example: ['https://yallapp.com.tr/m/3f1c2a9e-8d4b-4c6a-9e2f-1b7d5a0c4e88']
            purpose:
              type: string
              enum: [play, download]
              default: play
              description: "`play`: a link for the app's player (4 hours). `download`: a link to save the file for offline viewing (15 minutes, as an attachment)."

    MediaLinks:
      type: object
      required: [items, missing]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, kind, url, expires_at, size_bytes, mime_type, name]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [video, image, pdf] }
              url: { type: string, format: uri, description: "Signed for this request on Yallapp's media server; answers range requests." }
              expires_at: { type: string, format: date-time }
              size_bytes: { type: integer }
              mime_type: { type: string, example: video/mp4 }
              name: { type: string, description: The owner's name for the file. }
        missing:
          type: array
          description: IDs that aren't the app's files (deleted, never finished uploading, or another app's).
          items: { type: string }

    LicenseStatus:
      type: object
      required: [status, checked_at]
      properties:
        status:
          type: string
          enum: [active, expired, suspended, invalid]
        plan: { type: [string, 'null'], enum: [starter, growth, pro, business, null], description: "The app's plan. Plans before Phase 13 were starter and pro; the old Starter became Growth." }
        features:
          type: array
          description: |
            Plan features the plugin may enable (only while the license is
            active). `push`: push notifications; `offline_downloads`: offline
            mode in the app; `auto_publish`: we publish to the stores; `ios`:
            the iOS app; `page_editor`: the full page editor (without it the
            app gets the ready-made pages); `card_payments`: card payments in
            the app through Yallapp's payment page; `auto_rebuild`: new builds
            start when the app's settings change. Unknown values are ignored.
          items: { type: string, enum: [push, offline_downloads, auto_publish, ios, page_editor, card_payments, auto_rebuild] }
        limits:
          type: object
          description: The plan's limits; null means unlimited. Missing on older platforms.
          properties:
            app_users: { type: [integer, 'null'], description: "App users on the hosted API. A WordPress site keeps its own users: no limit applies there." }
            languages: { type: [integer, 'null'], description: "App languages, the default included; any language counts, whoever translates it. The layout endpoint already sends at most this many." }
            sources: { type: [integer, 'null'], description: "Connected content sources the app's pages can list (the app's main content, plus blog posts on WordPress). The layout endpoint already leaves out blocks beyond it." }
        sign_in_methods:
          type: [array, 'null']
          items: { type: string, enum: [phone, email] }
          description: |
            How people sign in to the app, as its owner chose on the dashboard's
            App sign-in page: `phone`, `email` or both. Null when the owner hasn't
            chosen: the plugin's own setting applies. The plugin serves it as
            `Config.auth.methods` (email works as `email_sign_in` says);
            a change reaches the site at its next check (every 12 hours) or at once
            with "Check now". Missing on older platforms.
        email_sign_in:
          type: [string, 'null']
          enum: [code, password, null]
          description: |
            How email sign-in works, as the app's owner chose on the dashboard's
            App sign-in page: `code` (a 6-digit code by email, sent through
            `POST /sign-in-codes/send` with `channel: email`; people without an
            account sign up) or `password` (the WordPress email and password;
            existing accounts only). Null when the owner hasn't chosen: the
            plugin's own setting applies. The plugin serves it as
            `Config.auth.email_sign_in`. Missing on older platforms.
        app_type:
          type: [string, 'null']
          enum: [lms, store, booking, real_estate, news, events, donations, null]
          description: |
            The app's type, as its owner chose it in the dashboard: the module
            its build includes. The plugin uses it instead of guessing from the
            plugins it finds (for the pages an app gets before any are
            published). Null when the license has no app yet. Unknown values
            are treated as null. Missing on older platforms.
        vertical:
          type: [string, 'null']
          enum: [restaurant, clinic, fitness, charity, null]
          description: |
            The kind of business, on top of `app_type` (`Config.vertical` in the
            app API): wording and defaults only. Null when the app has none.
            Unknown values are treated as null. Missing on older platforms.
        app_links:
          type: [object, 'null']
          description: |
            46 What the site's link files say (`docs/api/openapi.yaml`, tag
            Links): the plugin serves `/.well-known/assetlinks.json` from
            `android` and `/.well-known/apple-app-site-association` from `ios`,
            for the paths `/a/*`. Null (or a null part) when the app has no
            package name, fingerprint or Team ID yet: the plugin then serves no
            file for it (404). Missing on older platforms.
          properties:
            android:
              type: [object, 'null']
              required: [package_name, sha256_cert_fingerprints]
              properties:
                package_name: { type: string, example: com.example.academy }
                sha256_cert_fingerprints:
                  type: array
                  minItems: 1
                  maxItems: 4
                  description: The Play App Signing key's and the upload key's, as uppercase hex pairs with colons.
                  items: { type: string, pattern: '^([0-9A-F]{2}:){31}[0-9A-F]{2}$' }
            ios:
              type: [object, 'null']
              required: [app_ids]
              properties:
                app_ids:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string, pattern: '^[A-Z0-9]{10}\.[A-Za-z0-9.-]+$', example: ABCDE12345.com.example.academy }
        review_prompt: { type: boolean, description: "46 Whether the app may ask for a rating (`Config.app.review_prompt`), as the owner chose. Missing means true." }
        crash_reports: { type: boolean, description: "46 Whether the app sends crash reports to Yallapp (`Config.app.crash_reports`), as the owner chose. Missing means true." }
        offline_downloads:
          type: [boolean, 'null']
          description: |
            Roadmap 45. Whether students may save lessons for offline viewing,
            as the app's owner chose on the dashboard's Courses page. Null when
            the owner hasn't chosen: the plugin's own "Allow offline downloads"
            applies. Downloads also need `offline_downloads` in `features`.
            The plugin serves the result as `Config.features.downloads`.
            Missing on older platforms.
        screen_protection:
          type: [string, 'null']
          enum: ['off', content, app, null]
          description: |
            Roadmap 53. Screenshots and screen recording in the app, as the
            app's owner chose on the dashboard's Screen protection page: `off`,
            `content` (course content only) or `app` (every screen). Null when
            the owner hasn't chosen: the plugin's own "Block screenshots &
            screen recording" applies. The plugin serves the result as
            `Config.app.screen_protection`. Missing on older platforms.
        expires_at: { type: [string, 'null'], format: date-time }
        checked_at: { type: string, format: date-time }
        message: { type: [string, 'null'], description: Shown to the site admin. }

    PluginRelease:
      type: object
      required: [version, download_url, requires, requires_php, tested]
      properties:
        version: { type: string, example: 0.2.0 }
        download_url: { type: string, format: uri, description: Signed and expiring. }
        requires: { type: string, description: Minimum WordPress version., example: '6.0' }
        requires_php: { type: string, example: '7.4' }
        tested: { type: string, example: 7.1.3 }
        changelog_html: { type: string }

    Layout:
      type: object
      description: |
        The same shapes as the app API (`docs/api/openapi.yaml`): `appearance`
        is `Appearance`, `languages` is `Languages`. Texts are in the default
        language; `translations` holds the other languages, and any missing
        text falls back to the default.
      required: [version, appearance, languages, tabs, pages]
      properties:
        version: { type: string, example: '2026-10-13T18:00:00Z.4' }
        appearance:
          type: object
          description: '`Appearance` in the app API.'
        languages:
          type: object
          description: |
            `Languages` in the app API, for the plugin's `Config.languages`:
            any language the app can show (`LanguageCode`), in the owner's
            order. `list` (`AppLanguage`) names each one, its direction and the
            owner's string pack, which the app downloads from the platform;
            the plugin passes it on as it is. Tab names, page titles and
            sample texts Yallapp wrote already carry their Arabic and Turkish
            in `translations` where the owner wrote none.
          required: [default, available]
          properties:
            default: { type: string, example: en }
            available:
              type: array
              items: { type: string, example: ar }
            list:
              type: array
              items:
                type: object
                required: [code, name, native_name, direction, strings]
                properties:
                  code: { type: string, example: fr }
                  name: { type: string, example: French }
                  native_name: { type: string, example: Français }
                  direction: { type: string, enum: [ltr, rtl] }
                  strings:
                    oneOf:
                      - type: object
                        required: [url, version]
                        properties:
                          url: { type: string, format: uri }
                          version: { type: string }
                      - type: 'null'
        tabs:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: object
            required: [id, label, icon, target]
            properties:
              id: { type: string }
              label: { type: string }
              icon: { type: string }
              target:
                type: object
                description: '`Action` in the app API.'
              translations: { $ref: '#/components/schemas/Translations' }
        pages:
          type: array
          items: { $ref: '#/components/schemas/LayoutPage' }

    LayoutPage:
      type: object
      required: [slug, title, show_title, updated_at, blocks]
      properties:
        slug: { type: string, example: home }
        title: { type: string, example: Home }
        show_title: { type: boolean }
        updated_at: { type: string, format: date-time }
        translations: { $ref: '#/components/schemas/Translations' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/LayoutBlock' }

    LayoutBlock:
      type: object
      description: |
        A `Block` from the app API without the parts the plugin fills in:
        `items` blocks carry a `query` instead of `items`, `categories` blocks
        carry no `categories`, and `continue_learning` carries no `course`.
        The plugin drops blocks whose source it can't serve (for example
        `listings`) and blocks hidden from the current user by `visibility`.

        The blocks `slider`, `quick_links`, `testimonials`, `faq`,
        `countdown`, `contact`, `hours`, `social`, `team`, `stats` and
        `notice` have the same fields as in the app API. Entries of their
        lists (`slides`, `links`, `quotes`, `questions`, `people`, `stats`)
        carry their own `translations`, like blocks; the plugin applies them
        and removes them. It drops entries whose action it can't follow
        (quick links), actions it can't follow elsewhere, and a countdown that
        has ended without an `ended_text`. A block type the plugin doesn't
        know is left out, never sent unchecked.
      required: [id, type, visibility]
      additionalProperties: true
      properties:
        id: { type: string }
        type: { type: string, example: items }
        visibility: { type: string, enum: [everyone, signed_in, signed_out] }
        query:
          type: object
          description: For `items` blocks.
          required: [limit]
          properties:
            category_id: { type: [string, 'null'] }
            featured: { type: boolean }
            sort: { type: string, enum: [newest, popular, price_asc, price_desc], default: newest }
            limit: { type: integer, minimum: 1, maximum: 30 }
            ids:
              type: array
              description: Hand-picked entries, in this order. Overrides the other filters.
              items: { type: string }
        translations: { $ref: '#/components/schemas/Translations' }
        slides: { $ref: '#/components/schemas/LayoutBlockEntries' }
        links: { $ref: '#/components/schemas/LayoutBlockEntries' }
        quotes: { $ref: '#/components/schemas/LayoutBlockEntries' }
        questions: { $ref: '#/components/schemas/LayoutBlockEntries' }
        people: { $ref: '#/components/schemas/LayoutBlockEntries' }
        stats: { $ref: '#/components/schemas/LayoutBlockEntries' }

    LayoutBlockEntries:
      type: array
      description: |
        A block's list (`SliderBlock.slides`, `QuickLinksBlock.links`,
        `TestimonialsBlock.quotes`, `FaqBlock.questions`, `TeamBlock.people`,
        `StatsBlock.stats` in the app API), each entry with its texts in other
        languages.
      items:
        type: object
        additionalProperties: true
        properties:
          translations: { $ref: '#/components/schemas/Translations' }

    PreviewConfig:
      type: object
      required: [config, preview]
      properties:
        config:
          type: object
          description: The build config, `docs/build-config.schema.json`, with placeholders where the setup has no value yet.
          required: [schema_version, app_type, app_name, short_name, site_url, android_package, ios_bundle_id, version_name, version_code, branding]
          properties:
            schema_version: { const: 1 }
            app_type: { type: string, enum: [lms, store, booking, real_estate, news, events, donations] }
            app_name: { type: string, minLength: 1 }
            short_name: { type: string, minLength: 1 }
            site_url: { type: string, format: uri }
            api_base_url: { type: string, format: uri }
            auth_base_url: { type: string, format: uri, description: "An app on its own API that Yallapp signs people in to: the hosted API of the platform the preview runs on, for sign-in and the account (roadmap 34)." }
            android_package: { type: string }
            ios_bundle_id: { type: string }
            version_name: { type: string, example: 1.0.0 }
            version_code: { type: integer }
            branding:
              type: object
              required: [primary_color, splash_color, template, font]
              properties:
                primary_color: { type: string, example: '#0E0D24' }
                splash_color: { type: string, example: '#F4EFE6' }
                template: { type: string, enum: [classic, bold, minimal] }
                font: { type: string, example: Bricolage Grotesque }
                icon_url: { type: string, format: uri }
                logo_url: { type: string, format: uri }
        preview:
          type: object
          required: [app_id, expires_at, content_source, draft, api_token, placeholders, missing_steps]
          properties:
            app_id: { type: string, format: uuid }
            expires_at: { type: string, format: date-time, description: When the token stops working. }
            content_source:
              type: string
              enum: [wordpress, custom_api, hosted, none]
              description: Where the app's content comes from; `none` until the Website step chose it. The app then shows how to connect it.
            draft: { type: boolean, description: "The preview shows the Pages & look draft (hosted API only); otherwise the published pages." }
            api_token:
              type: [string, 'null']
              description: For the hosted API only. The app sends it as `X-Yallapp-Preview` with every request to the hosted API. An app on its own API that Yallapp signs people in to gets one too, and sends it only to `auth_base_url`, never to its own API.
            placeholders:
              type: array
              description: Build config fields filled with placeholders, e.g. `app_name`, `short_name`, `android_package`, `site_url`, `branding.icon_url`.
              items: { type: string }
            missing_steps:
              type: array
              description: Setup steps that aren't complete yet.
              items:
                type: object
                required: [step, label]
                properties:
                  step: { type: string, enum: [app-type, website, branding, listing, publishing] }
                  label: { type: string, example: Branding }

    AnalyticsBatch:
      type: object
      additionalProperties: false
      required: [install_id, platform, app_version, events]
      properties:
        install_id:
          type: string
          format: uuid
          description: The install's random analytics ID (not the device ID the app registers with its backend).
        platform: { type: string, enum: [android, ios] }
        app_version: { type: string, maxLength: 32, examples: ['1.2.0'] }
        os_version: { type: string, maxLength: 32, description: 'The system and its version, e.g. `Android 14` or `iOS 18.1`.' }
        locale: { type: string, maxLength: 16, description: 'The app''s language, e.g. `ar` or `en`. Only the language is kept.' }
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/AnalyticsEvent' }

    AnalyticsEvent:
      type: object
      additionalProperties: false
      required: [type, at]
      description: |
        One thing that happened in the app. Which fields go with which type:
        - `app_open`: `first_open` (true once per install). Each is a session.
        - `screen_view`: `screen`, the kind of screen (`home`, `course`,
          `cart`, `search`…), never an address with IDs in it.
        - `item_view`: `item_kind`, `item_id` and `title` (the name when it
          was seen, for the reports).
        - `add_to_cart`, `purchase_click` (the checkout or payment page opens),
          `enroll`, `book`, `donate`, `ticket`, `share`: `item_kind` and
          `item_id`, with `title`, `amount` and `currency` when known.
        - `search`: `query`, counted per day without the install; never kept
          with the install ID.
        - `push_open`: `notification_id` when the notification has one, and
          `push_type` (its `type`, e.g. `announcement`, `new_lesson`).
        - `screenshot` (roadmap 62): a screenshot the phone noticed while the
          owner's screen protection covered what was open (`Config.screen_protection`).
          With `item_kind` `lesson`, `item_id` and `title` when a lesson was
          open; without them elsewhere in the app. Only iOS tells the app
          (`UIApplication.userDidTakeScreenshotNotification`); Android blocks
          screenshots of protected screens with `FLAG_SECURE` and can't tell
          that someone tried, so Android apps never send it. Shown to
          academies as "Screenshots taken" per lesson.
        Fields that don't go with the type are ignored.
      properties:
        type:
          type: string
          enum: [app_open, screen_view, item_view, add_to_cart, purchase_click, enroll, book, donate, ticket, search, push_open, share, screenshot]
        at: { type: string, format: date-time, description: When it happened on the phone. }
        first_open: { type: boolean }
        screen: { type: string, pattern: '^[a-z][a-z0-9_]{0,39}$' }
        item_kind:
          type: string
          enum: [course, lesson, product, service, class, membership, listing, article, event, campaign, page]
        item_id: { type: string, minLength: 1, maxLength: 64 }
        title: { type: string, maxLength: 120 }
        amount: { type: number, minimum: 0, maximum: 100000000, description: In the currency's main unit (12.5 for ₺12.50). }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        query: { type: string, maxLength: 80 }
        notification_id: { type: string, maxLength: 64 }
        push_type: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }

    Translations:
      type: object
      description: 'Texts in other languages, keyed by language code then field name, e.g. `{"ar": {"heading": "..."}}`.'
      additionalProperties:
        type: object
        additionalProperties: { type: string }
