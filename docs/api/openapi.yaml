openapi: 3.1.0
info:
  title: Yallapp plugin API
  version: 1.0.0
  summary: The REST API the Yallapp WordPress plugin exposes to the Yallapp app.
  description: |
    Served by the Yallapp plugin on each client's WordPress site under
    `/wp-json/yallapp/v1`, by a client's own API, or by the Yallapp hosted
    API at `https://yallapp.com.tr/api/app/{app_id}` for clients without
    WordPress. The hosted API serves the configuration, sign-in, account,
    devices, push token and notifications endpoints; content endpoints come
    from the platform connected to the app and answer `not_found` until one is.

    Conventions:
    - JSON everywhere. Dates are ISO 8601 in UTC.
    - Authenticated calls send `Authorization: Bearer <access_token>`.
    - Errors use the `Error` shape with a stable machine-readable `code`.
    - Lists are paginated with `page` and `per_page` and return `Page` metadata.
    - Every response carries `X-Yallapp-Plugin-Version`.
    - The app sends `Accept-Language` with the language the user picked
      (one of `Config.languages.available`). Texts the client wrote (pages,
      blocks, listings) come back in that language when a translation exists,
      else in the default language. Tab names, page titles and sample texts
      that Yallapp wrote come in Arabic and Turkish too, unless the owner
      translated them; the hosted API answers its messages and labels in
      those languages as well. The app's own interface strings ship with the
      app in English, Arabic and Turkish; the owner's translations of them
      (any language) come as string packs (`Config.languages.list`,
      `GET /strings/{language}`).

    The app preview (in the Yallapp dashboard) runs the same app in a web
    browser at `https://yallapp.com.tr/preview-app/`. For it to reach the API,
    the server answers cross-origin requests from `https://yallapp.com.tr`
    (CORS: `Access-Control-Allow-Origin`, and preflight requests allowing the
    `Authorization` and `Content-Type` headers). WordPress does this for its
    REST API. On the hosted API the preview also sends
    `X-Yallapp-Preview: <preview token>`: the API then answers for the app's
    owner while the app isn't active yet, signs in only the store review
    number, and serves the Pages & look draft when the preview asks for it.

    A paused app (roadmap 68): when the app's plan ends (the end date has
    passed) or the owner's Yallapp account is suspended, every call answers
    503 `license_inactive` or `account_suspended` with the owner's `contact`,
    on WordPress (plugin 0.4.6 and later, which also compares the plan's end
    date with its own clock when it can't reach Yallapp) and on the hosted API
    alike. `GET /config` answers the same error, so the app shows its paused
    screen. What a person who is already signed in needs to delete their
    account keeps working: `POST /auth/refresh`, `POST /auth/logout` and
    `DELETE /me` (and, on WordPress, Yallapp's `POST /license/refresh`).
    Signing in is paused with the rest, so someone who isn't signed in asks
    the app's owner (`contact`) to delete their account. Everything comes back
    as it was once the plan is renewed.

    A deleted app (roadmap 73): when the owner deletes the app in the Yallapp
    dashboard, the hosted API answers 404 `not_found` on every path at once
    (the app is gone for the app as for the dashboard), and a WordPress site
    loses its license (`license_not_found` from Yallapp), so its app pauses
    as above. Yallapp's team can restore it within 7 days; after that its
    data and files are deleted.

    A client's own API can let Yallapp sign people in (roadmap 34): its app
    then sends sign-in, the account and its devices to the hosted API
    (`Config.auth.provider: yallapp`, `Config.auth.base_url`) and every other
    call to the client's API with Yallapp's access token, a JWT the client's
    API checks with the keys at `GET /.well-known/jwks.json` (see the
    "Yallapp sign-in" tag).

    Chat (roadmap 77): apps whose plan has chat (Pro and Business) talk with
    the business, and in academies with course groups, through the hosted API
    (`Config.chat`, the "Chat" tag), whatever runs the rest of the app. A
    WordPress app gets a chat token from its site first (`POST /chat/session`).
  license:
    name: Proprietary, Yallapp
    url: https://yallapp.com.tr
  contact:
    name: Yallapp
    email: info@yallapp.com.tr
servers:
  - url: https://{site}/wp-json/yallapp/v1
    description: A client's WordPress site
    variables:
      site:
        default: your-academy.com
        description: The client's WordPress host name.
  - url: https://yallapp.com.tr/api/app/{app_id}
    description: The Yallapp hosted API, for apps without WordPress
    variables:
      app_id:
        default: 00000000-0000-0000-0000-000000000000
        description: The app's ID on the Yallapp platform.
security:
  - bearerAuth: []
tags:
  - name: App
    description: App configuration and the home screen.
  - name: Pages
    description: Pages and bottom tabs built in the client dashboard.
  - name: Auth
    description: Sign-in with a one-time code, tokens and sign-up.
  - name: Yallapp sign-in
    description: |
      For a client's own API whose owner chose "Yallapp signs people in" on
      the dashboard's App sign-in page (roadmap 34). Yallapp's hosted API for
      the app (`https://yallapp.com.tr/api/app/{app_id}`, `Config.auth.base_url`)
      serves `GET /config` (only its `auth` counts), the Auth endpoints
      (`/auth/otp/request`, `/auth/email/request`, `/auth/otp/verify`,
      `/auth/register`, `/auth/refresh`, `/auth/logout`), `GET`, `PATCH` and
      `DELETE /me`, `GET /me/devices` and `DELETE /me/devices/{device_id}`,
      with the sign-in methods, codes, store review access and device limit
      the owner set in Yallapp. The client's API serves everything else,
      including `/auth/checkout-link`, `PUT /me/push-token` and the
      notifications, and never the sign-in endpoints.

      The access token the app sends to the client's API is a JWT signed with
      ES256 (header `kid`) by a key pair of that app only, valid for 15
      minutes. Claims: `iss` (`https://yallapp.com.tr`), `aud` (the app's ID),
      `sub` (the person's Yallapp user ID, a string), `phone` (E.164) and
      `email` only when proven by a code, `name`, `iat`, `exp`; `did` is
      Yallapp's own. The client's API checks the signature with the keys at
      `GET /.well-known/jwks.json`, and `iss`, `aud` and `exp`, then finds or
      creates its own user by `sub`, or by the proven phone or email. A
      missing, expired or invalid token answers 401, and the app refreshes it
      at Yallapp. Refresh tokens are opaque and work once; signing out,
      removing a device and deleting the account end them. Before deleting
      the account at Yallapp, the app calls the client's `DELETE /me`, so the
      client can delete its own data (404 or 405 when it keeps none). Roadmap
      49: whatever that call answers (an error, no answer), the app then
      deletes the account at Yallapp, and Yallapp sends the client's API a
      signed notice, the `accountDeleted` webhook (`POST <API
      address>/webhooks/yallapp`), retried until the API answers 2xx. The
      client deletes the person by `sub` from either, whichever comes first.
  - name: Account
    description: The signed-in student's profile, devices and push token.
  - name: Catalog
    description: Categories, courses and course details.
  - name: Learning
    description: Enrolled courses, lessons and progress.
  - name: Quizzes
    description: Quiz questions, attempts and results.
  - name: Commerce
    description: Free enrollment, checkout hand-off and the student's orders.
  - name: Notifications
    description: The notifications inbox.
  - name: Store billing
    description: |
      Roadmap 100. Courses and memberships bought in the app through Google
      Play Billing (Android) and the App Store's In-App Purchase (iOS), on
      Yallapp's hosted API for every app (`Config.store_billing.base_url`),
      as the stores ask for digital content. The app buys with the store's
      own SDK, then sends what the store gave it to `POST /billing/purchases`;
      Yallapp checks it with Google or Apple, records it once and gives the
      access where the course lives (the hosted API, the WordPress site
      through the plugin's `POST /billing/access`, Teachable or Thinkific
      through their enrolment APIs, or an app's own API through the
      `purchase.completed` notice). Refunds and ended subscriptions take it
      back. Roadmap 100.7: for an app on its own API, and for Teachable or
      Thinkific courses the platform's API doesn't price, the owner lists
      what the app sells on Dashboard › In-app purchases (each course's ID,
      title and price; each membership plan's ID, title, price, period and
      the course IDs it opens). Physical goods and services (shop
      products, orders, appointments, tickets to a venue, gym memberships,
      donations) keep their payment pages.
  - name: Chat
    description: |
      Roadmap 77. A person and the business (`direct`), and course groups in
      academies (`group`), on Yallapp's hosted API (`Config.chat.base_url`).
      People never talk to each other in private. Text, photos, videos, voice
      messages and files; files count in the app's storage and show in the
      business's Media library. Messages are kept a year, and longer when the
      business chooses; the business moderates (reports, blocking, deleting)
      and is responsible for what is said in its chat. Deleting one's account
      (`DELETE /me`, on the hosted API or a WordPress site) deletes the
      person's messages and files too.
  - name: Community
    description: |
      Course reviews and questions and answers. On Yallapp's hosted API
      (roadmap 63) the business answers questions and may reply to a review
      (`Review.reply`) or hide it from others (`hidden`, shown to its author
      only). Roadmap 64: the business may also hide a question or a single
      answer (`CourseQuestion.hidden`, `QuestionAnswer.hidden`); a hidden
      one reaches its author only, never other students' lists or counts.
  - name: Store
    description: |
      WooCommerce products, the cart and the checkout hand-off, for Store apps.
      The cart lives in the app; the order is placed on the site's own
      checkout, opened with a one-time link that fills the WooCommerce cart.
  - name: Listings
    description: |
      Property listings, for Real estate apps: search with filters, a
      listing's details, favorites and messages to the office. Listings are
      managed in the Yallapp dashboard and served by the hosted API.
  - name: News
    description: |
      Articles and categories, for News & blog apps (roadmap 23). Read-only
      and free to read: there is no paid content. WordPress serves the site's
      published posts (never private or password-protected ones); the hosted
      API serves articles written in the Yallapp dashboard or read from the
      site's RSS or Atom feed. An article's body is processed like lesson
      content (`render_mode`, `html` with embed placeholders, `embeds`).
  - name: Events
    description: |
      Events and tickets, for Events & tickets apps (roadmap 28): events with
      their days and times, a venue or an online link, and ticket types. Free
      tickets are taken in the app; paid tickets are bought on the web payment
      page and issued only once the payment is confirmed. Each ticket has a
      random code and a signed QR payload, checked once at the door. Tickets
      to events at a venue are physical-world services, bought on Android and
      iOS; tickets to online-only events (no venue) are digital content, so
      iOS never offers buying them (free tickets work everywhere). Served by
      the hosted API.
  - name: Donations
    description: |
      Campaigns and donations, for Charity & donations apps (roadmap 29).
      Campaigns are managed in the Yallapp dashboard and served by the hosted
      API. The donation itself is paid on a web page, into the charity's own
      payment account: in the iPhone app always in the system browser (App
      Store guideline 3.2.2), on Android in the app or in the browser as
      `open_in` says. A donation counts towards a campaign only after the
      payment is confirmed.
  - name: Delivery
    description: |
      Roadmap 104. Delivery and courier companies, on Yallapp's hosted API.
      The customer sends a parcel: picks a service, the pickup and drop-off
      places, sees the price before sending, and pays cash to the courier or
      by card on the company's payment page (its own iyzico, Kashier,
      Fawaterk, Stripe or PayPal account), as the company allows
      (`DeliveryConfig.payment`). Delivery is a service in the physical world,
      so the card payment page opens in the app on Android and iOS alike.
      Prices follow the company's choice (`DeliveryConfig.pricing`): by
      distance (a straight line between the two places, so both need their
      coordinates), by the drop-off zone, or one fixed price; a service may
      add its own amount. The customer follows the shipment by its stages, or
      also sees the courier on a map while it is on the way when the company
      chose live tracking (`DeliveryConfig.tracking`).
  - name: Courier
    description: |
      Roadmap 104. The courier's screens. A courier is a person the company
      added on the dashboard's Couriers page by mobile number (or by email,
      for apps that sign in by email only); whoever signs in to the app with
      that number, proven by its code, is that courier (`User.roles` has
      `courier`). Every endpoint here answers `not_courier` (403) to anyone
      else, and to couriers the company paused. Couriers see only the jobs
      given to them, and, when the company lets couriers take jobs
      (`DeliveryConfig.assignment` is `open`), the jobs waiting for a
      courier, without the customer's and recipient's numbers until they
      take one. The courier's position is sent while the app is open and
      they have a job on the way, kept only while it is, and shown only to
      the customer of that job.

      Where these screens are depends on the company's choice
      (`DeliveryConfig.courier_app`): `same`, in the company's app, shown
      only to couriers, who can switch between their courier screens and the
      customer's; `bundle`, in the company's second app made for couriers
      (build config `delivery_role: courier`), while its customer app has
      none; `yallapp_courier`, in the shared Yallapp Courier app, while the
      company's app has none.
  - name: Food
    description: |
      Roadmap 105.1. Food delivery from many restaurants, on Yallapp's hosted
      API. The company adds its restaurants with their menus; the customer
      picks a restaurant (`GET /food/restaurants`), fills one restaurant's
      cart, sees the total before ordering (`POST /food/quote`: the dishes,
      their choices, the delivery fee by the company's delivery prices from
      the restaurant to the customer, and the restaurant's smallest order),
      and orders, paying cash to the courier or by card on the company's
      payment page as the company allows (`FoodConfig.payment`). The
      restaurant accepts the order with the time it needs, or turns it down;
      the company's couriers deliver it (the Courier tag: each order's
      delivery is a courier job, picked up at the restaurant). The customer
      follows the order's stages, and the courier on a map while it is on the
      way when the company chose live tracking, then rates the restaurant and
      the courier.
  - name: Restaurant
    description: |
      Roadmap 105.1. A restaurant's screens. Its staff are people the company
      added to the restaurant on the dashboard by mobile number (or by email,
      for apps that sign in by email only); whoever signs in with that number,
      proven by its code, works for that restaurant (`User.roles` has
      `restaurant`). Every endpoint here answers `not_restaurant` (403) to
      anyone else, and to staff of a restaurant the company paused. Staff see
      their restaurant's orders only: new ones (with a push and a sound),
      accept each with the minutes it needs or turn it down with a reason,
      mark it ready for the courier, and set the restaurant busy for a while
      (no new orders) or open again.
  - name: Rides
    description: |
      Roadmap 105.2. Ride hailing, on Yallapp's hosted API. The rider sets the
      pickup and the drop-off, sees each of the company's vehicle types with
      its fare (`POST /rides/estimate`) and asks for a ride now or, when the
      company allows it, at a later time (`POST /rides`). The company's
      drivers get the request one at a time, nearest first, each with a few
      seconds to accept (`RidesConfig.matching`), or the company gives it to
      a driver from the dashboard. The rider follows the driver to the
      pickup and along the ride on the map, can share the ride with a link,
      call the company's emergency number, cancel (with the company's fee
      once the free minutes after a driver accepted are over), pay the fare
      in cash to the driver or by card on the company's payment page, and
      rate the driver. Fares, fees and the company's share are the
      company's: Yallapp sets none of them.
  - name: Driver
    description: |
      Roadmap 105.2. The driver's screens. A driver is a person the company
      added on the dashboard's Drivers page by mobile number (or by email,
      for apps that sign in by email only), with their car; whoever signs in
      with that number, proven by its code, is that driver (`User.roles` has
      `driver`). Every endpoint here answers `not_driver` (403) to anyone
      else, and to drivers the company suspended. A driver goes online to
      get ride requests; while online, the app sends the driver's position
      (only while it is open), which is used to offer rides nearest first
      and shown to the rider of their ride; it is dropped when they go
      offline. The rider's number is shown once the driver accepted, until
      the ride ends.

      Where these screens are depends on the company's choice
      (`RidesConfig.driver_app`): `same`, in the company's app, shown only to
      drivers; `bundle`, in the company's second app made for drivers (build
      config `role: driver`), while its riders' app has none.
  - name: Teachers
    description: |
      Roadmap 105.3. Academies with many teachers, on Yallapp's hosted API
      (`Config.instructors`). Each course may belong to one of the academy's
      teachers (`CourseSummary.instructor.id` is the teacher's ID; 0 for a
      course of the academy itself). Students browse the teachers, open a
      teacher's page with their courses and reviews, follow a teacher (a push
      when a new course of theirs is published) and rate a teacher once they
      are a student in one of their courses. When the academy lets people
      apply (`InstructorsConfig.applications`), a signed-in person can apply
      to teach and waits for the academy's answer. Teachers' shares are the
      academy's: Yallapp sets none.
  - name: Teacher
    description: |
      Roadmap 105.3. The teacher's screens. A teacher is a person the academy
      added on the dashboard's Teachers page by mobile number (or by email,
      for apps that sign in by email only), or whose application it
      approved; whoever signs in with that number is that teacher
      (`User.roles` has `teacher`). Every endpoint here answers
      `not_teacher` (403) to anyone else, and to teachers the academy
      suspended. A teacher makes courses (title, description, price, level),
      adds sections and lessons (a video or a PDF sent from the phone, or a
      video address) and sends a course for review; the academy publishes it
      or sends it back with a note. Lessons added to a published course are
      live at once. A teacher answers their students' questions through
      `POST /questions/{question_id}/answers` (the answer's author has
      `instructor` true) and sees what their courses sold and their share.
  - name: School
    description: |
      Roadmap 105.4. A school's app for its students and their parents, on
      Yallapp's hosted API. The school adds its students, parents and
      teachers on the dashboard (by mobile number, or by email for apps that
      sign in by email only), links each parent to their children, and puts
      the students in classes. Whoever signs in with a student's number is
      that student; with a parent's number, that parent (`User.roles` has
      `student` or `parent`). `GET /school/me` lists whom the person may
      see: a student themselves, a parent each of their children. Every
      `/school/students/{student_id}` endpoint answers `not_found` (404) for
      a student the person may not see, and `not_school_member` (403) to
      anyone the school didn't add. A student sees their timetable,
      attendance, homework (and hands it in), grades, upcoming exams and
      fees; a parent sees the same for each child and pays fees by card
      through the school's own payment page. Every amount is the school's:
      Yallapp sets none.
  - name: Classroom
    description: |
      Roadmap 105.4. The school's teachers' screens. A teacher is a person
      the school added as a teacher on the dashboard; whoever signs in with
      their number is that teacher (`User.roles` has `teacher`). Every
      endpoint here answers `not_teacher` (403) to anyone else. A teacher
      sees the classes and subjects they teach and their timetable, takes
      attendance in a tap (the parents of a student marked absent or late
      are told), gives homework and marks what was handed in, enters the
      scores of exams and quizzes, and writes to a class (its students and
      their parents).
  - name: Bookings
    description: |
      Services, staff, free times and appointments, for Bookings apps. The
      plugin reads them from the site's booking plugin (Amelia, BookingPress or
      LatePoint); the booking plugin's own rules decide the free times and
      whether a new appointment is approved or waits for the business.
      Appointments are paid at the business.
  - name: Classes
    description: |
      Group classes and memberships, for gyms, studios and coaches (Bookings
      apps; the hosted API only for now). Classes come from the business's
      weekly timetable; each has a capacity, and a spot is booked only while
      one is left. When `bookings.classes.membership_required` is true,
      booking needs an active membership, and a plan with credits uses one
      per class (given back when the customer cancels in time). Memberships
      are paid on a web page outside the app, on Android and iOS alike: they
      are for a service used in person (App Store Review Guideline 3.1.3(e)).
  - name: Platform
    description: |
      Calls from the Yallapp platform to a client's WordPress site (roadmap
      31), never from the app. Only the Yallapp plugin serves them; the hosted
      API and a client's own API don't.
  - name: Links
    description: |
      Links that open the app (roadmap 46): Android App Links and iOS
      Universal Links. A shared course, product, service, listing, article,
      event, campaign or page is a link `<base>/<kind>/<id>`. It opens that
      screen in the app when the app is installed, and the website otherwise.

      - On Yallapp's link domain, for every app: `<base>` is
        `https://yallapp.com.tr/a/<app_id>`. Without the app, that address
        shows a page in the app's branding with its store links; for a
        WordPress app it sends the visitor on to the site's own link.
      - On a WordPress site with the Yallapp plugin: `<base>` is
        `<site>/a` (`Config.links.share_base_url`). Without the app, the
        plugin sends the visitor to the item's own page on the site (its
        permalink), or to the home page when the item has none or isn't public.

      | Kind | Link | Opens in the app | `id` |
      |---|---|---|---|
      | `course` | `<base>/course/12` | the course (Academy) | a number |
      | `product` | `<base>/product/12` | the product (Store) | a number |
      | `service` | `<base>/service/12` | the service (Bookings) | a number |
      | `listing` | `<base>/listing/12` | the listing (Real estate) | a number |
      | `article` | `<base>/article/431` | the article (News & blog) | letters, digits, `-` and `_` |
      | `event` | `<base>/event/12` | the event (Events & tickets) | a number |
      | `campaign` | `<base>/campaign/12` | the campaign (Charity & donations) | a number |
      | `page` | `<base>/page/offers` | a page built in the dashboard | its slug |

      The same table, with examples, is `docs/api/app-links.json`; the app,
      the platform and the plugin follow it. A link of a kind the app type
      doesn't have, or that doesn't match, opens the app's home.

      The phone checks that the domain trusts the app with two files the
      domain serves at its root, as JSON (`application/json`), without a
      redirect: `/.well-known/assetlinks.json` (Android: the package name and
      the SHA-256 fingerprints of the Play App Signing key and the upload key)
      and `/.well-known/apple-app-site-association` (iOS: `<Team ID>.<bundle
      ID>` with the paths `/a/*`, or `/a/<app_id>/*` on Yallapp's domain). The
      plugin builds them from its license status (`LicenseStatus.app_links`
      in `docs/api/platform.yaml`). Push notifications and notifications in
      the inbox may carry a `link` in the same format.

      **The site's own pages** (roadmap 48). On a WordPress site, the plugin
      also lists in `apple-app-site-association` the paths of the site's own
      pages for what the app shows: courses and lessons, products and product
      categories, posts, and the pages with a booking plugin's booking form,
      as the site's permalinks make them. It leaves out, before them, what
      must stay on the website: `wp-admin`, `wp-login.php`, the REST API,
      feeds, `xmlrpc.php`, `wp-content` and `wp-includes`, the cart,
      checkout, account and payment pages of WooCommerce and the course
      plugins, and addresses with `add-to-cart`, `wc-api`, `rest_route` or
      `preview` in their query. Android's App Links have no exclusions, and
      the app's intent filters are fixed when it's built: the plugin reports
      the permalink bases that start with a fixed folder (`/courses/`,
      `/product/`, `/product-category/`, `/blog/`) with its license check
      (`SiteInfo.link_paths`), and the next build lists them. Posts whose
      permalinks start at the root of the site (`/%postname%/`) open the app on
      iPhone only.

      The app asks `GET /links/resolve` what a page of the site is. When the
      answer is an item it shows, it opens that screen; otherwise (`kind`
      null, an error, an older plugin) it opens the address in its own in-app
      browser, which never hands the address back to the app, so a link never
      loops. A site in a folder (`example.com/learn`) can't serve the two files
      at its domain's root: the plugin serves them at `<site>/.well-known/…`
      too, for the domain's own server to copy, and until it does only
      Yallapp's links open the app.
  - name: Crash reports
    description: |
      Crash reports (roadmap 46). Served by Yallapp for every app, at
      `https://yallapp.com.tr/api/app/{app_id}`, also when the app's content
      comes from WordPress or an own API: the app sends its crashes to
      Yallapp, never to the site. Off when `Config.app.crash_reports` is false.

paths:
  /config:
    get:
      tags: [App]
      operationId: getConfig
      summary: Get app configuration
      description: Branding, detected features and app rules set in the plugin settings. Called on every app start.
      security: []
      parameters:
        - $ref: '#/components/parameters/Platform'
        - name: app_version
          in: query
          required: true
          description: The app's version, used for the forced-update check.
          schema: { type: string, example: 1.0.0 }
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Config' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /home:
    get:
      tags: [App]
      operationId: getHome
      summary: Get home screen sections
      description: Sections in the order chosen in the plugin settings. Signed-out users get the public sections only.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Home sections
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items: { $ref: '#/components/schemas/HomeSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /pages:
    get:
      tags: [Pages]
      operationId: getPages
      summary: Get the bottom tabs and the list of pages
      description: |
        The navigation and pages the client published in the dashboard.
        When nothing is published yet, the server sends default pages and
        tabs for the app type, built from the site's content, so the answer
        is always a full navigation. Servers without pages (older plugins)
        return 404; the app then uses its built-in tabs and `/home`.

        The default pages follow `app_type`, the type of the app asking, so
        they match its screens from the first start. Without it the server uses
        the type the owner chose in the dashboard, else a guess from the site's
        plugins. Published pages don't depend on it.

        Send `If-None-Match` with the last `version` to get 304 when
        nothing changed.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppType'
      responses:
        '200':
          description: Navigation and pages
          headers:
            ETag:
              description: The published version, the same as `version`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Navigation' }
        '304':
          description: Not modified since the version in `If-None-Match`.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /pages/{slug}:
    get:
      tags: [Pages]
      operationId: getPage
      summary: Get one page with its blocks
      description: |
        Blocks in the order set in the dashboard, with lists (courses,
        products, services, posts, listings) already resolved. Blocks meant only for
        signed-in or signed-out users are filtered here. On iOS, blocks and
        items never carry purchase actions for paid content. 99.3 So are
        blocks the owner shows only between two dates, on the other platform
        or in other languages (than the one asked for with `Accept-Language`):
        the app never gets them.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageSlug'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppType'
      responses:
        '200':
          description: The page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /forms/{slug}/{block_id}:
    post:
      tags: [Pages]
      operationId: sendFormAnswers
      summary: Send the answers to a form block by email
      description: |
        Roadmap 99.4. For a `form` block whose `send_to` is `email`: the
        server checks the answers against the published block (each field
        it knows, required fields filled, an email or phone that looks like
        one, a choice among its options, at most 2,000 characters each) and
        emails them to the business: the hosted API to the app's support
        email (else its owner's), the plugin to the support email it has from
        Yallapp (else the site's admin email). With a signed-in person's
        token, their name and email go with the answers. A form whose
        `send_to` is `chat` is sent by the app as a chat message instead
        (`POST /chat/conversations/{conversation_id}/messages`), which needs
        the person signed in. At most 5 answers a minute and 30 a day from
        one address, counting only answers that pass the checks.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageSlug'
        - name: block_id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormAnswers' }
      responses:
        '202':
          description: The answers were sent. The app shows the block's `success_text`.
        '400':
          description: '`invalid_answers`, with `details.fields`: each field `id` that needs a change, then a message safe to show (in the language asked for with `Accept-Language` when the server has it); `invalid_request` when the form isn''t one to send by email.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: '`send_failed`: the email couldn''t be sent; the app keeps the answers and offers to try again.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /strings/{language}:
    get:
      tags: [App]
      operationId: getStringPack
      summary: Get the owner's translations of the app's own texts in one language
      description: |
        Served by the Yallapp platform for every app, also those on WordPress or
        their own API: the app takes the address from
        `Config.languages.list[].strings.url` and never builds it. The pack has
        the owner's translations of the app's interface strings (the keys of
        the app's string files); the app shows the owner's string, else its own
        in that language, else English. Keep the last pack for offline use and
        download it again when `strings.version` in `/config` changes. Strings
        with placeholders use the same ICU format as the app's string files
        (`{name}`, `{count, plural, =1{…} other{…}}`), checked when the owner
        saves them. With `draft=1` and `X-Yallapp-Preview`, the app preview
        gets the Pages & look draft's strings.
      security: []
      parameters:
        - name: language
          in: path
          required: true
          schema: { $ref: '#/components/schemas/LanguageCode' }
        - name: v
          in: query
          required: false
          description: The pack's version, so caches keep each version apart.
          schema: { type: string }
        - name: draft
          in: query
          required: false
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: The language's strings
          headers:
            ETag:
              description: The pack's version.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StringPack' }
        '304':
          description: Not modified since the version in `If-None-Match`.
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send a sign-in code
      description: |
        Sends a 6-digit code to the phone number. Rate limited per number and per IP.

        On a WordPress site the plugin's settings choose who sends it: Yallapp (the
        default: the plugin makes the code and Yallapp delivers it on WhatsApp) or
        Digits (through the gateway set up in Digits; needs Digits' REST API add-on).
        Either way the account is the one with that number on the site, so people who
        signed up with Digits keep their accounts. The hosted API sends codes itself.

        Demo apps on the hosted API (the apps on yallapp.com.tr/demo) send no code: only the
        public demo number signs in, with the fixed code shown on that page. Any other number
        is refused with 403 `demo_number_only`. The demo number is limited per IP and per app,
        and works in demo apps only.

        The app preview in the Yallapp dashboard sends `preview: true`, and only when
        `Config.auth.preview_sign_in` is true. Such a request never sends a code: only the
        store review number signs in, with its fixed code. Any other number is refused with
        403 `preview_review_number_only`.

        On the hosted API the store review number (and address) skips the per-number and
        per-IP limits, as reviewers sign in again and again, but is limited per app: 30
        requests an hour for the number and the address together, then 429, so its fixed code
        can't be guessed. The plugin applies its usual limits to them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country_code, phone]
              properties:
                country_code: { type: string, example: '+90' }
                phone: { type: string, description: National number without the country code., example: '5321234567' }
                preview: { type: boolean, description: "Sent by the app preview in the Yallapp dashboard. True: only the store review number signs in and no code is sent." }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [request_id, code_length, resend_after_seconds, expires_in_seconds]
                properties:
                  request_id: { type: string }
                  code_length: { type: integer, example: 6 }
                  resend_after_seconds: { type: integer, example: 60 }
                  expires_in_seconds: { type: integer, example: 300 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/ProviderError' }

  /auth/email/request:
    post:
      tags: [Auth]
      operationId: requestEmailCode
      summary: Send a sign-in code by email
      description: |
        Sends a 6-digit code to the email address, when `Config.auth.methods` has
        `email` and `Config.auth.email_sign_in` is `code` (the hosted API, and
        WordPress sites whose owner chose email codes). Same
        rules as phone codes: valid for 5 minutes, 5 attempts, a new code after a
        minute, limited per address and per IP. Verify it with `POST /auth/otp/verify`;
        an address with no account gets a `signup_token` (when sign-up from the app
        is allowed), and `POST /auth/register` then asks the same details as a phone
        sign-up (the email is already known).

        The email comes from the app's own email address when its owner set up
        their own email server in the Yallapp dashboard, else from Yallapp's
        address with the app's name. On WordPress the plugin makes the code
        and Yallapp delivers it; an account that can edit the site never signs
        in by code (it gets no email and the code is refused), so staff sign in
        on the website.

        Refused with 403 `method_not_allowed` when the app doesn't offer email
        sign-in. Demo apps sign in only by phone: 403 `demo_number_only`.

        Store review: the app's store review email address (for apps that sign in
        by email only, where reviewers can't use the review number) gets no email
        and signs in with the fixed review code. The app preview (`preview: true`)
        never sends a code: only the store review address signs in there, and any
        other address is refused with 403 `preview_review_number_only`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 191, example: sara@example.com }
                preview: { type: boolean, description: Sent by the app preview in the Yallapp dashboard. }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [request_id, code_length, resend_after_seconds, expires_in_seconds]
                properties:
                  request_id: { type: string }
                  code_length: { type: integer, example: 6 }
                  resend_after_seconds: { type: integer, example: 60 }
                  expires_in_seconds: { type: integer, example: 300 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/ProviderError' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: signInWithPassword
      summary: Sign in with email and password
      description: |
        For servers whose `Config.auth.email_sign_in` is `password` (a WordPress site:
        its own accounts and passwords, checked by WordPress with the site's own
        rules and security plugins). Only existing accounts sign in here; people
        without an account sign up by phone or on the website (or, where the owner
        chose email codes, with `POST /auth/email/request`). A wrong address and
        a wrong password get the same 400 `invalid_credentials`, so the answer never
        tells whether an account exists. Limited per address and per IP. Devices
        and the device limit work as for phone sign-in.

        Refused with 403 `method_not_allowed` when the app doesn't offer email
        sign-in. In the app preview only the store review email address signs in;
        anything else gets 403 `preview_review_number_only`.

        Store review on WordPress: with the plugin's store review access on, its
        test email address signs in with the fixed code as the password, to the
        site's account with that address (made when there is none and sign-up is
        allowed; never an account that can edit the site).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device]
              properties:
                email: { type: string, maxLength: 191, description: The account's email address (a WordPress username works too)., example: sara@example.com }
                password: { type: string, maxLength: 4096 }
                device: { $ref: '#/components/schemas/DeviceInput' }
                preview: { type: boolean, description: Sent by the app preview in the Yallapp dashboard. }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify a sign-in code
      description: |
        Verifies a code from `POST /auth/otp/request` or `POST /auth/email/request`.
        Returns tokens for an existing account. For a phone number (or email address) with no account,
        returns a one-time `signup_token` to use with `POST /auth/register`
        (only when sign-up from the app is allowed).

        A new phone number is refused with 403 `app_user_limit` when the app
        has as many users as its plan allows (apps on the hosted API only;
        a WordPress site keeps its users and has no limit). The error carries
        `contact`, so the app can show how to reach the app's owner. People
        who already have an account keep signing in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, code, device]
              properties:
                request_id: { type: string }
                code: { type: string, example: '481902' }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/SignupRequired'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account after verification
      description: |
        Fields required here follow the "Required at sign-up" plugin setting.
        Refused with 403 `app_user_limit` (with `contact`) when the app
        reached its plan's number of app users since the code was verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signup_token, name, device]
              properties:
                signup_token: { type: string }
                name: { type: string, example: Sara Yilmaz }
                email: { type: string, format: email }
                city: { type: string }
                device: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Refresh tokens
      description: |
        Exchanges a refresh token for new tokens. The old refresh token stops
        working (rotation). Roadmap 68: also while the app is paused, so a
        signed-in person can still delete their account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out this device
      description: Also while the app is paused (roadmap 68).
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /crashes:
    post:
      tags: [Crash reports]
      operationId: sendCrashReports
      summary: Send crash reports
      description: |
        The app sends what went wrong (an uncaught error in the app's code),
        at most 10 reports per call, each one at most once per app run, with
        the sessions it counted since it last sent. Reports that couldn't be
        sent are kept on the phone (at most 10) and sent on the next start.

        A report carries no personal data: no names, phone numbers, emails,
        tokens, codes or addresses with query strings. The app removes them
        before sending, and Yallapp removes what still looks like one before
        it stores the report. Yallapp groups reports by `fingerprint` (the
        error's type and its first frames in the app's own code), counting
        them, the first and last time seen and the app versions.

        Rate limited per app and per address (`rate_limited`, 429 with
        `retry_after_seconds`). Answers 204 also when crash reports are off for the
        app, so the app doesn't keep them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrashReportBatch' }
      responses:
        '204': { description: Received (or crash reports are off). }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /links/resolve:
    get:
      tags: [Links]
      operationId: resolveLink
      summary: What a page of the site is in the app
      description: |
        Roadmap 48. The app asks what an address on the site that opened it
        is: a course, a lesson, a product, a product category, a post, or a
        page with a booking form. `kind` is null when the address is something
        else (the home page, a page, the cart, an account page, another
        site): the app then opens it in its in-app browser. Only public,
        published items are named. Served by the Yallapp plugin; the hosted
        API answers 404 (its links are always `<base>/<kind>/<id>`), and so do
        plugins released before this endpoint: the app then opens the in-app
        browser too.
      security: []
      parameters:
        - name: url
          in: query
          required: true
          description: The whole address, as the phone opened it.
          schema: { type: string, format: uri, maxLength: 2048, example: 'https://academy.example.com/courses/intro-to-python/' }
      responses:
        '200':
          description: What the address is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkResolution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /.well-known/jwks.json:
    get:
      tags: [Yallapp sign-in]
      operationId: getSignInKeys
      summary: Get the keys that sign access tokens
      description: |
        Served only by Yallapp's hosted API, for an app on its own API that
        Yallapp signs people in to (404 otherwise): the app's public ES256 keys
        as a JSON Web Key Set, the one signing now first. When the owner
        replaces the key, the old one stays here for a day, so tokens it signed
        keep working until they expire. Cache it for up to 5 minutes
        (`Cache-Control`), and fetch it again when a token names a `kid` you
        don't have.
      security: []
      responses:
        '200':
          description: The app's public keys
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }
          content:
            application/jwk-set+json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/checkout-link:
    post:
      tags: [Commerce]
      operationId: createCheckoutLink
      summary: Get a one-time signed-in checkout link
      description: |
        Android only, and only when the "Enroll now on Android" setting is on.
        The link signs the student in on the website and opens the checkout for
        the course. It works once and expires after 5 minutes.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties:
                course_id: { type: integer }
      responses:
        '200':
          description: Checkout link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, open_in]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  open_in: { type: string, enum: [in_app, browser] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the signed-in student
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                city: { type: string }
      description: In a demo app everyone shares one account, which can't be changed (403 `feature_disabled`).
      responses:
        '200':
          description: Updated student
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Account]
      operationId: deleteMe
      summary: Delete account
      description: |
        Required by Apple and Google. Deletes or anonymises the WordPress user
        according to the site's policy and signs out every device. In a demo
        app (one shared account) it signs out this device only.

        Roadmap 68: it keeps working while the app is paused (its plan ended,
        or the owner's account is suspended), together with `POST
        /auth/refresh` and `POST /auth/logout`, on WordPress (plugin 0.4.6) and
        on the hosted API. The app offers it on its paused screen to someone
        who is signed in.
      responses:
        '204': { description: Account deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices:
    get:
      tags: [Account]
      operationId: listDevices
      summary: List signed-in devices
      description: In a demo app, only the current device, and `limit` 0 (no limit).
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [items, limit]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  limit: { type: integer, description: Devices allowed per account., example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/devices/{device_id}:
    delete:
      tags: [Account]
      operationId: removeDevice
      summary: Sign out a device
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Device removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/push-token:
    put:
      tags: [Account]
      operationId: setPushToken
      summary: Register this device for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: "The device's push token: from Firebase Cloud Messaging, or from Huawei Push Kit when `provider` is `hms`." }
                provider:
                  type: string
                  enum: [fcm, hms]
                  default: fcm
                  description: >-
                    Where the token is from. `fcm` (Firebase Cloud Messaging) for iPhones and Android
                    phones with Google Play services; `hms` (Huawei Push Kit) for Huawei phones without
                    them, in apps built with Huawei push. The server sends each token through its own
                    service, and skips `hms` tokens when it has no Push Kit credentials.
                preferences: { $ref: '#/components/schemas/NotificationPreferences' }
                language:
                  type: string
                  maxLength: 35
                  example: ar
                  description: >-
                    Roadmap 85.1: the language the app shows on this phone (a language tag; its first
                    part is kept), sent again when the person changes it. With the country the phone
                    signs in from (never its IP), it lets the business send a campaign to the people
                    who read a language or live in a country. Servers that don't need it ignore it.
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/cart:
    put:
      tags: [Account]
      operationId: setCart
      summary: Say how many items the cart holds
      description: |
        Roadmap 85.3: the app keeps the cart on the phone and says how many
        items it holds whenever that changes (0 once it's empty or ordered),
        so a shop on Yallapp's hosted API can send "You left something in
        your cart" once, 3 hours after the last change, when the owner
        hasn't turned it off. Nothing else about the cart is sent. Servers
        that don't need it answer 404, and the app doesn't ask again until
        it restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: integer, minimum: 0, maximum: 999 }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List the student's notifications
      description: |
        Every notification the site sent to the student, newest first, whether
        or not push reached a device: to everyone, to the students of a course
        they're enrolled in, or to them alone. Kept for 90 days.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, unread_count]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
                      unread_count: { type: integer, description: "Unread notifications in total, for the badge." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications/read:
    post:
      tags: [Notifications]
      operationId: markNotificationsRead
      summary: Mark every notification as read
      responses:
        '204': { description: Marked as read }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/session:
    post:
      tags: [Store billing]
      operationId: startStoreSession
      summary: A store billing token for the signed-in person (WordPress)
      description: |
        Roadmap 100. Served by the Yallapp plugin (0.4.23 and later) when
        `Config.store_billing.session` is `site`, like `POST /chat/session`:
        the plugin gets the token from Yallapp (`POST /billing/sessions` in the
        platform API) for the signed-in person's WordPress user ID, display
        name and email. The app sends it as `Authorization: Bearer` to
        `Config.store_billing.base_url` until `expires_at` (one hour), and
        asks again on 401 `invalid_token`.
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The app doesn't sell in the app (`feature_disabled`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /billing/products:
    get:
      tags: [Store billing]
      operationId: listStoreProducts
      summary: What the app sells through the store on this platform
      description: |
        Roadmap 100. Served by the hosted API at `Config.store_billing.base_url`
        for every app that sells in the app. The store product IDs of the paid
        courses and membership plans the owner sells, ready in the store.
        The app asks the store for each product's price in the person's
        currency and shows that price, never the site's. Public: no token
        needed.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: The products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StoreProduct' }
        '403':
          description: The app doesn't sell in the app (`feature_disabled`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/purchases:
    post:
      tags: [Store billing]
      operationId: sendStorePurchase
      summary: Send a purchase the store made, for the access it buys
      description: |
        Roadmap 100. After the store's purchase flow says the purchase went
        through (Android: `purchased`; iOS: a verified transaction), the app
        sends the Google purchase token or the App Store's signed transaction.
        Yallapp checks it with the store (that it is this app's, for this
        product, paid and not refunded), records it once, gives the access
        (enrolment in the course, or the membership until `expires_at`) and
        acknowledges it with the store. Only then does the app finish the
        transaction with the store. Sending the same purchase again answers
        the same grant. A purchase the store marks pending (`status`
        `pending`, Android) gives nothing yet: Yallapp gives the access when
        Google tells it the purchase completed.

        `invalid_receipt` (400): not a valid purchase of this app's product.
        `purchase_in_use` (409): the purchase gives access to another account
        of this app already (a store account buys for one app account).
        `store_unavailable` (503): the store couldn't be reached; the app keeps
        the transaction unfinished and sends it again later (at the next start
        too). A purchase never acknowledged is refunded by Google after three
        days.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorePurchase' }
      responses:
        '200':
          description: The access the purchase gives
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreGrant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The app doesn't sell in the app (`feature_disabled`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /billing/purchases/restore:
    post:
      tags: [Store billing]
      operationId: restoreStorePurchases
      summary: Restore purchases
      description: |
        Roadmap 100. "Restore purchases" (which Apple asks for): the app sends
        every purchase the store has for the person (Android: the purchase
        tokens of `queryPurchases`; iOS: the signed transactions of
        `Transaction.currentEntitlements`), and gets back the grants still
        active for this account. Purchases already in use by another account
        of the app are left out, never moved.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchase_tokens:
                  type: array
                  maxItems: 100
                  description: Android.
                  items: { type: string, maxLength: 2000 }
                signed_transactions:
                  type: array
                  maxItems: 100
                  description: iOS, each a JWS.
                  items: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: The grants still active
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StoreGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The app doesn't sell in the app (`feature_disabled`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /chat/session:
    post:
      tags: [Chat]
      operationId: startChatSession
      summary: A chat token for the signed-in person (WordPress)
      description: |
        Roadmap 77. Served by the Yallapp plugin only (0.4.9 and later): the
        chat lives on Yallapp, and a WordPress app's people sign in on the
        website, so the app asks its site for a chat token, which the plugin
        gets from Yallapp (`POST /chat/sessions` in the platform API) for the
        signed-in person: their WordPress user ID, display name and picture,
        and for an academy the courses they're enrolled in (their groups). The
        app then calls `Config.chat.base_url` with this token until
        `expires_at` (one hour), and asks again on 401 `invalid_token`.

        The hosted API and Yallapp sign-in don't need it: the app uses its
        own access token on `Config.chat.base_url` (`Config.chat.session` is
        `access_token` there).
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The app's plan has no chat, or the owner turned it off (`chat_not_available`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /chat/notify:
    post:
      tags: [Platform]
      operationId: notifyChat
      summary: Push a new chat message to the site's app users
      description: |
        Roadmap 77. Sent by the Yallapp platform to a WordPress site when a
        message arrives for its app's people: the site keeps their push
        tokens, so its plugin sends the push (Firebase or Huawei Push Kit),
        with the notification preferences the person chose. Nothing about the
        message is stored on the site.

        Signed like `POST /license/refresh`: `signature` is the lowercase hex
        HMAC-SHA256 of `yallapp-chat-notify:<timestamp>:<sha256 of the
        notification JSON, hex>` keyed with the license key in capitals; a
        wrong signature, a site without a license key or a timestamp more than
        5 minutes away is 401 `invalid_signature`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timestamp, signature, notification]
              properties:
                timestamp: { type: integer, examples: [1792000000] }
                signature: { type: string, pattern: '^[0-9a-f]{64}$' }
                notification:
                  type: object
                  required: [user_ids, title, body, conversation_id]
                  properties:
                    user_ids:
                      type: array
                      maxItems: 500
                      items: { type: integer }
                      description: The WordPress users to notify.
                    title: { type: string, maxLength: 120, description: "The sender's name, or the group's name." }
                    body: { type: string, maxLength: 200, description: 'The start of the message, or "Photo", "Video", "Voice message", "File" in the app''s language.' }
                    conversation_id: { type: string, format: uuid }
      responses:
        '202': { description: Sent to the devices that have a push token. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /campaigns/send:
    post:
      tags: [Platform]
      operationId: sendCampaign
      summary: Send a campaign from the Yallapp dashboard to the app's users
      description: |
        Roadmap 85.4. Sent by the Yallapp platform to a WordPress site when
        the owner sends a campaign from Dashboard › App notifications ›
        Campaigns (now, at the time chosen, or each week): the site keeps its
        people's push tokens, so the plugin adds the notification to everyone's
        inbox (with its picture and what it opens) and pushes it to the phones
        that allow announcements, in batches. When the last batch is sent, the
        plugin reports how many phones it reached and missed with
        `POST /campaigns/report` (docs/api/platform.yaml).

        Signed like `POST /chat/notify`: `signature` is the lowercase hex
        HMAC-SHA256 of `yallapp-campaign:<timestamp>:<sha256 of the campaign
        JSON, hex>` keyed with the license key in capitals; a wrong
        signature, a site without a license key or a timestamp more than 5
        minutes away is 401 `invalid_signature`. The same `send_id` twice is
        sent once (200 with the first answer).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timestamp, signature, campaign]
              properties:
                timestamp: { type: integer, examples: [1792000000] }
                signature: { type: string, pattern: '^[0-9a-f]{64}$' }
                campaign:
                  type: object
                  required: [send_id, title, body, link, image_url]
                  properties:
                    send_id: { type: integer, minimum: 1, description: "Yallapp's number for this send; the report names it." }
                    title: { type: string, maxLength: 65 }
                    body: { type: string, maxLength: 240 }
                    link: { type: [string, 'null'], format: uri, maxLength: 500, description: 'What it opens: a link in the format of the Links tag, or another `https` address; null opens the app.' }
                    image_url: { type: [string, 'null'], format: uri, maxLength: 500, description: "Its picture, on Yallapp's address." }
      responses:
        '202':
          description: In everyone's inbox; the pushes are queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignSent' }
        '200':
          description: This `send_id` was sent already; nothing more is sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignSent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /chat/conversations:
    get:
      tags: [Chat]
      operationId: listChatConversations
      summary: The person's conversations
      description: |
        Served by the hosted API (`Config.chat.base_url`) for every app with
        chat. The conversation with the business (`kind: direct`) always comes
        first, made on the first call; then, in an academy that turned on
        course groups, the group of each course the person is enrolled in,
        most recent message first. Students never talk to each other in
        private: there are only these two kinds.
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items, unread_count]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatConversation' }
                  unread_count: { type: integer, description: "Unread messages in all of them, for the tab's badge." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatNotAvailable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /chat/unread:
    get:
      tags: [Chat]
      operationId: chatUnread
      summary: How many messages are unread
      description: A cheap call for the badge, made when the app opens and comes back to the front.
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatNotAvailable' }

  /chat/conversations/{conversation_id}/messages:
    get:
      tags: [Chat]
      operationId: listChatMessages
      summary: Messages of a conversation
      description: |
        Newest first with `before` (older pages), or oldest first with `after`
        (what arrived since the last message the app has). While the
        conversation is on screen the app asks with `after` every
        `poll_after_seconds` (3 while messages come, up to 15 when it's
        quiet); a push brings it back when the app isn't open. Messages a
        person blocked (`ChatMember.blocked`) are left out for them; a
        deleted message stays in place as `deleted: true` without its text or
        file.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: after
          in: query
          schema: { type: string }
          description: A message ID; only newer messages, oldest first.
        - name: before
          in: query
          schema: { type: string }
          description: A message ID; only older messages, newest first.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more, poll_after_seconds]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  has_more: { type: boolean }
                  poll_after_seconds: { type: integer, minimum: 3, maximum: 15 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatNotAvailable' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: Send a message
      description: |
        Text (up to 4,000 characters), a finished upload (`upload_id`, from
        `POST /chat/uploads`), or both. `client_id` makes it safe to send
        again after a network error: the same `client_id` in the same
        conversation answers the message already made. Members the business
        blocked can read but not send (403 `chat_blocked`). 60 messages a
        minute per person.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, minLength: 8, maxLength: 64 }
                text: { type: string, maxLength: 4000 }
                upload_id: { type: string, format: uuid }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Chat isn't available (`chat_not_available`) or the business blocked this person (`chat_blocked`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The upload hasn't finished (`incomplete`); finish it with `/complete` first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /chat/conversations/{conversation_id}/read:
    post:
      tags: [Chat]
      operationId: readChatConversation
      summary: Mark a conversation read up to a message
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string }
      responses:
        '204': { description: Marked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/conversations/{conversation_id}/members:
    get:
      tags: [Chat]
      operationId: listChatMembers
      summary: The people in a group
      description: Names and pictures only, never a phone number or an email address. The business's team shows as the business.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/messages/{message_id}:
    delete:
      tags: [Chat]
      operationId: deleteChatMessage
      summary: Delete one's own message
      description: Deleted for everyone, with its file. Others see that a message was deleted.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not the person's own message (`not_allowed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/messages/{message_id}/report:
    post:
      tags: [Chat]
      operationId: reportChatMessage
      summary: Report a message to the business
      description: |
        The business sees the report in its dashboard and Yallapp Business and
        decides (delete the message, block the sender). Once per person and
        message; a second report answers 204 too.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [spam, abuse, inappropriate, other] }
                note: { type: string, maxLength: 500 }
      responses:
        '204': { description: Reported }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /chat/members/{member_id}/block:
    put:
      tags: [Chat]
      operationId: blockChatMember
      summary: Stop seeing a member's messages
      description: For the person asking only, in every group. The business itself can't be blocked.
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '204': { description: Blocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Chat]
      operationId: unblockChatMember
      summary: See a member's messages again
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '204': { description: Unblocked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/uploads:
    post:
      tags: [Chat]
      operationId: startChatUpload
      summary: Start sending a photo, video, voice message or file
      description: |
        Checks the type and size (pictures 20 MB, videos 200 MB, voice
        messages 20 MB, files 50 MB: PDF, Word, Excel, PowerPoint, text) and
        the app's storage, where chat files count with the Media library's
        (413 `storage_full`). The app sends the file in chunks to `upload_url`
        exactly as Yallapp Business does for Media (the media gate's protocol),
        then calls `/complete`, then sends the message with `upload_id`. An
        upload not sent in a message within a day is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, type]
              properties:
                name: { type: string, maxLength: 200 }
                size: { type: integer, minimum: 1 }
                type: { type: string, example: image/jpeg }
                duration_seconds: { type: integer, minimum: 0, description: A voice message's length. }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ChatNotAvailable' }
        '413':
          description: Too big for its kind (`too_big`), or the app's storage is full (`storage_full`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /chat/uploads/{upload_id}/resume:
    post:
      tags: [Chat]
      operationId: resumeChatUpload
      summary: A fresh link to carry on with an upload
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: A new link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatUpload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/uploads/{upload_id}/complete:
    post:
      tags: [Chat]
      operationId: completeChatUpload
      summary: Finish an upload
      description: 409 `incomplete` with the offset reached when part of the file is missing.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204': { description: Ready to send }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/points:
    get:
      tags: [Commerce]
      operationId: getMyPoints
      summary: The customer's loyalty points
      description: |
        91.4 Loyalty points of shops without a website (`StoreConfig.loyalty`):
        the balance, what it is worth, and the latest changes, newest first.
        Points are earned when an order is completed (what was paid for the
        products, after coupons and points), used in the cart
        (`CartInput.use_points`), given back when a paid order that used them
        is cancelled or refunded, and taken back when an order that earned
        them is refunded or its return approved. `feature_disabled` (403) when
        the shop has no loyalty points.
      responses:
        '200':
          description: The points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointsAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/orders:
    get:
      tags: [Commerce]
      operationId: listOrders
      summary: List the student's orders
      description: |
        Orders from the site's checkout (the LMS's own or WooCommerce, or the
        hosted API's payment page for shops without a website), newest first.
        Empty when the site doesn't sell (`features.orders`). The
        Academy app on iOS doesn't show orders, as it doesn't sell courses;
        Store apps show them on both platforms. 96.3 Apps without a website
        that sell tickets (Events), paid courses (Academy) or memberships
        (gyms' Bookings) list those orders here too, each with its
        `receipt_url`, and the app shows them under My orders (Events and
        gyms on both platforms).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/orders/{order_id}:
    get:
      tags: [Commerce]
      operationId: getOrder
      summary: Get one of the customer's orders
      description: |
        One order of the signed-in customer, for following it: a restaurant's
        order shows `fulfilment` and `fulfilment_status`, which change as the
        kitchen works on it (received, preparing, ready, out for delivery,
        completed). Each change also reaches the customer as a notification,
        whose push `data` carries the `order_id`. 91.2 Shop orders too: a
        shipment with its tracking, completed, cancelled or refunded is an
        `order_update` notification (unless the phone turned `orders` off)
        that opens this; on Yallapp's hosted API, shops on Shopify and the
        other connected platforms too (their orders are looked at for 30 days
        after a checkout from the app, every 15 minutes). `not_found` for
        someone else's order.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/orders/{order_id}/return:
    post:
      tags: [Commerce]
      operationId: requestReturn
      summary: Ask to return an order
      description: |
        91.3 The customer asks the shop to take back an order it completed,
        within `StoreConfig.returns.days` (`Order.can_return`). The shop
        approves or declines it (with a reply) on its side; the customer is
        told with an `order_update` notification. Once asked, it can't be
        asked again (`conflict`); `forbidden` when the shop takes no returns
        from the app or the order can't be returned (not completed, too late,
        nothing physical).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequestInput' }
      responses:
        '200':
          description: The order, with its `return_request`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courses/{course_id}/reviews:
    get:
      tags: [Community]
      operationId: listReviews
      summary: List a course's reviews
      description: Approved reviews, newest first, with the rating summary. Signed-in students also get their own review, approved or not.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, summary, can_review]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }
                      summary: { $ref: '#/components/schemas/RatingSummary' }
                      mine:
                        oneOf:
                          - $ref: '#/components/schemas/Review'
                          - type: 'null'
                      can_review: { type: boolean, description: "Whether the signed-in student may write or edit a review: enrolled, and reviews are on." }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courses/{course_id}/reviews/mine:
    put:
      tags: [Community]
      operationId: saveMyReview
      summary: Write or edit the student's review
      description: One review per student and course. Enrolled students only. The site may hold it for approval (`status`). On Yallapp's hosted API (roadmap 63) a student writes or edits at most 20 reviews an hour in an app (429).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /courses/{course_id}/questions:
    get:
      tags: [Community]
      operationId: listQuestions
      summary: List a course's questions
      description: Questions students asked in the course, newest first, without their answers. Enrolled students only. A question the business hid (roadmap 64) is listed only for its author, with `hidden`, and isn't in `total` for others.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CourseQuestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Community]
      operationId: askQuestion
      summary: Ask a question
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextInput' }
      responses:
        '201':
          description: Asked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /questions/{question_id}:
    get:
      tags: [Community]
      operationId: getQuestion
      summary: Get a question with its answers
      description: A question the business hid (roadmap 64) is `404` to everyone but its author. Hidden answers are listed only for their author.
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Question and answers, oldest answer first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseQuestionThread' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /questions/{question_id}/answers:
    post:
      tags: [Community]
      operationId: answerQuestion
      summary: Reply to a question
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextInput' }
      responses:
        '201':
          description: Reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List course categories
      security: []
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courses:
    get:
      tags: [Catalog]
      operationId: listCourses
      summary: List courses
      description: >-
        Published courses. A private course (WordPress's Private visibility, which the LMS
        uses to hide a course from its catalog) is never listed, not even to its students:
        they find it in `GET /me/courses` (50).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: integer }
        - name: price
          in: query
          schema: { type: string, enum: [all, free, paid], default: all }
        - name: orderby
          in: query
          schema: { type: string, enum: [newest, popular, title], default: newest }
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CourseSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courses/{course_id}:
    get:
      tags: [Catalog]
      operationId: getCourse
      summary: Get a course
      description: >-
        A private course opens only for the students enrolled in it (bought, free or added by
        an administrator) and for whoever may read it on the website (its author, editors and
        administrators); anyone else gets `404 not_found`, as for a course that doesn't
        exist (50). A course with a password on the website (roadmap 62) shows in the catalog
        and opens as `password_protected`; see `CourseDetail`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: Course detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courses/{course_id}/curriculum:
    get:
      tags: [Catalog]
      operationId: getCurriculum
      summary: Get a course's topics and items
      description: >-
        The course's topics (Tutor LMS topics, LearnPress, LearnDash and MasterStudy
        sections, LifterLMS sections, Sensei modules...) in the order the LMS shows them, each
        with its lessons, quizzes, assignments and live classes in order. Items the student
        can't open are returned with `locked` set and no content. A private course's
        curriculum is `404 not_found` for whoever can't open the course (`GET
        /courses/{course_id}`, 50). A course with a password on the website (62) has no topics
        for a student who isn't in it.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curriculum
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items: { $ref: '#/components/schemas/Topic' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courses/{course_id}/restart:
    post:
      tags: [Learning]
      operationId: restartCourse
      summary: Start a course again
      description: >-
        Roadmap 73. Clears the signed-in student's progress in the course (lessons completed,
        where each video stopped, and the quiz results the LMS keeps with the course, where it
        does) so they can take it again from the first lesson. Their enrollment, orders,
        reviews and questions stay. The app offers it ("Start the course again", after asking
        to confirm) on a finished course whose `CourseDetail.can_restart` is true, then opens
        the first lesson. `403 not_enrolled` for a student who isn't in the course, `403
        restart_disabled` when `can_restart` is false (the owner turned it off for the course,
        or the LMS has no way to reset a student's progress). A certificate already issued is
        the LMS's: some keep it, some take it back.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: The course's progress after starting again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courses/{course_id}/enroll:
    post:
      tags: [Commerce]
      operationId: enrollFree
      summary: Enroll in a free course
      description: >-
        A course with a password on the website (62) is `403 enrollment_disabled`: the student
        joins it on the website, where its password is entered.
        A course that needs a membership the student doesn't have (90.3,
        `CourseDetail.membership`) is `403 membership_required`.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/courses:
    get:
      tags: [Learning]
      operationId: listMyCourses
      summary: List the student's courses
      description: Private courses the student is enrolled in are listed too (50).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [in_progress, completed], default: in_progress }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Enrolled courses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MyCourse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/wishlist:
    get:
      tags: [Learning]
      operationId: listWishlist
      summary: List wishlisted courses
      description: >-
        Empty when the LMS has no wishlist (`features.wishlist` is false). Roadmap 62: a private
        course the student may open (enrolled in it, or may read it on the website) is listed
        like any other; one they can't open isn't.
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CourseSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/wishlist/{course_id}:
    put:
      tags: [Learning]
      operationId: addToWishlist
      summary: Add a course to the wishlist
      description: >-
        Fails with `feature_disabled` when the LMS has no wishlist (`features.wishlist` is
        false). A course the student can't open (a private one they aren't in) is `404
        not_found` (62).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '204': { description: Added }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [Learning]
      operationId: removeFromWishlist
      summary: Remove a course from the wishlist
      description: Fails with `feature_disabled` when the LMS has no wishlist (`features.wishlist` is false).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /lessons/{lesson_id}:
    get:
      tags: [Learning]
      operationId: getLesson
      summary: Get a lesson
      description: >-
        Free-preview lessons are public; everything else requires enrollment. A lesson of a
        private course is `404 not_found`, free previews included, for whoever can't open the
        course (`GET /courses/{course_id}`, 50); so is a lesson of a course with a password on
        the website for a student who isn't in it (62).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/BoundMedia'
      responses:
        '200':
          description: Lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /lessons/{lesson_id}/progress:
    put:
      tags: [Learning]
      operationId: saveLessonProgress
      summary: Save video position
      parameters:
        - $ref: '#/components/parameters/LessonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_seconds, watched_percent]
              properties:
                position_seconds: { type: integer, minimum: 0 }
                watched_percent: { type: number, minimum: 0, maximum: 100 }
      responses:
        '204': { description: Saved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /lessons/{lesson_id}/complete:
    post:
      tags: [Learning]
      operationId: completeLesson
      summary: Mark a lesson as complete
      description: Fails with `watch_requirement_not_met` when the site requires a share of the video to be watched first.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Course progress after completing the lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /lessons/{lesson_id}/download:
    post:
      tags: [Learning]
      operationId: downloadLesson
      summary: Links to save a lesson for offline viewing
      description: |
        Roadmap 45. When `features.downloads` is true and the lesson's
        `offline.available` is true, the app asks for the lesson's files here
        and keeps them on the phone, encrypted, in its own storage. Each link
        is for this student only and works for a short time (`expires_at`):
        the app downloads at once, and asks again to resume a download after
        that. A lesson whose video plays from a video site (YouTube, Vimeo,
        Bunny Stream and other players) can't be saved: 409
        `not_downloadable`, with `details.reason` as in `LessonOffline`.
        403 `feature_disabled` when downloads are off for the app, 403
        `not_enrolled` when the student can't open the lesson.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: The lesson's files
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDownload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/downloads/check:
    post:
      tags: [Learning]
      operationId: checkDownloads
      summary: Whether the student may keep their saved lessons
      description: |
        Roadmap 45. The app sends the lessons it keeps for offline viewing
        when it starts with a connection. A lesson is `refused` when the
        student can't open it any more (their enrollment ended, was
        refunded or expired, or the lesson is gone); the app deletes it. The
        app also deletes everything when `downloads` is false (the owner
        turned downloads off or the plan no longer includes offline mode),
        and a lesson it hasn't been able to check for `keep_days` days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lesson_ids]
              properties:
                lesson_ids:
                  type: array
                  maxItems: 500
                  items: { type: integer }
      responses:
        '200':
          description: The lessons the student may keep and those to delete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /quizzes/{quiz_id}:
    get:
      tags: [Quizzes]
      operationId: getQuiz
      summary: Get quiz details and the student's attempts
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '200':
          description: Quiz
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quiz' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /quizzes/{quiz_id}/attempts:
    post:
      tags: [Quizzes]
      operationId: startAttempt
      summary: Start an attempt
      description: Returns the questions. Questions of a type the app can't show natively are returned with `render_mode` `webview` and a signed `webview_url`.
      parameters:
        - $ref: '#/components/parameters/QuizId'
      responses:
        '201':
          description: Attempt started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /quizzes/{quiz_id}/attempts/{attempt_id}/submit:
    post:
      tags: [Quizzes]
      operationId: submitAttempt
      summary: Submit answers
      parameters:
