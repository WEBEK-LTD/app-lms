        '404': { $ref: '#/components/responses/NotFound' }

  /classroom/classes/{class_id}/messages:
    post:
      tags: [Classroom]
      operationId: messageClass
      summary: Write to a whole class at once
      description: |
        113.6 When the school allows it (`SchoolMessages.class_messages`):
        the same text in each one-to-one conversation of the teacher with the
        class's parents, students or both (`families`, as the school allows),
        so each answer comes back to the teacher alone; each of them gets a
        push. People who never signed in to the app can't be written to yet
        (`not_in_app`). Within the school's hours (409 `outside_hours`).
        The same `client_id` again sends nothing twice.
      parameters:
        - name: class_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, client_id, text]
              properties:
                to: { type: string, enum: [parents, students, families] }
                client_id: { type: string, minLength: 8, maxLength: 64 }
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [sent, not_in_app]
                properties:
                  sent: { type: integer, description: Conversations it went into. }
                  not_in_app: { type: integer, description: People who haven't signed in to the app yet. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Outside the school's messaging hours (`outside_hours`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /classroom/exams:
    get:
      tags: [Classroom]
      operationId: listClassroomExams
      summary: The exams of the teacher's classes
      description: Roadmap 113.8. The published exams of the teacher's classes (or of `class_id`), coming and done, as students see them.
      parameters:
        - { name: class_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Exams
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamLists' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

