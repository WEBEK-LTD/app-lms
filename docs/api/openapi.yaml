  /bookings/availability:
    get:
      tags: [Bookings]
      operationId: getAvailability
      summary: Free times for a service
      description: |
        Free start times from `from` for `days` days, by the business's local
        date, as the booking plugin computes them (working hours, days off,
        breaks, existing appointments, buffers and how far ahead customers
        may book). Without `staff`, a time is free when any staff member who
