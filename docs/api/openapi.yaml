        school allows (whom teachers write to, who writes first, the hours,
        files, a class at once, whether the administration reads them) and
        whom they can write to: a teacher the parents (and students, when
        allowed) of the classes they teach; a parent the teachers of their
        children; a student their own teachers. A conversation is opened
