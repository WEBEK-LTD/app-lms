  /billing/access:
    post:
      tags: [Platform]
      operationId: storeAccess
      summary: Give or take access bought through a store
      description: |
        Roadmap 100. Sent by the Yallapp platform to the WordPress site (plugin
        0.4.23 and later) once it has checked a store purchase, and again when
        Google or Apple says it was refunded, revoked, renewed or ended. The
        plugin gives the access (`grant`): enrols the user in the course (the
        site's LMS), or gives the membership until `expires_at` (Paid
        Memberships Pro level, LearnDash group, or the site's WooCommerce
        Subscriptions product), and records a WooCommerce order marked paid by
        the store when WooCommerce is active; or takes it back (`revoke`).
        `grant_id` is the same on every try of one change: a repeat answers as
        the first time did.

        The request is signed like `POST /license/refresh`: the headers
        `Yallapp-Timestamp` (Unix seconds) and `Yallapp-Signature`, the
        lowercase hex HMAC-SHA256 of `yallapp-billing-access:<timestamp>:<the raw
        body>`, keyed with the license key in capitals. A wrong signature, a
        site without a license key or a timestamp more than 5 minutes away is
        refused (`invalid_signature`, 401). Only sent to the https address of
        the site the license is active on; tried again after 1, 5 and 30
        minutes and 2, 6 and 24 hours when the site doesn't answer 2xx.
      security: []
      parameters:
        - name: Yallapp-Timestamp
          in: header
          required: true
          schema: { type: integer }
        - name: Yallapp-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_id, action, user_id, kind, platform, transaction_id]
              properties:
                grant_id: { type: string, format: uuid }
                action: { type: string, enum: [grant, revoke] }
                user_id: { type: integer, minimum: 1, description: The WordPress user. }
                kind: { type: string, enum: [course, membership] }
                course_id: { type: [integer, 'null'], description: For `course`. }
                plan_id: { type: [string, 'null'], description: 'For `membership`, as the plugin sent it in its catalog (`POST /billing/catalog`, platform API).' }
                expires_at: { type: [string, 'null'], format: date-time, description: 'For `membership`, when the paid period ends (renewals send a later one).' }
                platform: { type: string, enum: [android, ios] }
                transaction_id: { type: string, description: The store's order ID (Google) or original transaction ID (Apple). }
                amount: { type: [string, 'null'], description: 'What the person paid, in `currency`, for the WooCommerce order.' }
                currency: { type: [string, 'null'], example: TRY }
      responses:
        '200':
          description: Done (or already done).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  order_id: { type: [integer, 'null'], description: 'The WooCommerce order recorded, if any.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another try of the same `grant_id` is still being made (`conflict`); tried again later, it answers as that one did.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The site couldn't give or take the access now (its LMS or membership plugin is off, `lms_unavailable` or `access_unavailable`); tried again later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /license/refresh:
    post:
      tags: [Platform]
      operationId: refreshLicense
      summary: Check the license now
      description: |
        Sent by the Yallapp platform, a few seconds after the app's owner saves
        something the plugin reads from its license status (the app type, how
        people sign in, the plan) or publishes the app's pages. The plugin
        then checks its license with the platform and fetches the published
        pages, as it does on its own twice a day and every 15 minutes. It
        trusts nothing in this request: it only learns that it should ask now.

        The request is signed with the site's license key, which both sides
        know: `signature` is the lowercase hex HMAC-SHA256 of
        `yallapp-license-refresh:<timestamp>` keyed with the license key in
        capitals (`YALL-XXXX-XXXX-XXXX`). The plugin refuses a wrong signature,
        a site without a license key and a timestamp more than 5 minutes away
        from its clock (`invalid_signature`, 401). It checks at most once every
        30 seconds: a nudge within 30 seconds of the last one gets 429 and the
        plugin checks once when the 30 seconds are over, so the last change
        still arrives. Reachable during maintenance and while the app API is
        paused, so a renewed or reactivated plan reaches the site.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timestamp, signature]
              properties:
                timestamp:
                  type: integer
                  description: Unix time in seconds when the platform sent it.
                  examples: [1792000000]
                signature:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: HMAC-SHA256 of `yallapp-license-refresh:<timestamp>`, keyed with the license key, in lowercase hex.
      responses:
        '202':
          description: The license was checked (and the layout fetched); `status` is the license status the site now has.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [active, expired, suspended, invalid, none, unreachable]
                    description: '`unreachable`: the platform didn''t answer; the site keeps its last status.'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

