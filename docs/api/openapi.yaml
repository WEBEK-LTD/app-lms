  /store/products:
    get:
      tags: [Store]
      operationId: listProducts
      summary: List products
      description: Published products the shop shows (catalog visibility "shop" or "shop and search"; "search" when `search` is given).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: { type: string }
        - name: category
