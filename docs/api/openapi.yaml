                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Homework' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/homework/{homework_id}/submission:
    put:
      tags: [School]
      operationId: submitHomework
      summary: Hand in homework
      description: |
        By the student only (a parent gets `not_student`, 403): some text,
        a file (a photo or a PDF sent with `/school/uploads`), or both. It
        can be handed in again until the teacher marks it; after the due
        date it is marked late. Refused with `already_marked` (409) once
        marked.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/HomeworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 5000 }
                upload_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: The homework with its submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Homework' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /school/students/{student_id}/grades:
    get:
      tags: [School]
      operationId: getStudentGrades
      summary: The student's scores by subject, and the exams coming up
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Grades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentGrades' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/report-card:
    get:
      tags: [School]
      operationId: getStudentReportCard
      summary: The student's report card
      description: |
        Roadmap 112.5. Over the school's current term (else the year so far),
        or `from` to `to`: the student's percent in each subject (the share
        of the marks of the subject's scored exams, quizzes and assignments
        in the period) with each score, overall, and their attendance.
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: The report card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/reports:
    get:
      tags: [School]
      operationId: listStudentSharedReports
      summary: The teachers' reports the school shared with the student's parents
      description: |
        Roadmap 113.5. For the student's parents only (`not_parent`, 403, for
        anyone else, the student too): the reports teachers wrote on the
        student (their level, behaviour, attendance, what to do next) that the
        school approved and chose to share, newest first. The parents get a
        push (`school_report_shared`) when one is shared.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Shared reports
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SharedReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/fees:
    get:
      tags: [School]
      operationId: listStudentFees
      summary: The student's fees, due and paid
      description: |
        For the student's parents (`not_parent`, 403, for anyone else, the
        student too); at a school in university mode (113.9) the student
        sees and pays their own as well. `school_fee` pushes go to the same
        people.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Fees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentFees' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/fees/{fee_id}/pay:
    post:
      tags: [School]
      operationId: payStudentFee
      summary: Pay a fee by card on the school's payment page
      description: |
        When the school takes fees by card (`SchoolConfig.fees_by_card`) and
        has set up its payment gateway; `payments_unavailable` (503)
        otherwise, and `already_paid` (409) for a fee paid. The app opens
        `payment_url`; once paid the fee is `paid` with its receipt. For
        the same people as the fees (`not_parent`, 403, otherwise).
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/FeeId'
      responses:
        '200':
          description: The payment page
          content:
            application/json:
              schema:
                type: object
                required: [payment_url]
                properties:
                  payment_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /school/calendar:
    get:
      tags: [School]
      operationId: getSchoolCalendar
      summary: The school's calendar for the person
      description: |
        Roadmap 113.8. The events, holidays and breaks (no school that day)
        and exam days from `from` to `to` (this month and the next weeks by
        default, up to 120 days), with the published exams of the
        timetable: everyone's, the grade's and the class's of the person's
        students (a teacher's: of their classes), and the staff's for those
        who work at the school. With `student_id`, one of the person's
        students only (a parent's child); `not_found` (404) for anyone else.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: student_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: The calendar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolCalendar' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/exams:
    get:
      tags: [School]
      operationId: listStudentExams
      summary: The student's exams' timetable
      description: "Roadmap 113.8. The published exams of the student's class or grade: those coming (soonest first) and the last 50 done (latest first). The student and their parents get a push when exams are published and the day before each (`school_exam`)."
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Exams
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamLists' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/behaviour:
    get:
      tags: [School]
      operationId: getStudentBehaviour
      summary: The student's behaviour record
      description: "Roadmap 113.8. Merits and notes, newest first, with the record's points total and counts. Parents get a push (`school_behaviour`) for all of them, only negative ones or none, as the school chooses."
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - $ref: '#/components/schemas/BehaviourTotals'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/BehaviourNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/announcements:
    get:
      tags: [School]
      operationId: listSchoolAnnouncements
      summary: The school's news for the person
      description: Newest first. To the whole school, to the class of one of the person's students, or to one of them (and their family). A teacher also sees what they wrote.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SchoolAnnouncement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /school/checkin:
    get:
      tags: [Check-in]
      operationId: getCheckinToday
      summary: Today at the gate for the signed-in student, teacher or member of staff
      description: Whether the school takes check-ins, how, its place and radius (for the location method), the person's times and today's record.
      responses:
        '200':
          description: Today
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinToday' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Check-in]
      operationId: checkInOrOut
      summary: Check in or out
      description: |
        `action` `in` or `out`, with what the school's `methods` ask: the
        gate's `code` (the six digits typed, or what its QR code holds), the
        phone's `lat` and `lng`, or both. Errors: `checkin_off` (403, the
        school doesn't take check-ins), `outside_area` (403, with
        `details.distance_m`), `code_needed`, `invalid_code` (an old or
        another school's code) and `location_needed` (400), `not_school_day`,
        `too_early` (check-in opens two hours before the day starts),
        `already_in`, `not_in` and `already_out` (409). A student's parents
        get `school_checkin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [in, out] }
                code: { type: [string, 'null'], maxLength: 80, description: "The six digits on the gate's screen, or what its QR code holds (`YG1.…`)." }
                lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
                lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Checked in or out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/checkin/history:
    get:
      tags: [Check-in]
      operationId: getCheckinHistory
      summary: The signed-in person's month at the gate
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: The month
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinMonth' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /school/uploads:
    post:
      tags: [School]
      operationId: startSchoolUpload
      summary: Start sending a file for homework
      description: |
        A photo (JPEG, PNG, WebP) up to 20 MB or a PDF up to 200 MB, by a
        student handing in homework or a teacher giving it, into the
        school's Media library (413 `storage_full` when its storage is full).
        Sent in chunks to `upload_url` as chat files are, then `/complete`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, type]
              properties:
                name: { type: string, maxLength: 200 }
                size: { type: integer, minimum: 1 }
                type: { type: string, example: application/pdf }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Too big for its kind (`too_big`), or the school's storage is full (`storage_full`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /school/uploads/{upload_id}/resume:
    post:
      tags: [School]
      operationId: resumeSchoolUpload
      summary: A fresh link to carry on with an upload
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: A new link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolUpload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/uploads/{upload_id}/complete:
    post:
      tags: [School]
      operationId: completeSchoolUpload
      summary: Finish an upload
      description: 409 `incomplete` with the offset reached when part of the file is missing.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204': { description: Ready to use }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /school/students/{student_id}/bus:
    get:
      tags: [School]
      operationId: getStudentBus
      summary: The student's school bus, live while it runs
      description: |
        Roadmap 113.10. Each trip (morning, afternoon) the student rides:
        the route and its bus, the stops in the order the bus reaches them
        and the student's stop; `run` is today's trip once the driver
        started it, with the bus's position while it runs (`bus`, recent
        ones only, drawn on `SchoolConfig.map`) and how soon it reaches the
        student's stop (`eta_minutes`, `distance_m`: before they get on in
        the morning, while they're on the bus in the afternoon), and how
        the driver or the supervisor marked the student. Ask again every
        15 seconds or so while the screen is open. Parents are pushed
        (`school_bus`) when the bus is near the stop and when the child
        gets on and off.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: The student's trips
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentBus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/bus/routes:
    get:
      tags: [School]
      operationId: listBusCrewRoutes
      summary: The routes the person drives or supervises, with today's trips
      description: |
        Roadmap 113.10. For the school's people who drive or supervise one
        of its buses (`User.roles` has `bus`); `not_bus_crew` (403) for
        anyone else. `drives`: the person starts the route's trips and
        their phone sends the bus's position (the driver; without one, the
        supervisor).
      responses:
        '200':
          description: Routes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BusCrewRoute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /school/bus/routes/{route_id}/runs:
    post:
      tags: [School]
      operationId: startBusRun
      summary: Start the route's morning or afternoon trip today
      description: |
        Roadmap 113.10. By whoever `drives` the route. A trip started again
        the same day goes on where it was (200; 201 when it is new);
        `trip_running` (409) while the bus is on its other trip. While it
        runs, the driver's phone sends its position
        (`PUT /school/bus/runs/{run_id}/location`) as long as the trip's
        screen is open; nothing runs in the background.
      parameters:
        - $ref: '#/components/parameters/BusRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trip]
              properties:
                trip: { type: string, enum: [morning, afternoon] }
      responses:
        '200':
          description: The trip, started again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRun' }
        '201':
          description: The trip, started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/bus/runs/{run_id}:
    get:
      tags: [School]
      operationId: getBusRun
      summary: A trip as its crew sees it, the stops with their students
      parameters:
        - $ref: '#/components/parameters/BusRunId'
      responses:
        '200':
          description: The trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/bus/runs/{run_id}/location:
    put:
      tags: [School]
      operationId: sendBusLocation
      summary: The bus's position, from the driver's phone while the trip runs
      description: |
        Roadmap 113.10. At most every 5 seconds (more often is accepted and
        left out). The stops the bus comes within about 120 m of are
        reached; the parents of the stops it is now near (as the school
        chose: a distance or minutes) are pushed once each. `trip_ended`
        (409) once it ended.
      parameters:
        - $ref: '#/components/parameters/BusRunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: number, description: Metres. }
      responses:
        '204': { description: Kept }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /school/bus/runs/{run_id}/riders/{student_id}:
    put:
      tags: [School]
      operationId: markBusRider
      summary: Mark a student on the trip as on the bus, off it, or absent
      description: |
        Roadmap 113.10. By the route's driver or supervisor, for a student
        of the trip. The parents are pushed (`school_bus`) when the child
        gets on and off.
      parameters:
        - $ref: '#/components/parameters/BusRunId'
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [boarded, off, absent] }
      responses:
        '200':
          description: The student on the trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRider' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/bus/runs/{run_id}/end:
    post:
      tags: [School]
      operationId: endBusRun
      summary: End the trip
      description: Roadmap 113.10. By whoever `drives` the route; the bus's position is kept only while a trip runs. A trip left running ends on its own the next day.
      parameters:
        - $ref: '#/components/parameters/BusRunId'
      responses:
        '200':
          description: The trip, ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/library/books:
    get:
      tags: [School]
      operationId: listLibraryBooks
      summary: The school library's books, searched and by category
      description: |
        Roadmap 113.11. For everyone the school added. `q` matches the
        title, the author or the ISBN; `categories` are the library's, to
        browse by.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, maxLength: 60 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Books
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBookPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /school/library/books/{book_id}:
    get:
      tags: [School]
      operationId: getLibraryBook
      summary: A book, its copies on the shelf, its e-book and the person's holds of it
      description: |
        Roadmap 113.11. `file`: the e-book (a PDF) to read in the app, by a
        link that lasts a few hours. `borrowers`: whom the person may
        reserve it for (themselves, a parent's children).
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryBookDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/library/books/{book_id}/hold:
    post:
      tags: [School]
      operationId: holdLibraryBook
      summary: Reserve the book
      description: |
        Roadmap 113.11. Held now when a copy is free (`ready`, until
        `expires_at`: the school's days), else `waiting` until one comes
        back, in the order people reserved; they're pushed
        (`school_library`) when it is ready. `person_id`: whom it is for,
        when the person borrows for more than one (a parent's children).
        `already_held`, `on_loan_to_you`, `too_many_holds` and `no_copies`
        (409).
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                person_id: { type: [integer, 'null'] }
      responses:
        '201':
          description: The hold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryHold' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/library/holds/{hold_id}:
    delete:
      tags: [School]
      operationId: cancelLibraryHold
      summary: Cancel a hold; its copy goes to the next one waiting
      parameters:
