        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /listings:
    get:
      tags: [Listings]
      operationId: searchListings
      summary: Search listings
      description: Published listings matching the filters. Signed-in users get `favorited` on each.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: 'Words in the title, description, place or reference.' }
        - { name: purpose, in: query, schema: { type: string, enum: [sale, rent] } }
        - { name: type, in: query, schema: { type: string }, description: 'A `ListingFilters.types` key, e.g. apartment.' }
        - { name: city, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: max_price, in: query, schema: { type: number, minimum: 0 } }
        - { name: min_area, in: query, schema: { type: number, minimum: 0 }, description: Square metres. }
        - { name: max_area, in: query, schema: { type: number, minimum: 0 } }
        - { name: bedrooms, in: query, schema: { type: integer, minimum: 0 }, description: At least this many. }
        - { name: bathrooms, in: query, schema: { type: integer, minimum: 0 }, description: At least this many. }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, area_desc], default: newest } }
      responses:
        '200':
          description: Listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ListingSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /listings/{listing_id}:
    get:
      tags: [Listings]
      operationId: getListing
      summary: Get a listing
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /listings/{listing_id}/inquiries:
    post:
      tags: [Listings]
      operationId: sendInquiry
      summary: Message the office about a listing
      description: Starts a conversation with the office, or adds to the user's open one about this listing. The office answers from the dashboard.
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/favorites:
    get:
      tags: [Listings]
      operationId: listFavorites
      summary: List the user's favorite listings
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Favorites, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ListingSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/favorites/{listing_id}:
    put:
      tags: [Listings]
      operationId: addFavorite
      summary: Add a listing to favorites
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '204': { description: Added }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Listings]
      operationId: removeFavorite
      summary: Remove a listing from favorites
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/inquiries:
    get:
      tags: [Listings]
      operationId: listInquiries
      summary: List the user's conversations with the office
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Conversations, latest message first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Inquiry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/inquiries/{inquiry_id}:
    get:
      tags: [Listings]
      operationId: getInquiry
      summary: Get a conversation with its messages
      description: Marks the office's messages as read.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/inquiries/{inquiry_id}/messages:
    post:
      tags: [Listings]
      operationId: replyToInquiry
      summary: Reply in a conversation
      description: Writing again reopens a conversation the office closed. Refused with 403 while the office has messages turned off.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: The conversation with the new message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inquiry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /news/home:
    get:
      tags: [News]
      operationId: getNewsHome
      summary: Get the news home screen
      description: |
        Featured articles (sticky posts on WordPress, featured in the dashboard;
        the newest on a feed), the latest articles (without repeating those) and a rail per category with
        articles, newest first. Empty lists are sent as empty arrays; rails
        without articles are left out.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The home screen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NewsHome' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /news/categories:
    get:
      tags: [News]
      operationId: listNewsCategories
      summary: List article categories
      description: Categories with published articles, in the site's own order.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NewsCategory' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /news/articles:
    get:
      tags: [News]
      operationId: listArticles
      summary: List articles
      description: Published articles, newest first (or in the order of `ids`).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: category, in: query, schema: { type: string, maxLength: 64 }, description: 'A `NewsCategory.id`.' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: 'Words in the title, excerpt or body.' }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: ids, in: query, schema: { type: string, example: '12,40,7' }, description: 'Comma-separated article IDs, returned in that order (at most 30).' }
      responses:
        '200':
          description: Articles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ArticleSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /news/articles/{article_id}:
    get:
      tags: [News]
      operationId: getArticle
      summary: Get an article
      description: A published article with its body, processed like a lesson's content.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ArticleId'
      responses:
        '200':
          description: The article
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /events/filters:
    get:
      tags: [Events]
      operationId: getEventFilters
      summary: Get the filters the events list offers
      description: The categories of upcoming published events, with how many each has, and the days of the first and last upcoming event, for the list's filters and the calendar.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Filters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventFilters' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: |
        Published events, soonest first. Without `from`, events that haven't
        ended yet; a cancelled event stays in the list with `status: cancelled`
        until it would have ended. `from` and `to` are days in
        `EventsConfig.time_zone`, both included.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Events that end on or after this day.' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Events that start on or before this day.' }
        - { name: category, in: query, schema: { type: string, maxLength: 60 }, description: 'An `EventFilters.categories` id.' }
        - { name: search, in: query, schema: { type: string, maxLength: 100 }, description: 'Words in the title, description, venue or organiser.' }
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /events/{event_id}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event
      description: |
        A published event with its description (processed like a lesson's
        content), pictures, venue, ticket types and what each ticket type's
        button does on this platform (`TicketType.action`). The online link is
        sent only to people holding a ticket. Signed-in users get `my_tickets`.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /events/{event_id}/register:
    post:
      tags: [Events]
      operationId: registerForEvent
      summary: Get free tickets
      description: |
        Free ticket types only, on every platform. One ticket per name in
        `attendee_names` (the signed-in user's name for the rest), at most the
        ticket type's `max_per_order`. Places are taken atomically: fails with
        `sold_out` (409) when there aren't that many left, with `sales_ended`
        (409) after the ticket type's sales end or once the event started,
        with `event_cancelled` (409), and with `purchase_required` (403) for a
        paid ticket type.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketOrderInput' }
      responses:
        '201':
          description: The tickets
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /events/checkout-link:
    post:
      tags: [Events]
      operationId: createEventCheckoutLink
      summary: Get a one-time link to buy paid tickets
      description: |
        Holds the places and opens the web payment page; the tickets are
        issued only once the payment is confirmed, and show in
        `GET /me/tickets` then. Places that aren't paid for are freed after
        the link expires. Fails with `purchase_not_allowed` (403) on iOS for
        online-only events (no venue: digital content) and when the organiser
        can't take card payments, and with `sold_out`, `sales_ended` or
        `event_cancelled` (409) like `register`. The payment page's last page
        has `order-received` in its address.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [event_id]
                  properties:
                    event_id: { type: integer }
                - $ref: '#/components/schemas/TicketOrderInput'
      responses:
        '200':
          description: Checkout link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, open_in]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  open_in: { type: string, enum: [in_app, browser] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/tickets:
    get:
      tags: [Events]
      operationId: listMyTickets
      summary: List the user's tickets
      description: |
        Every ticket issued to the signed-in user, upcoming events first
        (soonest first), then past ones. The app keeps the last answer on the
        device, so tickets and their QR codes show without a connection.
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/tickets/{ticket_code}/cancel:
    post:
      tags: [Events]
      operationId: cancelMyTicket
      summary: Cancel one of the user's tickets
      description: |
        Free tickets only, when the organiser allows it (`EventsConfig.allow_cancel_hours`)
        and the event starts at least that many hours later; the place goes back
        on sale. Fails with `cancel_not_allowed` (403) otherwise, and with a
        conflict (409) for a ticket already used or cancelled. Paid tickets are
        refunded by the organiser.
      parameters:
        - $ref: '#/components/parameters/TicketCode'
      responses:
        '200':
          description: The cancelled ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /donations/campaigns:
    get:
      tags: [Donations]
      operationId: listCampaigns
      summary: List campaigns
      description: |
        Open campaigns first (featured ones first, then the newest), then
        campaigns that have ended. Drafts are never listed.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { type: string, enum: [open, closed] }, description: 'Only open or only closed campaigns.' }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: ids, in: query, schema: { type: string, example: '3,1' }, description: 'Comma-separated campaign IDs, returned in that order (at most 30).' }
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CampaignSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /donations/campaigns/{campaign_id}:
    get:
      tags: [Donations]
      operationId: getCampaign
      summary: Get a campaign
      description: |
        An open or closed campaign with its story, processed like an
        article's body, and its most recent donations (anonymous ones without
        a name).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: The campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /donations/checkout-link:
    post:
      tags: [Donations]
      operationId: createDonationCheckoutLink
      summary: Get a one-time link to the donation page
      description: |
        Starts a donation and returns the page where the donor pays. The
        donor's name and email for the receipt are asked on that page.

        `open_in` is always `browser` when `platform` is `ios`: an iPhone app
        may not take donations itself (App Store guideline 3.2.2), so the app
        opens the link in the system browser, never in a web view inside the
        app, and words the button "Donate on our website". On Android it is
        `in_app` (Google Play's billing rules don't cover donations to
        charities; the app may still open it in the browser).

        Fails with `invalid_request` (400) for an amount under the campaign's
        `min_amount`, a custom amount the campaign doesn't allow, or
        `recurring: monthly` when `DonationsConfig.monthly` is false; with
        `campaign_closed` (409) when the campaign has ended; with
        `purchase_not_allowed` (403) on iOS when `DonationsConfig.ios_mode`
        is `off`; and with `donations_unavailable` (503) while the charity's
        payments aren't set up.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DonationInput' }
      responses:
        '200':
          description: Donation link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, open_in]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  open_in:
                    type: string
                    enum: [in_app, browser]
                    description: Always `browser` on iOS.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/donations:
    get:
      tags: [Donations]
      operationId: listMyDonations
      summary: List the signed-in user's donations
      description: Confirmed donations started from the app while signed in, newest first, each with its receipt; 47 refunded ones too, with `refunded_total`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Donations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Donation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /delivery/services:
    get:
      tags: [Delivery]
      operationId: listDeliveryServices
      summary: List the company's delivery services
      description: The services a customer can choose (same-day, express, documents...), in the company's order. Empty when the company has none; the shipment then has no service.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryService' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /delivery/quote:
    post:
      tags: [Delivery]
      operationId: quoteShipment
      summary: Price a shipment before sending it
      description: |
        The price of sending a parcel between two places with a service.
        Fails with `invalid_request` (400) when a place needs its coordinates
        (pricing by distance), the zone is missing or unknown (pricing by
        zone), or the places are further apart than the company delivers
        (`DeliveryConfig.max_distance_km`).
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteInput' }
      responses:
        '200':
          description: The price
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /delivery/locate:
    post:
      tags: [Delivery]
      operationId: locateMapLink
      summary: Read a place's coordinates from a maps link
      description: |
        For a place shared as a Google Maps or Apple Maps link (a WhatsApp
        location, a short `maps.app.goo.gl` link): the coordinates it points
        at. Only links of those maps are followed. Fails with
        `invalid_request` (400) when the link has no coordinates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 500 }
      responses:
        '200':
          description: The coordinates
          content:
            application/json:
              schema:
                type: object
                required: [lat, lng]
                properties:
                  lat: { type: number, minimum: -90, maximum: 90 }
                  lng: { type: number, minimum: -180, maximum: 180 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /delivery/shipments:
    post:
      tags: [Delivery]
      operationId: createShipment
      summary: Send a parcel
      description: |
        Creates the shipment at the price `POST /delivery/quote` gives for the
        same places and service. Paid in cash (`payment: cash`), it waits for
        a courier at once (`pending`). Paid by card (`payment: card`), it
        waits for the payment (`awaiting_payment`) and the answer has
        `pay_url`, the company's payment page, opened in the app on both
        platforms (a service in the physical world); it waits for a courier
        once the payment is confirmed.

        Fails with `invalid_request` (400) as the quote does, or for a payment
        method the company doesn't take (`DeliveryConfig.payment`); with
        `payments_unavailable` (503) for a card payment while the company's
        payments aren't set up.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentInput' }
      responses:
        '201':
          description: The shipment
          content:
            application/json:
              schema:
                type: object
                required: [shipment, pay_url]
                properties:
                  shipment: { $ref: '#/components/schemas/Shipment' }
                  pay_url: { type: [string, 'null'], format: uri, description: 'For `payment: card`: the payment page, good for 60 minutes. Null for cash.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/shipments:
    get:
      tags: [Delivery]
      operationId: listMyShipments
      summary: List the signed-in customer's shipments
      description: Newest first; `active` only those not yet delivered, failed or cancelled.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Shipments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Shipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/shipments/{shipment_id}:
    get:
      tags: [Delivery]
      operationId: getMyShipment
      summary: Follow a shipment
      description: |
        The shipment with its stages, its courier and, with live tracking
        while the courier has it (`picked_up`, `on_the_way`), where the
        courier is. The app asks again every 15 seconds or so while the
        screen is open and the shipment is active.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The shipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/shipments/{shipment_id}/cancel:
    post:
      tags: [Delivery]
      operationId: cancelMyShipment
      summary: Cancel a shipment
      description: |
        Only before a courier has it (`awaiting_payment`, `pending`). A
        shipment paid by card is refunded by the company. Fails with
        `not_cancellable` (409) once a courier has it.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The cancelled shipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/shipments/{shipment_id}/pay:
    post:
      tags: [Delivery]
      operationId: payMyShipment
      summary: Get a new payment link for a shipment
      description: For a shipment still `awaiting_payment`, when the first link was closed or ran out. Fails with `not_payable` (409) for any other.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The payment page
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /courier/me:
    get:
      tags: [Courier]
      operationId: getCourier
      summary: The signed-in courier
      responses:
        '200':
          description: The courier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Courier' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Courier]
      operationId: updateCourier
      summary: Go on or off duty
      description: Only couriers on duty are offered new jobs and told of them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on_duty]
              properties:
                on_duty: { type: boolean }
      responses:
        '200':
          description: The courier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Courier' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courier/jobs:
    get:
      tags: [Courier]
      operationId: listCourierJobs
      summary: The courier's jobs
      description: |
        `active`: the courier's jobs not yet delivered, oldest first.
        `available`: shipments waiting for a courier, oldest first, only when
        the company lets couriers take jobs and the courier is on duty (else
        empty). `done`: the courier's delivered, failed and cancelled jobs
        of the last 30 days, newest first.
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [active, available, done] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/CourierJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /courier/jobs/{shipment_id}:
    get:
      tags: [Courier]
      operationId: getCourierJob
      summary: A job
      description: One of the courier's jobs, or one waiting for a courier that they could take.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourierJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /courier/jobs/{shipment_id}/accept:
    post:
      tags: [Courier]
      operationId: acceptCourierJob
      summary: Take a job
      description: |
        Only when the company lets couriers take jobs and the courier is on
        duty. The first courier to take it gets it; the others get
        `job_taken` (409).
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The job, now the courier's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourierJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /courier/jobs/{shipment_id}/status:
    post:
      tags: [Courier]
      operationId: updateCourierJob
      summary: Move a job to its next stage
      description: |
        In order: `picked_up` (the parcel is with the courier), `on_the_way`,
        then `delivered`, or `failed` when it couldn't be delivered (with a
        `note`). A cash shipment is paid once delivered: the courier collected
        `CourierJob.collect`. `released` gives a job that isn't picked up back
        to the company (to other couriers when they take jobs themselves).
        Fails with `invalid_status` (409) for any other step.
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [picked_up, on_the_way, delivered, failed, released] }
                note: { type: [string, 'null'], maxLength: 300, description: 'Why it failed, or a word for the company.' }
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourierJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /courier/location:
    put:
      tags: [Courier]
      operationId: putCourierLocation
      summary: Send the courier's position
      description: |
        Sent every 20 seconds or so while the app is open and the courier has
        a job picked up or on the way (no position is taken in the
        background). Kept only while they have one; answered 204 and
        dropped otherwise. At most one every 5 seconds is kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: [number, 'null'], minimum: 0, description: In metres. }
      responses:
        '204': { description: Received }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /food/restaurants:
    get:
      tags: [Food]
      operationId: listRestaurants
      summary: List the restaurants
      description: |
        The company's active restaurants: open ones first, then by `sort`.
        With the customer's position (`lat`, `lng`) each has its distance and
        whether it delivers there (`delivers`); restaurants that don't are
        listed last. `cuisine` keeps one cuisine (`FoodConfig.cuisines`), `q`
        searches restaurant and dish names.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: cuisine, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, distance, rating, delivery_time], default: recommended } }
      responses:
        '200':
          description: Restaurants
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RestaurantSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /food/restaurants/{restaurant_id}:
    get:
      tags: [Food]
      operationId: getRestaurant
      summary: A restaurant with its menu
      description: The restaurant and its menu in sections, the company's order. Sold-out dishes are listed with `available` false.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RestaurantId'
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Restaurant' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /food/quote:
    post:
      tags: [Food]
      operationId: quoteFoodOrder
      summary: Price one restaurant's cart
      description: |
        The cart's lines with their prices, the subtotal, the delivery fee to
        the drop-off and the total. Fails with `invalid_request` (400) for a
        dish or choice the restaurant doesn't have (or a missing required
        choice), with `unavailable_item` (409) for a sold-out dish (`field`
        names the line), `restaurant_closed` (409) while the restaurant is
        closed or busy, `below_minimum` (409) under the restaurant's smallest
        order, and `outside_delivery_area` (400) when the restaurant doesn't
        deliver to the drop-off.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodCartInput' }
      responses:
        '200':
          description: The cart's prices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /food/orders:
    post:
      tags: [Food]
      operationId: placeFoodOrder
      summary: Order from a restaurant
      description: |
        Places the order at the prices `POST /food/quote` gives for the same
        cart. Paid in cash, it goes to the restaurant at once (`placed`). Paid
        by card, it waits for the payment (`awaiting_payment`) and the answer
        has `pay_url`, the company's payment page, opened in the app on both
        platforms (food delivered is a service in the physical world); it goes
        to the restaurant once the payment is confirmed. Fails as the quote
        does, for a payment method the company doesn't take, and with
        `payments_unavailable` (503) for a card payment while the company's
        payments aren't set up.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodOrderInput' }
      responses:
        '201':
          description: The order
          content:
            application/json:
              schema:
                type: object
                required: [order, pay_url]
                properties:
                  order: { $ref: '#/components/schemas/FoodOrder' }
                  pay_url: { type: [string, 'null'], format: uri, description: 'For `payment: card`: the payment page, good for 60 minutes. Null for cash.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/food-orders:
    get:
      tags: [Food]
      operationId: listMyFoodOrders
      summary: List the signed-in customer's food orders
      description: Newest first; `active` only those not yet delivered, turned down or cancelled.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/FoodOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/food-orders/{order_id}:
    get:
      tags: [Food]
      operationId: getMyFoodOrder
      summary: Follow a food order
      description: |
        The order with its stages, the courier and, with live tracking while
        the courier has it (`picked_up`, `on_the_way`), where the courier is.
        The app asks again every 15 seconds or so while the screen is open and
        the order is active.
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/food-orders/{order_id}/cancel:
    post:
      tags: [Food]
      operationId: cancelMyFoodOrder
      summary: Cancel a food order
      description: Only before the restaurant accepts it (`awaiting_payment` or `placed`); then `not_cancellable` (409). A card payment already made is refunded by the company.
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      responses:
        '200':
          description: The order, cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/food-orders/{order_id}/pay:
    post:
      tags: [Food]
      operationId: payMyFoodOrder
      summary: A new payment page for an order waiting for its payment
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      responses:
        '200':
          description: The payment page
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/food-orders/{order_id}/rating:
    put:
      tags: [Food]
      operationId: rateMyFoodOrder
      summary: Rate a delivered order
      description: Once, after it is delivered, within 7 days. The restaurant's rating counts in its average; the courier's is seen by the company.
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurant]
              properties:
                restaurant: { type: integer, minimum: 1, maximum: 5 }
                courier: { type: [integer, 'null'], minimum: 1, maximum: 5 }
                comment: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The order with its rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /restaurant/me:
    get:
      tags: [Restaurant]
      operationId: getMyRestaurant
      summary: The restaurant the signed-in person works for
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDesk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Restaurant]
      operationId: setRestaurantBusy
      summary: Busy for a while, or open again
      description: '`busy_minutes` 15 to 240 stops new orders for that long; 0 opens again. Opening hours still apply.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [busy_minutes]
              properties:
                busy_minutes: { type: integer, minimum: 0, maximum: 240 }
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantDesk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurant/orders:
    get:
      tags: [Restaurant]
      operationId: listRestaurantOrders
      summary: The restaurant's orders
      description: '`new`: waiting to be accepted, oldest first; `active`: accepted and not yet picked up, the soonest ready first; `done`: picked up, delivered, turned down or cancelled in the last 2 days, newest first.'
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [new, active, done] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RestaurantOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurant/orders/{order_id}:
    get:
      tags: [Restaurant]
      operationId: getRestaurantOrder
      summary: One of the restaurant's orders
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /restaurant/orders/{order_id}/accept:
    post:
      tags: [Restaurant]
      operationId: acceptRestaurantOrder
      summary: Accept a new order with the minutes it needs
      description: From `placed` only; then `invalid_status` (409). The customer is told when it will be ready, and, when the company makes courier jobs on acceptance (`FoodConfig.courier_job`), a courier job is made at once.
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prep_minutes]
              properties:
                prep_minutes: { type: integer, minimum: 5, maximum: 180 }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /restaurant/orders/{order_id}/reject:
    post:
      tags: [Restaurant]
      operationId: rejectRestaurantOrder
      summary: Turn down a new order
      description: From `placed` only. The customer is told the reason; a card payment is refunded by the company.
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [closing, too_busy, item_unavailable, other] }
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /restaurant/orders/{order_id}/ready:
    post:
      tags: [Restaurant]
      operationId: readyRestaurantOrder
      summary: The order is ready for the courier
      description: From `accepted` only. Makes the courier job when the company makes them once orders are ready (`FoodConfig.courier_job`).
      parameters:
        - $ref: '#/components/parameters/FoodOrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestaurantOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /market/vendors:
    get:
      tags: [Market]
      operationId: listMarketVendors
      summary: List the vendors
      description: |
        The app's active vendors: open ones first, then by `sort`. With the
        customer's position (`lat`, `lng`) each has its distance, delivery
        time and fee, and whether it delivers there; vendors that don't are
        listed last (they can still be ordered from for pick-up when they
        allow it). `kind` keeps one kind, `category` one cuisine or
        department (`MarketConfig.categories`), `q` searches vendors and their
        items, and the flags keep vendors with free delivery, an offer,
        the club's benefit or pick-up.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/VendorKind' } }
        - { name: category, in: query, schema: { type: string, maxLength: 40 } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, distance, rating, delivery_time, delivery_fee], default: recommended } }
        - { name: free_delivery, in: query, schema: { type: boolean } }
        - { name: offers, in: query, schema: { type: boolean } }
        - { name: club, in: query, schema: { type: boolean } }
        - { name: pickup, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Vendors
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MarketVendorSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /market/vendors/{vendor_id}:
    get:
      tags: [Market]
      operationId: getMarketVendor
      summary: A vendor
      description: |
        The vendor with its hours, delivery terms, offers and the sections
        of what it sells: a restaurant's menu sections with their dishes, or
        a grocery's or shop's departments with their aisles (products come
        from `GET /market/vendors/{vendor_id}/products`, as there may be many).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VendorId'
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: The vendor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketVendor' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /market/vendors/{vendor_id}/products:
    get:
      tags: [Market]
      operationId: listMarketProducts
      summary: A vendor's products
      description: |
        Paged, in the vendor's order. `department` and `aisle` keep one,
        `q` searches names, brands and descriptions, `barcode` finds one by
        its barcode or SKU. Out-of-stock products are listed with
        `in_stock` false after the others.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VendorId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: department, in: query, schema: { type: integer } }
        - { name: aisle, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: barcode, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MarketProduct' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /market/search:
    get:
      tags: [Market]
      operationId: searchMarket
      summary: Search vendors and what they sell
      description: Vendors whose name or category matches, and the best matching dishes and products with their vendor, near the customer when `lat` and `lng` are given.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/VendorKind' } }
      responses:
        '200':
          description: The matches
          content:
            application/json:
              schema:
                type: object
                required: [vendors, items]
                properties:
                  vendors:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/MarketVendorSummary' }
                  items:
                    type: array
                    maxItems: 40
                    items:
                      type: object
                      required: [vendor, product]
                      properties:
                        vendor: { $ref: '#/components/schemas/MarketVendorSummary' }
                        product: { $ref: '#/components/schemas/MarketProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /market/offers:
    get:
      tags: [Market]
      operationId: listMarketOffers
      summary: Offers and coupons the customer can use
      description: The app's public offers (with their vendor, or the whole app), and, signed in, the coupons the customer holds (given after a complaint, or for a first order). Codes the owner keeps private are not listed.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: vendor_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MarketCoupon' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /market/quote:
    post:
      tags: [Market]
      operationId: quoteMarketOrder
      summary: Price one vendor's cart
      description: |
        Every line of the price, as the order would be charged: each item
        before and after its discount, the coupon (and whether the owner or
        the vendor pays it), the club's discount, the delivery fee (the app's
        courier prices or the vendor's own), taxes added or included, the
        wallet's part, and the total. Fails with `invalid_request` (400) for
        an item or choice the vendor doesn't have, `unavailable_item` (409)
        for one out of stock (`field` names the line), `vendor_closed` (409)
        while the vendor is closed, busy or paused (unless `scheduled_for` is
        within its hours), `below_minimum` (409) under the vendor's smallest
        order, `quantity_limit` (409) outside its fewest or most items,
        `outside_delivery_area` (400), `pickup_unavailable` (409), and
        `coupon_invalid` (409) with the reason in `message`.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketCartInput' }
      responses:
        '200':
          description: The cart's prices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketQuote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /market/orders:
    post:
      tags: [Market]
      operationId: placeMarketOrder
      summary: Order from a vendor
      description: |
        Places the order at the prices `POST /market/quote` gives for the
        same cart (the answer's `quote_id` keeps them for 10 minutes). Paid in
        cash, or fully from the wallet, it goes to the vendor at once
        (`placed`; a scheduled order at its time). Paid by card, Apple Pay or
        Google Pay, it waits for the payment (`awaiting_payment`): the answer
        has `pay_url`, the gateway's payment page (which offers Apple Pay and
        Google Pay where the gateway does), opened in the app on both
        platforms (food and goods delivered are services in the physical
        world, not in-app purchases); it goes to the vendor once the payment
        is confirmed. Fails as the quote does, with `quote_expired` (409),
        for a payment method the app doesn't take, and with
        `payments_unavailable` (503) while the app's payments aren't set up.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketOrderInput' }
      responses:
        '201':
          description: The order
          content:
            application/json:
              schema:
                type: object
                required: [order, pay_url]
                properties:
                  order: { $ref: '#/components/schemas/MarketOrder' }
                  pay_url: { type: [string, 'null'], format: uri, description: 'For an online payment: the payment page, good for 60 minutes. Null otherwise.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/market-orders:
    get:
      tags: [Market]
      operationId: listMyMarketOrders
      summary: The signed-in customer's orders
      description: Newest first; `active` keeps those not yet delivered, picked up, turned down or cancelled, scheduled ones included.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MarketOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/market-orders/{order_id}:
    get:
      tags: [Market]
      operationId: getMyMarketOrder
      summary: One of the customer's orders
      description: The order with its stages, and `tracking` while it is on its way.
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/market-orders/{order_id}/cancel:
    post:
      tags: [Market]
      operationId: cancelMyMarketOrder
      summary: Cancel an order
      description: Until the vendor accepts it (a scheduled order until 30 minutes before its time). An online payment is refunded to it, a wallet part to the wallet. `not_cancellable` (409) after that; the customer can open a complaint instead.
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/market-orders/{order_id}/pay:
    post:
      tags: [Market]
      operationId: payMyMarketOrder
      summary: A new payment page for an order waiting for its payment
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
        - $ref: '#/components/parameters/Platform'
      responses:
        '200':
          description: The payment page
          content:
            application/json:
              schema:
                type: object
                required: [pay_url]
                properties:
                  pay_url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/market-orders/{order_id}/rating:
    post:
      tags: [Market]
      operationId: rateMyMarketOrder
      summary: Rate a delivered or picked-up order
      description: Once, within 7 days. The vendor (and the courier, when the app's courier delivered it), 1 to 5, with words for the vendor.
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor]
              properties:
                vendor: { type: integer, minimum: 1, maximum: 5 }
                courier: { type: [integer, 'null'], minimum: 1, maximum: 5 }
                comment: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The rated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/market-orders/{order_id}/complaints:
    post:
      tags: [Market]
      operationId: openMarketComplaint
      summary: Open a complaint on an order
      description: |
        From when the order is placed until 48 hours after it was delivered
        or picked up (`complaint_closed` (409) after that); one open
        complaint per order at a time (`complaint_open` (409)). Photos are
        added next with `POST /me/complaints/{complaint_id}/photos`.
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintInput' }
      responses:
        '201':
          description: The complaint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/complaints:
    get:
      tags: [Market]
      operationId: listMyComplaints
      summary: The customer's complaints
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Complaints
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/complaints/{complaint_id}:
    get:
      tags: [Market]
      operationId: getMyComplaint
      summary: A complaint with its messages and decision
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      responses:
        '200':
          description: The complaint
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/complaints/{complaint_id}/messages:
    post:
      tags: [Market]
      operationId: addComplaintMessage
      summary: Write to support on a complaint
      description: Until it is closed (`complaint_closed` (409)).
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: The complaint with the message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/complaints/{complaint_id}/photos:
    post:
      tags: [Market]
      operationId: addComplaintPhoto
      summary: Add a photo to a complaint
      description: A photo sent with `/market/uploads` (JPEG, PNG or WebP up to 8 MB) joins an open complaint, at most 5 a complaint (`too_many_photos` (409); a closed complaint is `complaint_closed` (409)). Seen by support and, when support shares it, by the vendor.
      parameters:
        - $ref: '#/components/parameters/ComplaintId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string, description: 'The id /market/uploads gave, sent once /complete answered.' }
      responses:
        '201':
          description: The complaint with the photo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /market/uploads:
    post:
      tags: [Market]
      operationId: startMarketUpload
      summary: Start sending a complaint photo
      description: |
        A photo (JPEG, PNG or WebP) up to 8 MB, by a customer with a
        complaint still open (`no_complaint` (403) otherwise), into the
        app's Media library (413 `storage_full` when its storage is full).
        Sent in chunks to `upload_url` as chat files are, then `/complete`,
        then added with `/me/complaints/{complaint_id}/photos`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, type]
              properties:
                name: { type: string, maxLength: 200 }
                size: { type: integer, minimum: 1 }
                type: { type: string, example: image/jpeg }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Over 8 MB (`too_big`), or the app's storage is full (`storage_full`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /market/uploads/{upload_id}/resume:
    post:
      tags: [Market]
      operationId: resumeMarketUpload
      summary: A fresh link to carry on with a complaint photo
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: A new link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchoolUpload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /market/uploads/{upload_id}/complete:
    post:
      tags: [Market]
      operationId: completeMarketUpload
      summary: Finish sending a complaint photo
      description: 409 `incomplete` with the offset reached when part of the photo is missing.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204': { description: Ready to add to the complaint }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/wallet:
    get:
      tags: [Market]
      operationId: getMyWallet
      summary: The customer's wallet
      description: Its balance and history (refunds, credit from support, paid orders). The wallet is in `MarketConfig.currency` and can't be withdrawn as cash.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: The wallet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /market/club:
    get:
      tags: [Market]
      operationId: getMarketClub
      summary: The delivery club's plans
      description: The app owner's club plans (monthly or yearly, at the owner's prices) and their benefits; `MarketConfig.club` false when the app has no club (404).
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: The club
          content:
            application/json:
              schema:
                type: object
                required: [name, description, plans]
                properties:
                  name: { type: string, example: Plus }
                  description: { type: [string, 'null'] }
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/ClubPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/club:
    get:
      tags: [Market]
      operationId: getMyClub
      summary: The customer's club membership
      description: Null `membership` when not a member.
      responses:
        '200':
          description: The membership
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership: { $ref: '#/components/schemas/ClubMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Market]
      operationId: joinClub
      summary: Join the club
      description: |
        Starts a membership on a plan, waiting for its payment (`pay_url`,
        card, Apple Pay or Google Pay on the gateway's page); the membership
        is active once the payment is confirmed. A new period is paid the
        same way, by joining again once the paid period ends, or by a
        cancelled member taking the same plan back. `already_member` (409)
        while a period is paid.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: integer }
      responses:
        '201':
          description: The membership and its payment page
          content:
            application/json:
              schema:
                type: object
                required: [membership, pay_url]
                properties:
                  membership: { $ref: '#/components/schemas/ClubMembership' }
                  pay_url:
                    type: [string, 'null']
                    format: uri
                    description: The payment page; null for a plan the owner offers for free, which starts at once.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/club/cancel:
    post:
      tags: [Market]
      operationId: cancelClub
      summary: Stop the club from renewing
      description: The membership stays until the end of the period it is paid for.
      responses:
        '200':
          description: The membership
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership: { $ref: '#/components/schemas/ClubMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vendor/me:
    get:
      tags: [Vendor]
      operationId: getVendorDesk
      summary: The vendor, as its staff see it
      responses:
        '200':
          description: The vendor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDesk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Vendor]
      operationId: updateVendorDesk
      summary: Set the vendor busy, paused, running late or taking orders, and its hours
      description: '`busy_minutes` stops new orders for that long (scheduled ones still come); `paused` true stops them until set false again; `delay` keeps taking orders with more minutes on every delivery and pick-up time and a reason customers see, and ends by itself. Staff with the `orders` role or more. `hours`, `closed_dates` and `prep_minutes` change the vendor''s weekly hours, days off and preparation time at once, for its `owner` and `manager` only (403 otherwise); the app''s owner sees the change and can undo it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                busy_minutes: { type: [integer, 'null'], minimum: 5, maximum: 240, description: 'Null ends being busy.' }
                paused: { type: boolean }
                delay:
                  type: [object, 'null']
                  description: 'Running late; null ends it.'
                  required: [minutes, reason]
                  properties:
                    minutes: { type: integer, enum: [10, 15, 20, 30, 45, 60] }
                    reason: { type: string, enum: [demand, couriers, weather, other], description: 'High demand, few couriers, the weather, or the vendor''s own words in `note`.' }
                    note: { type: [string, 'null'], maxLength: 80, description: 'Plain text, required with `other`; ignored otherwise.' }
                    for_minutes: { type: [integer, 'null'], enum: [30, 60, 120, null], description: 'How long; null or left out: until the vendor ends it.' }
                hours:
                  type: array
                  maxItems: 14
                  description: 'The weekly hours, up to two periods a day; a day left out is closed. A period that closes before it opens runs past midnight.'
                  items:
                    type: object
                    required: [day, opens, closes]
                    properties:
                      day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                      opens: { type: string, pattern: '^\d{2}:\d{2}$' }
                      closes: { type: string, pattern: '^\d{2}:\d{2}$' }
                closed_dates:
                  type: array
                  maxItems: 20
                  description: 'All the days off (holidays), replacing the ones before: closed all day from `from` to `to` (both included, in `MarketConfig`''s time zone), each up to 92 days, starting within a year. Past ones are dropped.'
                  items: { $ref: '#/components/schemas/VendorClosedDates' }
                prep_minutes: { type: integer, minimum: 5, maximum: 180, description: 'How long an order usually takes; delivery and pick-up times start from it.' }
      responses:
        '200':
          description: The vendor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorDesk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vendor/orders:
    get:
      tags: [Vendor]
      operationId: listVendorOrders
      summary: The vendor's orders
      description: '`status` `new` (waiting for an answer, oldest first), `active` (accepted, not yet handed over or delivered), `scheduled`, or `done` (the last 7 days, newest first).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { type: string, enum: [new, active, scheduled, done], default: new } }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/VendorOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vendor/orders/{order_id}:
    get:
      tags: [Vendor]
      operationId: getVendorOrder
      summary: One of the vendor's orders
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vendor/orders/{order_id}/accept:
    post:
      tags: [Vendor]
      operationId: acceptVendorOrder
      summary: Accept an order with the minutes it needs
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prep_minutes]
              properties:
                prep_minutes: { type: integer, minimum: 5, maximum: 180 }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vendor/orders/{order_id}/reject:
    post:
      tags: [Vendor]
      operationId: rejectVendorOrder
      summary: Turn an order down
      description: The customer is told and refunded in full (to the payment, or the wallet for its wallet part).
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [closing, too_busy, items_unavailable, outside_area, other] }
                note: { type: [string, 'null'], maxLength: 300, description: 'Shown to the app owner, not the customer.' }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vendor/orders/{order_id}/lines:
    patch:
      tags: [Vendor]
      operationId: pickVendorOrder
      summary: Pick a grocery or shop order
      description: |
        For each line: the amount picked (a weighed amount for items sold by
        weight, within the customer's agreed limit,
        `MarketConfig.weight_tolerance_percent`), a substitute (only as the
        customer allowed, `MarketOrderLine.if_missing`), or missing. The
        order's total is worked out again (a lower total refunds the
        difference when it was paid online; it is never charged more than
        the customer agreed). Accepted orders only.
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [line_id, outcome]
                    properties:
                      line_id: { type: integer }
                      outcome: { type: string, enum: [picked, substituted, missing] }
                      quantity: { type: [number, 'null'], exclusiveMinimum: 0, description: 'For `picked`: units, or the weighed amount in the product''s unit (kg, g, l).' }
                      substitute_product_id: { type: [integer, 'null'], description: 'For `substituted`. Left out, the item the customer chose (`if_missing: chosen`).' }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vendor/orders/{order_id}/ready:
    post:
      tags: [Vendor]
      operationId: readyVendorOrder
      summary: The order is ready
      description: For the app's courier or the vendor's driver to take it, or for the customer to pick up (told with the pick-up code).
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vendor/orders/{order_id}/handover:
    post:
      tags: [Vendor]
      operationId: handOverVendorOrder
      summary: Hand the order over
      description: |
        `to` `driver`: the vendor's own driver took it (`on_the_way`);
        `delivered`: the vendor's driver delivered it; `customer`: picked up,
        with the customer's 4-digit `pickup_code` (`wrong_code` (409)). With
        the app's couriers, the courier's own screens move the order instead
        (`invalid_request` (400) here).
      parameters:
        - $ref: '#/components/parameters/MarketOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [driver, delivered, customer] }
                pickup_code: { type: [string, 'null'], pattern: '^\d{4}$' }
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /vendor/statements:
    get:
      tags: [Vendor]
      operationId: getVendorStatement
      summary: The vendor's statement for a month
      description: 'The orders delivered or picked up in the month, the refunds and compensations decided on them, and what each side owes the other. Owners and managers only. How the owner and the vendor settle stays between them.'
      parameters:
        - { name: month, in: query, description: 'The month, `2026-10`; this month by default.', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: The statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorStatement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vendor/complaints:
    get:
      tags: [Vendor]
      operationId: listVendorComplaints
      summary: Complaints the app's support shared with the vendor
      description: 'Read only, newest first: what was wrong and the decision. Never the customer, the conversation or the team''s notes; the app''s support answers customers. Owners, managers and order staff.'
      responses:
        '200':
          description: The complaints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VendorComplaint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vendor/products:
    get:
      tags: [Vendor]
      operationId: listVendorProducts
      summary: The vendor's items, for stock
      description: Dishes or products, paged; `out_of_stock` keeps those out; `q` and `barcode` find them.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: barcode, in: query, schema: { type: string, maxLength: 64 } }
        - { name: out_of_stock, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MarketProduct' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vendor/products/{product_id}:
    patch:
      tags: [Vendor]
      operationId: updateVendorProductStock
      summary: Put an item in or out of stock
      description: '`in_stock`, and for products that count it, `stock` (out of stock at 0 by itself).'
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                in_stock: { type: boolean }
                stock: { type: [integer, 'null'], minimum: 0 }
      responses:
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketProduct' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /rides/estimate:
    post:
      tags: [Rides]
      operationId: estimateRide
      summary: The fare of each vehicle type between two places
      description: |
        Both places need their coordinates. The distance and time are
        estimated from the straight line between them (the road is taken as
        a third longer, at the company's usual speed), so the fare is
        `upfront` (the one the rider pays, plus waiting) or an estimate when
        the company charges what the meter says (`RidesConfig.fare_mode`).
        Vehicle types without an online driver nearby are listed with
        `available` false (asking for one still waits for a driver). Fails
        with `outside_service_area` (400) when the pickup is outside the
        company's areas, with `invalid_request` (400) for a place without
        coordinates or an unknown promo code (`field` names it), and with
        `rides_unavailable` (503) while the company has no vehicle type with
        fares.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RideEstimateInput' }
      responses:
        '200':
          description: The fares
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideEstimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /rides:
    post:
      tags: [Rides]
      operationId: requestRide
      summary: Ask for a ride
      description: |
        At the fare `POST /rides/estimate` gives for the same places, vehicle
        type and promo code. Now: it is offered to the drivers at once
        (`searching`). Later (`scheduled_at`, when `RidesConfig.scheduling`
        allows it, 30 minutes to 7 days ahead): it waits (`scheduled`) and is
        offered 15 minutes before. A card ride is paid once it ends, on the
        company's payment page (`POST /me/rides/{ride_id}/pay`). An unpaid
        cancellation fee from the rider's last ride is added to this one's
        fare.

        Fails as the estimate does; with `ride_in_progress` (409) while the
        rider has another ride that isn't over (scheduled ones aside); with
        `invalid_request` (400) for a payment method the company doesn't take
        or a time it doesn't allow; with `payments_unavailable` (503) for a
        card ride while the company's payments aren't set up.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RideInput' }
      responses:
        '201':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/rides:
    get:
      tags: [Rides]
      operationId: listMyRides
      summary: List the signed-in rider's rides
      description: Newest first; `active` only those not yet completed or cancelled (scheduled ones too).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Rides
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/rides/{ride_id}:
    get:
      tags: [Rides]
      operationId: getMyRide
      summary: Follow a ride
      description: |
        The ride with its stages, its driver and car and, from the driver's
        accepting until the ride ends, where the driver is. The app asks
        again every 5 seconds or so while the screen is open and the ride is
        active.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/rides/{ride_id}/cancel:
    post:
      tags: [Rides]
      operationId: cancelMyRide
      summary: Cancel a ride
      description: |
        Before it starts (`scheduled`, `searching`, `accepted`, `arrived`);
        then `not_cancellable` (409). Free while no driver has it, and for
        `RidesConfig.cancellation.free_minutes` after a driver accepted; after
        that the company's fee (`cancellation.fee`) is charged, added to the
        rider's next ride.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], enum: [changed_plans, driver_late, driver_asked, wrong_place, other, null] }
      responses:
        '200':
          description: The cancelled ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/rides/{ride_id}/pay:
    post:
      tags: [Rides]
      operationId: payMyRide
      summary: Pay a card ride
      description: For a card ride `completed` and not paid yet, the company's payment page (good for 60 minutes), opened in the app on both platforms (a service in the physical world). Fails with `not_payable` (409) for any other.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: The payment page
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/rides/{ride_id}/rating:
    post:
      tags: [Rides]
      operationId: rateMyRide
      summary: Rate the driver
      description: Once, after the ride is completed, within 7 days; then `already_rated` or `not_ratable` (409). The rating counts in the driver's average; the comment is seen by the company.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver]
              properties:
                driver: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/me:
    get:
      tags: [Driver]
      operationId: getDriver
      summary: The signed-in driver
      responses:
        '200':
          description: The driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Driver]
      operationId: updateDriver
      summary: Go online or offline
      description: Only online drivers are offered rides. Going offline drops their position; it is refused with `ride_in_progress` (409) while they have a ride that isn't over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
      responses:
        '200':
          description: The driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/location:
    put:
      tags: [Driver]
      operationId: putDriverLocation
      summary: Send the driver's position
      description: |
        Sent every 5 to 10 seconds while the app is open and the driver is
        online (no position is taken in the background). Kept only while
        they are online; answered 204 and dropped otherwise. At most one
        every 3 seconds is kept. During a ride, the positions also measure
        the distance the meter charges (`RidesConfig.fare_mode` `metered`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                accuracy: { type: [number, 'null'], minimum: 0, description: In metres. }
                heading: { type: [number, 'null'], minimum: 0, maximum: 360, description: 'Degrees from north, for the car on the rider''s map.' }
      responses:
        '204': { description: Received }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver/offers:
    get:
      tags: [Driver]
      operationId: listDriverOffers
      summary: The ride offered to the driver now
      description: |
        A ride offered to this driver, with when the offer ends
        (`offer_expires_at`); at most one at a time; empty when none is or the
        driver is offline. The app asks every 3 seconds or so while online
        and free, and on a `ride_offer` push. The rider's number is not shown
        until the driver accepts.
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DriverRide' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver/rides:
    get:
      tags: [Driver]
      operationId: listDriverRides
      summary: The driver's rides
      description: '`active`: the driver''s ride that isn''t over (at most one). `done`: their completed and cancelled rides of the last 30 days, newest first.'
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [active, done] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Rides
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DriverRide' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver/rides/{ride_id}:
    get:
      tags: [Driver]
      operationId: getDriverRide
      summary: A ride
      description: One of the driver's rides, or the one offered to them now.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRide' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /driver/rides/{ride_id}/accept:
    post:
      tags: [Driver]
      operationId: acceptDriverRide
      summary: Accept the ride offered
      description: While it is offered to this driver; then `offer_expired` (409). The rider is told the driver is on the way.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: The ride, now the driver's
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRide' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/rides/{ride_id}/decline:
    post:
      tags: [Driver]
      operationId: declineDriverRide
      summary: Let the ride go to the next driver
      description: The offer ends at once and isn't made to this driver again. Answered 204 also when it had already ended.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /driver/rides/{ride_id}/status:
    post:
      tags: [Driver]
      operationId: updateDriverRide
      summary: Move a ride to its next stage
      description: |
        In order: `arrived` at the pickup, `in_progress` once the rider is in
        (with the rider's `pin` when `RidesConfig.pin` is true; a wrong one
        is `wrong_pin`, 400), then `completed` at the drop-off, which works
        out the final fare (shown on the answer's `fare`); a cash ride is
        paid once completed: the driver collected `collect`. `cancelled`
        before the ride starts, with a `reason`: `rider_no_show` (only
        `RidesConfig.cancellation.no_show_minutes` after arriving; the rider
        is charged the cancellation fee) or `other` (the ride goes back to
        the next driver). Fails with `invalid_status` (409) for any other
        step.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [arrived, in_progress, completed, cancelled] }
                pin: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
                reason: { type: [string, 'null'], enum: [rider_no_show, other, null] }
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: The ride
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverRide' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /driver/earnings:
    get:
      tags: [Driver]
      operationId: getDriverEarnings
      summary: What the driver made
      description: The driver's completed rides over today, this week (from Monday) or this month, in `RidesConfig.timezone`, with each day's totals.
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [today, week, month] } }
      responses:
        '200':
          description: Earnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverEarnings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /taxi/live-token:
    post:
      tags: [Taxi]
      operationId: createTaxiLiveToken
      summary: A token to sign in to the live database
      description: |
        A Firebase custom token for the company's Firebase project (sign in
        with it, then use `database_url`), valid for an hour. Its claims:
        `app` (the app's ID), `role` (`rider` or `driver`), `driver_key`
        (a driver's own), `ride` and `follow` (the rider's ride that isn't
        over and its driver's key). Ask for a new one when it expires and
        when the ride changes (a driver accepted it, it ended).
        `feature_disabled` (403) when the app has no live database.
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiLiveToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /taxi/nearby:
    get:
      tags: [Taxi]
      operationId: listNearbyTaxis
      summary: The free taxis around a place
      description: |
        The online drivers with no ride, whose position is under a minute
        old, within the company's matching distance of the place, nearest
        first, at most 30. For apps without a live database, and for the
        first look before the live one answers. Positions are rounded to
        about 10 metres.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: Taxis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiNearby' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /taxi/places:
    get:
      tags: [Taxi]
      operationId: searchTaxiPlaces
      summary: Places for where to
      description: |
        The same as `GET /maps/places`, kept for the taxi apps built before
        roadmap 112.
        Places matching what the rider typed, near them first, from the
        company's Google Maps (Places) or OpenStreetMap search server
        (`TaxiConfig.map.search`). A Google place comes without its position:
        ask `GET /taxi/places/{place_id}` when the rider picks it.
        `feature_disabled` (403) when the company has no search.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - name: session
          in: query
          description: The same random value for the searches of one choice (Google bills them as one).
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Places
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 8
                    items: { $ref: '#/components/schemas/TaxiPlace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /taxi/places/{place_id}:
    get:
      tags: [Taxi]
      operationId: getTaxiPlace
      summary: A place's position
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: place_id, in: path, required: true, schema: { type: string, maxLength: 300 } }
        - { name: session, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: The place
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiPlace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /taxi/route:
    post:
      tags: [Taxi]
      operationId: getTaxiRoute
      summary: The route between two places
      description: |
        The driving route, from the company's Google Maps (Routes) or
        OpenStreetMap routing server (`TaxiConfig.map.routes`), to draw on
        the map and to tell how long. `feature_disabled` (403) when the
        company has none: the app draws a straight line.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { $ref: '#/components/schemas/LatLng' }
                to: { $ref: '#/components/schemas/LatLng' }
      responses:
        '200':
          description: The route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`), or has no route between the places (`no_route`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /maps/places:
    get:
      tags: [Maps]
      operationId: searchMapPlaces
      summary: Places by name
      description: |
        Places matching what the person typed, near them first, on the
        app's map: the company's Google Maps (Places) or OpenStreetMap
        search server, or the platform's search server, or 112.6 MapTiler's
        geocoding with the tiles' key (`search` in
        `TaxiConfig.map`, `DeliveryConfig.map`, `FoodConfig.map`). A Google
        place comes without its position: ask `GET /maps/places/{place_id}`
        when the person picks it. `feature_disabled` (403) when the app's map
        has no search.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - name: session
          in: query
          description: The same random value for the searches of one choice (Google bills them as one).
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Places
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 8
                    items: { $ref: '#/components/schemas/TaxiPlace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /maps/address:
    get:
      tags: [Maps]
      operationId: getMapAddress
      summary: The address at a position
      description: |
        Roadmap 112.6. The place at the phone's position, named in the
        person's language, so "My location" fills the address: the company's
        Google Maps (Geocoding API), its or the platform's Nominatim server
        (`/reverse`), or MapTiler's geocoding with the tiles' key. Works
        wherever `search` is true; `feature_disabled` (403) otherwise, and
        `not_found` (404) when the map names nothing there. The app keeps
        its field as it is on any error.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: The place, with the position asked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiPlace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /maps/places/{place_id}:
    get:
      tags: [Maps]
      operationId: getMapPlace
      summary: A place's position
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: place_id, in: path, required: true, schema: { type: string, maxLength: 300 } }
        - { name: session, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: The place
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiPlace' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /maps/route:
    post:
      tags: [Maps]
      operationId: getMapRoute
      summary: The route between two places
      description: |
        The driving route on the app's map: the company's Google Maps
        (Routes) or OpenStreetMap routing server, or the platform's routing
        server (`routes` in `TaxiConfig.map`, `DeliveryConfig.map`,
        `FoodConfig.map`), to draw on the map and to tell how long.
        `feature_disabled` (403) when the map has no routes: the app draws a
        straight line.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { $ref: '#/components/schemas/LatLng' }
                to: { $ref: '#/components/schemas/LatLng' }
      responses:
        '200':
          description: The route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxiRoute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: The map provider didn't answer (`map_unavailable`), or has no route between the places (`no_route`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /teachers:
    get:
      tags: [Teachers]
      operationId: listTeachers
      summary: The academy's teachers
      description: Active teachers, the academy's featured ones first, then by rating. `feature_disabled` (403) when the app has no teachers (`Config.instructors` null).
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: In the name and the subjects.
          schema: { type: string, maxLength: 100 }
        - name: subject
          in: query
          schema: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Teachers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, subjects]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TeacherSummary' }
                      subjects:
                        type: array
                        description: Every subject the active teachers teach, for filtering.
                        items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teachers/{teacher_id}:
    get:
      tags: [Teachers]
      operationId: getTeacher
      summary: A teacher's page
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '200':
          description: The teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teachers/{teacher_id}/follow:
    put:
      tags: [Teachers]
      operationId: followTeacher
      summary: Follow a teacher
      description: The student gets a push (`new_course`) when a new course of the teacher is published. 123 On WordPress too, for any course's teacher (`Instructor.following`).
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '204': { description: Following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teachers]
      operationId: unfollowTeacher
      summary: Stop following a teacher
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      responses:
        '204': { description: Not following }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teachers/{teacher_id}/reviews:
    get:
      tags: [Teachers]
      operationId: listTeacherReviews
      summary: Students' reviews of a teacher
      description: Newest first. A review the academy hid is sent to its author only.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TeacherId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TeacherReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teachers/{teacher_id}/reviews/mine:
    put:
      tags: [Teachers]
      operationId: saveTeacherReview
      summary: Rate a teacher
      description: One review per student and teacher, changed by sending it again. Only a student enrolled in one of the teacher's courses may rate them (`not_student`, 403); a teacher can't rate themselves.
      parameters:
        - $ref: '#/components/parameters/TeacherId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /teachers/application:
    get:
      tags: [Teachers]
      operationId: getTeacherApplication
      summary: The signed-in person's application to teach
      description: 404 when they never applied.
      responses:
        '200':
          description: The application
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherApplication' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Teachers]
      operationId: applyToTeach
      summary: Apply to teach
      description: |
        Only when `InstructorsConfig.applications` is true (`feature_disabled`,
        403, otherwise). The academy sees the application on its Teachers
        page and approves or declines it; once approved, the person is a
        teacher. Sending it again replaces a declined application; a pending
        or approved one answers `already_applied` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, bio, subjects]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                bio: { type: string, minLength: 1, maxLength: 1000, description: Who they are and what they would teach. }
                subjects: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 1, maxLength: 40 } }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /teacher/me:
    get:
      tags: [Teacher]
      operationId: getTeacherMe
      summary: The signed-in teacher
      responses:
        '200':
          description: The teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Teacher]
      operationId: updateTeacherMe
      summary: Change the teacher's bio and subjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, maxLength: 1000 }
                subjects: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 40 } }
      responses:
        '200':
          description: The teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /teacher/courses:
    get:
      tags: [Teacher]
      operationId: listTeacherCourses
      summary: The teacher's courses
      description: Every course of the teacher, whatever its stage, newest first.
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                type: object
                required: [items, categories, currency]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherCourse' }
                  categories:
                    type: array
                    description: The academy's categories a course can be in.
                    items: { $ref: '#/components/schemas/Category' }
                  currency: { type: string, example: EGP }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Teacher]
      operationId: createTeacherCourse
      summary: Start a course
      description: The course starts as a draft, which only the teacher and the academy see.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherCourseInput' }
      responses:
        '201':
          description: The course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherCourse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

