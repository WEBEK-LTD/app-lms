              schema: { $ref: '#/components/schemas/SchoolMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /school/messages:
    get:
      tags: [School]
      operationId: getSchoolMessages
      summary: Messages with teachers, as the school allows
      description: |
