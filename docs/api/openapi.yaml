  /teacher/uploads:
    post:
      tags: [Teacher]
      operationId: startTeacherUpload
      summary: Start sending a lesson's video or PDF
      description: |
        Videos (MP4, MOV, WebM) up to 5 GB and PDFs up to 200 MB, into the
        academy's Media library (413 `storage_full` when its storage is full),
        named with the teacher's name. The app sends the file in chunks to
        `upload_url` as for chat uploads, calls `/complete`, then adds the
        lesson with `upload_id`. A file not used in a lesson stays in the
        Media library, where the academy can delete it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, type]
              properties:
                name: { type: string, maxLength: 200 }
                size: { type: integer, minimum: 1 }
                type: { type: string, example: video/mp4 }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Too big for its kind (`too_big`), or the academy's storage is full (`storage_full`).
