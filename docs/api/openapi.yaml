      operationId: listTeacherReports
      summary: The teacher's reports
      description: "Roadmap 113.5. The teacher's own reports to the school, the last changed first: drafts, sent, sent back for changes and approved; a student's (their history) or a class's."
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, sent, returned, approved] }
