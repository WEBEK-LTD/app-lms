        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classroom/classes/{class_id}/syllabus:
    get:
      tags: [Classroom]
      operationId: getClassSyllabus
      summary: The class's progress through the syllabus
      description: |
        Roadmap 113.5. The syllabus of each subject the teacher teaches in the
        class, for the class's grade (as the school wrote it: units, and their
        lessons or topics with the days the plan gives each), with the topics
        the class covered and where the plan says it should be today (a topic
        is due once its last day has passed; `behind` when fewer are covered
