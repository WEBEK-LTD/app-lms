        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Classroom]
      operationId: createTeacherReport
      summary: Start a report (a draft)
      description: |
        Roadmap 113.5. On one of the school's templates: a student template
        needs `student_id` (a student of a class the teacher teaches), a
        class template `class_id` (a class they teach; the period is the
        school's term, else the year so far, when not given). Answers are
        checked against the template's fields (text up to 2000 characters, one
        of a choice's choices, a rating from 1 to 5); required ones are needed
        only to send it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_id]
              properties:
                template_id: { type: integer }
                student_id: { type: integer }
                class_id: { type: integer }
                subject_id: { type: [integer, 'null'] }
                period_from: { type: [string, 'null'], format: date }
                period_to: { type: [string, 'null'], format: date }
                answers: { $ref: '#/components/schemas/ReportAnswers' }
      responses:
        '201':
          description: The draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /classroom/reports/{report_id}:
    get:
      tags: [Classroom]
      operationId: getTeacherReport
      summary: One of the teacher's reports, with the school's comments
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Classroom]
      operationId: updateTeacherReport
      summary: Change a draft, or a report sent back
      description: "Roadmap 113.5. A report with the school (sent or approved) can't be changed (`report_sent`, 409)."
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_id: { type: [integer, 'null'] }
                period_from: { type: [string, 'null'], format: date }
                period_to: { type: [string, 'null'], format: date }
                answers: { $ref: '#/components/schemas/ReportAnswers' }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Classroom]
      operationId: deleteTeacherReport
      summary: Delete a draft
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /classroom/reports/{report_id}/send:
    post:
      tags: [Classroom]
      operationId: sendTeacherReport
      summary: Send a report to the school
      description: |
        Roadmap 113.5. A draft, or a report the school sent back, with every
        required field filled in (`incomplete_report`, 400, else) and an
        optional note; the school's administration hears of it on Yallapp
        Business. The teacher gets a push (`school_report`) when the school
        comments on it, sends it back for changes or approves it.
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: The report, sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/me:
    get:
      tags: [Staff]
      operationId: getStaffMe
      summary: The signed-in teacher or member of staff at work
      description: Their job, department, working days and hours (else the school's times for teachers and staff), duties, and a teacher's lessons in the week.
      responses:
        '200':
          description: At work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/leave:
    get:
      tags: [Staff]
      operationId: listLeaveRequests
      summary: The person's leave requests
      description: Newest first.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Leave requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LeaveRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Staff]
      operationId: requestLeave
      summary: Ask for leave
      description: From up to 30 days back to a year ahead, up to 90 days at a time; `leave_overlaps` (409) when a waiting or approved request has some of the days. A document is a photo or a PDF sent with `/school/uploads`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, starts_on, ends_on]
              properties:
                kind: { type: string, enum: [sick, annual, other] }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                note: { type: [string, 'null'], maxLength: 1000 }
                upload_id: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Asked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /staff/leave/{leave_id}:
    delete:
      tags: [Staff]
      operationId: withdrawLeaveRequest
      summary: Withdraw a leave request the school hasn't answered
      parameters:
        - $ref: '#/components/parameters/LeaveId'
      responses:
        '204': { description: Withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/announcements:
    get:
      tags: [Staff]
      operationId: listStaffAnnouncements
      summary: The staff's own news
      description: Newest first; for teachers and staff only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Announcements
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/SchoolAnnouncement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parent/me:
    get:
      tags: [Parent]
      operationId: getParentMe
      summary: The signed-in parent and their children
      description: Their children in the order the school added them (never the parent themselves), the slips each has to answer, and whether the school lets parents write to their children's teachers (113.6).
      responses:
        '200':
          description: The parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /parent/children/{student_id}/day:
    get:
      tags: [Parent]
      operationId: getChildDay
      summary: A child's day at a glance
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: The day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildDay' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parent/slips:
    get:
      tags: [Parent]
      operationId: listPermissionSlips
      summary: The permission slips for the parent's children
      description: Open ones first (the soonest due first), then those closed in the last 60 days; each with the parent's children it is for and their answers. `student_id` for one child's.
      parameters:
        - name: student_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Slips
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PermissionSlip' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parent/slips/{slip_id}/answers:
    post:
      tags: [Parent]
      operationId: answerPermissionSlip
      summary: Sign a slip for a child, yes or no
      description: With the parent's name. Answering again replaces the answer, until the end of the due date (`slip_closed`, 409, after it).
      parameters:
        - $ref: '#/components/parameters/SlipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, answer, signed_name]
              properties:
                student_id: { type: integer }
                answer: { type: string, enum: ['yes', 'no'] }
                signed_name: { type: string, maxLength: 120 }
      responses:
        '200':
          description: Signed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionSlip' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /parent/children/{student_id}/excuses:
    get:
      tags: [Parent]
      operationId: listAbsenceExcuses
      summary: The excuses sent for a child
      description: Newest first, up to 50.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Excuses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AbsenceExcuse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Parent]
      operationId: sendAbsenceExcuse
      summary: Excuse a child's absence
      description: For a day or several, from 30 days back to 60 days ahead, up to 60 days at a time; `excuse_overlaps` (409) when a waiting or accepted excuse has some of the days. A photo or PDF is sent with `/school/uploads`. The school's administration is told on Yallapp Business.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_on, reason]
              properties:
                starts_on: { type: string, format: date }
                ends_on: { type: [string, 'null'], format: date, description: 'The last day; the first when left out.' }
                reason: { type: string, maxLength: 1000 }
                upload_id: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbsenceExcuse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /parent/excuses/{excuse_id}:
    delete:
      tags: [Parent]
      operationId: withdrawAbsenceExcuse
      summary: Withdraw an excuse the school hasn't answered
      description: '`already_answered` (409) once the school accepted or declined it.'
      parameters:
        - $ref: '#/components/parameters/ExcuseId'
      responses:
        '204': { description: Withdrawn }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /parent/children/{student_id}/pickup:
    get:
      tags: [Parent]
      operationId: getChildPickup
      summary: Who may pick a child up
      description: The list the parents keep (any of the child's parents changes it; the school adds to it in the dashboard), today's one-day note and the next days'.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Pick-up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildPickup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Parent]
      operationId: saveChildPickup
      summary: Change who may pick a child up
      description: The whole list, up to 10 people; it replaces the one before. A photo is an image sent with `/school/uploads` (`photo_id` is its id); a photo already on the list stays when its `photo_id` is sent again.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                people:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string, maxLength: 120 }
                      relation: { type: [string, 'null'], maxLength: 60, example: Grandmother }
                      phone: { type: [string, 'null'], maxLength: 30 }
                      photo_id: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildPickup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /parent/children/{student_id}/pickup/note:
    put:
      tags: [Parent]
      operationId: savePickupNote
      summary: Say who picks the child up on a day
      description: '"Today X picks up": for today (when `date` is left out) or one of the next 30 days, one per day (sending again replaces it); the school sees it on that day''s board.'
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                date: { type: [string, 'null'], format: date }
                name: { type: string, maxLength: 120 }
                relation: { type: [string, 'null'], maxLength: 60 }
                phone: { type: [string, 'null'], maxLength: 30 }
                note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildPickup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Parent]
      operationId: deletePickupNote
      summary: Take back a day's pick-up note
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - name: date
          in: query
          description: The day; today when left out.
          schema: { type: string, format: date }
      responses:
        '200':
          description: Taken back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildPickup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/payslips:
    get:
      tags: [Staff]
      operationId: listPayslips
      summary: The person's own payslips
      description: |
        Roadmap 113.12. Final payslips only (a draft the school is still
        writing is never shown), the newest month first; `advances` are the
        person's advances still being taken back. `pdf_url` is a signed link
        to the payslip's PDF in the app's language, good for 15 minutes:
        ask again for a new one.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Payslips
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, advances]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Payslip' }
                      advances:
                        type: array
                        items: { $ref: '#/components/schemas/SalaryAdvance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/payslips/{payslip_id}:
    get:
      tags: [Staff]
      operationId: getPayslip
      summary: One of the person's payslips, with a new PDF link
      parameters:
        - $ref: '#/components/parameters/PayslipId'
      responses:
        '200':
          description: The payslip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payslip' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # 113.9 Universities

  /school/students/{student_id}/university:
    get:
      tags: [University]
      operationId: getUniversityStudent
      summary: The student's program, advisor, GPA and this term's registration
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: The student at the university
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniversityStudent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/university/registration:
    get:
      tags: [University]
      operationId: getUniRegistration
      summary: The student's registration for a term, and the sections offered
      description: |
        The sections the student holds (asked for, enrolled or on a waiting
        list) and the term's other sections, each with its seats left and
        whether it can be added (`problems` says why not).
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/TermIdQuery'
      responses:
        '200':
          description: The registration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/university/registration/sections:
    post:
      tags: [University]
      operationId: addUniSection
      summary: Add a section (the student only)
      description: |
        While the term's registration is open and the registration isn't
        with the advisor. The section waits for the advisor (`pending`,
        its seat held), or joins the waiting list when it is full and the
        university has one (`waitlisted`). `not_allowed_clash`,
        `not_allowed_prerequisites`, `not_allowed_credits`,
        `not_allowed_full`, `not_allowed_taken`, `registration_closed`,
        `waiting_for_advisor` and `already_added` answer 409.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section_id]
              properties:
                section_id: { type: integer }
                term_id: { type: integer }
      responses:
        '200':
          description: The registration with the section
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/students/{student_id}/university/registration/sections/{section_id}:
    delete:
      tags: [University]
      operationId: dropUniSection
      summary: Drop a section (the student only)
      description: Until the term's drop date (`drop_closed`, 409, after it). The first on its waiting list who fits takes the seat and is told (`uni_seat`).
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/SectionId'
        - $ref: '#/components/parameters/TermIdQuery'
      responses:
        '200':
          description: The registration without the section
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/students/{student_id}/university/registration/submit:
    post:
      tags: [University]
      operationId: submitUniRegistration
      summary: Send the registration to the advisor (the student only)
      description: With a section waiting for approval and at least the program's credits for a term (`credits_low`, 409). The advisor is told (`uni_advisee`).
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                term_id: { type: integer }
      responses:
        '200':
          description: The registration, with the advisor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniRegistration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /school/students/{student_id}/university/timetable:
    get:
      tags: [University]
      operationId: getUniTimetable
      summary: The student's week of lectures in a term
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - { name: term_id, in: query, description: The term; else the current one., schema: { type: integer } }
      responses:
        '200':
          description: The week
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniTimetable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /school/students/{student_id}/university/results:
    get:
      tags: [University]
      operationId: getUniResults
      summary: Results by term, each term's GPA and the cumulative GPA
      description: Only the grades of sections whose results are published.
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: The results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniResults' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
