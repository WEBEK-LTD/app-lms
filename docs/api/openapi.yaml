      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/TopicId'
      responses:
        '200':
          description: The class's syllabus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSyllabus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /classroom/classes/{class_id}/attendance:
    get:
      tags: [Classroom]
      operationId: getClassAttendance
      summary: A class's attendance on a day
      description: Every student of the class, with their mark that day (null when not taken). Today in the school's time zone by default.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The day's attendance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassAttendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Classroom]
      operationId: takeClassAttendance
      summary: Take a class's attendance
      description: |
        For today or a day in the last 7 (`date_out_of_range`, 400, else).
        Students left out keep their mark. When the school tells families
        (`SchoolConfig.absence_alerts`), the parents of a student newly
        marked absent or late get a push (`school_absence`).
      parameters:
        - $ref: '#/components/parameters/ClassId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, items]
              properties:
                date: { type: string, format: date }
                items:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [student_id, status]
                    properties:
                      student_id: { type: integer }
                      status: { type: string, enum: [present, absent, late, excused] }
                      note: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: The day's attendance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassAttendance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

