  /bookings/availability:
    get:
      tags: [Bookings]
      operationId: getAvailability
      summary: Free times for a service
      description: |
        Free start times from `from` for `days` days, by the business's local
        date, as the booking plugin computes them (working hours, days off,
        breaks, existing appointments, buffers and how far ahead customers
        may book). Without `staff`, a time is free when any staff member who
        provides the service is free; `staff_ids` says who.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: service
          in: query
          required: true
          schema: { type: integer }
        - name: staff
          in: query
          description: A staff member, or none for anyone.
          schema: { type: integer }
        - name: from
          in: query
          required: true
          description: The first day, in the business's time zone.
          schema: { type: string, format: date, example: '2026-10-14' }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 31, default: 7 }
      responses:
        '200':
          description: Free times by day
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /bookings/appointments:
    post:
      tags: [Bookings]
      operationId: bookAppointment
      summary: Book an appointment
      description: |
        Books a free time for the signed-in customer, through the booking
        plugin, so its emails, calendar sync and approval rules apply. The
        appointment is `approved` or `pending` as the plugin decides.

        Fails with `slot_taken` (409) when the time is no longer free and with
        `invalid_request` (400) for a service, staff member or time that can't
        be booked.

        When `bookings.intake_fields` lists questions (a clinic's intake form),
        `answers` holds the customer's answers by field ID. Fails with
        `invalid_answers` (400) when a required answer is missing or an answer
        doesn't fit its field; `details.fields` then maps field IDs to messages
        safe to show. Answers are health data: only the customer (in their
        appointments) and the business (in its dashboard) see them, and no
        push, email or text message includes them.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentInput' }
      responses:
        '201':
          description: The appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/appointments:
    get:
      tags: [Bookings]
      operationId: listMyAppointments
      summary: List the customer's appointments
      description: Upcoming ones soonest first, past ones (and cancelled ones) newest first.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Appointments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/appointments/{appointment_id}:
    get:
      tags: [Bookings]
      operationId: getMyAppointment
      summary: Get one of the customer's appointments
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/appointments/{appointment_id}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelMyAppointment
      summary: Cancel one of the customer's appointments
      description: Fails with `too_late` (409) when it starts sooner than `bookings.cancel_before_minutes` allows, or when the business doesn't let customers cancel.
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The cancelled appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /bookings/classes:
    get:
      tags: [Classes]
      operationId: listClasses
      summary: List classes on the timetable
      description: |
        Classes from `from` to `to` (both included, the business's local
        dates), soonest first, also full and cancelled ones. Signed-in
        customers get `booked` for their own spots. Answers `not_found` (404)
        when the app has no classes.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          required: true
          description: The first day, in the business's time zone.
          schema: { type: string, format: date, example: '2026-10-14' }
        - name: to
          in: query
          description: The last day, at most 31 days after `from`. Default 6 days after it.
          schema: { type: string, format: date, example: '2026-10-20' }
      responses:
        '200':
          description: Classes
          content:
            application/json:
              schema:
                type: object
                required: [timezone, items]
                properties:
                  timezone: { type: string, example: Europe/Istanbul }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ClassSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /bookings/classes/{class_id}/book:
    post:
      tags: [Classes]
      operationId: bookClass
      summary: Book a spot in a class
      description: |
        Books one spot for the signed-in customer, only while one is left (no
        overbooking, also when many book at once). Booking a class already
        booked answers it again. Fails with `class_full` (409), `too_late`
        (409) once it has started or is closer than `min_minutes_ahead`,
        `class_cancelled` (409), `membership_required` (403) without an active
        membership when the business asks for one, `membership_frozen` (403,
        roadmap 64) when the active memberships are frozen on the class's
        day, and `no_credits`
        (403) when the membership's credits are used up. With a credit plan,
        one credit is used.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: The class, with `booked` true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /bookings/classes/{class_id}/cancel:
    post:
      tags: [Classes]
      operationId: cancelClass
      summary: Cancel the customer's spot in a class
      description: |
        Gives the spot back. A credit used for it comes back too. Fails with
        `too_late` (409) when the class starts sooner than
        `bookings.classes.cancel_before_minutes` allows, or when customers
        can't cancel in the app, and with `not_found` (404) when the customer
        has no spot in it.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: The class, with `booked` false
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /memberships/plans:
    get:
      tags: [Classes]
      operationId: listMembershipPlans
      summary: List the membership plans on sale
      description: Plans in the business's order. Empty when it sells none in the app.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MembershipPlan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /memberships/checkout-link:
    post:
      tags: [Classes]
      operationId: createMembershipCheckoutLink
      summary: Get a payment page link for a membership
      description: |
        Opens the business's payment page for one plan; paying starts the
        membership at once. The page's last address has `order-received` in
        it. Offered on Android and iOS: a membership is for a service used in
        person, not digital content. Fails with `feature_disabled` (403) when
        the business can't take card payments, and with `not_found` (404) for
        a plan not on sale.
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: integer }
      responses:
        '200':
          description: Payment link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, open_in]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  open_in: { type: string, enum: [in_app, browser] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /me/memberships:
    get:
      tags: [Classes]
      operationId: listMyMemberships
      summary: List the customer's memberships
      description: Active ones first (the one that ends first), then ended ones, newest first.
      responses:
        '200':
          description: Memberships
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /listings/filters:
