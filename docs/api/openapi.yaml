              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: The course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherCourse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /teacher/courses/{course_id}/lessons:
    post:
      tags: [Teacher]
      operationId: addTeacherLesson
      summary: Add a lesson
      description: |
        A lesson in one of the course's sections: a video (`upload_id` of a
        finished upload of a video, or `video_url`, a YouTube, Vimeo or
        https video address), a PDF (`upload_id` of a PDF, attached to the
        lesson) or text only. Uploads go to the academy's Media library and
        count in its storage. In a published course the lesson is live at
        once (and students who follow the course are told, like any new
        lesson). Not while the course is `in_review` (`not_editable`, 409).
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section_id, title]
              properties:
                section_id: { type: integer }
                title: { type: string, minLength: 1, maxLength: 120 }
                text: { type: string, maxLength: 5000 }
                video_url: { type: [string, 'null'], format: uri }
                upload_id: { type: [string, 'null'], format: uuid }
                duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 600 }
                preview: { type: boolean, default: false, description: Open to everyone before enrolling. }
      responses:
        '201':
          description: The course
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherCourse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

