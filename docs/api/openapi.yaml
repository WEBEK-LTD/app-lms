        '404': { $ref: '#/components/responses/NotFound' }

  /store/cart:
    post:
      tags: [Store]
      operationId: quoteCart
      summary: Price the app's cart
      description: |
        Checks the app's cart against the shop: current prices, stock and
        quantity limits. Nothing is saved. Shipping, taxes and coupons are
        added on the site's checkout.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartInput' }
      responses:
        '200':
          description: The priced cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /store/checkout-link:
    post:
      tags: [Store]
      operationId: createStoreCheckoutLink
      summary: Get a one-time checkout link for the cart
      description: |
        On WordPress, the link fills the site's WooCommerce cart with these
        lines, keeps the delivery date and gift message for the order, signs
        the customer in when they are signed in to the app, and opens the
        checkout; it works once. On the hosted API it opens the shop's
        checkout (Shopify's or another connected platform's, or our payment
        page for shops without a website). The link expires at `expires_at`. Signed-out customers get a link only
        when the shop allows guest checkout (`store.guest_checkout`). The
        checkout's last page has `order-received` or `thank_you` in its
        address, so the app knows the order was placed.

        A `coupon` (91.1) goes with the order: applied on the site's checkout
        (WooCommerce, or a connected platform's discount link) or on our payment
        page; one that doesn't apply any more is left out, never an error.

        With `use_points` (91.4, shops without a website), the signed-in
        customer's loyalty points take their value off the order on our
        payment page: as many as they have then, up to what the products cost
        after the coupon. They are used when the order is paid.

        Fails with `cart_changed` (409) when a line is no longer available,
        with `one_product_at_a_time` (409) when the shop's checkout can only
        take one product from the app (show the message), and with
        `purchase_not_allowed` (403) for digital products on iOS.

        Shops with `store.fulfilment` (restaurants and cafés) also take how
        the order is collected: `fulfilment` (`pickup` or `delivery`, one the
        shop offers), a `delivery_address` for delivery, and `scheduled_for`
        (one of the `slots` of `GET /store/order-times`; null or missing for
        "as soon as possible"). They fail with `kitchen_closed` (409) for an
        order as soon as possible while closed (show the message; a scheduled
        time may still work), `below_minimum` (409) when a delivery's subtotal
        is under `store.fulfilment.min_order`, `outside_delivery_area` (400)
        when the district isn't one of `store.fulfilment.delivery_areas`, and
        `invalid_request` (400) for a missing address or a time that isn't
        offered. The delivery fee is added to the order on our payment page.
        Prices, options and fees are always computed by the server.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Platform'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CartInput'
                - type: object
                  properties:
                    delivery_date: { type: [string, 'null'], format: date, description: "Required when `store.delivery_date.required` is true." }
                    gift_message: { type: [string, 'null'], maxLength: 500 }
                    fulfilment: { type: [string, 'null'], enum: [pickup, delivery, null], description: "Shops with `store.fulfilment` only (required there): how the customer gets the order." }
                    delivery_address: { $ref: '#/components/schemas/DeliveryAddress' }
                    scheduled_for:
                      type: [string, 'null']
                      format: date-time
                      description: "Shops with `store.fulfilment` only: the time the order is for, one of `GET /store/order-times` `slots`. Null or missing: as soon as possible." 
      responses:
        '200':
          description: Checkout link
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, open_in]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  open_in: { type: string, enum: [in_app, browser] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /store/order-times:
    get:
      tags: [Store]
      operationId: getOrderTimes
      summary: When the kitchen takes orders now
      description: |
        For shops with `store.fulfilment` (restaurants and cafés): whether
        they're open now, when they open or close next, whether an order "as
        soon as possible" can be placed now, and the times a scheduled order
        can be for. Computed in the shop's time zone at the time of the
        request, so the app asks again before checkout. `not_found` for shops
        without `store.fulfilment`.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Opening state and times
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTimes' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

