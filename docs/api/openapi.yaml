      responses:
        '200':
          description: The homework
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassroomHomeworkDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
