        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/questions/{question_id}:
    get:
      tags: [Messages]
      operationId: getQuestion
      summary: A question with its answers
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: The question and its answers, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Messages]
      operationId: updateQuestion
      summary: Hide a question, or show it again
      description: |
        64 A hidden question is seen only by its author in the app (with a
        note), and isn't in other students' lists or counts; it stays here
        with `hidden`. Hiding doesn't answer it.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: The question as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/questions/{question_id}/answers:
    post:
      tags: [Messages]
      operationId: answerQuestion
      summary: Answer
      description: The answer shows under the question in the app, in the business's name; the student is told in their inbox and on their phone.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '201':
          description: Answered; the question as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/questions/{question_id}/answers/{answer_id}:
    patch:
      tags: [Messages]
      operationId: updateAnswer
      summary: Hide a student's answer, or show it again
      description: |
        64 A hidden answer is seen only by its author in the app (with a
        note), and isn't counted for others. The business's own answers
        can't be hidden (400).
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/AnswerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: The question as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: The courses' reviews
      description: 63 Newest first, with the rating of the reviews shown in the app.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: filter
          in: query
          description: "`unreplied`: shown and without a reply; `hidden`: hidden from others."
          schema: { type: string, enum: [all, unreplied, hidden], default: all }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, rating, rating_count]
                    properties:
                      rating: { type: [number, 'null'], description: "The average of the reviews shown, to one decimal." }
                      rating_count: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/reviews/{review_id}:
    patch:
      tags: [Reviews]
      operationId: updateReview
      summary: Hide a review, or show it again
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/reviews/{review_id}/reply:
    put:
      tags: [Reviews]
      operationId: replyReview
      summary: Reply under a review, or change the reply
      description: Everyone sees the reply under the review in the app, in the business's name.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reviews]
      operationId: deleteReviewReply
      summary: Remove the reply
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: Members, to check one in by name
      description: Memberships with their member's name, phone and whether they came in today; active ones first. `q` finds a name, phone or email.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, time_zone]
                    properties:
                      time_zone: { type: string }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/members/{membership_id}/freeze:
    put:
      tags: [Members]
      operationId: freezeMember
      summary: Freeze a membership
      description: |
        64 From `from` (today or a later day, within 90 days, in the gym's
        time zone) until `until` (the day it's back, after `from`, at most a
        year later) or, without `until`, until it is unfrozen. While frozen
        the door answers `frozen` and the member can't book classes that
        start inside it; classes it had booked inside it are cancelled, their
        spots and credits given back, and the member is told. With `until`,
        the end moves later by the frozen days at once; without, when it is
        unfrozen (gym days, the end keeping its time of day). An active, not
        ended membership without a freeze still to come; else 409
        `invalid_status`.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/MembershipId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from: { type: string, format: date }
                until: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: The member as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Members]
      operationId: unfreezeMember
      summary: Unfreeze a membership
      description: |
        64 An active membership only. The member can come in again from now;
        the end moves later by the days it was frozen until today (a freeze that hadn't started yet is
        just removed, and a freeze with `until` gives back the days it no
        longer takes). 409 `invalid_status` when there's no freeze now or to
        come.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: The member as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /apps/{app_id}/members/check-in:
    post:
      tags: [Members]
      operationId: checkInMember
      summary: Check a member in at the door
      description: |
        The scanned QR code or the typed member code, or a membership chosen
        by name (`membership_id`). Once a member a day: a second scan the
        same day answers `already_in` with when they came in, on any phone.
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, maxLength: 300 }
                membership_id: { type: integer }
      responses:
        '200':
          description: What the door should do
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCheckIn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/members/check-ins:
    get:
      tags: [Members]
      operationId: listMemberCheckIns
      summary: Who came in today
      description: The day's check-ins in the gym's time zone, the latest first.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: date
          in: query
          description: A day as YYYY-MM-DD; today when missing.
          schema: { type: string, format: date }
      responses:
        '200':
          description: The day's check-ins
          content:
            application/json:
              schema:
                type: object
                required: [date, time_zone, count, items]
                properties:
                  date: { type: string, format: date }
                  time_zone: { type: string }
                  count: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MemberVisit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/users:
    get:
      tags: [App users]
      operationId: listAppUsers
      summary: The app's users
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: q
          in: query
          description: A name, phone number or email address, or part of one.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Users, newest first; `total` counts the search's matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items, count]
                    properties:
                      count: { type: integer, description: Every user of the app. }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AppUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/analytics:
    get:
      tags: [Analytics]
      operationId: getAnalytics
      summary: How people use the app
      parameters:
        - $ref: '#/components/parameters/AppId'
        - name: range
          in: query
          schema: { type: string, enum: ['7', '30', '90', custom], default: '30' }
        - name: from
          in: query
          description: With `range=custom`, the first day (YYYY-MM-DD in the app's time zone).
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/notifications:
    get:
      tags: [Notifications]
      operationId: listSentNotifications
      summary: Notifications sent to everyone
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: The last 50, newest first, with whether push can go out
          content:
            application/json:
              schema:
                type: object
                required: [items, push]
                properties:
                  push: { type: boolean, description: 'The plan has push, is active (68: false once it ended) and a Firebase key is saved.' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SentNotification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Notifications]
      operationId: sendNotification
      summary: Send a notification to everyone who uses the app
      description: |
        As Dashboard › App notifications: a title of up to 65 characters and
        a message of up to 240; everyone gets it in the app's inbox, and
        phones that allow announcements get a push when the plan has push and
        the app's Firebase key is saved. 10 an hour per app, counted with the
        dashboard's and with notifications sent later as each goes out. To
        send later, `POST /apps/{app_id}/notifications/scheduled`. Roadmap 68:
        nothing is sent once the app's plan has ended (its end date passed),
        neither to the inboxes nor as a push: 403 `plan_not_active`, until the
        plan is renewed on yallapp.com.tr.
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, maxLength: 65 }
                body: { type: string, maxLength: 240 }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /apps/{app_id}/notifications/scheduled:
    get:
      tags: [Notifications]
      operationId: listScheduledNotifications
      summary: Notifications waiting to be sent later
      description: |
        Roadmap 61. Those waiting, being sent or stopped halfway (`failed`),
        soonest first, with the app's time zone (Analytics'). Once sent, one
        is in `GET /apps/{app_id}/notifications`.
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Waiting notifications
          content:
            application/json:
              schema:
                type: object
                required: [time_zone, max, items]
                properties:
                  time_zone: { type: string, example: Africa/Cairo }
                  max: { type: integer, description: How many can wait at once. }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduledNotification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Notifications]
      operationId: scheduleNotification
      summary: Send a notification to everyone later
      description: |
        As Dashboard › App notifications › Send later: the same title and
        message rules as sending now, and a local `date` and `time` in the
        app's time zone, later than now and within 90 days (errors under
        `send_at`). At most 50 wait at once (409 `too_many_scheduled`). Yallapp
        sends it within 5 minutes of its time; when the hour's 10 are used,
        it goes in the next hour. Roadmap 68: refused with 403
        `plan_not_active` while the app's plan has ended; one whose time comes
        after the plan ended isn't sent: it shows as `failed` with the reason
        in `result`, to send again after renewing.
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '201':
          description: Waiting to be sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledNotification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /apps/{app_id}/notifications/scheduled/{scheduled_id}:
    put:
      tags: [Notifications]
      operationId: editScheduledNotification
      summary: Change a notification waiting to be sent
      description: Its title, message, date and time, with the same rules, while it still waits (409 `already_sent` otherwise).
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/ScheduledId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '200':
          description: As it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledNotification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Notifications]
      operationId: cancelScheduledNotification
      summary: Cancel a notification waiting to be sent
      description: 409 `already_sent` once it is being sent or was sent.
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/ScheduledId'
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /apps/{app_id}/preview:
    post:
      tags: [Publishing]
      operationId: createPreview
      summary: A link to try the app
      description: |
        The dashboard's "Preview your app": the app's web build with a preview
        token for this app, valid an hour. `draft` shows the unpublished
        pages (apps on the hosted API).
      parameters:
        - $ref: '#/components/parameters/AppId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                draft: { type: boolean, default: false }
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/builds:
    get:
      tags: [Publishing]
      operationId: listBuilds
      summary: Builds, publishing and downloads
      description: Read-only. Download links are signed for 15 minutes; ask again for fresh ones. Builds are started on the dashboard.
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: The last 10 builds and the publishing status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Builds' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/license:
    get:
      tags: [License]
      operationId: getLicense
      summary: The app's plan, its end and the storage
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Read-only facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/License' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /team:
    get:
      tags: [Team]
      operationId: getTeam
      summary: The team and the invitations waiting
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }

  /team/invitations:
    post:
      tags: [Team]
      operationId: inviteTeamMember
      summary: Invite someone
      description: |
        Emails a link to join (in the invitee's language when they have a
        Yallapp account, else the owner's). Someone who already uses Yallapp
        joins with their own password. Refused for the owner's own email,
        someone on the team already, Yallapp's team and an address with an
        invitation waiting (send that one again).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInviteRequest' }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamInvitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /team/invitations/{invitation_id}:
    delete:
      tags: [Team]
      operationId: cancelTeamInvitation
      summary: Cancel an invitation
      description: Its link stops working.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /team/invitations/{invitation_id}/resend:
    post:
      tags: [Team]
      operationId: resendTeamInvitation
      summary: Send an invitation again
      description: A new link for 7 more days; the old link stops working.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /team/members/{user_id}:
    patch:
      tags: [Team]
      operationId: updateTeamMember
      summary: Change what someone can do
      description: Applies at once, on the dashboard and on their phones.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamAccessRequest' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Team]
      operationId: removeTeamMember
      summary: Remove someone from the team
      description: They are signed out at once, on the website and on every phone.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The access token from sign-in or refresh (15 minutes).

  parameters:
    AppId:
      name: app_id
      in: path
      required: true
      description: One of the signed-in client's apps (`Me.apps`).
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointment_id
      in: path
      required: true
      schema: { type: integer }
    ScheduledId:
      name: scheduled_id
      in: path
      required: true
      schema: { type: integer }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: integer }
    CourseId:
      name: course_id
      in: path
      required: true
      schema: { type: integer }
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InquiryId:
      name: inquiry_id
      in: path
      required: true
      schema: { type: integer }
    QuestionId:
      name: question_id
      in: path
      required: true
      schema: { type: integer }
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema: { type: integer }
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema: { type: integer }
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    BadRequest:
      description: The request is invalid (`invalid_request`, with `errors` per field when a form's rules refused it).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, expired or revoked token (`invalid_token`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountNotActive:
      description: |
        The account isn't active yet (`account_pending`) or is suspended
        (`account_suspended`); `GET /me` shows its state. Or (roadmap 60) the
        person's role on the team doesn't allow this (`not_allowed`: "Ask the
        owner"). Or the app's plan isn't active (`plan_not_active`) for what
        waits for it: Media uploads and (68) notifications to the app's users.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, not one of the client's own (`not_found`), or not something this app has (`not_available`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The action conflicts with the current state (`invalid_status`, `not_refundable`, `incomplete`, 61 `slot_taken`, `not_bookable`, `too_many_scheduled`, `already_sent`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit reached (`rate_limited`). `retry_after_seconds` says when to try again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderError:
      description: The payment provider refused or didn't answer (`provider_error`); check its panel.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Media uploads aren't available right now (`unavailable`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          examples:
            - invalid_credentials
            - use_website
            - invalid_token
            - account_pending
            - account_suspended
            - not_allowed
            - not_found
            - not_available
            - invalid_request
            - invalid_status
            - not_refundable
            - plan_not_active
            - storage_full
            - too_big
            - incomplete
            - rate_limited
        message: { type: string, description: "Safe to show, in the person's language." }
        errors:
          type: object
          description: Per field, the form's message (the dashboard's rules).
          additionalProperties: { type: string }
        retry_after_seconds: { type: integer }

    Page:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Link:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }

    Money:
      type: object
      description: An amount in the app's own currency (what the owner sells in, not Yallapp's prices).
      required: [amount_cents, currency, formatted]
      properties:
        amount_cents: { type: integer, description: In minor units. }
        currency: { type: string, example: TRY }
        formatted: { type: string, example: '₺1,250.00' }

    DeviceInfo:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, maxLength: 100, description: 'What the person calls the phone ("Pixel 8", "iPhone of Ahmed").' }
        platform: { type: string, enum: [android, ios] }
        app_version: { type: string, maxLength: 20 }

    SignInRequest:
      type: object
      required: [email, password, device]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo' }

    Session:
      type: object
      required: [token_type, access_token, access_expires_at, refresh_token, refresh_expires_at, device_id, account_state]
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        device_id: { type: string, format: uuid }
        account_state: { $ref: '#/components/schemas/AccountState' }

    AccountState:
      type: string
      enum: [pending, active, expired, suspended]
      description: The account's state as the dashboard has it; `expired` when every app's plan ended.

    Me:
      type: object
      required: [user, account, business, businesses, apps, links]
      properties:
        user:
          type: object
          required: [id, name, email, language]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            language: { type: [string, 'null'], enum: [en, ar, tr, null], description: The dashboard language they chose; null follows the device. }
        account:
          type: object
          required: [state, message]
          properties:
            state: { $ref: '#/components/schemas/AccountState' }
            message: { type: [string, 'null'], description: "What a pending or suspended account sees, in the person's language." }
        business:
          description: The business this device works on (roadmap 60); null for none.
          oneOf:
            - $ref: '#/components/schemas/Business'
            - type: 'null'
        businesses:
          type: array
          description: Every business the person works on, their own first; more than one shows a switcher (`PUT /me/business`).
          items: { $ref: '#/components/schemas/Business' }
        apps:
          type: array
          description: Oldest first, as the dashboard's app switcher; for a team member limited to some apps, only those. Empty while the account is pending or suspended.
          items: { $ref: '#/components/schemas/AppSummary' }
        links:
          type: object
          required: [dashboard, support_whatsapp, support_email]
          properties:
            dashboard: { type: string, format: uri }
            support_whatsapp: { type: [string, 'null'], format: uri }
            support_email: { type: [string, 'null'] }

    AppSummary:
      type: object
      required: [id, name, type, type_name, backend, state, icon_url, plan, features, access]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [lms, store, booking, real_estate, news, events, donations] }
        vertical: { type: [string, 'null'], enum: [restaurant, clinic, fitness, charity, null] }
        type_name: { type: string, example: Restaurant, description: The kind's name in the person's language. }
        backend: { type: [string, 'null'], enum: [wordpress, hosted, custom_api, setup_requested, null] }
        state: { $ref: '#/components/schemas/AccountState' }
        icon_url: { type: [string, 'null'], format: uri }
        plan:
          oneOf:
            - $ref: '#/components/schemas/PlanSummary'
            - type: 'null'
        features: { $ref: '#/components/schemas/AppFeatures' }
        access: { $ref: '#/components/schemas/AppAccess' }

    PlanSummary:
      type: object
      required: [id, name, expires_at, days_left]
      properties:
        id: { type: string, example: growth }
        name: { type: string, example: Growth }
        expires_at: { type: string, format: date-time }
        days_left: { type: integer }

    AppFeatures:
      type: object
      description: What the app has, as the dashboard's menu shows it for its type and content source, and (roadmap 60) the person's role allows.
      required: [orders, kitchen, appointments, events, check_in, donations, products, courses, articles, listings, inquiries, app_users, notifications, media, analytics, preview, builds]
      properties:
        orders: { type: boolean }
        kitchen: { type: boolean, description: A restaurant's orders move through the kitchen's steps. }
        appointments: { type: boolean }
        events: { type: boolean }
        check_in: { type: boolean }
        donations: { type: boolean }
        products: { type: boolean }
        courses: { type: boolean }
        articles: { type: boolean }
        listings: { type: boolean }
        inquiries: { type: boolean }
        questions: { type: boolean, description: "63 Students' questions in courses managed in Yallapp (Messages). Missing on older servers: false." }
        reviews: { type: boolean, description: "63 Reviews of courses managed in Yallapp (Catalog & content). Missing on older servers: false." }
        member_check_in: { type: boolean, description: "63 A gym's members checked in at the door (Bookings & appointments). Missing on older servers: false." }
        app_users: { type: boolean }
        notifications: { type: boolean }
        media: { type: boolean }
        analytics: { type: boolean }
        preview: { type: boolean }
        builds: { type: boolean }

    Device:
      type: object
      required: [id, name, platform, app_version, created_at, last_seen_at, current, push]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string, enum: [android, ios] }
        app_version: { type: [string, 'null'] }
        created_at: { type: string, format: date-time, description: When it signed in. }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean, description: The device asking. }
        push: { type: boolean, description: It registered a push token. }

    PushTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 512 }
        provider: { type: string, enum: [fcm, hms], default: fcm, description: 'Firebase, or Huawei Push Kit for Huawei phones without Google Play.' }

    PushKind:
      type: string
      enum: [new_order, new_booking, new_message, new_review, payment_received, build_finished, yallapp_updates, account_notices]
      description: |
        `new_order` an order was paid; `new_booking` an appointment was
        booked; `new_message` a message about a listing arrived, or (63) a
        student asked a question in a course or wrote again under one
        (`question_id`); `new_review` (63) a student reviewed a course
        (`review_id`); `payment_received` a donation, or a payment to Yallapp for a
        plan or storage; `build_finished` a build is ready or failed;
        `yallapp_updates` Yallapp published an update or announcement;
        `account_notices` the account got a notice (plan ending, app users
        near the limit, storage, the site ready, the API failing, a ticket
        refund due).

    PushPreferences:
      type: object
      description: One switch per kind of push (PushKind).
      propertyNames: { $ref: '#/components/schemas/PushKind' }
      properties:
        new_order: { type: boolean }
        new_booking: { type: boolean }
        new_message: { type: boolean }
        new_review: { type: boolean }
        payment_received: { type: boolean }
        build_finished: { type: boolean }
        yallapp_updates: { type: boolean }
        account_notices: { type: boolean }

    Update:
      type: object
      required: [key, kind, title, body, summary, at, unread, current]
      properties:
        key: { type: string, example: 'announcement:3f1c…' }
        kind: { type: string, enum: [update, announcement, maintenance, offer, account] }
        kind_label: { type: string }
        title: { type: string }
        body: { type: string, description: 'Plain text for the account''s items, a small Markdown (no HTML) for announcements.' }
        summary: { type: string, description: The text on one line (about 160 characters). }
        link: { type: [string, 'null'], format: uri }
        link_label: { type: [string, 'null'] }
        app_name: { type: [string, 'null'], description: 'The app it is about, when the account has more than one.' }
        at: { type: string, format: date-time }
        unread: { type: boolean }
        current: { type: boolean, description: Still live (in the bell); false for ended announcements. }

    Today:
      type: object
      required: [date, time_zone, sales, donations, counts, needs_you]
      properties:
        date: { type: string, format: date }
        time_zone: { type: string }
        sales:
          type: array
          items: { $ref: '#/components/schemas/Money' }
        donations:
          type: array
          items: { $ref: '#/components/schemas/Money' }
        counts:
          type: object
          description: Only what the app has.
          properties:
            orders: { type: integer, description: Orders paid today. }
            appointments: { type: integer, description: Appointments today (pending or confirmed). }
            tickets: { type: integer, description: Tickets issued today. }
            check_ins: { type: integer, description: Tickets used today. }
            member_check_ins: { type: integer, description: "63 A gym's members checked in today (once a member a day)." }
            donations: { type: integer }
            new_users: { type: integer }
            app_opens: { type: [integer, 'null'], description: 'Sessions today, from Analytics (apps built before roadmap 44 send none).' }
        needs_you:
          type: array
          items: { $ref: '#/components/schemas/NeedsYou' }

    NeedsYou:
      type: object
      required: [kind, count, title]
      properties:
        kind: { type: string, enum: [orders_in_progress, appointments_to_confirm, unanswered_messages, questions_to_answer, notice] }
        count: { type: integer }
        title: { type: string, description: In the person's language. }
        notice_id: { type: [integer, 'null'] }

    Order:
      type: object
      required: [id, number, status, total, refunded, lines, customer, created_at, paid_at, next_statuses]
      properties:
        id: { type: integer }
        number: { type: string, example: '1042' }
        status: { type: string, enum: [processing, completed, cancelled, refunded] }
        status_label: { type: string }
        kitchen:
          type: [object, 'null']
          description: A restaurant's order.
          properties:
            type: { type: string, enum: [pickup, delivery] }
            step: { type: string, enum: [received, preparing, ready, out_for_delivery, completed, cancelled] }
            step_label: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        refunded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        lines:
          type: array
          items:
            type: object
            required: [name, quantity, unit]
            properties:
              name: { type: string }
              quantity: { type: integer }
              unit: { $ref: '#/components/schemas/Money' }
              options:
                type: array
                items: { type: string }
        customer:
          type: [object, 'null']
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string }
            city: { type: string }
            address: { type: string }
        created_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        next_statuses:
          type: array
          items: { type: string }
          description: What `POST …/status` accepts now.

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [refund, refunds]
          properties:
            refund: { $ref: '#/components/schemas/RefundOptions' }
            refunds:
              type: array
              items:
                type: object
                required: [id, amount, reason, method, created_at]
                properties:
                  id: { type: integer }
                  amount: { $ref: '#/components/schemas/Money' }
                  reason: { type: string }
                  method: { type: string, enum: [api, manual] }
                  created_at: { type: string, format: date-time }

    RefundOptions:
      type: object
      required: [refundable, why, left, by_api, manual, reasons, can_take_back]
      properties:
        refundable: { type: boolean }
        why: { type: [string, 'null'] }
        provider: { type: string, enum: [iyzico, kashier, fawaterk] }
        left: { $ref: '#/components/schemas/Money' }
        by_api: { type: boolean }
        manual: { type: boolean }
        reasons:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, enum: [buyer_request, double_payment, fraud, other] }
              label: { type: string }
        can_take_back:
          type: object
          properties:
            tickets: { type: array, items: { $ref: '#/components/schemas/Takeable' } }
            courses: { type: array, items: { $ref: '#/components/schemas/Takeable' } }
            memberships: { type: array, items: { $ref: '#/components/schemas/Takeable' } }

    Takeable:
      type: object
      required: [id, label]
      properties:
        id: { type: integer }
        label: { type: string }

    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: string, example: '150.50', description: In major units. }
        reason: { type: string, enum: [buyer_request, double_payment, fraud, other] }
        note: { type: string, maxLength: 300 }
        method: { type: string, enum: [api, manual], default: api }
        reference: { type: string, maxLength: 191, description: The provider's reference of a refund made in its panel. }
        tickets: { type: array, items: { type: integer } }
        courses: { type: array, items: { type: integer } }
        memberships: { type: array, items: { type: integer } }

    Appointment:
      type: object
      required: [id, status, service, staff, customer, start_at, end_at, local_date, local_time, price, notes, next_statuses, can_reschedule]
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, cancelled, completed, no_show] }
        status_label: { type: string }
        service: { type: string }
        staff: { type: string }
        customer:
          type: object
          required: [name]
          properties:
            name: { type: string }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        local_date: { type: string, format: date }
        local_time: { type: string, example: '14:30' }
        price: { $ref: '#/components/schemas/Money' }
        notes: { type: [string, 'null'] }
        answers:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        next_statuses:
          type: array
          items: { type: string }
        can_reschedule: { type: boolean, description: 61 Pending or approved and not started yet. }

    RescheduleTimes:
      type: object
      required: [time_zone, staff, days]
      properties:
        time_zone: { type: string, example: Europe/Istanbul }
        staff:
          type: array
          description: Who provides the service, the appointment's own staff member first.
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
        days:
          type: array
          items:
            type: object
            required: [date, slots]
            properties:
              date: { type: string, format: date }
              slots:
                type: array
                items:
                  type: object
                  required: [start, end, local_time, staff_ids]
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
                    local_time: { type: string, example: '15:30' }
                    staff_ids: { type: array, items: { type: integer } }

    EventSummary:
      type: object
      required: [id, title, status, start_at, end_at, venue, tickets]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [draft, published, cancelled] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        venue: { type: [string, 'null'] }
        tickets:
          type: object
          required: [valid, used, capacity]
          properties:
            valid: { type: integer, description: Tickets not used yet. }
            used: { type: integer, description: Checked in. }
            capacity: { type: [integer, 'null'] }

    CheckIn:
      type: object
      required: [outcome, admitted, message]
      properties:
        outcome: { type: string, enum: [admitted, used, cancelled, not_paid, other_event, not_found, forged, not_a_code] }
        admitted: { type: boolean, description: True only for `admitted`. }
        message: { type: string, description: "What to show at the door, in the person's language." }
        ticket:
          type: [object, 'null']
          properties:
            code: { type: string }
            holder_name: { type: string }
            type_name: { type: string }
            event_id: { type: integer }
            event_title: { type: string }
            used_at: { type: [string, 'null'], format: date-time }

    Donation:
      type: object
      required: [id, amount, refunded, status, donor_name, campaign_id, campaign_title, paid_at]
      properties:
        id: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        refunded:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status: { type: string, enum: [paid, refunded] }
        donor_name: { type: [string, 'null'], description: Null when they gave anonymously. }
        message: { type: [string, 'null'] }
        campaign_id: { type: [integer, 'null'] }
        campaign_title: { type: string }
        paid_at: { type: [string, 'null'], format: date-time }

    CampaignTotals:
      type: object
      required: [id, title, status, raised, donors, goal]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string }
        raised: { $ref: '#/components/schemas/Money' }
        donors: { type: integer }
        goal:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'

    Product:
      type: object
      required: [id, name, price, sale_price, stock, available, image_url, sales]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        sale_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        stock: { type: [integer, 'null'], description: Null for no limit. }
        available: { type: boolean, description: Shown in the app (false is a restaurant's "sold out"). }
        image_url: { type: [string, 'null'], format: uri }
        sales: { type: integer }

    ProductPatch:
      type: object
      properties:
        price: { type: string, example: '450.00', description: In major units. }
        sale_price: { type: [string, 'null'] }
        stock: { type: [integer, 'null'], minimum: 0, maximum: 1000000 }
        available: { type: boolean }

    Course:
      type: object
      required: [id, title, published, price, students, topics]
      properties:
        id: { type: integer }
        title: { type: string }
        published: { type: boolean }
        price: { $ref: '#/components/schemas/Money' }
        students: { type: integer }
        topics:
          type: array
          items:
            type: object
            required: [id, title, lessons]
            properties:
              id: { type: integer }
              title: { type: string }
              lessons:
                type: array
                items:
                  type: object
                  required: [id, title, video, duration_minutes, preview]
                  properties:
                    id: { type: integer }
                    title: { type: string }
                    video: { type: string, enum: [media, link, none], description: 'A Media library file, another address, or no video.' }
                    media_id: { type: [string, 'null'], format: uuid }
                    duration_minutes: { type: [integer, 'null'] }
                    preview: { type: boolean }

    LessonRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2, maxLength: 120 }
        video_media_id: { type: [string, 'null'], format: uuid, description: A video of the app's Media library. }
        video_url: { type: [string, 'null'], format: uri }
        text: { type: string, maxLength: 20000 }
        duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 600 }
        preview: { type: boolean, default: false, description: A free preview. }

    Article:
      type: object
      required: [id, title, status, featured, published_at, updated_at]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [draft, published] }
        featured: { type: boolean }
        published_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }

    Listing:
      type: object
      required: [id, title, status, featured, price, city]
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        featured: { type: boolean }
        price: { type: string, description: 'As the office wrote it, with its currency.' }
        city: { type: string }

    MediaFile:
      type: object
      required: [id, name, kind, content_type, size_bytes, status, public, link, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [video, image, pdf] }
        content_type: { type: string }
        size_bytes: { type: integer }
        status: { type: string, enum: [uploading, ready] }
        public: { type: boolean }
        link: { type: string, format: uri, description: 'The Yallapp link, `https://yallapp.com.tr/m/<id>`.' }
        created_at: { type: string, format: date-time }

    Upload:
      type: object
      required: [id, upload_url, chunk_bytes, size]
      properties:
        id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        chunk_bytes: { type: integer, example: 5242880 }
        size: { type: integer }

    Storage:
      type: object
      required: [used_bytes, limit_bytes, used, limit, full, manage_url]
      properties:
        used_bytes: { type: integer }
        limit_bytes: { type: [integer, 'null'], description: Null without a plan. }
        used: { type: string, example: 1.2 GB }
        limit: { type: [string, 'null'], example: 20 GB }
        full: { type: boolean }
        manage_url: { type: string, format: uri, description: Storage packs are bought on yallapp.com.tr. }

    Inquiry:
      type: object
      required: [id, listing_id, listing_title, person, status, last_message, unread, updated_at]
      properties:
        id: { type: integer }
        listing_id: { type: integer }
        listing_title: { type: string }
        person: { type: string }
        status: { type: string, enum: [open, closed] }
        last_message: { type: [string, 'null'] }
        unread: { type: integer, description: Their messages the office hasn't read. }
        updated_at: { type: string, format: date-time }

    InquiryDetail:
      allOf:
        - $ref: '#/components/schemas/Inquiry'
        - type: object
          required: [messages]
          properties:
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
            messages:
              type: array
              items:
                type: object
                required: [id, from, text, created_at]
                properties:
                  id: { type: integer }
                  from: { type: string, enum: [user, office] }
                  text: { type: string }
                  created_at: { type: string, format: date-time }

    Question:
      type: object
      required: [id, course_id, course_title, person, text, status, hidden, answer_count, created_at, updated_at]
      properties:
        id: { type: integer }
        course_id: { type: integer }
        course_title: { type: string }
        person: { type: string, description: The student's name. }
        text: { type: string }
        status: { type: string, enum: [open, answered], description: '`open`: waiting for the business.' }
        hidden: { type: boolean, description: 64 Hidden from others; its author still sees it. }
        answer_count: { type: integer, description: The answers shown in the app (64 not the hidden ones). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: The latest question or answer. }

    QuestionDetail:
      allOf:
        - $ref: '#/components/schemas/Question'
        - type: object
          required: [answers]
          properties:
            answers:
              type: array
              items:
                type: object
                required: [id, from, name, text, hidden, created_at]
                properties:
                  id: { type: integer }
                  from: { type: string, enum: [student, business] }
                  name: { type: string, description: "The student's name, or the business's as the app shows it." }
                  text: { type: string }
                  hidden: { type: boolean, description: 64 Hidden from others; its author still sees it. }
                  created_at: { type: string, format: date-time }

    Review:
      type: object
      required: [id, course_id, course_title, person, rating, text, hidden, reply, created_at, updated_at]
      properties:
        id: { type: integer }
        course_id: { type: integer }
        course_title: { type: string }
        person: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        hidden: { type: boolean, description: Hidden from others; its author still sees it. }
        reply:
          oneOf:
            - type: object
              required: [text, created_at]
              properties:
                text: { type: string }
                created_at: { type: string, format: date-time }
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Member:
      type: object
      required: [membership_id, name, phone, plan_name, status, starts_at, ends_at, credits_left, checked_in_at, frozen]
      properties:
        membership_id: { type: integer }
        name: { type: string }
        phone: { type: [string, 'null'] }
        plan_name: { type: string }
        status: { type: string, enum: [active, frozen, expired, cancelled], description: '64 `frozen`: frozen now (`frozen`).' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        frozen:
          description: |
            64 A freeze now or to come: from the start of `from` (the gym's
            day) until the start of `until`, the day it's back, or until it is
            unfrozen (null). Null: no freeze.
          oneOf:
            - type: object
              required: [from, until]
              properties:
                from: { type: string, format: date-time }
                until: { type: [string, 'null'], format: date-time }
            - type: 'null'
        credits_left: { type: [integer, 'null'], description: Null for unlimited classes. }
        checked_in_at: { type: [string, 'null'], format: date-time, description: When they came in today; null when not yet. }

    MemberCheckIn:
      type: object
      required: [outcome, admitted, message, member]
      properties:
        outcome:
          type: string
          enum: [admitted, already_in, expired, cancelled, not_started, frozen, no_credits, not_found, forged, not_a_code]
          description: '`already_in`: checked in earlier today (`member.checked_in_at`); `frozen` (64): the membership is frozen (`member.frozen_until`); `no_credits`: a class pack used up; `forged`: a QR code not made by this app.'
        admitted: { type: boolean, description: True only for `admitted`. }
        message: { type: string, description: "What to show at the door, in the person's language." }
        member:
          oneOf:
            - type: object
              required: [membership_id, name, plan_name, ends_at, credits_left, checked_in_at]
              properties:
                membership_id: { type: integer }
                name: { type: string }
                plan_name: { type: string }
                ends_at: { type: [string, 'null'], format: date-time }
                credits_left: { type: [integer, 'null'] }
                checked_in_at: { type: [string, 'null'], format: date-time, description: Today's check-in (now when admitted). }
                frozen_until: { type: [string, 'null'], format: date-time, description: '64 With `frozen`: the day it''s back; null until it is unfrozen.' }
            - type: 'null'

    MemberVisit:
      type: object
      required: [id, membership_id, name, plan_name, checked_in_at, by]
      properties:
        id: { type: integer }
        membership_id: { type: integer }
        name: { type: string }
        plan_name: { type: string }
        checked_in_at: { type: string, format: date-time }
        by: { type: string, description: Who checked them in. }

    AppUser:
      type: object
      required: [id, name, phone, email, city, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Analytics:
      type: object
      required: [range, time_zone, has_data, kpis, previous, daily, retention, platforms, countries, screens]
      properties:
        range:
          type: object
          required: [preset, from, to, days]
          properties:
            preset: { type: string }
            from: { type: string, format: date }
            to: { type: string, format: date }
            days: { type: integer }
        time_zone: { type: string }
        has_data: { type: boolean }
        kpis: { $ref: '#/components/schemas/Kpis' }
        previous: { $ref: '#/components/schemas/Kpis' }
        daily:
          type: array
          items:
            type: object
            required: [day, active, installs, sessions]
            properties:
              day: { type: string, format: date }
              active: { type: integer }
              installs: { type: integer }
              sessions: { type: integer }
        retention:
          type: array
          items:
            type: object
            required: [days, cohort, returned, rate]
            properties:
              days: { type: integer }
              cohort: { type: integer }
              returned: { type: integer }
              rate: { type: [number, 'null'] }
        platforms: { type: array, items: { $ref: '#/components/schemas/Share' } }
        countries: { type: array, items: { $ref: '#/components/schemas/Share' } }
        screens: { type: array, items: { $ref: '#/components/schemas/Share' } }

    Kpis:
      type: object
      required: [installs, active_avg, weekly, monthly, sessions]
      properties:
        installs: { type: integer }
        active_avg: { type: number }
        weekly: { type: integer }
        monthly: { type: integer }
        sessions: { type: integer }

    Share:
      type: object
      required: [key, label, value, share]
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: integer }
        share: { type: number }

    SentNotification:
      type: object
      required: [id, title, body, sent_at]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        sent_at: { type: string, format: date-time }

    ScheduleRequest:
      type: object
      required: [title, body, date, time]
      properties:
        title: { type: string, maxLength: 65 }
        body: { type: string, maxLength: 240 }
        date: { type: string, format: date, description: In the app's time zone. }
        time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '18:30' }

    ScheduledNotification:
      type: object
      required: [id, title, body, send_at, local_date, local_time, status, result]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        send_at: { type: string, format: date-time }
        local_date: { type: string, format: date }
        local_time: { type: string, example: '18:30' }
        status: { type: string, enum: [scheduled, sending, failed] }
        result: { type: [string, 'null'], description: "Why it failed, when it did (68: also when the app's plan had ended at its time)." }

    NotificationResult:
      type: object
      required: [message, pushed]
      properties:
        message: { type: string }
        pushed: { type: integer, description: Phones the push went to. }

    Preview:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    Builds:
      type: object
      required: [items, publishing]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, number, version, status, status_label, created_at, finished_at, files]
            properties:
              id: { type: string, format: uuid }
              number: { type: integer }
              version: { type: string }
              status: { type: string, enum: [queued, building, ready, failed] }
              status_label: { type: string }
              message: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
              finished_at: { type: [string, 'null'], format: date-time }
              files:
                type: array
                items:
                  type: object
                  required: [kind, label, url]
                  properties:
                    kind: { type: string }
                    label: { type: string }
                    url: { type: [string, 'null'], format: uri, description: Signed for 15 minutes; null when not available. }
        publishing:
          type: object
          required: [mode, stores]
          properties:
            mode: { type: string, enum: [self, managed] }
            stores:
              type: array
              description: With "We publish for you", each store's status.
              items:
                type: object
                required: [store, status]
                properties:
                  store: { type: string }
                  status: { type: string }
                  url: { type: [string, 'null'], format: uri }

    License:
      type: object
      required: [state, plan, storage, manage_url]
      properties:
        state: { $ref: '#/components/schemas/AccountState' }
        plan:
          oneOf:
            - $ref: '#/components/schemas/PlanSummary'
            - type: 'null'
        next_plan:
          type: [object, 'null']
          description: A lower plan chosen to start at the end of this one.
          properties:
            id: { type: string }
            name: { type: string }
            starts_at: { type: string, format: date-time }
        features:
          type: array
          description: What the plan includes, in the person's language.
          items: { type: string }
        storage: { $ref: '#/components/schemas/Storage' }
        manage_url: { type: string, format: uri, description: 'Renewing, changing plans and storage packs: on yallapp.com.tr only.' }

    TeamRole:
      type: string
      enum: [owner, manager, staff]

    TeamArea:
      type: string
      description: What a Staff member can be given (roadmap 60).
      enum: [orders, bookings, events, donations, catalog, media, messages, app_users, analytics, notifications]

    AppAccess:
      type: object
      description: What the signed-in person may do on this app (roadmap 60).
      required: [role, areas, license, team, settings]
      properties:
        role: { $ref: '#/components/schemas/TeamRole' }
        areas:
          type: array
          description: The areas they have; every area for owners and managers.
          items: { $ref: '#/components/schemas/TeamArea' }
        license: { type: boolean, description: 'License, payments and storage packs: the owner only. Else the app shows "Ask the owner".' }
        team: { type: boolean, description: The Team paths. }
        settings: { type: boolean, description: "The app's settings: builds and publishing (owners and managers)." }

    Business:
      type: object
      required: [id, name, role, state]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Its first app's name, else its owner's." }
        role: { $ref: '#/components/schemas/TeamRole' }
        state: { $ref: '#/components/schemas/AccountState' }

    TeamMember:
      type: object
      required: [user_id, name, email, role, areas, app_ids, joined_at, last_sign_in_at]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/TeamRole' }
        areas:
          type: array
          items: { $ref: '#/components/schemas/TeamArea' }
        app_ids:
          type: [array, 'null']
          description: The apps they work on; null for all of them.
          items: { type: string, format: uuid }
        joined_at: { type: [string, 'null'], format: date-time, description: Null for the owner. }
        last_sign_in_at: { type: [string, 'null'], format: date-time }

    TeamInvitation:
      type: object
      required: [id, name, email, role, areas, app_ids, sent_at, expires_at, expired]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/TeamRole' }
        areas:
          type: array
          items: { $ref: '#/components/schemas/TeamArea' }
        app_ids:
          type: [array, 'null']
          items: { type: string, format: uuid }
        sent_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }

    Team:
      type: object
      required: [members, invitations]
      properties:
        members:
          type: array
          description: The owner first, then the team in the order they joined.
          items: { $ref: '#/components/schemas/TeamMember' }
        invitations:
          type: array
          description: Invitations neither accepted nor cancelled, newest first (expired ones too, to send again).
          items: { $ref: '#/components/schemas/TeamInvitation' }

    TeamAccessRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [manager, staff] }
        areas:
          type: array
          description: Staff only; at least one.
          items: { $ref: '#/components/schemas/TeamArea' }
        app_ids:
          type: [array, 'null']
          description: Some of the business's apps, or null (or left out) for all of them.
          items: { type: string, format: uuid }

    TeamInviteRequest:
      allOf:
        - $ref: '#/components/schemas/TeamAccessRequest'
        - type: object
          required: [name, email]
          properties:
            name: { type: string, minLength: 2, maxLength: 120 }
            email: { type: string, format: email }
