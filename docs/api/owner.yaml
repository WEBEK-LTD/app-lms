                  - type: object
                    required: [items, campaigns]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Donation' }
                      campaigns:
                        type: array
                        items: { $ref: '#/components/schemas/CampaignTotals' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountNotActive' }
        '404': { $ref: '#/components/responses/NotFound' }

  /apps/{app_id}/products:
