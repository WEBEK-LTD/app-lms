    parameters: [{ $ref: "#/components/parameters/ItemId" }]
    get:
      x-building: true
      tags: [Showcase]
      summary: Comments, oldest first
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/CommentPage" } } } }
    post:
      x-building: true
      tags: [Showcase]
      summary: Comment
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommentInput" } } } }
      responses:
        "201": { description: Commented., content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }

  # ------------------------------------------------------------ Area B: Member tutorials (233.4)
  /tutorials/mine:
    get:
      x-building: true
      tags: [Tutorials]
      summary: The member's own tutorials, any status
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page of tutorials (area B's shape)., content: { application/json: { schema: { type: object, required: [items, next_cursor], properties: { items: { type: array, items: { type: object } }, next_cursor: { type: [string, "null"] } } } } } }
  /tutorials/drafts:
    post:
      x-building: true
      tags: [Tutorials]
      summary: A member writes a tutorial (article, or a video link); the first ones wait for review; "Official" stays for the Yallapp team
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialInput" } } } }
      responses:
        "201": { description: Written (pending or published)., content: { application/json: { schema: { type: object } } } }
  /tutorials/drafts/{tutorial_id}:
    parameters: [{ name: tutorial_id, in: path, required: true, schema: { type: string } }]
    patch:
      x-building: true
      tags: [Tutorials]
      summary: Change one's tutorial (back to review when it was held)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TutorialInput" } } } }
      responses:
        "200": { description: The tutorial., content: { application/json: { schema: { type: object } } } }
    delete:
      x-building: true
      tags: [Tutorials]
      summary: Delete one's tutorial
      responses:
        "204": { description: Deleted. }

  # ------------------------------------------------------------ Area B: Academy (233.1)
  /academy/courses:
    get:
      x-building: true
      tags: [Academy]
      summary: Courses, with whether each is open to the viewer
      description: |
        The API never says what a course costs and offers nothing to buy: a
        course is `open` (free, or the member has it) or `locked`. Courses
        are sold on the website's own pages only, never through this API.
        The app shows a lock, and no price, buy button or payment link.
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ name: level, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/CoursePage" } } } }
  /academy/courses/{course}:
    parameters: [{ $ref: "#/components/parameters/Course" }]
    get:
      x-building: true
      tags: [Academy]
      summary: A course and its lessons (a locked course's lessons have titles only)
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200": { description: The course., content: { application/json: { schema: { $ref: "#/components/schemas/Course" } } } }
  /academy/courses/{course}/lessons/{lesson_id}:
    parameters: [{ $ref: "#/components/parameters/Course" }, { name: lesson_id, in: path, required: true, schema: { type: string } }]
    get:
      x-building: true
      tags: [Academy]
      summary: A lesson (its video or article); 403 `course_locked` when the course isn't open to them
      responses:
        "200": { description: The lesson., content: { application/json: { schema: { $ref: "#/components/schemas/Lesson" } } } }
        "403": { description: "`course_locked`." }
  /academy/courses/{course}/lessons/{lesson_id}/complete:
    parameters: [{ $ref: "#/components/parameters/Course" }, { name: lesson_id, in: path, required: true, schema: { type: string } }]
    post:
      x-building: true
      tags: [Academy]
      summary: Mark a lesson done
      responses:
        "200": { description: The progress., content: { application/json: { schema: { $ref: "#/components/schemas/CourseProgress" } } } }
  /academy/courses/{course}/quizzes/{quiz_id}/attempts:
    parameters: [{ $ref: "#/components/parameters/Course" }, { name: quiz_id, in: path, required: true, schema: { type: string } }]
    post:
      x-building: true
      tags: [Academy]
      summary: Answer a quiz; passing every quiz and lesson earns the certificate
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answers], properties: { answers: { type: object, additionalProperties: { type: array, items: { type: string } }, description: "Question id → the chosen option ids." } } } } } }
      responses:
        "200": { description: The result., content: { application/json: { schema: { $ref: "#/components/schemas/QuizResult" } } } }
  /academy/mine:
    get:
      x-building: true
      tags: [Academy]
      summary: The member's open courses and their progress (bought ones are open on every device on sign-in)
      responses:
        "200": { description: The courses., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/CourseSummary" } } } } } } }
  /academy/certificates:
    get:
      x-building: true
      tags: [Academy]
      summary: The member's certificates
      responses:
        "200": { description: The certificates., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Certificate" } } } } } } }
  /academy/certificates/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    get:
      x-building: true
      tags: [Academy]
      summary: Check a certificate (public; its PDF is `pdf_url`)
      security: []
      responses:
        "200": { description: The certificate., content: { application/json: { schema: { $ref: "#/components/schemas/Certificate" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ Area C: Push, points, leaderboard (232.6, 233.2)
  /me/push-tokens:
    put:
      x-building: true
      tags: [Notifications]
      summary: The device's Firebase Cloud Messaging token (the app sends it after sign-in and when it changes)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, platform], properties: { token: { type: string, maxLength: 4096 }, platform: { type: string, enum: [ios, android] } } } } } }
      responses:
        "204": { description: Kept for this session's device. }
    delete:
      x-building: true
      tags: [Notifications]
      summary: Forget this device's token (signing out does too)
      responses:
        "204": { description: Forgotten. }
  /me/points:
    get:
      x-building: true
      tags: [Points]
      summary: The member's points, level and history, newest first
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: The points., content: { application/json: { schema: { $ref: "#/components/schemas/PointsHistory" } } } }
  /leaderboard:
    get:
      x-building: true
      tags: [Points]
      summary: The leaderboard, this week's (Monday 00:00 UTC on) or all-time
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ name: period, in: query, schema: { type: string, enum: [week, all], default: week } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/LeaderboardPage" } } } }
  /admin/points:
    get:
      x-building: true
      tags: [Admin]
      summary: The points for each action, their daily caps, and the levels
      responses:
        "200": { description: The table., content: { application/json: { schema: { $ref: "#/components/schemas/PointsRules" } } } }
    put:
      x-building: true
      tags: [Admin]
      summary: Change the points table (admins; audit-logged)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PointsRules" } } } }
      responses:
        "200": { description: The table., content: { application/json: { schema: { $ref: "#/components/schemas/PointsRules" } } } }

  # ------------------------------------------------------------ Area C: Challenges (233.3)
  /challenges:
    get:
      x-building: true
      tags: [Challenges]
      summary: Challenges (the running one first; the home card reads `status=open&limit=1`)
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [upcoming, open, voting, closed] } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/ChallengePage" } } } }
  /challenges/{challenge_id}:
    parameters: [{ $ref: "#/components/parameters/ChallengeId" }]
    get:
      x-building: true
      tags: [Challenges]
      summary: A challenge, its rules and winners
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200": { description: The challenge., content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
  /challenges/{challenge_id}/entries:
    parameters: [{ $ref: "#/components/parameters/ChallengeId" }]
    get:
      x-building: true
      tags: [Challenges]
      summary: The entries, most voted first while voting
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeEntryPage" } } } }
    post:
      x-building: true
      tags: [Challenges]
      summary: Enter, with a showcase item or a link (once, while open)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { showcase_id: { type: string }, url: { type: string, format: uri }, note: { type: string, maxLength: 1000 } } } } } }
      responses:
        "201": { description: Entered., content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeEntry" } } } }
  /challenges/{challenge_id}/entries/{entry_id}/vote:
    parameters: [{ $ref: "#/components/parameters/ChallengeId" }, { name: entry_id, in: path, required: true, schema: { type: string } }]
    put: { x-building: true, tags: [Challenges], summary: Vote for an entry (not one's own; while voting), responses: { "200": { $ref: "#/components/responses/Liked" } } }
    delete: { x-building: true, tags: [Challenges], summary: Take the vote back, responses: { "200": { $ref: "#/components/responses/Liked" } } }
  /admin/challenges:
    post:
      x-building: true
      tags: [Admin]
      summary: Post a challenge
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeInput" } } } }
      responses:
        "201": { description: Posted., content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
  /admin/challenges/{challenge_id}:
    parameters: [{ $ref: "#/components/parameters/ChallengeId" }]
    patch:
      x-building: true
      tags: [Admin]
      summary: Change a challenge
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChallengeInput" } } } }
      responses:
        "200": { description: The challenge., content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
    delete:
      x-building: true
      tags: [Admin]
      summary: Delete a challenge
      responses:
        "204": { description: Deleted. }
  /admin/challenges/{challenge_id}/winners:
    parameters: [{ $ref: "#/components/parameters/ChallengeId" }]
    put:
      x-building: true
      tags: [Admin]
      summary: Pick the winners; each gets the challenge's badge or points
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [entry_ids], properties: { entry_ids: { type: array, minItems: 1, maxItems: 10, items: { type: string } } } } } } }
      responses:
        "200": { description: The challenge., content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }

  # ------------------------------------------------------------ Area C: Events and live (234.3, 234.4)
  /events:
    get:
      x-building: true
      tags: [Events]
      summary: Events, soonest first (`past` for replays)
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/EventKind" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/EventPage" } } } }
  /events/{event_id}:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      x-building: true
      tags: [Events]
      summary: An event (times in UTC; clients show them in the viewer's time zone)
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200": { description: The event., content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
  /events/{event_id}/rsvp:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    put:
      x-building: true
      tags: [Events]
      summary: Going (free; reminders by push and email a day and an hour before)
      responses:
        "200": { description: The event., content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
        "409": { description: "`event_full`." }
    delete:
      x-building: true
      tags: [Events]
      summary: Not going
      responses:
        "200": { description: The event., content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
  /events/{event_id}/attendees:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      x-building: true
      tags: [Events]
      summary: Who is going
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/MemberPage" }
  /events/{event_id}/ics:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      x-building: true
      tags: [Events]
      summary: Add to calendar (an .ics file)
      security: []
      responses:
        "200": { description: The calendar file., content: { text/calendar: { schema: { type: string } } } }
  /events/{event_id}/comments:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      x-building: true
      tags: [Events]
      summary: A live event's comments; with `after`, only newer ones (polling during the live)
      security: [{ bearerAuth: [] }, {}]
      parameters: [{ name: after, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/CommentPage" } } } }
    post:
      x-building: true
      tags: [Events]
      summary: Comment during the live
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommentInput" } } } }
      responses:
        "201": { description: Commented., content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
  /admin/events:
    post:
      x-building: true
      tags: [Admin]
      summary: Create an event or a live session (an embed URL; no streaming of our own)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
  /admin/events/{event_id}:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    patch:
      x-building: true
      tags: [Admin]
      summary: Change an event (the replay link after a live)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } } }
      responses:
        "200": { description: The event., content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
    delete:
      x-building: true
      tags: [Admin]
      summary: Cancel an event (those going hear of it)
      responses:
        "204": { description: Cancelled. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The access token from sign-in or refresh (15 minutes). The website sends it in the `yc_access` cookie instead.

  parameters:
    Member:
      name: member
      in: path
      required: true
      description: The member's id, or `@` and their username.
      schema: { type: string, examples: ["@mohamed", "7f1c…"] }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: question_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AnswerId:
      name: answer_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string }
    Group:
      name: group
      in: path
      required: true
      description: The group's id, or its slug.
      schema: { type: string }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string }
    PostId:
      name: post_id
      in: path
      required: true
      schema: { type: string }
    CommentId:
      name: comment_id
      in: path
      required: true
      schema: { type: string }
    StoryId:
      name: story_id
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string }
    Course:
      name: course
      in: path
      required: true
      description: The course's id or slug.
      schema: { type: string }
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema: { type: string }
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: string }

  requestBodies:
    Vote:
      required: true
      content:
        application/json:
          schema: { type: object, required: [value], properties: { value: { type: integer, enum: [1, 0, -1], description: "0 takes the vote back." } } }

  responses:
    Liked:
      description: The count now and whether the member likes (or voted for) it.
      content:
        application/json:
          schema: { type: object, required: [count, mine], properties: { count: { type: integer }, mine: { type: boolean } } }
    Session:
      description: Signed in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    Unauthorized:
      description: "`invalid_token` (none, expired, or signed out)."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    Forbidden:
      description: "`not_allowed`, `not_admin` or `account_suspended`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    NotAllowed:
      description: "`not_allowed` (oneself, or a blocked member)."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    NotFound:
      description: "`not_found`."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    Invalid:
      description: "`invalid_request`, with the fields at fault."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    TooMany:
      description: "`too_many_attempts`; `Retry-After` says when to try again."
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }
    MemberPage:
      description: A page of members.
      content:
        application/json:
          schema:
            type: object
            required: [items, next_cursor]
            properties:
              items: { type: array, items: { $ref: "#/components/schemas/MemberSummary" } }
              next_cursor: { type: [string, "null"] }
    Voted:
      description: The score now and the member's vote.
      content:
        application/json:
          schema: { type: object, required: [score, my_vote], properties: { score: { type: integer }, my_vote: { type: integer, enum: [1, 0, -1] } } }

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [invalid_request, invalid_credentials, invalid_token, email_taken, username_taken, account_suspended, provider_not_configured, not_found, not_allowed, not_admin, not_eligible, already_pending, already_reported, already_linked, too_many_attempts]
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    Language:
      type: string
      enum: [en, ar, tr]
      default: en
    Theme:
      type: string
      enum: [system, light, dark]
    TargetType:
      type: string
      description: "Phase 2–4 adds posts, stories, showcase items, groups, jobs, conversations (reported as a whole) and pro reviews."
      enum: [member, question, answer, reply, tutorial, comment, post, story, showcase, group, job, conversation, review]
    DeviceInput:
      type: object
      properties:
        name: { type: string, maxLength: 100, examples: [iPhone 16] }
        platform: { type: string, enum: [ios, android, web], default: web }
    Session:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at, created, member]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        created: { type: boolean, description: "True when this sign-in made the member (Apple, Google, sign-up)." }
        member: { $ref: "#/components/schemas/Me" }
    Device:
      type: object
      required: [id, name, platform, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    BadgeKind:
      type: string
      enum: [gold, green, blue]
      description: "gold: Pro Developer; green: Verified Business; blue: Active Member. Only the highest shows next to a name (gold, then green, then blue)."
    Badge:
      type: object
      required: [kind, label, since]
      properties:
        kind: { $ref: "#/components/schemas/BadgeKind" }
        label: { type: string, description: "In the reader's language: Pro Developer, Verified Business, Active Member." }
        since: { type: string, format: date-time }
        company_name: { type: [string, "null"], description: "Green only." }
        app_url: { type: [string, "null"], description: "Green only." }
    MemberSummary:
      type: object
      description: "A member wherever they appear (an author, a follower). A deleted member is `{ id, display_name: \"Deleted member\", deleted: true }`."
      required: [id, username, display_name, avatar_url, top_badge, team, deleted, rank, rank_label, level, level_label, level_progress]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        avatar_url: { type: [string, "null"] }
        headline: { type: string }
        top_badge: { oneOf: [{ $ref: "#/components/schemas/BadgeKind" }, { type: "null" }], description: "The one badge shown next to the name." }
        team: { type: boolean, description: "Yallapp's team (\"Yallapp Team\")." }
        deleted: { type: boolean }
        rank: { type: string, enum: [newcomer, member, contributor, pro, expert, master], description: "Their standing by points: the same as level (newcomer, member from 25, contributor from 250, pro from 1,000, expert from 1,375, master from 5,000)." }
        rank_label: { type: string, description: "The rank's name in the reader's language (\"Expert\")." }
        level: { type: string, enum: [newcomer, member, contributor, pro, expert, master], description: "The level by points, from one table (`/config` levels); the same as rank." }
        level_label: { type: string, description: "The level's name in the reader's language." }
        level_progress: { type: number, minimum: 0, maximum: 1, description: "How far toward the next level (1 at the top): the side menu's bar." }
        relationship: { $ref: "#/components/schemas/Relationship" }
    Relationship:
      type: object
      description: How the signed-in member stands with this member (absent when signed out).
      required: [following, followed_by, friend, blocked]
      properties:
        following: { type: boolean }
        followed_by: { type: boolean }
        friend: { type: string, enum: [none, requested, incoming, friends], description: "requested: the viewer asked; incoming: they asked the viewer." }
        friend_request_id: { type: [string, "null"] }
        blocked: { type: boolean, description: "The viewer blocked them." }
    Profile:
      allOf:
        - $ref: "#/components/schemas/MemberSummary"
        - type: object
          required: [bio, skills, links, badges, points, counts, joined_at, yallapp_linked]
          properties:
            bio: { type: string }
            skills: { type: array, items: { type: string } }
            links: { type: array, items: { $ref: "#/components/schemas/ProfileLink" } }
            badges: { type: array, items: { $ref: "#/components/schemas/Badge" }, description: "Every badge held, highest first." }
            points: { type: integer }
            counts:
              type: object
              required: [followers, following, friends, questions, answers, accepted_answers, apps]
              properties:
                followers: { type: integer }
                following: { type: integer }
                friends: { type: integer }
                questions: { type: integer }
                answers: { type: integer }
                accepted_answers: { type: integer }
                apps: { type: integer }
            joined_at: { type: string, format: date-time }
            yallapp_linked: { type: boolean }
    ProfileLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, maxLength: 40 }
        url: { type: string, format: uri, maxLength: 300 }
    Me:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [email, email_verified, has_password, providers, language, theme, role, status, unread_notifications, pending_friend_requests]
          properties:
            email: { type: [string, "null"] }
            email_verified: { type: boolean }
            has_password: { type: boolean }
            providers: { type: array, items: { type: string, enum: [email, apple, google, yallapp] } }
            language: { $ref: "#/components/schemas/Language" }
            theme: { $ref: "#/components/schemas/Theme" }
            role: { type: string, enum: [member, team, admin], description: "Stored role: \"team\" gives official answers. It never makes an admin." }
            community_role: { type: [string, "null"], enum: [admin, moderator, null], description: "Who runs the community, asked again on each request: admin when the linked Yallapp account is an owner or admin of Yallapp's admin; moderator when an admin made them one (area C)." }
            status: { type: string, enum: [active, suspended] }
            unread_notifications: { type: integer }
            pending_friend_requests: { type: integer }
            link_suggestion:
              type: object
              description: "A Yallapp account with the member's verified email may be linked in one tap (POST /me/yallapp-link/suggested). Nothing about the account is shown before they agree."
              required: [available]
              properties:
                available: { type: boolean }
    MePatch:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, pattern: "^[a-z0-9_.]{3,30}$" }
        headline: { type: string, maxLength: 80 }
        bio: { type: string, maxLength: 1000 }
        skills: { type: array, maxItems: 15, items: { type: string, minLength: 1, maxLength: 30 } }
        links: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/ProfileLink" } }
        language: { $ref: "#/components/schemas/Language" }
        theme: { $ref: "#/components/schemas/Theme" }
    FriendRequest:
      type: object
      required: [id, member, created_at]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: "#/components/schemas/MemberSummary" }
        created_at: { type: string, format: date-time }
    YallappLink:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean }
        linked_at: { type: [string, "null"], format: date-time }
        account_name: { type: [string, "null"], description: "The Yallapp account's name." }
        account_email: { type: [string, "null"], description: "The Yallapp account's email, shown to the member themself so they can tell which account is linked." }
        apps: { type: array, items: { $ref: "#/components/schemas/LinkedApp" } }
    LinkedApp:
      type: object
      required: [id, name, icon_url, app_store_url, play_store_url, from_template, paid_plan]
      properties:
        id: { type: string }
        name: { type: string }
        icon_url: { type: [string, "null"] }
        app_store_url: { type: [string, "null"] }
        play_store_url: { type: [string, "null"] }
        from_template: { type: boolean }
        paid_plan: { type: boolean }
    Section:
      type: object
      required: [slug, name, icon, coming_soon]
      properties:
        slug: { type: string }
        name: { type: string, description: "In the reader's language." }
        icon: { type: string, description: "A Material Symbols Rounded name." }
        count: { type: integer, description: "Published questions (or tutorials) in it; 0 where a section is shown inside a question." }
        coming_soon: { type: boolean }
        followed: { type: boolean, description: "In the Q&A: whether the signed-in member follows it (\"My sections\")." }
    Config:
      type: object
      required: [languages, default_language, sections, tabs]
      properties:
        languages: { type: array, items: { $ref: "#/components/schemas/Language" } }
        default_language: { $ref: "#/components/schemas/Language" }
        sections:
          type: array
          description: "The side menu's sections in order: home, qa, tutorials, academy, showcase, challenges, groups, friends, pros, events. Phase 1 has home, qa, tutorials and friends; the rest are coming_soon."
          items: { $ref: "#/components/schemas/Section" }
        tabs:
          type: array
          description: "The tab bar: home, qa, create, learn, groups."
          items: { $ref: "#/components/schemas/Section" }
        levels:
          type: array
          description: "The levels by points, lowest first (lib/community/levels.ts)."
          items:
            type: object
            required: [key, name, min_points]
            properties:
              key: { type: string }
              name: { type: string }
              min_points: { type: integer }
        groups_create_policy: { type: string, enum: [everyone, badge_holders, chosen], description: "Read by phase 2." }
        site_url: { type: string, format: uri }
    Tag:
      type: object
      required: [slug, name, count]
      properties:
        slug: { type: string }
        name: { type: string }
        count: { type: integer }
    QuestionSummary:
      type: object
      required: [id, slug, title, excerpt, author, section, tags, language, score, answer_count, view_count, accepted, has_official_answer, status, created_at, last_activity_at, bookmarked]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, description: "The website's address: /questions/{slug}. The API takes it wherever it takes the id." }
        title: { type: string }
        excerpt: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        section: { $ref: "#/components/schemas/Section" }
        tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        language: { $ref: "#/components/schemas/Language" }
        score: { type: integer }
        answer_count: { type: integer }
        view_count: { type: integer }
        accepted: { type: boolean }
        has_official_answer: { type: boolean }
        status: { type: string, enum: [pending, published, removed] }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        bookmarked: { type: boolean, description: "Saved by the signed-in member." }
    Question:
      allOf:
        - $ref: "#/components/schemas/QuestionSummary"
        - type: object
          required: [body, my_vote, can_edit, can_accept, answers, accepted_answer_id]
          properties:
            body: { type: string, description: "Markdown." }
            my_vote: { type: integer, enum: [1, 0, -1] }
            can_edit: { type: boolean }
            can_accept: { type: boolean }
            accepted_answer_id: { type: [string, "null"] }
            answers: { type: array, items: { $ref: "#/components/schemas/Answer" } }
    Answer:
      type: object
      required: [id, question_id, body, author, official, accepted, score, my_vote, status, reply_count, replies, can_edit, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        question_id: { type: string, format: uuid }
        body: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        official: { type: boolean, description: "From Yallapp's team: shows the \"Yallapp Team\" badge." }
        accepted: { type: boolean }
        score: { type: integer }
        my_vote: { type: integer, enum: [1, 0, -1] }
        status: { type: string, enum: [pending, published, removed] }
        reply_count: { type: integer, description: "Published replies." }
        replies: { type: array, description: "The newest 3, oldest first; the rest from /qa/answers/{answer_id}/replies.", items: { $ref: "#/components/schemas/Reply" } }
        can_edit: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Reply:
      type: object
      description: "A short reply under an answer (moderation calls it a `comment`)."
      required: [id, answer_id, body, author, status, created_at, can_edit]
      properties:
        id: { type: string, format: uuid }
        answer_id: { type: string, format: uuid }
        body: { type: string, maxLength: 1000 }
        author: { $ref: "#/components/schemas/MemberSummary" }
        status: { type: string, enum: [pending, published, removed] }
        created_at: { type: string, format: date-time }
        can_edit: { type: boolean, description: "Its author may delete it." }
    TutorialSummary:
      type: object
      required: [id, slug, title, summary, kind, level, language, section, cover_url, duration_seconds, duration_minutes, official, tags, author, view_count, bookmarked, published_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        kind: { type: string, enum: [article, video] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        language: { $ref: "#/components/schemas/Language" }
        section: { $ref: "#/components/schemas/Section" }
        cover_url: { type: [string, "null"] }
        duration_seconds: { type: integer, description: "A video's length; an article's reading time (200 words a minute)." }
        duration_minutes: { type: [integer, "null"], description: "duration_seconds rounded up to minutes." }
        official: { type: boolean }
        tags: { type: array, items: { type: string }, description: "Tag slugs." }
        author: { $ref: "#/components/schemas/MemberSummary" }
        view_count: { type: integer }
        bookmarked: { type: boolean, description: "Saved by the signed-in member." }
        published_at: { type: string, format: date-time }
    Tutorial:
      allOf:
        - $ref: "#/components/schemas/TutorialSummary"
        - type: object
          required: [body, video_url]
          properties:
            body: { type: string, description: "Markdown: the article, or a video's notes. Every tutorial is free." }
            video_url: { type: [string, "null"], description: "A video's address; null for an article." }
    VerificationState:
      type: object
      required: [has_gold, app_count, required_apps, yallapp_linked, can_apply, request]
      properties:
        has_gold: { type: boolean }
        app_count: { type: integer, description: "Apps on the linked Yallapp account (templates count)." }
        required_apps: { type: integer, const: 5 }
        yallapp_linked: { type: boolean }
        can_apply: { type: boolean }
        apps: { type: array, items: { $ref: "#/components/schemas/LinkedApp" } }
        request: { oneOf: [{ $ref: "#/components/schemas/VerificationRequest" }, { type: "null" }] }
    VerificationRequest:
      type: object
      required: [id, member, full_name, portfolio_links, apps, status, reason, created_at, reviewed_at]
      properties:
        id: { type: string, format: uuid }
        member: { $ref: "#/components/schemas/MemberSummary" }
        full_name: { type: string }
        portfolio_links: { type: array, items: { type: string } }
        apps: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } } }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: [string, "null"], description: "The admin's reason, shown to the member." }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
    BadgeGrant:
      type: object
      required: [id, badge, source, reason, granted_by, granted_at, expires_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        badge: { $ref: "#/components/schemas/BadgeKind" }
        source: { type: string, enum: [auto, manual, request] }
        reason: { type: [string, "null"], description: "Private: admins only." }
        granted_by: { oneOf: [{ $ref: "#/components/schemas/MemberSummary" }, { type: "null" }] }
        granted_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoke_reason: { type: [string, "null"] }
        company_name: { type: [string, "null"] }
        app_url: { type: [string, "null"] }
    AuditEntry:
      type: object
      required: [id, actor, action, member, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        actor: { oneOf: [{ $ref: "#/components/schemas/MemberSummary" }, { type: "null" }], description: "Null: the badge rules themselves." }
        action: { type: string, examples: [badge.grant, badge.revoke, badge.auto_grant, badge.auto_revoke, verification.approve, verification.reject, member.suspend, member.restore, moderator.grant, moderator.revoke, settings.update, moderation.approve, moderation.remove, report.action, report.dismiss] }
        member: { oneOf: [{ $ref: "#/components/schemas/MemberSummary" }, { type: "null" }] }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        details: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
    ModeratorGrant:
      type: object
      required: [member, granted_by, granted_at, reason]
      properties:
        member: { $ref: "#/components/schemas/MemberSummary" }
        granted_by: { oneOf: [{ $ref: "#/components/schemas/MemberSummary" }, { type: "null" }] }
        granted_at: { type: string, format: date-time }
        reason: { type: string, description: "Admins only." }
    AdminSettings:
      type: object
      required: [blue_badge, groups_create_policy, spam_filter]
      properties:
        blue_badge:
          type: object
          description: "The Blue (Active Member) rules: all must hold. Removed after `inactive_days` without activity; back when active again."
          required: [min_account_days, min_points, min_accepted_answers, min_approved_tutorials, violation_free_days, inactive_days]
          properties:
            min_account_days: { type: integer, default: 60 }
            min_points: { type: integer, default: 1000 }
            min_accepted_answers: { type: integer, default: 20, description: "Or the tutorials below." }
            min_approved_tutorials: { type: integer, default: 10 }
            violation_free_days: { type: integer, default: 90 }
            inactive_days: { type: integer, default: 90 }
        groups_create_policy: { type: string, enum: [everyone, badge_holders, chosen], default: everyone }
        groups_create_members: { type: array, items: { type: string }, description: "The chosen members' ids (policy `chosen`)." }
        spam_filter:
          type: object
          required: [enabled, blocked_domains, blocked_words, max_links, hide_after_reports]
          properties:
            enabled: { type: boolean, default: true }
            blocked_domains: { type: array, items: { type: string } }
            blocked_words: { type: array, items: { type: string } }
            max_links: { type: integer, default: 3 }
            hide_after_reports: { type: integer, default: 3, description: "Content reported by this many members is held until a moderator decides." }
        first_posts_reviewed: { type: integer, default: 2 }
    ModerationItem:
      type: object
      required: [id, target_type, target_id, cause, status, preview, author, report_count, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { $ref: "#/components/schemas/TargetType" }
        target_id: { type: string }
        cause: { type: string, enum: [first_posts, spam_filter, reports] }
        status: { type: string, enum: [open, approved, removed] }
        preview: { type: string, description: "The content's title or first lines." }
        author: { oneOf: [{ $ref: "#/components/schemas/MemberSummary" }, { type: "null" }] }
        report_count: { type: integer }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        handled_at: { type: [string, "null"], format: date-time }
    Report:
      type: object
      required: [id, reporter, target_type, target_id, reason, note, status, created_at]
      properties:
        id: { type: string, format: uuid }
        reporter: { $ref: "#/components/schemas/MemberSummary" }
        target_type: { $ref: "#/components/schemas/TargetType" }
        target_id: { type: string }
        reason: { type: string, enum: [spam, harassment, hate, inappropriate, misinformation, impersonation, other] }
        note: { type: string }
        status: { type: string, enum: [open, actioned, dismissed] }
        created_at: { type: string, format: date-time }
        handled_at: { type: [string, "null"], format: date-time }
    Notification:
      type: object
      required: [id, kind, text, link, actor, target_type, target_id, read, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          examples: [follow, friend_request, friend_accepted, answer, answer_accepted, official_answer, reply, mention, vote_milestone, badge_granted, badge_revoked, verification_approved, verification_rejected, post_approved, post_removed, report_resolved, yallapp_linked]
        text: { type: string, description: "In the member's language." }
        link: { type: string, description: "Where it opens on the Community, a path (\"/questions/12#a31\", \"/u/nour\")." }
        actor: { oneOf: [{ $ref: "#/components/schemas/MemberSummary" }, { type: "null" }] }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationSettings:
      type: object
      required: [email]
      properties:
        email:
          type: object
          description: Which kinds also come by email (the list always has them all).
          additionalProperties: { type: boolean }
          examples: [{ answer: true, answer_accepted: true, friend_request: true, follow: false, badge_granted: true, verification_approved: true, verification_rejected: true, official_answer: true }]

    # ================================================================ Phases 2–5
    Tenant:
      type: string
      description: |
        Whose community a record belongs to: `yallapp` (Yallapp Community) or
        a client app's id (its own community, phase 5). Every community table
        keeps it; nothing is ever read across tenants.
      examples: [yallapp, 6f0d9a52-3c1e-4d55-9a0a-6b1d2e7c4f10]
    ReportReason:
      type: string
      enum: [spam, harassment, hate, inappropriate, misinformation, impersonation, other]

    # ------------------------------------------------------------ Area A: Messages
    Conversation:
      type: object
      required: [id, kind, title, members, last_message, unread, muted, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [direct, group, hire], description: "`hire`: opened by a hire request (its `hire_request_id`)." }
        title: { type: [string, "null"], description: "A group chat's own title; null: clients show the others' names." }
        members: { type: array, items: { $ref: "#/components/schemas/MemberSummary" }, description: "Everyone in it, the viewer included." }
        last_message: { oneOf: [{ $ref: "#/components/schemas/Message" }, { type: "null" }] }
        unread: { type: integer, description: "Messages after the viewer's read mark (not their own)." }
        muted: { type: boolean }
        blocked: { type: boolean, description: "A one-to-one conversation with a member either side blocked: read-only." }
        hire_request_id: { type: [string, "null"] }
        read_by: { type: object, additionalProperties: { type: [string, "null"] }, description: "Member id → the last message id they read." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        next_cursor: { type: [string, "null"] }
    Message:
      type: object
      required: [id, conversation_id, author, body, photos, reply_to, deleted, created_at]
      properties:
        id: { type: string }
        conversation_id: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        body: { type: string, description: "Empty when deleted." }
        photos: { type: array, items: { type: string, format: uri } }
        reply_to: { oneOf: [{ type: object, required: [id, author_name, excerpt], properties: { id: { type: string }, author_name: { type: string }, excerpt: { type: string } } }, { type: "null" }] }
        deleted: { type: boolean }
        created_at: { type: string, format: date-time }
    MessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Message" } }
        next_cursor: { type: [string, "null"] }

    # ------------------------------------------------------------ Area A: Groups
    GroupRole:
      type: string
      enum: [owner, moderator, member]
    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, maxLength: 2000 }
        visibility: { type: string, enum: [public, private], default: public }
    Group:
      type: object
      required: [id, slug, name, description, visibility, cover_url, owner, member_count, post_count, status, standing, created_at]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public, private] }
        cover_url: { type: [string, "null"] }
        owner: { $ref: "#/components/schemas/MemberSummary" }
        member_count: { type: integer }
        post_count: { type: integer }
        status: { type: string, enum: [active, pending, removed], description: "`pending`: waiting for review (its owner and moderators see it)." }
        standing: { $ref: "#/components/schemas/GroupStanding" }
        created_at: { type: string, format: date-time }
    GroupStanding:
      type: object
      required: [role, requested]
      description: The viewer's place in the group.
      properties:
        role: { oneOf: [{ $ref: "#/components/schemas/GroupRole" }, { type: "null" }], description: "null: not a member." }
        requested: { type: boolean, description: "Asked to join a private group; waiting." }
    GroupPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Group" } }
        next_cursor: { type: [string, "null"] }
    GroupMember:
      type: object
      required: [member, role, joined_at]
      properties:
        member: { $ref: "#/components/schemas/MemberSummary" }
        role: { $ref: "#/components/schemas/GroupRole" }
        joined_at: { type: string, format: date-time, description: "When they joined, or asked to (requests)." }
    GroupMemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GroupMember" } }
        next_cursor: { type: [string, "null"] }

    # ------------------------------------------------------------ Area A: Pros
    ProService:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        rate: { type: string, maxLength: 80, description: "Text only (\"from $300\", \"by the hour\"); no money moves on the platform." }
    ProInput:
      type: object
      required: [headline, services, availability]
      properties:
        headline: { type: string, minLength: 3, maxLength: 120 }
        about: { type: string, maxLength: 4000 }
        services: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/ProService" } }
        skills: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        availability: { type: string, enum: [available, busy, unavailable] }
        showcase_ids: { type: array, maxItems: 12, items: { type: string }, description: "The member's own showcase items, as the portfolio." }
    ProProfile:
      type: object
      required: [member, headline, about, services, skills, availability, portfolio, rating, review_count, done_count, created_at]
      properties:
        member: { $ref: "#/components/schemas/MemberSummary" }
        headline: { type: string }
        about: { type: string }
        services: { type: array, items: { $ref: "#/components/schemas/ProService" } }
        skills: { type: array, items: { type: string } }
        availability: { type: string, enum: [available, busy, unavailable] }
        portfolio: { type: array, items: { $ref: "#/components/schemas/ShowcaseSummary" } }
        rating: { type: [number, "null"], description: "The average, 1–5; null before a review." }
        review_count: { type: integer }
        done_count: { type: integer }
        created_at: { type: string, format: date-time }
    ProPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProProfile" } }
        next_cursor: { type: [string, "null"] }
    HireRequest:
      type: object
      required: [id, client, pro, service, message, status, conversation_id, review, created_at, updated_at]
      properties:
        id: { type: string }
        client: { $ref: "#/components/schemas/MemberSummary" }
        pro: { $ref: "#/components/schemas/MemberSummary" }
        service: { type: [string, "null"] }
        message: { type: string }
        status: { type: string, enum: [pending, accepted, declined, done, cancelled] }
        conversation_id: { type: string, description: "The message thread it opened (kind `hire`)." }
        review: { oneOf: [{ $ref: "#/components/schemas/ProReview" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HireRequestPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/HireRequest" } }
        next_cursor: { type: [string, "null"] }
    ProReview:
      type: object
      required: [id, author, rating, text, created_at]
      properties:
        id: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        created_at: { type: string, format: date-time }
    ProReviewPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProReview" } }
        next_cursor: { type: [string, "null"] }

    # ------------------------------------------------------------ Area A: Jobs
    JobType:
      type: string
      enum: [full_time, part_time, contract, freelance, internship]
    JobInput:
      type: object
      required: [title, description, type]
      properties:
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 10000 }
        type: { $ref: "#/components/schemas/JobType" }
        remote: { type: boolean, default: true }
        location: { type: string, maxLength: 120 }
        skills: { type: array, maxItems: 15, items: { type: string, maxLength: 40 } }
        budget: { type: string, maxLength: 80, description: "Text only; no money moves on the platform." }
    Job:
      type: object
      required: [id, poster, title, description, type, remote, location, skills, budget, status, application_count, applied, created_at]
      properties:
        id: { type: string }
        poster: { $ref: "#/components/schemas/MemberSummary" }
        title: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/JobType" }
        remote: { type: boolean }
        location: { type: string }
        skills: { type: array, items: { type: string } }
        budget: { type: string }
        status: { type: string, enum: [pending, open, closed, removed] }
        application_count: { type: integer, description: "Shown to the poster; 0 for others." }
        applied: { type: boolean, description: "The viewer applied." }
        created_at: { type: string, format: date-time }
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Job" } }
        next_cursor: { type: [string, "null"] }
    JobApplication:
      type: object
      required: [id, job_id, job_title, applicant, message, links, status, created_at]
      properties:
        id: { type: string }
        job_id: { type: string }
        job_title: { type: string }
        applicant: { $ref: "#/components/schemas/MemberSummary" }
        message: { type: string }
        links: { type: array, items: { type: string, format: uri } }
        status: { type: string, enum: [sent, shortlisted, declined, withdrawn] }
        created_at: { type: string, format: date-time }
    JobApplicationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/JobApplication" } }
        next_cursor: { type: [string, "null"] }

    # ------------------------------------------------------------ Area B: Feed, posts, stories, showcase
    FeedItem:
      type: object
      required: [kind, id, created_at]
      description: One item of a feed; exactly the field named by `kind` is set.
      properties:
        kind: { type: string, enum: [post, question, showcase] }
        id: { type: string }
        created_at: { type: string, format: date-time }
        post: { $ref: "#/components/schemas/Post" }
        question: { type: object, description: "Area B's QuestionSummary." }
        showcase: { $ref: "#/components/schemas/ShowcaseSummary" }
    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeedItem" } }
        next_cursor: { type: [string, "null"] }
    Media:
      type: object
      required: [kind, url]
      properties:
        kind: { type: string, enum: [photo, video] }
        url: { type: string, format: uri }
        poster_url: { type: [string, "null"], description: "A video's poster frame." }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
    LinkPreview:
      type: object
      required: [url, title]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        description: { type: [string, "null"] }
        image_url: { type: [string, "null"] }
        site_name: { type: [string, "null"] }
    Post:
      type: object
      required: [id, author, body, media, link_preview, group_id, like_count, comment_count, liked, saved, status, share_url, created_at]
      properties:
        id: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        body: { type: string }
        media: { type: array, items: { $ref: "#/components/schemas/Media" } }
        link_preview: { oneOf: [{ $ref: "#/components/schemas/LinkPreview" }, { type: "null" }] }
        group_id: { type: [string, "null"] }
        like_count: { type: integer }
        comment_count: { type: integer }
        liked: { type: boolean }
        saved: { type: boolean }
        status: { type: string, enum: [published, pending, removed] }
        share_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
    CommentInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        parent_id: { type: [string, "null"], description: "Replying to this comment (one level)." }
    Comment:
      type: object
      required: [id, author, body, parent_id, like_count, liked, replies, status, created_at]
      properties:
        id: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        body: { type: string }
        parent_id: { type: [string, "null"] }
        like_count: { type: integer }
        liked: { type: boolean }
        replies: { type: array, items: { $ref: "#/components/schemas/Comment" }, description: "A top-level comment's replies, oldest first (empty for a reply)." }
        status: { type: string, enum: [published, pending, removed] }
        created_at: { type: string, format: date-time }
    CommentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        next_cursor: { type: [string, "null"] }
    Story:
      type: object
      required: [id, author, media, view_count, seen, created_at, expires_at]
      properties:
        id: { type: string }
        author: { $ref: "#/components/schemas/MemberSummary" }
        media: { $ref: "#/components/schemas/Media" }
        view_count: { type: integer, description: "Shown to its author; 0 for others." }
        seen: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    StoryRing:
      type: object
      required: [member, stories, all_seen]
      properties:
        member: { $ref: "#/components/schemas/MemberSummary" }
        stories: { type: array, items: { $ref: "#/components/schemas/Story" }, description: "Oldest first." }
        all_seen: { type: boolean }
    ShowcaseSummary:
      type: object
      required: [id, title, cover_url, author, made_with_yallapp, like_count]
      properties:
        id: { type: string }
        title: { type: string }
        cover_url: { type: [string, "null"] }
        author: { $ref: "#/components/schemas/MemberSummary" }
        made_with_yallapp: { type: boolean, description: "Verified: the app belongs to the author's linked Yallapp account." }
        like_count: { type: integer }
    ShowcaseItem:
      type: object
      required: [id, title, description, app_type, pictures, app_store_url, play_store_url, website_url, author, made_with_yallapp, like_count, comment_count, liked, status, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        app_type: { type: [string, "null"] }
        pictures: { type: array, items: { type: string, format: uri } }
        app_store_url: { type: [string, "null"] }
        play_store_url: { type: [string, "null"] }
        website_url: { type: [string, "null"] }
        author: { $ref: "#/components/schemas/MemberSummary" }
        made_with_yallapp: { type: boolean }
        like_count: { type: integer }
        comment_count: { type: integer }
        liked: { type: boolean }
        status: { type: string, enum: [published, pending, removed] }
        created_at: { type: string, format: date-time }
    ShowcasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ShowcaseSummary" } }
        next_cursor: { type: [string, "null"] }
    TutorialInput:
      type: object
      required: [title, kind, section]
      properties:
        title: { type: string, minLength: 5, maxLength: 160 }
        kind: { type: string, enum: [article, video] }
        section: { type: string }
        body: { type: string, maxLength: 50000, description: "An article's text (Markdown)." }
        video_url: { type: string, format: uri, description: "A video's link (YouTube or Vimeo)." }
        tags: { type: array, maxItems: 5, items: { type: string } }

    # ------------------------------------------------------------ Area B: Academy
    CourseSummary:
      type: object
      required: [id, slug, title, summary, cover_url, level, lesson_count, access, progress]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        cover_url: { type: [string, "null"] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        lesson_count: { type: integer }
        access: { type: string, enum: [open, locked], description: "`open`: free, or the member has it. Never a price." }
        progress: { type: [number, "null"], minimum: 0, maximum: 1, description: "Done lessons and passed quizzes; null when not started." }
    CoursePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CourseSummary" } }
        next_cursor: { type: [string, "null"] }
    Course:
      allOf:
        - { $ref: "#/components/schemas/CourseSummary" }
        - type: object
          required: [description, lessons, quizzes]
          properties:
            description: { type: string }
            lessons: { type: array, items: { type: object, required: [id, title, kind, minutes, done], properties: { id: { type: string }, title: { type: string }, kind: { type: string, enum: [video, article] }, minutes: { type: integer }, done: { type: boolean } } } }
            quizzes: { type: array, items: { type: object, required: [id, title, after_lesson_id, passed], properties: { id: { type: string }, title: { type: string }, after_lesson_id: { type: [string, "null"] }, passed: { type: boolean } } } }
            certificate: { oneOf: [{ $ref: "#/components/schemas/Certificate" }, { type: "null" }] }
    Lesson:
      type: object
      required: [id, course_id, title, kind, body, video_url, minutes, done]
      properties:
        id: { type: string }
        course_id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [video, article] }
        body: { type: string, description: "An article's text (Markdown); a video's notes." }
        video_url: { type: [string, "null"] }
        minutes: { type: integer }
        done: { type: boolean }
    CourseProgress:
      type: object
      required: [course_id, progress, completed]
      properties:
        course_id: { type: string }
        progress: { type: number }
        completed: { type: boolean }
        certificate: { oneOf: [{ $ref: "#/components/schemas/Certificate" }, { type: "null" }] }
    QuizResult:
      type: object
      required: [score, passed, correct]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        passed: { type: boolean }
        correct: { type: object, additionalProperties: { type: boolean }, description: "Question id → answered right." }
        progress: { $ref: "#/components/schemas/CourseProgress" }
    Certificate:
      type: object
      required: [code, member_name, course_title, issued_at, verify_url, pdf_url]
      properties:
        code: { type: string }
        member_name: { type: string }
        course_title: { type: string }
        issued_at: { type: string, format: date-time }
        verify_url: { type: string, format: uri, description: "The public page that checks it." }
        pdf_url: { type: string, format: uri }

    # ------------------------------------------------------------ Area C: Points, challenges, events
    PointsRules:
      type: object
      required: [actions, levels]
      properties:
        actions:
          type: array
          items: { type: object, required: [action, points, daily_cap], properties: { action: { type: string, examples: [question, answer, answer_accepted, post, comment, like_received, showcase, tutorial_published, challenge_entry, challenge_won, event_attended, course_completed] }, points: { type: integer }, daily_cap: { type: [integer, "null"], description: "At most this many points a day from it; null: no cap." } } }
        levels:
          type: array
          items: { type: object, required: [key, min_points, name], properties: { key: { type: string }, min_points: { type: integer }, name: { type: object, required: [en, ar, tr], properties: { en: { type: string }, ar: { type: string }, tr: { type: string } } } } }
    PointsHistory:
      type: object
      required: [points, level, items, next_cursor]
      properties:
        points: { type: integer }
        week_points: { type: integer }
        level: { type: object, required: [key, label, progress], properties: { key: { type: string }, label: { type: string }, progress: { type: number }, next_at: { type: [integer, "null"] } } }
        items: { type: array, items: { type: object, required: [action, points, created_at], properties: { action: { type: string }, points: { type: integer }, target_type: { type: [string, "null"] }, target_id: { type: [string, "null"] }, created_at: { type: string, format: date-time } } } }
        next_cursor: { type: [string, "null"] }
    LeaderboardPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { type: object, required: [rank, member, points], properties: { rank: { type: integer }, member: { $ref: "#/components/schemas/MemberSummary" }, points: { type: integer } } } }
        me: { type: [object, "null"], properties: { rank: { type: integer }, points: { type: integer } } }
        next_cursor: { type: [string, "null"] }
    ChallengeInput:
      type: object
      required: [title, rules, starts_at, ends_at]
      properties:
        title: { type: string, maxLength: 160 }
        rules: { type: string, maxLength: 10000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, description: "Entries close; voting runs until `voting_ends_at`." }
        voting_ends_at: { type: string, format: date-time }
        reward_points: { type: integer, minimum: 0 }
        reward_badge: { type: [string, "null"] }
        cover_url: { type: [string, "null"] }
    Challenge:
      type: object
      required: [id, title, rules, status, starts_at, ends_at, voting_ends_at, reward_points, reward_badge, entry_count, entered, winners]
      properties:
        id: { type: string }
        title: { type: string }
        rules: { type: string }
        cover_url: { type: [string, "null"] }
        status: { type: string, enum: [upcoming, open, voting, closed] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        voting_ends_at: { type: string, format: date-time }
        reward_points: { type: integer }
        reward_badge: { type: [string, "null"] }
        entry_count: { type: integer }
        entered: { type: boolean }
        winners: { type: array, items: { $ref: "#/components/schemas/ChallengeEntry" } }
    ChallengePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Challenge" } }
        next_cursor: { type: [string, "null"] }
    ChallengeEntry:
      type: object
      required: [id, member, showcase, url, note, vote_count, voted, created_at]
      properties:
        id: { type: string }
        member: { $ref: "#/components/schemas/MemberSummary" }
        showcase: { oneOf: [{ $ref: "#/components/schemas/ShowcaseSummary" }, { type: "null" }] }
        url: { type: [string, "null"] }
        note: { type: string }
        vote_count: { type: integer }
        voted: { type: boolean }
        created_at: { type: string, format: date-time }
    ChallengeEntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ChallengeEntry" } }
        next_cursor: { type: [string, "null"] }
    EventKind:
      type: string
      enum: [online, in_person, live]
    EventInput:
      type: object
      required: [title, kind, starts_at]
      properties:
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 10000 }
        kind: { $ref: "#/components/schemas/EventKind" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        time_zone: { type: string, description: "The organiser's IANA zone, for an in-person event's local time.", examples: [Europe/Istanbul] }
        location: { type: [string, "null"], description: "In person: the place." }
        join_url: { type: [string, "null"], format: uri, description: "Online: the meeting link (shown to those going)." }
        embed_url: { type: [string, "null"], format: uri, description: "Live: a YouTube Live or meeting embed. No streaming of our own." }
        replay_url: { type: [string, "null"], format: uri }
        capacity: { type: [integer, "null"] }
        cover_url: { type: [string, "null"] }
    Event:
      type: object
      required: [id, title, description, kind, starts_at, ends_at, time_zone, location, join_url, embed_url, replay_url, capacity, going_count, going, live_now, status]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        kind: { $ref: "#/components/schemas/EventKind" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        time_zone: { type: string }
        location: { type: [string, "null"] }
        join_url: { type: [string, "null"], description: "Only to those going." }
        embed_url: { type: [string, "null"] }
        replay_url: { type: [string, "null"] }
        capacity: { type: [integer, "null"] }
        cover_url: { type: [string, "null"] }
        going_count: { type: integer }
        going: { type: boolean }
        live_now: { type: boolean }
        status: { type: string, enum: [scheduled, cancelled] }
    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Event" } }
        next_cursor: { type: [string, "null"] }
