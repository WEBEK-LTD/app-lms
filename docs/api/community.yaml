openapi: 3.1.0
info:
  title: Yallapp Community API
  version: 1.0.0
  summary: What the Yallapp Community app and website (community.yallapp.com.tr) call.
  description: |
    Roadmap 231. The server side of Yallapp Community: a public community
    for app makers, on the website `community.yallapp.com.tr` and in its own
    app ("Yallapp Community"). Anyone can join; a Yallapp account is not
    needed, and one can be linked.

    - **Accounts.** Members are the community's own accounts (not Yallapp
      dashboard users). They join and sign in with email and password, Sign
      in with Apple or Google. Each sign-in is a device of its own
      (`GET /me/sessions`).
    - **Tokens.** Sign-in gives an access token (15 minutes) and a refresh
      token (60 days, renewed each time it is used: send the newest one).
      Both are random secrets the server keeps only as hashes. The website
      keeps them in httpOnly cookies (`yc_access`, `yc_refresh`) and sends
      the same requests; the app sends `Authorization: Bearer`.
    - **Reading without an account.** Questions, answers, tutorials and
      profiles are public: `GET` paths marked `security: []` answer without
      a token, and with one they add what is the member's own (their vote,
      whether they follow someone).
    - **Languages.** English is the default; Arabic (MSA) and Turkish are
      the member's choice (`Member.language`). Texts the API writes (errors,
      notifications, emails, section names) follow `Member.language`, else
      `Accept-Language`, else English. What members wrote comes back as
      written.
    - **No payments in the app.** Nothing is sold through this API, and
      every tutorial is free, always: no locks, no prices.
    - **Blocking.** A member never sees content, profiles or notifications
      from someone they blocked or who blocked them; follows and friendships
      between the two end when one blocks the other.
    - **Moderation.** A new member's first 2 questions or posts are reviewed
      before they appear (`status: pending`); the spam and bad-link filter
      can hold any post. Held content is visible to its author and the
      moderators only.
    - **Errors** are `{ "error": { "code", "message" } }` with the HTTP status;
      `message` is in the member's language. Validation errors add `fields`.
    - **Pages.** Lists take `cursor` and `limit` (default 20, at most 50) and
      answer `{ items, next_cursor }`; `next_cursor` null is the end.

    Areas: A (base: accounts, profiles, the social graph, linking a Yallapp
    account, reports), B (Q&A, tutorials, search), C (badges and the
    verification form, notifications, moderation, the admin). Each area
    keeps its paths and schemas here.

    **Phases 2–5 (ROADMAP 232–235).** A: messages, groups, pros, jobs, and
    the tenant key. B: feed and posts, stories, showcase, member tutorials,
    the academy. C: push, points and the leaderboard, challenges, events
    and live, and the admin and moderation of all of it.

    - **The tenant key (235).** One engine serves many communities. Yallapp
      Community is the tenant `yallapp`; a client app that adds the
      "Community" app type in Studio has its own community, the tenant
      being its app id, with its own members (the app's customers),
      content, moderation and settings. A client app calls the same paths
      under `https://yallapp.com.tr/api/app/{app_id}/community/v1`; its
      tokens, members and everything else never reach another tenant
      (404 there). Every community table keeps `tenant_id`.
    - **Polling.** The website polls `GET /messages/unread` and an open
      conversation's messages with `after` (every 15 s); the app polls the
      same and also gets push (`PUT /me/push-tokens`).
    - **Still no payments in the app.** Academy courses say only `open` or
      `locked`: the website sells them on its own pages (Yallapp's Stripe
      checkout), never through this API. Pros' rates and jobs' budgets are
      text; no money moves on the platform. Events are free.
  contact:
    name: Yallapp
    email: info@yallapp.com.tr
servers:
  - url: https://community.yallapp.com.tr/api/community/v1
  - url: https://yallapp.com.tr/api/community/v1
  - url: https://yallapp.com.tr/api/app/{app_id}/community/v1
    description: A client app's own community (phase 5); the tenant is the app.
    variables:
      app_id: { default: "00000000-0000-0000-0000-000000000000", description: "The client app's id." }
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: |
      Join and sign in with email, Apple or Google; renew the tokens; sign
      out; reset a forgotten password. Limits: 30 attempts per IP and 8 per
      email in 15 minutes (429 `too_many_attempts`).
  - name: Me
    description: The signed-in member's own account, profile, settings, devices, and their link to a Yallapp account.
  - name: Members
    description: Profiles, followers, following, friends and their apps.
  - name: Social
    description: Follow (one way, no approval), friends (a request, then accept), block.
  - name: Reports
    description: Reporting a member or content to the moderators.
  - name: Config
    description: The sections of the app and site, what is coming soon, the languages.
  - name: Q&A
    description: (Area B) Questions, answers, votes, accepted answers, official answers, tags and sections.
  - name: Tutorials
    description: (Area B) Official tutorials, articles and videos, by section, level and language.
  - name: Search
    description: (Area B) Search across questions, tutorials, members and tags; similar questions before asking.
  - name: Badges
    description: (Area C) Gold (Pro Developer), Green (Verified Business), Blue (Active Member); the Gold verification form.
  - name: Notifications
    description: (Area C) The notifications list and the email choices. Push is phase 2.
  - name: Admin
    description: "(Area C) Admins only (`Member.role` admin): badges, verification requests, the audit log, settings, moderation, reports."
  - name: Messages
    description: "(Area A, 232.4) One-to-one and small group chats (up to 10 people): text, photos, replies, read state. Blocks are respected."
  - name: Groups
    description: "(Area A, 232.5) Public or private groups with an owner and moderators; their posts and questions."
  - name: Pros
    description: "(Area A, 234.1) Pro profiles, hire requests (a message thread), and reviews once done. No money moves on the platform."
  - name: Jobs
    description: "(Area A, 234.2) Job posts, applications and applicants."
  - name: Posts
    description: "(Area B, 232.1) The home feed, posts with photos or a video, likes, comments and replies, saves."
  - name: Stories
    description: "(Area B, 232.2) Photo or short video stories for 24 hours."
  - name: Showcase
    description: "(Area B, 232.3) Apps members built, \"Made with Yallapp\" verified from the linked account."
  - name: Academy
    description: "(Area B, 233.1) Courses, lessons, quizzes, progress and certificates. Nothing is sold through the API."
  - name: Points
    description: "(Area C, 233.2) Points, levels and the leaderboard."
  - name: Challenges
    description: "(Area C, 233.3) Challenges, entries and votes."
  - name: Events
    description: "(Area C, 234.3, 234.4) Events and live sessions (an embed; no streaming of our own), RSVP, reminders, calendar files."

paths:
  # ------------------------------------------------------------ Area A: Auth
  /auth/email/sign-up:
    post:
      tags: [Auth]
      summary: Join with email and password
      description: |
        Makes the member and signs them in. A verification email is sent; an
        unverified member can use everything but the link expires after 7
        days and can be sent again (`POST /auth/email/verify/resend`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email, maxLength: 191 }
                password: { type: string, minLength: 8, maxLength: 200 }
                display_name: { type: string, minLength: 1, maxLength: 80 }
                username: { type: string, pattern: "^[a-z0-9_.]{3,30}$", description: "Made from the name when not sent." }
                language: { $ref: "#/components/schemas/Language" }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { description: "`email_taken` or `username_taken`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/email/log-in:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: "`invalid_credentials`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "403": { description: "`account_suspended`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/apple:
    post:
      tags: [Auth]
      summary: Continue with Apple
      description: |
        Sends the identity token from Sign in with Apple. It is checked
        against Apple's keys, the audience (the app's bundle id or the
        website's service id, from the environment) and the nonce. The first
        time, a member is made (`created` true): Apple gives the name only
        then, so the app sends it. An email that is already a member's is
        linked to that member when Apple says it is verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                nonce: { type: string, description: "The raw nonce whose SHA-256 the app gave Apple." }
                display_name: { type: string, maxLength: 80 }
                language: { $ref: "#/components/schemas/Language" }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "201": { $ref: "#/components/responses/Session" }
        "401": { description: "`invalid_token`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "403": { description: "`account_suspended`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "503": { description: "`provider_not_configured`: this environment has no Apple keys.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /auth/google:
    post:
      tags: [Auth]
      summary: Continue with Google
      description: The ID token from Google Sign-In, checked against Google's keys and the client ids from the environment. As for Apple, the first time makes the member.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                language: { $ref: "#/components/schemas/Language" }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "201": { $ref: "#/components/responses/Session" }
        "401": { description: "`invalid_token`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "403": { description: "`account_suspended`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "503": { description: "`provider_not_configured`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /auth/yallapp/start:
    post:
      tags: [Auth]
      summary: Start "Continue with Yallapp"
      description: |
        OAuth-style with PKCE (RFC 7636, S256). The client makes a random
        `state` and a `code_verifier`, sends `code_challenge` =
        BASE64URL(SHA-256(code_verifier)), and opens `authorize_url` in the
        browser (the app: the system's web authentication session). On
        yallapp.com.tr the person signs in to Yallapp and approves; the
        browser then goes to `redirect_uri?code=…&state=…` (or
        `?error=access_denied&state=…`). The request waits 10 minutes; its
        code lasts 2 and works once. `redirect_uri` is exactly the site's
        `{site}/auth/yallapp/callback` or the app's `yallappcommunity://auth/yallapp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uri, code_challenge, code_challenge_method, state]
              properties:
                redirect_uri: { type: string }
                code_challenge: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                code_challenge_method: { type: string, enum: [S256] }
                state: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Yallapp's approval page.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, expires_at]
                properties:
                  authorize_url: { type: string, format: uri, examples: ["https://yallapp.com.tr/link-community?mode=signin&request=…"] }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/yallapp:
    post:
      tags: [Auth]
      summary: Continue with Yallapp (the code for a session)
      description: |
        The code from the redirect, with the verifier and the same
        `redirect_uri`. Signs in the member linked to that Yallapp account,
        or makes one linked to it with the account's name and email (201,
        `created`); its email is confirmed in the community unless Yallapp
        has confirmed it. An unlinked member who already has that email is
        409 `email_taken`: they log in their own way, then link. A link made
        this way never makes anyone a Community admin or "Yallapp Team".
        Every failing code (unknown, expired, used, another redirect, the
        wrong verifier) is the same 401, and the code is spent at the first try.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, code_verifier, redirect_uri]
              properties:
                code: { type: string }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
                redirect_uri: { type: string }
                language: { $ref: "#/components/schemas/Language" }
                device: { $ref: "#/components/schemas/DeviceInput" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "201": { $ref: "#/components/responses/Session" }
        "401": { description: "`invalid_token`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "403": { description: "`account_suspended`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "409": { description: "`email_taken`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renew the tokens
      description: Gives a new access token and a new refresh token; the old refresh token stops working.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { description: "`invalid_token`: expired, used, or signed out.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /auth/log-out:
    post:
      tags: [Auth]
      summary: Log out this device
      responses:
        "204": { description: Signed out. }
  /auth/email/verify:
    post:
      tags: [Auth]
      summary: Confirm the email address
      description: The token from the verification email's link (`https://community.yallapp.com.tr/verify-email?token=…`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        "204": { description: Verified. }
        "400": { description: "`invalid_token` (unknown, used or expired).", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /auth/email/verify/resend:
    post:
      tags: [Auth]
      summary: Send the verification email again
      responses:
        "204": { description: Sent (or already verified). }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Ask for a password reset email
      description: Always 204, whether or not the email is a member's. The link is valid for 1 hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "204": { description: Sent when the email is a member's. }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Set a new password from the reset link
      description: Signs every device out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "204": { description: Changed. }
        "400": { description: "`invalid_token` or `invalid_request`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Area A: Me
  /me:
    get:
      tags: [Me]
      summary: The signed-in member
      responses:
        "200": { description: The member., content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Me]
      summary: Edit the profile and settings
      description: Only the fields sent change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MePatch" }
      responses:
        "200": { description: The member as it is now., content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { description: "`username_taken`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Me]
      summary: Delete the account
      description: |
        Deletes the member at once: their profile, follows, friendships,
        blocks and sessions. Their questions and answers stay, shown as from
        "Deleted member". Members who joined with email send their password;
        Apple and Google members send `confirm: "DELETE"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                confirm: { type: string, enum: [DELETE] }
      responses:
        "204": { description: Deleted. }
        "401": { description: "`invalid_credentials`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /me/avatar:
    put:
      tags: [Me]
      summary: Upload the profile picture
      description: A JPEG, PNG or WebP of at most 5 MB; kept square-cropped at 512 × 512.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "200": { description: The member as it is now., content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "400": { description: "`invalid_image` or `too_large`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
    delete:
      tags: [Me]
      summary: Remove the profile picture
      responses:
        "200": { description: The member as it is now., content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
  /me/password:
    put:
      tags: [Me]
      summary: Change (or, for an Apple or Google member, set) the password
      description: Signs the other devices out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string, description: "Needed when the member has one." }
                new_password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "204": { description: Changed. }
        "401": { description: "`invalid_credentials`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /me/sessions:
    get:
      tags: [Me]
      summary: The member's signed-in devices
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Device" } } } }
  /me/sessions/{session_id}:
    delete:
      tags: [Me]
      summary: Sign a device out
      parameters: [{ name: session_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Signed out. }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/blocks:
    get:
      tags: [Social]
      summary: The members this member blocked
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/MemberPage" }
  /me/friend-requests:
    get:
      tags: [Social]
      summary: Friend requests sent to the member, or sent by them
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [incoming, outgoing], default: incoming } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FriendRequest" } }
                  next_cursor: { type: [string, "null"] }
  /me/friend-requests/{request_id}/accept:
    post:
      tags: [Social]
      summary: Accept a friend request sent to the member
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { description: Now friends., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/friend-requests/{request_id}/decline:
    post:
      tags: [Social]
      summary: Decline a friend request sent to the member
      description: The sender is not told.
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "204": { description: Declined. }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/yallapp-link:
    get:
      tags: [Me]
      summary: The member's link to a Yallapp account
      responses:
        "200": { description: The link., content: { application/json: { schema: { $ref: "#/components/schemas/YallappLink" } } } }
    delete:
      tags: [Me]
      summary: Unlink the Yallapp account
      description: Badges that need it (Gold's apps, Green) are checked again.
      responses:
        "204": { description: Unlinked. }
  /me/yallapp-link/start:
    post:
      tags: [Me]
      summary: Start linking a Yallapp account
      description: |
        Gives `confirm_url` on yallapp.com.tr. The app opens it in the
        browser; the person signs in to Yallapp there (if not already) and
        confirms "Link to Yallapp Community as {display_name}". Then the
        browser goes to `return_url` (the website's profile, or the app's
        `yallappcommunity://linked`) and `GET /me/yallapp-link` shows the
        account. A Yallapp account links to one member only (409
        `already_linked`, shown on the confirm page). The link expires in
        15 minutes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_to: { type: string, enum: [web, app], default: web }
      responses:
        "200":
          description: Where to confirm.
          content:
            application/json:
              schema:
                type: object
                required: [confirm_url, expires_at]
                properties:
                  confirm_url: { type: string, format: uri, examples: ["https://yallapp.com.tr/community/link?state=…"] }
                  expires_at: { type: string, format: date-time }
  /me/yallapp-link/suggested:
    post:
      tags: [Me]
      summary: Link the suggested Yallapp account in one tap
      description: |
        Offered (`Me.link_suggestion.available`) when the member's email is
        verified and is the verified email of a Yallapp account that isn't
        linked to anyone, isn't on Yallapp's own team, and the member hasn't
        said no. Checked again now; never automatic. Linked this way, it
        never makes anyone a Community admin.
      responses:
        "200": { description: The link., content: { application/json: { schema: { $ref: "#/components/schemas/YallappLink" } } } }
        "409": { description: "`not_eligible`: no longer offered.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      tags: [Me]
      summary: Say no to the suggested link (not offered again)
      responses:
        "204": { description: Dismissed. }

  # ------------------------------------------------------------ Area A: Members
  /members/{member}:
    get:
      tags: [Members]
      summary: A member's profile
      description: "`member` is the member's id or `@username`. A member who blocked the viewer, or whom the viewer blocked, is 404 (blocked) only for the blocked side; the blocker sees `relationship.blocked` true."
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: The profile., content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/followers:
    get:
      tags: [Members]
      summary: Who follows the member
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Member" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/MemberPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/following:
    get:
      tags: [Members]
      summary: Whom the member follows
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Member" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/MemberPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/friends:
    get:
      tags: [Members]
      summary: The member's friends
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Member" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/MemberPage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/apps:
    get:
      tags: [Members]
      summary: The member's apps made with Yallapp
      description: Read from the linked Yallapp account (never entered by hand); empty without a link. Only apps published on a store are listed publicly; the member sees all of theirs.
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200":
          description: The apps.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/LinkedApp" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/follow:
    put:
      tags: [Social]
      summary: Follow the member
      description: One way, no approval. Following oneself or a blocked member is 400 `not_allowed`.
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: Following., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Social]
      summary: Stop following the member
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: Not following., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/friend:
    put:
      tags: [Social]
      summary: Send a friend request (or accept theirs)
      description: When the other member already asked, this accepts. The other member gets a notification (area C).
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: Requested or friends., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Social]
      summary: Unfriend, or cancel the request sent
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: Not friends., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}/block:
    put:
      tags: [Social]
      summary: Block the member
      description: Ends follows both ways, the friendship and any request between the two.
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: Blocked., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Social]
      summary: Unblock the member
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: Unblocked., content: { application/json: { schema: { $ref: "#/components/schemas/Relationship" } } } }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ Area A: Reports, config
  /reports:
    post:
      tags: [Reports]
      summary: Report a member or content
      description: Once per member and target (409 `already_reported`). Goes to the moderators' queue (area C); content reported by several members is held until a moderator decides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type: { $ref: "#/components/schemas/TargetType" }
                target_id: { type: string }
                reason: { type: string, enum: [spam, harassment, hate, inappropriate, misinformation, impersonation, other] }
                note: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Reported., content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`already_reported`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }
  /config:
    get:
      tags: [Config]
      summary: The sections, what is coming soon, the languages
      description: The side menu and the tab bar draw from this; a section `coming_soon` shows as "Coming soon" and opens nothing.
      security: [{}, { bearerAuth: [] }]
      responses:
        "200": { description: The configuration., content: { application/json: { schema: { $ref: "#/components/schemas/Config" } } } }

  # ------------------------------------------------------------ Area B: Q&A
  /qa/sections:
    get:
      tags: [Q&A]
      summary: The Q&A sections
      security: [{}, { bearerAuth: [] }]
      responses:
        "200": { description: In order., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Section" } } } } } } }
  /qa/sections/{section}/follow:
    parameters: [{ name: section, in: path, required: true, schema: { type: string }, description: "A section's slug." }]
    put:
      tags: [Q&A]
      summary: Follow a section ("My sections"; the `for_you` filter puts its questions first)
      responses:
        "204": { description: Followed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      tags: [Q&A]
      summary: Stop following a section
      responses:
        "204": { description: Not followed. }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/home:
    get:
      tags: [Q&A]
      summary: The Q&A home's side panels
      description: "Questions waiting for an answer (the signed-in member's sections first), this week's figures and its most helpful members."
      security: [{}, { bearerAuth: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, default: 5, maximum: 20 }, description: "Waiting questions." }]
      responses:
        "200":
          description: The panels.
          content:
            application/json:
              schema:
                type: object
                required: [waiting, stats, active_members]
                properties:
                  waiting:
                    type: object
                    required: [items, total, in_my_sections]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } }
                      total: { type: integer }
                      in_my_sections: { type: boolean, description: "The items are from the member's followed sections." }
                  stats:
                    type: object
                    required: [questions, answered_rate, new_count]
                    properties:
                      questions: { type: integer, description: "Published questions." }
                      answered_rate: { type: integer, description: "Percent of them with an answer." }
                      new_count: { type: integer, description: "Asked in the last 7 days." }
                  active_members:
                    type: array
                    items:
                      type: object
                      required: [member, points, accepted_answers]
                      properties:
                        member: { $ref: "#/components/schemas/MemberSummary" }
                        points: { type: integer, description: "Earned in the last 7 days." }
                        accepted_answers: { type: integer }
  /qa/saved:
    get:
      tags: [Q&A]
      summary: The signed-in member's saved questions and tutorials, the last saved first
      responses:
        "200":
          description: Saved posts.
          content:
            application/json:
              schema:
                type: object
                required: [questions, tutorials]
                properties:
                  questions: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } }
                  tutorials: { type: array, items: { $ref: "#/components/schemas/TutorialSummary" } }
  /qa/tags:
    get:
      tags: [Q&A]
      summary: Tags, most used first, or matching `q`
      security: [{}, { bearerAuth: [] }]
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: section, in: query, schema: { type: string }, description: "Those used in this section's questions." }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Tags., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Tag" } } } } } } }
  /qa/questions:
    get:
      tags: [Q&A]
      summary: Questions
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: section, in: query, schema: { type: string }, description: "A section's slug." }
        - { name: tag, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string }, description: "A member's id." }
        - { name: filter, in: query, schema: { type: string, enum: [all, unanswered, answered, official, following, for_you], default: all }, description: "answered: with an accepted answer; official: with an answer from Yallapp's team; following: by members the signed-in member follows; for_you: the member's followed sections first." }
        - { name: sort, in: query, schema: { type: string, enum: [active, newest, votes], default: active } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/Language" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: A page of questions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [Q&A]
      summary: Ask a question
      description: "`status` is `pending` for a new member's first 2 posts or when the filter holds it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, section]
              properties:
                title: { type: string, minLength: 10, maxLength: 200 }
                body: { type: string, minLength: 20, maxLength: 20000, description: "Markdown." }
                section: { type: string, description: "A section's slug." }
                tags: { type: array, maxItems: 5, items: { type: string } }
                language: { $ref: "#/components/schemas/Language" }
      responses:
        "201": { description: Asked., content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/questions/similar:
    get:
      tags: [Q&A, Search]
      summary: Questions like the one being typed, before asking
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: title, in: query, required: true, schema: { type: string, minLength: 3 } }
        - { name: body, in: query, schema: { type: string }, description: "What is typed so far of the question's body (weighs less than the title)." }
        - { name: section, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 5, maximum: 10 } }
      responses:
        "200": { description: Most similar first., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } } } } } } }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/questions/{question_id}:
    get:
      tags: [Q&A]
      summary: A question with its answers
      description: "The accepted answer first, then official answers, then by score. Reading it counts a view unless `view=0`. A pending question is shown to its author only; a removed one to nobody."
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/QuestionId" }, { name: view, in: query, schema: { type: string, enum: ["0", "1"], default: "1" } }]
      responses:
        "200": { description: The question., content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Q&A]
      summary: Edit one's own question
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 10, maxLength: 200 }
                body: { type: string, minLength: 20, maxLength: 20000 }
                section: { type: string }
                tags: { type: array, maxItems: 5, items: { type: string } }
      responses:
        "200": { description: The question., content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      tags: [Q&A]
      summary: Delete one's own question (or, for a moderator, remove it)
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /qa/questions/{question_id}/vote:
    put:
      tags: [Q&A]
      summary: Vote on a question
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      requestBody: { $ref: "#/components/requestBodies/Vote" }
      responses:
        "200": { $ref: "#/components/responses/Voted" }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/questions/{question_id}/bookmark:
    parameters: [{ $ref: "#/components/parameters/QuestionId" }]
    put:
      tags: [Q&A]
      summary: Save a question
      responses:
        "204": { description: Saved. }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      tags: [Q&A]
      summary: Unsave a question
      responses:
        "204": { description: Unsaved. }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/questions/{question_id}/answers:
    post:
      tags: [Q&A]
      summary: Answer a question
      description: "Yallapp's team's answers are official (\"Yallapp Team\" badge) unless they send `official` false; others sending `official` true get 403. A blocked member can't answer: 403."
      parameters: [{ $ref: "#/components/parameters/QuestionId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 10, maxLength: 20000 }
                official: { type: boolean, default: false }
      responses:
        "201": { description: Answered., content: { application/json: { schema: { $ref: "#/components/schemas/Answer" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/answers/{answer_id}:
    patch:
      tags: [Q&A]
      summary: Edit one's own answer
      parameters: [{ $ref: "#/components/parameters/AnswerId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 10, maxLength: 20000 } } }
      responses:
        "200": { description: The answer., content: { application/json: { schema: { $ref: "#/components/schemas/Answer" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      tags: [Q&A]
      summary: Delete one's own answer
      parameters: [{ $ref: "#/components/parameters/AnswerId" }]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /qa/answers/{answer_id}/vote:
    put:
      tags: [Q&A]
      summary: Vote on an answer
      parameters: [{ $ref: "#/components/parameters/AnswerId" }]
      requestBody: { $ref: "#/components/requestBodies/Vote" }
      responses:
        "200": { $ref: "#/components/responses/Voted" }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/answers/{answer_id}/accept:
    put:
      tags: [Q&A]
      summary: Accept the answer (the question's author)
      description: One accepted answer per question; accepting another moves it. The answer's author gets points (area C counts them).
      parameters: [{ $ref: "#/components/parameters/AnswerId" }]
      responses:
        "200": { description: The question., content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Q&A]
      summary: Un-accept the answer
      parameters: [{ $ref: "#/components/parameters/AnswerId" }]
      responses:
        "200": { description: The question., content: { application/json: { schema: { $ref: "#/components/schemas/Question" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /qa/answers/{answer_id}/replies:
    parameters: [{ $ref: "#/components/parameters/AnswerId" }]
    get:
      tags: [Q&A]
      summary: An answer's replies, oldest first
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: A page of replies.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Reply" } }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Q&A]
      summary: Reply to an answer
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        "201": { description: Replied., content: { application/json: { schema: { $ref: "#/components/schemas/Reply" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /qa/replies/{reply_id}:
    delete:
      tags: [Q&A]
      summary: Delete one's own reply
      parameters: [{ name: reply_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------------ Area B: Tutorials, search
  /tutorials/sections:
    get:
      tags: [Tutorials]
      summary: The tutorial sections
      security: [{}, { bearerAuth: [] }]
      responses:
        "200": { description: In order., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Section" } } } } } } }
  /tutorials:
    get:
      tags: [Tutorials]
      summary: Official tutorials
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: section, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [article, video] } }
        - { name: level, in: query, schema: { type: string, enum: [beginner, intermediate, advanced] } }
        - { name: language, in: query, schema: { $ref: "#/components/schemas/Language" } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TutorialSummary" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [Tutorials]
      summary: Publish an official tutorial (Yallapp's team; others get 403)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, summary, kind, section, level, language]
              properties:
                title: { type: string, minLength: 10, maxLength: 200 }
                summary: { type: string, minLength: 10, maxLength: 400 }
                kind: { type: string, enum: [article, video] }
                section: { type: string }
                level: { type: string, enum: [beginner, intermediate, advanced] }
                language: { $ref: "#/components/schemas/Language" }
                body: { type: string, description: "Markdown: the article, or a video's notes." }
                video_url: { type: string, description: "A video's address on YouTube, Vimeo or yallapp.com.tr." }
                duration_seconds: { type: integer, description: "A video's length." }
                cover_url: { type: string, format: uri }
                tags: { type: array, maxItems: 5, items: { type: string } }
      responses:
        "201": { description: Published., content: { application/json: { schema: { $ref: "#/components/schemas/Tutorial" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /tutorials/{tutorial}/bookmark:
    parameters: [{ name: tutorial, in: path, required: true, schema: { type: string }, description: "Its id or slug." }]
    put:
      tags: [Tutorials]
      summary: Save a tutorial
      responses:
        "204": { description: Saved. }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
    delete:
      tags: [Tutorials]
      summary: Unsave a tutorial
      responses:
        "204": { description: Unsaved. }
        "429": { $ref: "#/components/responses/TooMany" }
  /tutorials/{tutorial}:
    get:
      tags: [Tutorials]
      summary: A tutorial (by id or slug)
      description: "Reading it counts a view unless `view=0`."
      security: [{}, { bearerAuth: [] }]
      parameters: [{ name: tutorial, in: path, required: true, schema: { type: string } }, { name: view, in: query, schema: { type: string, enum: ["0", "1"], default: "1" } }]
      responses:
        "200": { description: The tutorial., content: { application/json: { schema: { $ref: "#/components/schemas/Tutorial" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /search:
    get:
      tags: [Search]
      summary: Search the community
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: type, in: query, schema: { type: string, enum: [all, questions, tutorials, members, tags], default: all } }
        - { name: section, in: query, schema: { type: string }, description: "Questions and tutorials in this section only." }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Results by kind.
          content:
            application/json:
              schema:
                type: object
                required: [questions, tutorials, members, tags]
                properties:
                  questions: { type: array, items: { $ref: "#/components/schemas/QuestionSummary" } }
                  tutorials: { type: array, items: { $ref: "#/components/schemas/TutorialSummary" } }
                  members: { type: array, items: { $ref: "#/components/schemas/MemberSummary" } }
                  tags: { type: array, items: { $ref: "#/components/schemas/Tag" } }

        "429": { $ref: "#/components/responses/TooMany" }
  # ------------------------------------------------------------ Area C: Badges
  /badges/verification:
    get:
      tags: [Badges]
      summary: The member's Gold verification state
      description: "`can_apply` is true with 5 or more apps on the linked Yallapp account (Studio Market templates count) and no pending request; the Apply button shows only then."
      responses:
        "200": { description: The state., content: { application/json: { schema: { $ref: "#/components/schemas/VerificationState" } } } }
    post:
      tags: [Badges]
      summary: Apply for Gold (Pro Developer)
      description: The apps come from the linked Yallapp account, not from the form. 403 `not_eligible` under 5 apps; 409 `already_pending`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [full_name, id_proof]
              properties:
                full_name: { type: string, maxLength: 120 }
                id_proof: { type: string, format: binary, description: "JPEG, PNG or PDF, at most 5 MB; private." }
                portfolio_links: { type: array, maxItems: 5, items: { type: string, format: uri } }
      responses:
        "201": { description: Sent., content: { application/json: { schema: { $ref: "#/components/schemas/VerificationState" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`already_pending`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } } }

  # ------------------------------------------------------------ Area C: Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: The member's notifications
      parameters: [{ name: unread, in: query, schema: { type: boolean } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, unread_count]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  next_cursor: { type: [string, "null"] }
                  unread_count: { type: integer }
  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark notifications read (the ones listed, or all)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: string } } } }
      responses:
        "204": { description: Marked. }
  /notifications/settings:
    get:
      tags: [Notifications]
      summary: Which notifications also come by email
      responses:
        "200": { description: The choices., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }
    put:
      tags: [Notifications]
      summary: Change which notifications also come by email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200": { description: The choices., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationSettings" } } } }

  # ------------------------------------------------------------ Area C: Admin
  /admin/verification-requests:
    get:
      tags: [Admin]
      summary: Gold verification requests
      parameters: [{ name: status, in: query, schema: { type: string, enum: [pending, approved, rejected], default: pending } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Oldest pending first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VerificationRequest" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/verification-requests/{request_id}:
    post:
      tags: [Admin]
      summary: Approve or reject a request (with a reason); the member is notified either way
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [approve, reject] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200": { description: Decided., content: { application/json: { schema: { $ref: "#/components/schemas/VerificationRequest" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/verification-requests/{request_id}/id-proof:
    get:
      tags: [Admin]
      summary: The request's ID proof (a short-lived private link)
      parameters: [{ $ref: "#/components/parameters/RequestId" }]
      responses:
        "200": { description: The link., content: { application/json: { schema: { type: object, required: [url, expires_at], properties: { url: { type: string, format: uri }, expires_at: { type: string, format: date-time } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/members:
    get:
      tags: [Admin]
      summary: Find members
      parameters: [{ name: q, in: query, schema: { type: string } }, { name: badge, in: query, schema: { $ref: "#/components/schemas/BadgeKind" } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { $ref: "#/components/responses/MemberPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/members/{member}/badges:
    get:
      tags: [Admin]
      summary: A member's badges, held and past, with their reasons
      parameters: [{ $ref: "#/components/parameters/Member" }]
      responses:
        "200": { description: The badges., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/BadgeGrant" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Grant a badge by hand
      description: Allowed even when the rules aren't met. The reason is private; the expiry optional. Written to the audit log.
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [badge, reason]
              properties:
                badge: { $ref: "#/components/schemas/BadgeKind" }
                reason: { type: string, minLength: 3, maxLength: 1000 }
                expires_at: { type: [string, "null"], format: date-time }
                company_name: { type: string, description: "Green only." }
                app_url: { type: string, format: uri, description: "Green only." }
      responses:
        "201": { description: Granted., content: { application/json: { schema: { $ref: "#/components/schemas/BadgeGrant" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/members/{member}/badges/{badge}:
    delete:
      tags: [Admin]
      summary: Revoke a badge, with a reason (written to the audit log)
      parameters: [{ $ref: "#/components/parameters/Member" }, { name: badge, in: path, required: true, schema: { $ref: "#/components/schemas/BadgeKind" } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } }
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{member}/status:
    put:
      tags: [Admin]
      summary: Suspend or restore a member (a suspension is a violation and signs them out)
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [active, suspended] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "204": { description: Changed. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/moderators:
    get:
      tags: [Admin]
      summary: The Community's moderators (admins only)
      description: "A Community admin is a member whose linked Yallapp account is a Yallapp platform admin (checked on every request). Admins make members moderators: the moderation queue and reports only, no badges or settings."
      responses:
        "200": { description: The moderators., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ModeratorGrant" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/moderators/{member}:
    put:
      tags: [Admin]
      summary: Make a member a moderator, with a reason (written to the audit log)
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } }
      responses:
        "200": { description: The moderators., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ModeratorGrant" } } } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: Take a member's moderator role away, with a reason (written to the audit log)
      parameters: [{ $ref: "#/components/parameters/Member" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } }
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/audit-log:
    get:
      tags: [Admin]
      summary: The audit log (who, when, why)
      parameters: [{ name: member, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/settings:
    get:
      tags: [Admin]
      summary: The community's settings
      responses:
        "200": { description: The settings., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Admin]
      summary: Change the community's settings (written to the audit log)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettings" }
      responses:
        "200": { description: The settings., content: { application/json: { schema: { $ref: "#/components/schemas/AdminSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/moderation:
    get:
      tags: [Admin]
      summary: The moderation queue
      parameters: [{ name: status, in: query, schema: { type: string, enum: [open, approved, removed], default: open } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Oldest open first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ModerationItem" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/moderation/{item_id}:
    post:
      tags: [Admin]
      summary: Approve or remove the content (removing records a violation)
      parameters: [{ name: item_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, remove] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Decided., content: { application/json: { schema: { $ref: "#/components/schemas/ModerationItem" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/reports:
    get:
      tags: [Admin]
      summary: Reports
      parameters: [{ name: status, in: query, schema: { type: string, enum: [open, actioned, dismissed], default: open } }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Oldest open first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Report" } }
                  next_cursor: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/reports/{report_id}:
    post:
      tags: [Admin]
      summary: Close a report (actioned or dismissed)
      parameters: [{ name: report_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [actioned, dismissed] }, note: { type: string } } }
      responses:
        "200": { description: Closed., content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ================================================================ Phases 2–5 (ROADMAP 232–235)
  # Every path below also answers under a client app's own community:
  # https://yallapp.com.tr/api/app/{app_id}/community/v1/… (the tenant key, see info).
  # `x-building: true`: in the contract, not served yet. Each area drops it
  # as it builds the operation; none is left when phases 2–5 ship.

  # ------------------------------------------------------------ Area A: Messages (232.4)
  /messages/conversations:
    get:
      x-building: true
      tags: [Messages]
      summary: The member's conversations, latest message first
      description: Polled by the website (every 15 s while open) and the app (with push). Blocked members' one-to-one conversations are left out.
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/ConversationPage" } } } }
    post:
      x-building: true
      tags: [Messages]
      summary: Start a conversation
      description: |
        One other member: their one-to-one conversation (the existing one when
        there is one, 200; a new one, 201). Two to 9 others: a new small group
        chat (up to 10 people with the creator), with an optional title. Never
        with a member either side blocked (400 `not_allowed`). A member who
        isn't followed back may still be written to; limits: 20 new
        conversations a day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                member_ids: { type: array, minItems: 1, maxItems: 9, items: { type: string } }
                title: { type: string, maxLength: 80 }
                body: { type: string, maxLength: 4000, description: "A first message, sent at once." }
      responses:
        "200": { description: The existing one-to-one conversation., content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "201": { description: A new conversation., content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "429": { $ref: "#/components/responses/TooMany" }
  /messages/unread:
    get:
      x-building: true
      tags: [Messages]
      summary: How many conversations have unread messages (the inbox badge; cheap to poll)
      responses:
        "200": { description: The count., content: { application/json: { schema: { type: object, required: [conversations], properties: { conversations: { type: integer } } } } } }
  /messages/conversations/{conversation_id}:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      x-building: true
      tags: [Messages]
      summary: One conversation (its people and read state)
      responses:
        "200": { description: The conversation., content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      x-building: true
      tags: [Messages]
      summary: Rename a group chat (any of its members)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { title: { type: string, maxLength: 80 }, muted: { type: boolean, description: "For oneself only: no push for it." } } } } } }
      responses:
        "200": { description: The conversation., content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
  /messages/conversations/{conversation_id}/members:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      x-building: true
      tags: [Messages]
      summary: Add people to a group chat (up to 10 in all)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [member_ids], properties: { member_ids: { type: array, minItems: 1, maxItems: 9, items: { type: string } } } } } } }
      responses:
        "200": { description: The conversation., content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/NotAllowed" }
  /messages/conversations/{conversation_id}/members/me:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    delete:
      x-building: true
      tags: [Messages]
      summary: Leave a group chat, or hide a one-to-one conversation until its next message
      responses:
        "204": { description: Left. }
  /messages/conversations/{conversation_id}/messages:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      x-building: true
      tags: [Messages]
      summary: Messages, newest first; with `after`, only those newer than it (polling)
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: after, in: query, description: "A message id: only messages after it, oldest first.", schema: { type: string } }
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/MessagePage" } } } }
    post:
      x-building: true
      tags: [Messages]
      summary: Send a message (text, up to 4 photos, a reply to one message)
      description: JSON for text only; multipart (`body`, `reply_to_id`, `photos` up to 4, JPEG/PNG/WebP, 5 MB each) with photos. Refused (400 `not_allowed`) when the other member of a one-to-one conversation blocked or was blocked. 60 messages a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 4000 }, reply_to_id: { type: [string, "null"] } } }
          multipart/form-data:
            schema: { type: object, properties: { body: { type: string, maxLength: 4000 }, reply_to_id: { type: string }, photos: { type: array, maxItems: 4, items: { type: string, format: binary } } } }
      responses:
        "201": { description: Sent., content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/NotAllowed" }
        "429": { $ref: "#/components/responses/TooMany" }
  /messages/conversations/{conversation_id}/messages/{message_id}:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }, { name: message_id, in: path, required: true, schema: { type: string } }]
    delete:
      x-building: true
      tags: [Messages]
      summary: Delete one's own message (shows as deleted for everyone)
      responses:
        "204": { description: Deleted. }
  /messages/conversations/{conversation_id}/read:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      x-building: true
      tags: [Messages]
      summary: Mark read up to a message (the newest when none is given)
      requestBody: { content: { application/json: { schema: { type: object, properties: { message_id: { type: string } } } } } }
      responses:
        "204": { description: Read. }
  /messages/conversations/{conversation_id}/report:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      x-building: true
      tags: [Messages]
      summary: Report a conversation to the moderators (they see its last 50 messages)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { $ref: "#/components/schemas/ReportReason" }, note: { type: string, maxLength: 500 } } } } } }
      responses:
        "201": { description: Reported. }
        "409": { description: "`already_reported`." }

  # ------------------------------------------------------------ Area A: Groups (232.5)
  /groups:
    get:
      x-building: true
      tags: [Groups]
      summary: Groups, most active first; `mine` for the member's own ("My groups" in the side menu)
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: mine, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: A page., content: { application/json: { schema: { $ref: "#/components/schemas/GroupPage" } } } }
    post:
      x-building: true
      tags: [Groups]
      summary: Create a group
      description: Who may follows the admin setting `groups_create_policy` (everyone, badge holders, or chosen members; 403 `not_allowed` otherwise). The creator is its owner. A new member's group waits for review like their first posts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /groups/{group}:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    get:
      x-building: true
      tags: [Groups]
      summary: A group's page (a private group shows its name, description and counts to everyone; its posts to members)
      security: [{ bearerAuth: [] }, {}]
      responses:
        "200": { description: The group., content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      x-building: true
      tags: [Groups]
      summary: Change a group (its owner or moderators)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInput" } } } }
      responses:
        "200": { description: The group., content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      x-building: true
      tags: [Groups]
      summary: Delete a group (its owner, or a community admin)
      responses:
        "204": { description: Deleted. }
  /groups/{group}/cover:
    parameters: [{ $ref: "#/components/parameters/Group" }]
    put:
      x-building: true
