name: Yallapp Courier release

# 104.8.6 Yallapp Courier (mobile/ with mobile/config/yallapp-courier.json) to Google Play and
# the App Store under Yallapp's own accounts, as Yallapp Business's release does
# (business-release.yml). Run it from Actions › "Yallapp Courier release" › Run workflow. It
# builds the signed App Bundle and IPA, uploads them to a Google Play testing track and to
# TestFlight with the store listings, screenshots and images, and never publishes: production
# on Google Play and "Add for Review" on the App Store stay a click in the consoles.
#
# Secrets and variables: docs/publishing/yallapp-courier.md › Releasing. Google Play and the
# App Store sign in with Yallapp Business's (YB_GCP_*, YB_PLAY_*, YB_ASC_*): the same accounts.
# A store whose secrets are missing is skipped and the run's summary says what to add. Secrets
# are only written to $RUNNER_TEMP and deleted.

on:
  workflow_dispatch:
    inputs:
      stores:
        description: Which stores
        type: choice
        options: [both, android, ios]
        default: both
      track:
        description: Google Play track (production is promoted in Play Console)
        type: choice
        options: [internal, alpha, beta]
        default: internal
      version:
        description: Version name, like 1.0.1 (empty = version_name in mobile/config/yallapp-courier.json). A new one is needed once a version is live on the App Store.
        type: string
        required: false
        default: ''
      play_check:
        description: Only check the Google Play sign-in (Workload Identity Federation); builds and uploads nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: courier-release
  cancel-in-progress: false

env:
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
  FASTLANE_OPT_OUT_USAGE: '1'

jobs:
  prepare:
    name: Version and what's set up
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: mobile/config/yallapp-courier.json
          sparse-checkout-cone-mode: false
      - id: plan
        name: Version, build number and the secrets each store needs
        env:
          STORES: ${{ inputs.stores }}
          PLAY_CHECK: ${{ inputs.play_check }}
          TRACK: ${{ inputs.track }}
          VERSION_INPUT: ${{ inputs.version }}
          OFFSET: ${{ vars.YC_BUILD_NUMBER_OFFSET }}
          # Only whether each one is set, never its value.
          HAS_YC_ANDROID_UPLOAD_KEYSTORE: ${{ secrets.YC_ANDROID_UPLOAD_KEYSTORE != '' }}
          HAS_YC_SECRETS_TOKEN: ${{ secrets.YC_SECRETS_TOKEN != '' || secrets.YB_SECRETS_TOKEN != '' }}
          HAS_YC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YC_ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_YC_ANDROID_KEY_ALIAS: ${{ secrets.YC_ANDROID_KEY_ALIAS != '' }}
          HAS_YC_ANDROID_KEY_PASSWORD: ${{ secrets.YC_ANDROID_KEY_PASSWORD != '' }}
          HAS_YB_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_YB_PLAY_SERVICE_ACCOUNT: ${{ vars.YB_PLAY_SERVICE_ACCOUNT != '' }}
          HAS_YB_ASC_KEY_ID: ${{ secrets.YB_ASC_KEY_ID != '' }}
          HAS_YB_ASC_ISSUER_ID: ${{ secrets.YB_ASC_ISSUER_ID != '' }}
          HAS_YB_ASC_PRIVATE_KEY: ${{ secrets.YB_ASC_PRIVATE_KEY != '' }}
          HAS_YB_IOS_DISTRIBUTION_P12: ${{ secrets.YB_IOS_DISTRIBUTION_P12 != '' }}
          HAS_YC_APP_REVIEW_DEMO_USER: ${{ secrets.YC_APP_REVIEW_DEMO_USER != '' }}
          HAS_YC_APP_REVIEW_DEMO_PASSWORD: ${{ secrets.YC_APP_REVIEW_DEMO_PASSWORD != '' }}
          HAS_YC_APP_REVIEW_FIRST_NAME: ${{ vars.YC_APP_REVIEW_FIRST_NAME != '' || vars.YB_APP_REVIEW_FIRST_NAME != '' }}
          HAS_YC_APP_REVIEW_LAST_NAME: ${{ vars.YC_APP_REVIEW_LAST_NAME != '' || vars.YB_APP_REVIEW_LAST_NAME != '' }}
          HAS_YC_APP_REVIEW_PHONE: ${{ vars.YC_APP_REVIEW_PHONE != '' || vars.YB_APP_REVIEW_PHONE != '' }}
          HAS_YC_FIREBASE_GOOGLE_SERVICES: ${{ vars.YC_FIREBASE_GOOGLE_SERVICES != '' }}
          HAS_YC_FIREBASE_SERVICE_INFO: ${{ vars.YC_FIREBASE_SERVICE_INFO != '' }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version=$(python3 -c 'import json; print(json.load(open("mobile/config/yallapp-courier.json"))["version_name"])')
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.0.1, not \"$version\"."
            echo "The version must look like 1.0.1 (three numbers with dots)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Google Play and the App Store need a build number that only goes up: this
          # workflow's run number, with room for re-runs of the same run.
          attempt=$(( GITHUB_RUN_ATTEMPT > 9 ? 9 : GITHUB_RUN_ATTEMPT ))
          build=$(( ${OFFSET:-0} + GITHUB_RUN_NUMBER * 10 + attempt ))

          set_or_missing() { for name in "$@"; do v="HAS_$name"; if [ "${!v}" = true ]; then echo "| \`$name\` | set |"; else echo "| \`$name\` | **missing** |"; fi; done; }
          all_set() { for name in "$@"; do v="HAS_$name"; [ "${!v}" = true ] || return 1; done; }

          android=no; ios=no
          if [ "$PLAY_CHECK" = true ]; then STORES=none; fi
          if [ "$STORES" != ios ] && [ "$STORES" != none ]; then android=yes; fi
          if [ "$STORES" != android ] && [ "$STORES" != none ]; then
            if all_set YB_ASC_KEY_ID YB_ASC_ISSUER_ID YB_ASC_PRIVATE_KEY; then ios=yes; else ios=missing; fi
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "android=$android"
            echo "ios=$([ "$ios" = yes ] && echo yes || echo no)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Yallapp Courier $version (build $build)"
            echo
            if [ "$PLAY_CHECK" = true ]; then
              echo "**Only checking the Google Play sign-in**: nothing is built or uploaded."
            else
              echo "Stores: **$STORES**. Google Play track: **$TRACK**."
            fi
            echo
            if [ "$android" = yes ]; then
              echo "### Google Play"
              echo
              echo "| Secret or variable | |"
              echo "|---|---|"
              set_or_missing YC_ANDROID_UPLOAD_KEYSTORE YC_ANDROID_KEYSTORE_PASSWORD YC_ANDROID_KEY_ALIAS YC_ANDROID_KEY_PASSWORD YB_GCP_WORKLOAD_IDENTITY_PROVIDER YB_PLAY_SERVICE_ACCOUNT YC_FIREBASE_GOOGLE_SERVICES
              echo
              if ! all_set YC_ANDROID_UPLOAD_KEYSTORE YC_ANDROID_KEYSTORE_PASSWORD && all_set YC_SECRETS_TOKEN; then
                echo "**First run**: the upload key is made in this run and saved as the four \`YC_ANDROID_*\` secrets with \`YC_SECRETS_TOKEN\` (or \`YB_SECRETS_TOKEN\`)."
              elif ! all_set YC_ANDROID_UPLOAD_KEYSTORE YC_ANDROID_KEYSTORE_PASSWORD; then
                echo "**No upload key**: the Android part stops until \`YC_SECRETS_TOKEN\` is added (the run then makes the key), or \`YC_ANDROID_UPLOAD_KEYSTORE\`, \`YC_ANDROID_KEYSTORE_PASSWORD\`, \`YC_ANDROID_KEY_ALIAS\` and \`YC_ANDROID_KEY_PASSWORD\`."
              fi
              if ! all_set YB_GCP_WORKLOAD_IDENTITY_PROVIDER YB_PLAY_SERVICE_ACCOUNT; then
                echo "Without the variables \`YB_GCP_WORKLOAD_IDENTITY_PROVIDER\` and \`YB_PLAY_SERVICE_ACCOUNT\` (Google Play sign-in through Workload Identity Federation) the App Bundle is built and put on the \"Yallapp Courier test build\" pre-release as **yallapp-courier.aab** (and attached to this run) but not uploaded to Google Play."
              fi
              if ! all_set YC_FIREBASE_GOOGLE_SERVICES; then
                echo "No \`YC_FIREBASE_GOOGLE_SERVICES\`: the Android app is built **without notifications**."
              fi
              echo
            fi
            if [ "$STORES" != android ] && [ "$STORES" != none ]; then
              echo "### App Store"
              echo
              echo "| Secret or variable | |"
              echo "|---|---|"
              set_or_missing YB_ASC_KEY_ID YB_ASC_ISSUER_ID YB_ASC_PRIVATE_KEY YB_IOS_DISTRIBUTION_P12 YC_APP_REVIEW_DEMO_USER YC_APP_REVIEW_DEMO_PASSWORD YC_APP_REVIEW_FIRST_NAME YC_APP_REVIEW_LAST_NAME YC_APP_REVIEW_PHONE YC_FIREBASE_SERVICE_INFO
              echo
              echo "App Review's contact (\`YC_APP_REVIEW_FIRST_NAME\`, \`_LAST_NAME\`, \`_PHONE\`, \`_EMAIL\`) falls back to Yallapp Business's \`YB_APP_REVIEW_*\` variables."
              if [ "$ios" = missing ]; then
                echo "**The iOS app is skipped**: add the App Store Connect key as \`YB_ASC_KEY_ID\`, \`YB_ASC_ISSUER_ID\` and \`YB_ASC_PRIVATE_KEY\` (docs/LAUNCH-CHECKLIST.md 7l)."
              fi
              if ! all_set YB_IOS_DISTRIBUTION_P12; then
                echo "No \`YB_IOS_DISTRIBUTION_P12\`: a distribution certificate is made for this run and kept for the build it signs; when Apple's limit is reached, the oldest one made over 30 days ago is revoked first (nothing to do)."
              fi
              if ! all_set YC_FIREBASE_SERVICE_INFO; then
                echo "No \`YC_FIREBASE_SERVICE_INFO\`: the iOS app is built **without notifications**."
              fi
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The listing's screenshots, drawn from sample companies and jobs in English, Arabic and
  # Turkish (mobile/test/store/courier_store_screenshots_test.dart).
  screenshots:
    name: Store screenshots
    if: ${{ !inputs.play_check }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        run: flutter pub get --enforce-lockfile
      - name: Draw the screenshots
        run: YC_SCREENSHOTS_DIR="$RUNNER_TEMP/screenshots" flutter test test/store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courier-store-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 14

  # Google Play signs in without a key file, as Yallapp Business's release does: GitHub's OIDC
  # token through the Workload Identity Federation provider for the release service account.
  play-check:
    name: Google Play sign-in
    needs: prepare
    if: ${{ inputs.play_check }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The two variables
        env:
          WIF_PROVIDER: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_ACCOUNT: ${{ vars.YB_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$PLAY_ACCOUNT" ]; then
            echo "Add the repository variables \`YB_GCP_WORKLOAD_IDENTITY_PROVIDER\` and \`YB_PLAY_SERVICE_ACCOUNT\` (docs/LAUNCH-CHECKLIST.md 7l), then run this check again." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.YB_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - name: Sign in to Google Play and open the app
        working-directory: build
        env:
          CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: bundle exec fastlane android business_play_check app:courier json_key:"$CREDENTIALS" summary:"$GITHUB_STEP_SUMMARY"

  android:
    name: Google Play
    needs: [prepare, screenshots]
    # The App Bundle comes first: it is built even when the screenshots couldn't be drawn.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.android == 'yes' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # Puts the App Bundle on the "Yallapp Courier test build" pre-release (below), and
    # signs in to Google Play with GitHub's OIDC token (Workload Identity Federation).
    permissions:
      contents: write
      id-token: write
    env:
      LC_ALL: C.UTF-8
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      # Yallapp Courier's build config with this version and its Firebase file
      # (YC_FIREBASE_GOOGLE_SERVICES, written to the runner), applied to mobile/.
      - name: Build config and Firebase file
        env:
          YC_FIREBASE_GOOGLE_SERVICES: ${{ vars.YC_FIREBASE_GOOGLE_SERVICES }}
        run: |
          python3 - mobile/config/yallapp-courier.json "$RUNNER_TEMP/yc-versioned.json" <<'PY'
          import json, os, sys
          config = json.load(open(sys.argv[1]))
          config["version_name"], config["version_code"] = os.environ["VERSION"], int(os.environ["BUILD"])
          json.dump(config, open(sys.argv[2], "w"), indent=2)
          PY
          python3 build/scripts/business_store.py --app courier firebase android \
            "$RUNNER_TEMP/yc-versioned.json" "$RUNNER_TEMP/yc-firebase" "$RUNNER_TEMP/yc-config.json" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! grep -q '"firebase"' "$RUNNER_TEMP/yc-config.json"; then
            echo "- **No notifications in this Android build**: \`YC_FIREBASE_GOOGLE_SERVICES\` is empty." >> "$GITHUB_STEP_SUMMARY"
          fi
          cd mobile && dart run tool/apply_config.dart "$RUNNER_TEMP/yc-config.json"

      # The upload key from the four YC_ANDROID_* secrets. The repository is public: the key
      # is only written to $RUNNER_TEMP, never printed nor attached, and deleted below.
      # On the first run, without those secrets but with YC_SECRETS_TOKEN (or YB_SECRETS_TOKEN:
      # a fine-grained token allowed to write this repository's secrets), the key is made here
      # and saved as the four secrets, so nobody ever holds it. Lost later? Play Console can
      # reset an upload key (Play App Signing).
      - id: key
        name: Upload key
        env:
          SECRETS_TOKEN: ${{ secrets.YC_SECRETS_TOKEN || secrets.YB_SECRETS_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.YC_ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.YC_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YC_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YC_ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/yc-upload.jks"
          # Pasted values may end with a line break; the alias has no spaces.
          trim_end() { local v="$1"; while [[ "$v" == *$'\n' || "$v" == *$'\r' ]]; do v="${v%?}"; done; printf '%s' "$v"; }
          STORE_PASSWORD=$(trim_end "$STORE_PASSWORD")
          KEY_PASSWORD=$(trim_end "$KEY_PASSWORD")
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          if [ -z "$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')" ] && [ -n "$SECRETS_TOKEN" ]; then
            echo "::add-mask::$SECRETS_TOKEN"
            STORE_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$STORE_PASSWORD"
            KEY_PASSWORD=$STORE_PASSWORD
            KEY_ALIAS=upload
            rm -f "$keystore"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Yallapp Courier, O=Yallapp, C=TR" > /dev/null 2>&1
            KEYSTORE_BASE64=$(base64 -w0 "$keystore")
            # Values go to gh on stdin, never on the command line.
            save() { printf '%s' "$2" | GH_TOKEN="$SECRETS_TOKEN" gh secret set "$1" -R "$GITHUB_REPOSITORY" > /dev/null; }
            if ! { save YC_ANDROID_UPLOAD_KEYSTORE "$KEYSTORE_BASE64" &&
                   save YC_ANDROID_KEYSTORE_PASSWORD "$STORE_PASSWORD" &&
                   save YC_ANDROID_KEY_ALIAS "$KEY_ALIAS" &&
                   save YC_ANDROID_KEY_PASSWORD "$KEY_PASSWORD"; }; then
              rm -f "$keystore"
              echo "The secrets token can't save repository secrets: it needs this repository and the permission Secrets: Read and write. Nothing was signed; fix the token and run the workflow again." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "A new upload key was made and saved as the four \`YC_ANDROID_*\` secrets. \`YC_SECRETS_TOKEN\` isn't needed any more: delete it (Settings › Secrets and variables › Actions) and the token itself on GitHub." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')" ] || [ -z "$STORE_PASSWORD" ]; then
            {
              echo "### Google Play: no upload key"
              echo
              echo "The App Bundle is signed with Yallapp Courier's upload key. Either add \`YC_SECRETS_TOKEN\` (a fine-grained token for this repository with Secrets: Read and write; the next run makes the key and saves it, docs/publishing/yallapp-courier.md › Releasing) or add these repository secrets (Settings › Secrets and variables › Actions), then run the workflow again:"
              echo
              echo "- \`YC_ANDROID_UPLOAD_KEYSTORE\`: the PKCS12 keystore file in base64 (line breaks are fine)"
              echo "- \`YC_ANDROID_KEYSTORE_PASSWORD\`: its password"
              echo "- \`YC_ANDROID_KEY_ALIAS\`: \`upload\`"
              echo "- \`YC_ANDROID_KEY_PASSWORD\`: the key's password (the same as the keystore's)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No upload key: add the YC_ANDROID_* secrets (see the run's summary)."
            exit 1
          fi
          KEY_ALIAS=${KEY_ALIAS:-upload}
          KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          # base64 with or without line breaks and spaces.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null || true
          if ! keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "The upload key can't be opened: YC_ANDROID_UPLOAD_KEYSTORE must be the keystore file in base64, with the YC_ANDROID_KEYSTORE_PASSWORD and YC_ANDROID_KEY_ALIAS (upload) that go with it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The upload certificate's SHA-256 fingerprint is public (Play Console shows it).
          sha256=$(keytool -exportcert -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | python3 build/scripts/fingerprint.py || true)
          echo "Upload certificate SHA-256: \`${sha256:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > mobile/android/key.properties

      - id: build
        name: Build the App Bundle
        working-directory: mobile
        run: |
          flutter build appbundle --release --build-name="$VERSION" --build-number="$BUILD"
          mkdir -p "$RUNNER_TEMP/out"
          mv build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/yallapp-courier-$VERSION-$BUILD.aab"

      - name: Remove the upload key from the runner
        if: always()
        run: rm -f mobile/android/key.properties "$RUNNER_TEMP/yc-upload.jks"

      - name: Attach the App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-courier-aab
          path: ${{ runner.temp }}/out/*.aab
          if-no-files-found: error
          retention-days: 30

      # The same App Bundle on its own pre-release, with a plain link, for the first upload by
      # hand in Play Console (and whenever the upload below can't run). Replaced by every run.
      - name: Publish the App Bundle on the "Yallapp Courier test build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yallapp-courier-test
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Yallapp Courier test build" \
              --notes "yallapp-courier.aab is Yallapp Courier's release App Bundle signed with its upload key, from the Yallapp Courier release workflow, for Google Play. Replaced by every run. The Mobile workflow's debug APK (artifact yallapp-courier-debug-apk) is the one to try on a phone."
          fi
          cp "$RUNNER_TEMP"/out/*.aab "$RUNNER_TEMP/yallapp-courier.aab"
          gh release upload "$tag" "$RUNNER_TEMP/yallapp-courier.aab" -R "$GITHUB_REPOSITORY" --clobber
          echo "- App Bundle $VERSION (build $BUILD): **yallapp-courier.aab** on the [Yallapp Courier test build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) pre-release." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: courier-store-screenshots
          path: ${{ runner.temp }}/screenshots

      - name: Store listing, icon, feature graphic and screenshots
        run: python3 build/scripts/business_store.py --app courier play "$RUNNER_TEMP/play-metadata" "$RUNNER_TEMP/screenshots"

      # No key file: GitHub's OIDC token through Workload Identity Federation (play-check above).
      - id: auth
        if: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.YB_PLAY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.YB_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - id: play
        name: Upload to Google Play
        env:
          CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          if [ -z "$CREDENTIALS" ]; then
            echo "uploaded=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd build
          bundle exec fastlane android business_play app:courier \
            aab:"$(ls "$RUNNER_TEMP"/out/*.aab)" track:"$TRACK" \
            json_key:"$CREDENTIALS" metadata:"$RUNNER_TEMP/play-metadata"
          echo "uploaded=yes" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          KEY_OUTCOME: ${{ steps.key.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOADED: ${{ steps.play.outputs.uploaded }}
          PLAY_OUTCOME: ${{ steps.play.outcome }}
        run: |
          {
            echo "### Google Play"
            echo
            if [ "$KEY_OUTCOME" != success ]; then
              echo "- **No App Bundle**: the upload key is missing or can't be opened (above)."
            elif [ "$BUILD_OUTCOME" != success ]; then
              echo "- **The App Bundle couldn't be built.** The log of \"Build the App Bundle\" says why."
            elif [ "$UPLOADED" = yes ]; then
              echo "- Version $VERSION (build $BUILD) is on the **$TRACK** track with the store listing, icon, feature graphic and screenshots in English, Arabic and Turkish."
              echo "- To publish: Play Console › Yallapp Courier › Test and release › promote the release to Production."
            elif [ "$PLAY_OUTCOME" = failure ]; then
              echo "- **The upload to Google Play didn't work.** The App Bundle is on the \"Yallapp Courier test build\" pre-release as **yallapp-courier.aab** and attached below. Usual reasons: the app's first App Bundle wasn't uploaded by hand yet (Play Console › Yallapp Courier › Test and release › Testing › Internal testing › Create new release, with **yallapp-courier.aab**), the Google Play sign-in doesn't work (run the workflow with **play_check**), the service account isn't given this app in Play Console › Users and permissions with Release rights, or this App Bundle isn't signed with the app's upload key. The log of \"Upload to Google Play\" says which."
            else
              echo "- The App Bundle is on the \"Yallapp Courier test build\" pre-release as **yallapp-courier.aab** (and attached below). The first one goes by hand: Play Console › Yallapp Courier › Test and release › Testing › Internal testing › Create new release. With the variables \`YB_GCP_WORKLOAD_IDENTITY_PROVIDER\` and \`YB_PLAY_SERVICE_ACCOUNT\` the next ones upload by themselves."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: App Store
    needs: [prepare, screenshots]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.ios == 'yes' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Apple takes uploads built with the iOS 26 SDK: use the newest Xcode 26 on the runner.
      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Eiv 'beta|release_candidate' | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no Xcode 26."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.YB_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.YB_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.YB_ASC_PRIVATE_KEY }}
        run: |
          umask 077
          python3 - "$RUNNER_TEMP/yc-asc.json" <<'PY'
          import json, os, sys
          json.dump({"app_store_connect": {
              "key_id": os.environ["ASC_KEY_ID"].strip(),
              "issuer_id": os.environ["ASC_ISSUER_ID"].strip(),
              "private_key": os.environ["ASC_PRIVATE_KEY"],
          }}, open(sys.argv[1], "w"))
          PY
          if ! python3 build/scripts/p8_key.py "$RUNNER_TEMP/yc-asc.json"; then
            echo "The App Store Connect key in YB_ASC_PRIVATE_KEY can't be read. Paste the whole content of the .p8 file from App Store Connect › Users and Access › Integrations, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Yallapp Courier's build config with this version and its Firebase file
      # (YC_FIREBASE_SERVICE_INFO, written to the runner), applied to mobile/; then the iOS
      # project's settings. Signing happens in fastlane, as for Yallapp Business.
      - name: Prepare the iOS project
        env:
          YC_FIREBASE_SERVICE_INFO: ${{ vars.YC_FIREBASE_SERVICE_INFO }}
        run: |
          python3 - mobile/config/yallapp-courier.json "$RUNNER_TEMP/yc-versioned.json" <<'PY'
          import json, os, sys
          config = json.load(open(sys.argv[1]))
          config["version_name"], config["version_code"] = os.environ["VERSION"], int(os.environ["BUILD"])
          json.dump(config, open(sys.argv[2], "w"), indent=2)
          PY
          python3 build/scripts/business_store.py --app courier firebase ios \
            "$RUNNER_TEMP/yc-versioned.json" "$RUNNER_TEMP/yc-firebase" "$RUNNER_TEMP/yc-config.json" | tee -a "$GITHUB_STEP_SUMMARY"
          # Without the file (no iOS app in Firebase yet) the app is built without pushes.
          push=$(python3 -c 'import json,sys; print("true" if "firebase" in json.load(open(sys.argv[1])) else "false")' "$RUNNER_TEMP/yc-config.json")
          echo "YC_PUSH=$push" >> "$GITHUB_ENV"
          if [ "$push" = false ]; then
            echo "- **No notifications in this iOS build**: \`YC_FIREBASE_SERVICE_INFO\` is empty. Register the iOS app \`tr.com.yallapp.courier\` in the Firebase project and paste its GoogleService-Info.plist into that variable, then run the workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi
          cd mobile
          dart run tool/apply_config.dart "$RUNNER_TEMP/yc-config.json"
          flutter build ios --release --config-only --no-codesign --build-name="$VERSION" --build-number="$BUILD"

      - name: Sign and export the IPA
        working-directory: build
        env:
          YB_IOS_DISTRIBUTION_P12: ${{ secrets.YB_IOS_DISTRIBUTION_P12 }}
          YB_IOS_DISTRIBUTION_PASSWORD: ${{ secrets.YB_IOS_DISTRIBUTION_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"
          bundle exec fastlane ios business_ipa app:courier push:"$YC_PUSH" \
            asc:"$RUNNER_TEMP/yc-asc.json" project:"$GITHUB_WORKSPACE/mobile" \
            out:"$RUNNER_TEMP/ipa" status:"$RUNNER_TEMP/yc-ios-status.txt" cert_out:"$RUNNER_TEMP/yc-cert-id.txt"
          mv "$RUNNER_TEMP/ipa/YallappCourier.ipa" "$RUNNER_TEMP/ipa/yallapp-courier-$VERSION-$BUILD.ipa"
          rm -f "$RUNNER_TEMP"/ipa/*.mobileprovision "$RUNNER_TEMP"/ipa/*.cer "$RUNNER_TEMP"/ipa/*.p12

      - name: Attach the IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-courier-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        working-directory: build
        run: |
          bundle exec fastlane ios business_testflight \
            asc:"$RUNNER_TEMP/yc-asc.json" ipa:"$RUNNER_TEMP/ipa/yallapp-courier-$VERSION-$BUILD.ipa"
          # The build is Apple's now: its certificate must stay valid until the build is
          # approved, since App Review checks the signature again when it is submitted.
          touch "$RUNNER_TEMP/yc-uploaded"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: courier-store-screenshots
          path: ${{ runner.temp }}/screenshots

      - name: App Store listing
        env:
          YC_APP_REVIEW_FIRST_NAME: ${{ vars.YC_APP_REVIEW_FIRST_NAME }}
          YC_APP_REVIEW_LAST_NAME: ${{ vars.YC_APP_REVIEW_LAST_NAME }}
          YC_APP_REVIEW_PHONE: ${{ vars.YC_APP_REVIEW_PHONE }}
          YC_APP_REVIEW_EMAIL: ${{ vars.YC_APP_REVIEW_EMAIL }}
          YB_APP_REVIEW_FIRST_NAME: ${{ vars.YB_APP_REVIEW_FIRST_NAME }}
          YB_APP_REVIEW_LAST_NAME: ${{ vars.YB_APP_REVIEW_LAST_NAME }}
          YB_APP_REVIEW_PHONE: ${{ vars.YB_APP_REVIEW_PHONE }}
          YB_APP_REVIEW_EMAIL: ${{ vars.YB_APP_REVIEW_EMAIL }}
          YC_APP_REVIEW_DEMO_USER: ${{ secrets.YC_APP_REVIEW_DEMO_USER }}
          YC_APP_REVIEW_DEMO_PASSWORD: ${{ secrets.YC_APP_REVIEW_DEMO_PASSWORD }}
        run: |
          python3 build/scripts/business_store.py --app courier appstore "$RUNNER_TEMP/asc-store" "$RUNNER_TEMP/screenshots"
          cd build
          bundle exec fastlane ios business_appstore app:courier \
            asc:"$RUNNER_TEMP/yc-asc.json" store:"$RUNNER_TEMP/asc-store" version:"$VERSION" build:"$BUILD"

      # The certificate made for this run (none with YB_IOS_DISTRIBUTION_P12), only when the
      # run stopped before the upload: one that signed an uploaded build is kept.
      - name: Revoke this run's unused certificate
        if: always()
        working-directory: build
        run: |
          if [ ! -f "$RUNNER_TEMP/yc-uploaded" ] && [ -s "$RUNNER_TEMP/yc-cert-id.txt" ] && [ -f "$RUNNER_TEMP/yc-asc.json" ]; then
            bundle exec fastlane ios business_revoke asc:"$RUNNER_TEMP/yc-asc.json" cert_file:"$RUNNER_TEMP/yc-cert-id.txt"
          fi
      - name: Remove the keys from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/yc-asc.json" "$RUNNER_TEMP/asc-store/review.json" "$RUNNER_TEMP/yc-cert-id.txt"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          status=$(cat "$RUNNER_TEMP/yc-ios-status.txt" 2>/dev/null || true)
          {
            echo "### App Store"
            echo
            case "$status" in
              no_app)
                echo "- **The app doesn't exist in App Store Connect yet.** The App ID \`tr.com.yallapp.courier\` is registered now: in App Store Connect › Apps › + › New App choose iOS, the name Yallapp Courier, a primary language (English (U.S.)), the bundle ID **tr.com.yallapp.courier** and the SKU \`yallapp-courier\`, then run this workflow again." ;;
              certificate_limit)
                echo "- **Apple's limit of distribution certificates is reached** and every one was made in the last 30 days. In developer.apple.com › Certificates, revoke a Distribution certificate whose builds are already approved or no longer wanted, then run this workflow again." ;;
              *)
                if [ "$OUTCOME" = success ]; then
                  echo "- Version $VERSION (build $BUILD) is in TestFlight, with the listing, screenshots (iPhone and iPad) and age rating in English, Arabic and Turkish, and chosen for the version."
                  echo "- To publish: App Store Connect › Yallapp Courier › the version › Add for Review, then Submit to App Review."
                else
                  echo "- **The iOS app didn't go through.** The failed step's log says why. When the IPA was made it is attached below (**yallapp-courier-ipa**)."
                fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
