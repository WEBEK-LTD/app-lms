name: Platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/web/**'
      - 'docs/api/pipeline.yaml'
      - 'docs/build-config.schema.json'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'platform/web/**'
      - 'docs/api/pipeline.yaml'
      - 'docs/build-config.schema.json'
      - '.github/workflows/platform.yml'

# 69 A pull request from a fork runs on GitHub's runners, never on ours (see ci.yml).
permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      web: ${{ steps.files.outputs.web }}
      db: ${{ steps.files.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Files this push changed
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests check only what their latest push changed, to save
          # Actions minutes; main, new pull requests and force pushes check all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$HEAD")"
          else
            files=all
          fi
          printf '%s\n' "$files"
          match() { [ "$files" = all ] || grep -qE "$1" <<<"$files"; }
          {
            if match '^(platform/web/|docs/api/pipeline\.yaml$|docs/build-config\.schema\.json$|\.github/workflows/platform\.yml$)'; then echo web=true; else echo web=false; fi
            if match '^(platform/web/(drizzle/|src/lib/(data|db)/|scripts/migrate\.mjs$)|\.github/workflows/platform\.yml$)'; then echo db=true; else echo db=false; fi
          } >> "$GITHUB_OUTPUT"

  pipeline-contract:
    name: Pipeline API contract
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/api/pipeline.yaml
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/pipeline.yaml

  web:
    name: Lint, types, tests, build, e2e
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: platform/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/web/playwright-report
          retention-days: 7

  # Production runs MariaDB: every migration and the MySQL store are checked on it.
  mariadb:
    name: Migrations and e2e on MariaDB
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: yallapp
          MARIADB_USER: yallapp
          MARIADB_PASSWORD: yallapp-ci
          MARIADB_ROOT_PASSWORD: yallapp-ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: platform/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: mysql://yallapp:yallapp-ci@127.0.0.1:3306/yallapp
      DATABASE_SSL: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Apply the migrations, then again (must be a no-op)
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: A migration that stopped halfway finishes on the next run
        run: |
          # Forget the last migration as if its deploy stopped after its statements ran.
          node -e '
            const mysql = require("mysql2/promise");
            (async () => {
              const c = await mysql.createConnection(process.env.DATABASE_URL);
              await c.query("DELETE FROM `__drizzle_migrations` ORDER BY created_at DESC LIMIT 1");
              await c.end();
            })();
          '
          npm run db:migrate | tee "$RUNNER_TEMP/resume.log"
          grep -q "were already there" "$RUNNER_TEMP/resume.log"
          npm run db:migrate | grep -q "up to date"
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests on MariaDB
        run: E2E_DATABASE_URL="$DATABASE_URL" npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mariadb
          path: platform/web/playwright-report
          retention-days: 7
