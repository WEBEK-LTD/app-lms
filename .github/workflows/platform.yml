name: Platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/web/**'
      - 'docs/api/pipeline.yaml'
      - 'docs/build-config.schema.json'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'platform/web/**'
      - 'docs/api/pipeline.yaml'
      - 'docs/build-config.schema.json'
      - '.github/workflows/platform.yml'

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      web: ${{ steps.files.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Files this push changed
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests check only what their latest push changed, to save
          # Actions minutes; main, new pull requests and force pushes check all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$HEAD")"
          else
            files=all
          fi
          printf '%s\n' "$files"
          match() { [ "$files" = all ] || grep -qE "$1" <<<"$files"; }
          {
            if match '^(platform/web/|docs/api/pipeline\.yaml$|docs/build-config\.schema\.json$|\.github/workflows/platform\.yml$)'; then echo web=true; else echo web=false; fi
          } >> "$GITHUB_OUTPUT"

  pipeline-contract:
    name: Pipeline API contract
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/api/pipeline.yaml
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/pipeline.yaml

  web:
    name: Lint, types, tests, build, e2e
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: platform/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform/web/playwright-report
          retention-days: 7
