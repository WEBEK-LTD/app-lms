name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'platform/web/public/preview-app/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'platform/web/public/preview-app/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Files this push changed
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests check only what their latest push changed, to save
          # Actions minutes; main, new pull requests and force pushes check all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$HEAD")"
          else
            files=all
          fi
          printf '%s\n' "$files"
          match() { [ "$files" = all ] || grep -qE "$1" <<<"$files"; }
          {
            if match '^(mobile/|platform/web/public/preview-app/|\.github/workflows/mobile\.yml$)'; then echo app=true; else echo app=false; fi
          } >> "$GITHUB_OUTPUT"

  app:
    name: Flutter app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Apply the example build config
        run: dart run tool/apply_config.dart config/example.json

      - name: Generated files are committed and up to date
        run: git diff --exit-code -- .

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 17 The app preview: the web build the platform serves at /preview-app/.
      - name: App preview is up to date
        run: tool/build_preview.sh --check

      - name: Build the app preview (web)
        run: flutter build web --release --base-href /preview-app/ --no-wasm-dry-run

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Store app
        run: |
          jq '.app_type = "store"' config/example.json > "$RUNNER_TEMP/store.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/store.json"
          grep -q 'appType: AppType.store' lib/generated/build_config.g.dart

      - name: Build Store debug APK
        run: flutter build apk --debug

      - name: Upload Store debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-store-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Bookings app
        run: |
          jq '.app_type = "booking"' config/example.json > "$RUNNER_TEMP/booking.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/booking.json"
          grep -q 'appType: AppType.booking' lib/generated/build_config.g.dart

      - name: Build Bookings debug APK
        run: flutter build apk --debug

      - name: Upload Bookings debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-booking-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Real estate app
        run: |
          jq '.app_type = "real_estate"' config/example.json > "$RUNNER_TEMP/real_estate.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/real_estate.json"
          grep -q 'appType: AppType.realEstate' lib/generated/build_config.g.dart

      - name: Build Real estate debug APK
        run: flutter build apk --debug

      - name: Upload Real estate debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-real-estate-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a News & blog app
        run: |
          jq '.app_type = "news"' config/example.json > "$RUNNER_TEMP/news.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/news.json"
          grep -q 'appType: AppType.news' lib/generated/build_config.g.dart

      - name: Build News & blog debug APK
        run: flutter build apk --debug

      - name: Upload News & blog debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-news-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as an Events & tickets app
        run: |
          jq '.app_type = "events"' config/example.json > "$RUNNER_TEMP/events.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/events.json"
          grep -q 'appType: AppType.events' lib/generated/build_config.g.dart

      - name: Build Events & tickets debug APK
        run: flutter build apk --debug

      - name: Upload Events & tickets debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-events-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Charity & donations app
        run: |
          jq '.app_type = "donations" | .vertical = "charity"' config/example.json > "$RUNNER_TEMP/donations.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/donations.json"
          grep -q 'appType: AppType.donations' lib/generated/build_config.g.dart

      - name: Build Charity & donations debug APK
        run: flutter build apk --debug

      - name: Upload Charity & donations debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-donations-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # 36 A build with an agconnect-services.json includes Huawei push
      # (android/hms_push); the ones above, without it, have nothing from Huawei.
      - name: Build a debug APK with Huawei push
        run: |
          cp config/example-agconnect-services.json android/app/agconnect-services.json
          flutter build apk --debug
          rm android/app/agconnect-services.json
