name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'business/**'
      - 'build/scripts/business_store.py'
      - 'platform/web/public/preview-app/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'business/**'
      - 'build/scripts/business_store.py'
      - 'platform/web/public/preview-app/**'
      - '.github/workflows/mobile.yml'

# 69 A pull request from a fork runs on GitHub's runners, never on ours (see ci.yml).
permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      app: ${{ steps.files.outputs.app }}
      business: ${{ steps.files.outputs.business }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: files
        name: Files this push changed
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests check only what their latest push changed, to save
          # Actions minutes; main, new pull requests and force pushes check all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$HEAD")"
          else
            files=all
          fi
          printf '%s\n' "$files"
          match() { [ "$files" = all ] || grep -qE "$1" <<<"$files"; }
          {
            if match '^(mobile/|platform/web/public/preview-app/|\.github/workflows/mobile\.yml$)'; then echo app=true; else echo app=false; fi
            # 59 Yallapp Business, the owners' app.
            if match '^(business/|build/scripts/business_store\.py$|\.github/workflows/mobile\.yml$)'; then echo business=true; else echo business=false; fi
          } >> "$GITHUB_OUTPUT"

  app:
    name: Flutter app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Apply the example build config
        run: dart run tool/apply_config.dart config/example.json

      - name: Generated files are committed and up to date
        run: git diff --exit-code -- .

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 17 The app preview: the web build the platform serves at /preview-app/.
      - name: App preview is up to date
        run: tool/build_preview.sh --check

      - name: Build the app preview (web)
        run: flutter build web --release --base-href /preview-app/ --no-wasm-dry-run

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Store app
        run: |
          jq '.app_type = "store"' config/example.json > "$RUNNER_TEMP/store.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/store.json"
          grep -q 'appType: AppType.store' lib/generated/build_config.g.dart

      - name: Build Store debug APK
        run: flutter build apk --debug

      - name: Upload Store debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-store-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Bookings app
        run: |
          jq '.app_type = "booking"' config/example.json > "$RUNNER_TEMP/booking.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/booking.json"
          grep -q 'appType: AppType.booking' lib/generated/build_config.g.dart

      - name: Build Bookings debug APK
        run: flutter build apk --debug

      - name: Upload Bookings debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-booking-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Real estate app
        run: |
          jq '.app_type = "real_estate"' config/example.json > "$RUNNER_TEMP/real_estate.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/real_estate.json"
          grep -q 'appType: AppType.realEstate' lib/generated/build_config.g.dart

      - name: Build Real estate debug APK
        run: flutter build apk --debug

      - name: Upload Real estate debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-real-estate-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a News & blog app
        run: |
          jq '.app_type = "news"' config/example.json > "$RUNNER_TEMP/news.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/news.json"
          grep -q 'appType: AppType.news' lib/generated/build_config.g.dart

      - name: Build News & blog debug APK
        run: flutter build apk --debug

      - name: Upload News & blog debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-news-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as an Events & tickets app
        run: |
          jq '.app_type = "events"' config/example.json > "$RUNNER_TEMP/events.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/events.json"
          grep -q 'appType: AppType.events' lib/generated/build_config.g.dart

      - name: Build Events & tickets debug APK
        run: flutter build apk --debug

      - name: Upload Events & tickets debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-events-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Charity & donations app
        run: |
          jq '.app_type = "donations" | .vertical = "charity"' config/example.json > "$RUNNER_TEMP/donations.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/donations.json"
          grep -q 'appType: AppType.donations' lib/generated/build_config.g.dart

      - name: Build Charity & donations debug APK
        run: flutter build apk --debug

      - name: Upload Charity & donations debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-donations-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # 36 A build with an agconnect-services.json includes Huawei push
      # (android/hms_push); the ones above, without it, have nothing from Huawei.
      - name: Build a debug APK with Huawei push
        run: |
          cp config/example-agconnect-services.json android/app/agconnect-services.json
          flutter build apk --debug
          rm android/app/agconnect-services.json

  # 59 Yallapp Business (business/), the app for the people who run an app
  # on Yallapp: the same checks as the client app. No APK here: release
  # builds are made for the stores (docs/LAUNCH-CHECKLIST.md).
  business:
    name: Yallapp Business
    needs: changes
    if: needs.changes.outputs.business == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    # Publishes the test APKs as a pre-release (below).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: business
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Interface strings are complete and generated
        run: |
          python3 tool/build_arb.py
          flutter gen-l10n
          git diff --exit-code -- .

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # APKs to try on a phone, signed with the debug key (they can't go to
      # Google Play): one against yallapp.com.tr, one on the demo's sample apps.
      # Pushes need the app's Firebase project (README), which these leave out.
      # Pushes: the Firebase project's Android client options, from the repository's
      # Actions variables (not secrets: they ship inside the app). Without them the
      # APK works the same and says notifications aren't set up in this build.
      - name: Build the APK for yallapp.com.tr
        env:
          YB_FIREBASE_PROJECT_ID: ${{ vars.YB_FIREBASE_PROJECT_ID }}
          YB_FIREBASE_SENDER_ID: ${{ vars.YB_FIREBASE_SENDER_ID }}
          YB_FIREBASE_APP_ID_ANDROID: ${{ vars.YB_FIREBASE_APP_ID_ANDROID }}
          YB_FIREBASE_API_KEY_ANDROID: ${{ vars.YB_FIREBASE_API_KEY_ANDROID }}
        run: |
          # A variable may hold the whole google-services.json instead of one value:
          # the Android app's values are read from it (tr.com.yallapp.business).
          python3 ../build/scripts/business_store.py firebase android "$RUNNER_TEMP/yb-firebase.json"
          flutter build apk --release --dart-define-from-file="$RUNNER_TEMP/yb-firebase.json"
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/yallapp-business.apk"

      - name: Build the demo APK
        run: |
          flutter build apk --release --dart-define=YB_DEMO=true
          mv build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/yallapp-business-demo.apk"

      - name: Upload the APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-business-apk
          path: |
            ${{ runner.temp }}/yallapp-business.apk
            ${{ runner.temp }}/yallapp-business-demo.apk
          if-no-files-found: error
          retention-days: 14

      # The same APKs on one pre-release that is replaced on every build, so they
      # can be downloaded with a plain link (artifacts need a signed-in browser).
      - name: Publish the APKs on the "Yallapp Business test build" pre-release
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yallapp-business-test
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Yallapp Business test build" \
              --notes "Debug-signed APKs to try on a phone, replaced by every build (they can't go to Google Play). yallapp-business.apk works against yallapp.com.tr; yallapp-business-demo.apk runs on sample data (owner@example.com / yallapp-demo). yallapp-business.aab, when there, is the release App Bundle signed with the upload key, from the Yallapp Business release workflow, for Google Play."
          fi
          gh release upload "$tag" "$RUNNER_TEMP/yallapp-business.apk" "$RUNNER_TEMP/yallapp-business-demo.apk" -R "$GITHUB_REPOSITORY" --clobber
