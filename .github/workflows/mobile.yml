name: Mobile

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install packages
        run: flutter pub get --enforce-lockfile

      - name: Apply the example build config
        run: dart run tool/apply_config.dart config/example.json

      - name: Generated files are committed and up to date
        run: git diff --exit-code -- .

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Apply the example config as a Store app
        run: |
          jq '.app_type = "store"' config/example.json > "$RUNNER_TEMP/store.json"
          dart run tool/apply_config.dart "$RUNNER_TEMP/store.json"
          grep -q 'appType: AppType.store' lib/generated/build_config.g.dart

      - name: Build Store debug APK
        run: flutter build apk --debug

      - name: Upload Store debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yallapp-store-example-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
