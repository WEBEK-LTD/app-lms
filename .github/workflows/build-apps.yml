name: Build client apps

# Builds the apps clients queue in their Yallapp dashboard (build/README.md).
# Polls the platform every hour; the platform also starts it as soon as a
# build is queued (GITHUB_DISPATCH_TOKEN), and "Run workflow" checks the queue at once.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-queue
  cancel-in-progress: false

# 79.4/69.14 The pipeline token and the files host's login are given only to the
# steps that call the platform or upload, never to the setup actions.
env:
  PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}

jobs:
  queue:
    name: Take queued builds
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    if: vars.PLATFORM_API_URL != ''
    outputs:
      builds: ${{ steps.take.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build/scripts
      - id: take
        name: Claim queued builds
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          builds=$(python3 build/scripts/platform.py queue)
          log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for id in $(echo "$builds" | python3 -c 'import json,sys; print(" ".join(b["id"] for b in json.load(sys.stdin)))'); do
            python3 build/scripts/platform.py claim "$id" "$log_url"
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "Builds: $builds"

  android:
    name: Android ${{ matrix.build.id }}
    needs: queue
    if: needs.queue.outputs.builds != '[]' && needs.queue.outputs.builds != ''
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build: ${{ fromJSON(needs.queue.outputs.builds) }}
    env:
      AUTO_PUBLISH: ${{ matrix.build.auto_publish }}
      # 89.2 A share of Google Play's production users first, when the owner asked.
      ANDROID_ROLLOUT: ${{ matrix.build.android_rollout }}
      FILES_BASE_URL: ${{ vars.FILES_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 87.3 A rebuild of an earlier build checks out the code it was made from.
          ref: ${{ matrix.build.source_ref || github.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build, sign and upload
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
          FILES_FTP_URL: ${{ secrets.FILES_FTP_URL }}
          FILES_FTP_USER: ${{ secrets.FILES_FTP_USER }}
          FILES_FTP_PASSWORD: ${{ secrets.FILES_FTP_PASSWORD }}
        run: build/scripts/android.sh "${{ matrix.build.id }}" "$RUNNER_TEMP/result"
      - name: Keep the result for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.build.id }}-android
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: ignore
          retention-days: 3

  ios:
    name: iOS ${{ matrix.build.id }}
    needs: queue
    if: needs.queue.outputs.builds != '[]' && needs.queue.outputs.builds != ''
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        build: ${{ fromJSON(needs.queue.outputs.builds) }}
    env:
      AUTO_PUBLISH: ${{ matrix.build.auto_publish }}
      # 89.2 Apple's phased release, when the owner asked.
      IOS_PHASED: ${{ matrix.build.ios_phased }}
      FILES_BASE_URL: ${{ vars.FILES_BASE_URL }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 87.3 A rebuild of an earlier build checks out the code it was made from.
          ref: ${{ matrix.build.source_ref || github.sha }}
      # Without an App Store Connect key, or without iOS in the app's plan (the secrets
      # then send none), there is no iOS app; skip the macOS setup.
      - id: check
        name: Check for an App Store Connect key
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          has=$(python3 build/scripts/platform.py has_ios "${{ matrix.build.id }}")
          echo "ios=$has" >> "$GITHUB_OUTPUT"
          if [ "$has" != "yes" ]; then
            mkdir -p "$RUNNER_TEMP/result"
            echo '{"stages":{"ios":"skipped","upload_testflight":"skipped"},"artifacts":[],"message":"No iOS app in this build: add your App Store Connect key in App setup › Publishing, on a plan with the iOS app."}' > "$RUNNER_TEMP/result/result.json"
            python3 build/scripts/platform.py status "${{ matrix.build.id }}" '{"stages":{"ios":"skipped","upload_testflight":"skipped"}}'
          fi
      # Apple takes uploads built with the iOS 26 SDK: use the newest
      # Xcode 26 on the runner.
      - if: steps.check.outputs.ios == 'yes'
        name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Eiv 'beta|release_candidate' | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no Xcode 26."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - if: steps.check.outputs.ios == 'yes'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - if: steps.check.outputs.ios == 'yes'
        run: pip install pillow==12.0.0
      - if: steps.check.outputs.ios == 'yes'
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - if: steps.check.outputs.ios == 'yes'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - if: steps.check.outputs.ios == 'yes'
        name: Install packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - if: steps.check.outputs.ios == 'yes'
        name: Build, sign and upload
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
          FILES_FTP_URL: ${{ secrets.FILES_FTP_URL }}
          FILES_FTP_USER: ${{ secrets.FILES_FTP_USER }}
          FILES_FTP_PASSWORD: ${{ secrets.FILES_FTP_PASSWORD }}
        run: build/scripts/ios.sh "${{ matrix.build.id }}" "$RUNNER_TEMP/result"
      - name: Keep the result for the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.build.id }}-ios
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: ignore
          retention-days: 3

  report:
    name: Report ${{ matrix.build.id }}
    needs: [queue, android, ios]
    if: always() && needs.queue.outputs.builds != '[]' && needs.queue.outputs.builds != ''
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.queue.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: build/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-${{ matrix.build.id }}-*
          path: results
      - name: Send the final status
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: python3 build/scripts/report.py "${{ matrix.build.id }}" results
