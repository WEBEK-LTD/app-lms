name: Build client apps

# Builds the apps clients queue in their Yallapp dashboard (build/README.md).
# Polls the platform every hour; the platform also starts it as soon as a
# build is queued (GITHUB_DISPATCH_TOKEN), and "Run workflow" checks the queue at once.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-queue
  cancel-in-progress: false

# 79.4/69.14 The pipeline token and the files host's login are given only to the
# steps that call the platform or upload, never to the setup actions.
env:
  PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}

jobs:
  queue:
    name: Take queued builds
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    if: vars.PLATFORM_API_URL != ''
    outputs:
      builds: ${{ steps.take.outputs.builds }}
      # 142 The builds each job makes: Android unless started for the iPhone only; iOS when the
      # build has it (its plan, the App Store Connect key) and wasn't started for Android only.
      android: ${{ steps.take.outputs.android }}
      ios: ${{ steps.take.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: build/scripts
      - id: take
        name: Claim queued builds
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          builds=$(python3 build/scripts/platform.py queue)
          log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for id in $(echo "$builds" | python3 -c 'import json,sys; print(" ".join(b["id"] for b in json.load(sys.stdin)))'); do
            python3 build/scripts/platform.py claim "$id" "$log_url"
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "android=$(echo "$builds" | python3 -c 'import json,sys; print(json.dumps([b for b in json.load(sys.stdin) if b.get("android", True)]))')" >> "$GITHUB_OUTPUT"
          echo "ios=$(echo "$builds" | python3 -c 'import json,sys; print(json.dumps([b for b in json.load(sys.stdin) if b.get("ios", True)]))')" >> "$GITHUB_OUTPUT"
          echo "Builds: $builds"

  android:
    name: Android ${{ matrix.build.id }}
    needs: queue
    if: needs.queue.outputs.android != '[]' && needs.queue.outputs.android != ''
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build: ${{ fromJSON(needs.queue.outputs.android) }}
    env:
      AUTO_PUBLISH: ${{ matrix.build.auto_publish }}
      # 89.2 A share of Google Play's production users first, when the owner asked.
      ANDROID_ROLLOUT: ${{ matrix.build.android_rollout }}
      FILES_BASE_URL: ${{ vars.FILES_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 87.3 A rebuild of an earlier build checks out the code it was made from.
          ref: ${{ matrix.build.source_ref || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      # 185 Gradle's downloaded dependencies and wrapper, shared by every client's build, so three
      # builds at once don't each fetch them all from Maven Central and the Plugin Portal (which
      # answered 429). Only what those repositories and Gradle's site serve: no build outputs, no
      # client's config, keys or signing files (they stay in the checkout and the runner's temp).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-release-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/pubspec.lock') }}
          restore-keys: |
            gradle-deps-release-${{ runner.os }}-
      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build, sign and upload
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
          FILES_FTP_URL: ${{ secrets.FILES_FTP_URL }}
          FILES_FTP_USER: ${{ secrets.FILES_FTP_USER }}
          FILES_FTP_PASSWORD: ${{ secrets.FILES_FTP_PASSWORD }}
        run: build/scripts/android.sh "${{ matrix.build.id }}" "$RUNNER_TEMP/result"
      - name: Keep the result for the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result-${{ matrix.build.id }}-android
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: ignore
          retention-days: 3

  ios:
    name: iOS ${{ matrix.build.id }}
    needs: queue
    # 142 No Mac for a build without the iOS app: the report says why.
    if: needs.queue.outputs.ios != '[]' && needs.queue.outputs.ios != ''
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        build: ${{ fromJSON(needs.queue.outputs.ios) }}
    env:
      AUTO_PUBLISH: ${{ matrix.build.auto_publish }}
      # 89.2 Apple's phased release, when the owner asked.
      IOS_PHASED: ${{ matrix.build.ios_phased }}
      FILES_BASE_URL: ${{ vars.FILES_BASE_URL }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 87.3 A rebuild of an earlier build checks out the code it was made from.
          ref: ${{ matrix.build.source_ref || github.sha }}
      # Without an App Store Connect key, or without iOS in the app's plan (the secrets
      # then send none), there is no iOS app; skip the macOS setup.
      - id: check
        name: Check for an App Store Connect key
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          has=$(python3 build/scripts/platform.py has_ios "${{ matrix.build.id }}")
          echo "ios=$has" >> "$GITHUB_OUTPUT"
          if [ "$has" != "yes" ]; then
            mkdir -p "$RUNNER_TEMP/result"
            echo '{"stages":{"ios":"skipped","upload_testflight":"skipped","app_review":"skipped"},"artifacts":[],"message":"No iOS app in this build: add your App Store Connect key in App setup › Publishing, on a plan with the iOS app."}' > "$RUNNER_TEMP/result/result.json"
            python3 build/scripts/platform.py status "${{ matrix.build.id }}" '{"stages":{"ios":"skipped","upload_testflight":"skipped","app_review":"skipped"}}'
          fi
      # From April 2027 Apple takes only uploads built with the iOS 27 SDK
      # (ITMS-90725): use the newest released Xcode, 27 or later, on GitHub's
      # xcode-27 runner.
      - if: steps.check.outputs.ios == 'yes'
        name: Use the newest Xcode (27 or later)
        run: |
          # The newest released Xcode on the runner (a beta or release candidate
          # never counts), and never older than 27.
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -Eiv 'beta|release_candidate' | sort -V | tail -n 1)
          major=$(basename "$xcode" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')
          if [ -z "$xcode" ] || [ "${major:-0}" -lt 27 ]; then
            echo "::error::This runner has no released Xcode 27 or later (a beta does not count)."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - if: steps.check.outputs.ios == 'yes'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - if: steps.check.outputs.ios == 'yes'
        run: pip install pillow==12.0.0
      - if: steps.check.outputs.ios == 'yes'
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - if: steps.check.outputs.ios == 'yes'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - if: steps.check.outputs.ios == 'yes'
        name: Install packages
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - if: steps.check.outputs.ios == 'yes'
        name: Build, sign and upload
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
          FILES_FTP_URL: ${{ secrets.FILES_FTP_URL }}
          FILES_FTP_USER: ${{ secrets.FILES_FTP_USER }}
          FILES_FTP_PASSWORD: ${{ secrets.FILES_FTP_PASSWORD }}
        run: build/scripts/ios.sh "${{ matrix.build.id }}" "$RUNNER_TEMP/result"
      - name: Keep the result for the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: result-${{ matrix.build.id }}-ios
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: ignore
          retention-days: 3

  report:
    name: Report ${{ matrix.build.id }}
    needs: [queue, android, ios]
    if: always() && needs.queue.outputs.builds != '[]' && needs.queue.outputs.builds != ''
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    # 151 Reads this run's jobs: an iOS job GitHub had no Mac for (cancelled in the queue, before
    # any step ran) can't report itself, so the report says why from here.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.queue.outputs.builds) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: build/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: result-${{ matrix.build.id }}-*
          path: results
      - name: Send the final status
        env:
          BUILD_PIPELINE_TOKEN: ${{ secrets.BUILD_PIPELINE_TOKEN }}
          # 142 The apps this build makes (the jobs that ran for it).
          BUILD_ONLY: ${{ matrix.build.only }}
          BUILD_IOS: ${{ matrix.build.ios }}
          # 151 Read-only (actions: read above): the run's jobs, for an iOS job that never got a Mac.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build/scripts/report.py "${{ matrix.build.id }}" results
