name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/api/openapi.yaml
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/openapi.yaml docs/api/platform.yaml docs/api/pipeline.yaml

  plugin-syntax:
    name: Plugin syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every plugin file
        run: find wp-plugin -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

  plugin-standards:
    name: Plugin coding standards
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: WordPress coding standards and PHP 7.4 compatibility
        run: composer lint

  plugin-package:
    name: Plugin zip
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - name: Build the installable zip
        id: zip
        run: echo "path=$(bin/build-zip.sh "$RUNNER_TEMP/dist")" >> "$GITHUB_OUTPUT"
      - name: Only runtime files are packaged
        run: |
          unzip -Z1 "${{ steps.zip.outputs.path }}" > files.txt
          grep -qx "yallapp/yallapp.php" files.txt
          ! grep -E "^yallapp/(tests|vendor|bin)/|composer|phpcs|phpunit" files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yallapp-plugin
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  plugin-unit:
    name: Plugin unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  plugin-integration:
    name: Plugin end-to-end (WordPress + Tutor LMS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-tutor4.1.1-sqlite3.1.0-cli2.12.0
      - name: Build the dev site and run the API checks
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  adapter-integration:
    name: Plugin end-to-end (${{ matrix.lms }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lms: [learnpress, lifterlms, masterstudy, masteriyo, sensei]
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-${{ matrix.lms }}-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build the dev site with ${{ matrix.lms }} and run the API checks
        env:
          LMS: ${{ matrix.lms }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  store-integration:
    name: Plugin end-to-end (WooCommerce store)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-store-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build a WooCommerce shop and run the store checks
        env:
          APP: store
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  booking-describe:
    name: Describe booking plugin (${{ matrix.booking }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - booking: amelia
            slug: ameliabooking
            prefix: amelia
            code: 'Domain/Entity/(Bookable|Booking|User|Schedule)|Domain/Services/(TimeSlot|Reservation|Booking|Entity)|Application/Services/(TimeSlot|Reservation|Booking|Bookable|User|Settings)|Application/Commands/Booking/Appointment/(AddBooking|CancelBooking)|Infrastructure/Container\.php|Infrastructure/Repository/(Booking|Bookable|User|Schedule)|Domain/Factory/Booking'
          - booking: bookly
            slug: bookly-responsive-appointment-booking-tool
            prefix: bookly
            code: 'lib/(entities|slots)/|lib/Config\.php|lib/utils/(DateTime|Price|Common)\.php|lib/(UserBookingData|CartItem|ChainItem)\.php|frontend/modules/booking/'
          - booking: latepoint
            slug: latepoint
            prefix: latepoint
            code: 'lib/models/(booking|service|agent|customer|order|location|work_period|off_period|service_category|cart)|lib/helpers/(booking|timeline|availability|time|work_periods|money|settings|service|agent|customer|order|cart|time_period|booking_request)'
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - name: Build a site with the booking plugin
        env:
          APP: bookings
          BOOKING: ${{ matrix.booking }}
          SEED: '0'
        run: tests/dev-site/setup.sh "$RUNNER_TEMP/site"
      - name: Version
        run: |
          grep -m1 -i 'Version:' "$RUNNER_TEMP/site/wp-content/plugins/${{ matrix.slug }}/"*.php || true
          curl -s "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=${{ matrix.slug }}&request%5Bfields%5D%5Bversions%5D=0" | php -r '$i = json_decode(stream_get_contents(STDIN), true); echo $i["version"] ?? "?", " active_installs=", $i["active_installs"] ?? "?", " requires=", $i["requires"] ?? "?", " requires_php=", $i["requires_php"] ?? "?", PHP_EOL;'
      - name: Tables and options
        run: php ~/.cache/yallapp-dev/wp-cli-2.12.0.phar --path="$RUNNER_TEMP/site" --allow-root eval-file tests/dev-site/describe-plugin.php ${{ matrix.prefix }}
      - name: Code index
        run: tests/dev-site/describe-source.sh "$RUNNER_TEMP/site/wp-content/plugins/${{ matrix.slug }}" '${{ matrix.code }}'

  build-pipeline:
    name: Build pipeline scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - name: Unit tests
        run: python -m unittest discover build/tests -v
      - name: Shell scripts
        run: shellcheck build/scripts/*.sh wp-plugin/yallapp/tests/integration/run.sh
      - name: Files host
        run: php -l build/files-host/index.php
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - name: Fastfile loads
        working-directory: build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          LC_ALL: C.UTF-8
        run: bundle exec fastlane lanes
