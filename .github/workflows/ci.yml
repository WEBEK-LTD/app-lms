name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/api/openapi.yaml
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/openapi.yaml docs/api/platform.yaml

  plugin-syntax:
    name: Plugin syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every plugin file
        run: find wp-plugin -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

  plugin-standards:
    name: Plugin coding standards
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: WordPress coding standards and PHP 7.4 compatibility
        run: composer lint

  plugin-unit:
    name: Plugin unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  plugin-integration:
    name: Plugin end-to-end (WordPress + Tutor LMS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-tutor4.1.1-sqlite3.1.0-cli2.12.0
      - name: Build the dev site and run the API checks
        run: tests/integration/run.sh "$RUNNER_TEMP/site"
