name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: API contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/api/openapi.yaml
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/openapi.yaml docs/api/platform.yaml docs/api/pipeline.yaml

  plugin-syntax:
    name: Plugin syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every plugin file
        run: find wp-plugin -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

  plugin-standards:
    name: Plugin coding standards
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: WordPress coding standards and PHP 7.4 compatibility
        run: composer lint

  plugin-package:
    name: Plugin zip
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - name: Build the installable zip
        id: zip
        run: echo "path=$(bin/build-zip.sh "$RUNNER_TEMP/dist")" >> "$GITHUB_OUTPUT"
      - name: Only runtime files are packaged
        run: |
          unzip -Z1 "${{ steps.zip.outputs.path }}" > files.txt
          grep -qx "yallapp/yallapp.php" files.txt
          ! grep -E "^yallapp/(tests|vendor|bin)/|composer|phpcs|phpunit" files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yallapp-plugin
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  plugin-unit:
    name: Plugin unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  plugin-integration:
    name: Plugin end-to-end (WordPress + Tutor LMS)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-tutor4.1.1-sqlite3.1.0-cli2.12.0
      - name: Build the dev site and run the API checks
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  adapter-integration:
    name: Plugin end-to-end (${{ matrix.lms }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lms: [learnpress, lifterlms, masterstudy, masteriyo, sensei]
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-${{ matrix.lms }}-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build the dev site with ${{ matrix.lms }} and run the API checks
        env:
          LMS: ${{ matrix.lms }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  store-integration:
    name: Plugin end-to-end (WooCommerce store)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-store-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build a WooCommerce shop and run the store checks
        env:
          APP: store
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  booking-describe:
    name: Describe booking plugin (${{ matrix.booking }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - booking: amelia
            slug: ameliabooking
            prefix: amelia
            code: 'NO_METHOD_INDEX$'
            show: 'class (CommandHandler|DateTimeService|AppointmentRepository|CustomerBookingRepository|UserApplicationService|CustomerApplicationService|UserService|Controller)[^A-Za-z]|function getAppointmentData'
          - booking: bookingpress
            slug: bookingpress-appointment-booking
            prefix: bookingpress
            code: 'core/classes|bookingpress-appointment-booking\.php'
            show: 'Plugin Name: BookingPress'
          - booking: latepoint
            slug: latepoint
            prefix: latepoint
            code: 'NO_METHOD_INDEX$'
            show: 'class (OsResourceHelper|OsOrdersController|OsCustomerCabinetController|OsCartsHelper|OsPaymentsHelper|OsBookingHelper|OsStepsHelper|OsCustomerHelper|OsOrdersHelper)[^A-Za-z]'
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - name: Build a site with the booking plugin
        env:
          APP: bookings
          BOOKING: ${{ matrix.booking }}
          SEED: '0'
        run: tests/dev-site/setup.sh "$RUNNER_TEMP/site" || echo "SETUP FAILED"
      - name: Plugins and PHP log
        run: |
          php ~/.cache/yallapp-dev/wp-cli-2.12.0.phar --path="$RUNNER_TEMP/site" --allow-root plugin list || true
          php ~/.cache/yallapp-dev/wp-cli-2.12.0.phar --path="$RUNNER_TEMP/site" --allow-root plugin activate ${{ matrix.slug }} || true
          tail -n 60 "$RUNNER_TEMP/site/wp-content/debug.log" || true
          ls -la ~/.cache/yallapp-dev/ "$RUNNER_TEMP/site/wp-content/plugins/" "$RUNNER_TEMP/site/wp-content/plugins/${{ matrix.slug }}" || true
      - name: Tables and options
        run: php ~/.cache/yallapp-dev/wp-cli-2.12.0.phar --path="$RUNNER_TEMP/site" --allow-root eval-file tests/dev-site/describe-plugin.php ${{ matrix.prefix }} || true
      - name: Source
        env:
          SHOW: ${{ matrix.show }}
        run: tests/dev-site/describe-source.sh "$RUNNER_TEMP/site/wp-content/plugins/${{ matrix.slug }}" '${{ matrix.code }}'

  build-pipeline:
    name: Build pipeline scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - name: Unit tests
        run: python -m unittest discover build/tests -v
      - name: Shell scripts
        run: shellcheck build/scripts/*.sh wp-plugin/yallapp/tests/integration/run.sh
      - name: Files host
        run: php -l build/files-host/index.php
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - name: Fastfile loads
        working-directory: build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          LC_ALL: C.UTF-8
        run: bundle exec fastlane lanes
