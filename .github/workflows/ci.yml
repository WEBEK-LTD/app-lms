name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" runs every check, whatever changed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      plugin: ${{ steps.files.outputs.plugin }}
      describe: ${{ steps.files.outputs.describe }}
      pipeline: ${{ steps.files.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        name: Files this push changed
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests check only what their latest push changed, to save
          # Actions minutes; main, manual runs, new pull requests and force
          # pushes check all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$HEAD")"
          else
            files=all
          fi
          printf '%s\n' "$files"
          match() { [ "$files" = all ] || grep -qE "$1" <<<"$files"; }
          {
            if match '^(wp-plugin/|\.github/workflows/ci\.yml$)'; then echo plugin=true; else echo plugin=false; fi
            if match '^(wp-plugin/yallapp/tests/dev-site/describe-methods\.php|\.github/workflows/ci\.yml)$'; then echo describe=true; else echo describe=false; fi
            if match '^(build/|wp-plugin/yallapp/tests/integration/run\.sh$|\.github/workflows/ci\.yml$)'; then echo pipeline=true; else echo pipeline=false; fi
          } >> "$GITHUB_OUTPUT"

  api-contract:
    name: API contract
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint docs/api/openapi.yaml
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/openapi.yaml docs/api/platform.yaml docs/api/pipeline.yaml

  plugin-syntax:
    name: Plugin syntax (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every plugin file
        run: find wp-plugin -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

  plugin-standards:
    name: Plugin coding standards
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: WordPress coding standards and PHP 7.4 compatibility
        run: composer lint

  plugin-package:
    name: Plugin zip
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - name: Build the installable zip
        id: zip
        run: echo "path=$(bin/build-zip.sh "$RUNNER_TEMP/dist")" >> "$GITHUB_OUTPUT"
      - name: Only runtime files are packaged
        run: |
          unzip -Z1 "${{ steps.zip.outputs.path }}" > files.txt
          grep -qx "yallapp/yallapp.php" files.txt
          ! grep -E "^yallapp/(tests|vendor|bin)/|composer|phpcs|phpunit" files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yallapp-plugin
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  plugin-unit:
    name: Plugin unit tests (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  plugin-integration:
    name: Plugin end-to-end (WordPress + Tutor LMS)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-tutor4.1.1-sqlite3.1.0-cli2.12.0
      - name: Build the dev site and run the API checks
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  adapter-integration:
    name: Plugin end-to-end (${{ matrix.lms }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        lms: [learnpress, lifterlms, masterstudy, masteriyo, sensei]
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-${{ matrix.lms }}-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build the dev site with ${{ matrix.lms }} and run the API checks
        env:
          LMS: ${{ matrix.lms }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  store-integration:
    name: Plugin end-to-end (WooCommerce store)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-store-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build a WooCommerce shop and run the store checks
        env:
          APP: store
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  bookings-integration:
    name: Plugin end-to-end (bookings on ${{ matrix.booking }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        booking: [amelia, latepoint]
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - name: Build a site with ${{ matrix.booking }} and run the bookings checks
        env:
          APP: bookings
          BOOKING: ${{ matrix.booking }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"
      - name: PHP log
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/site/wp-content/debug.log" || true

  booking-describe:
    name: Describe booking plugin (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.describe == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: bookingpress save
            booking: bookingpress
            slug: bookingpress-appointment-booking
            methods: '::(bookingpress_save_appointment_booking_func|bookingpress_confirm_booking|bookingpress_is_appointment_booked|bookinpgress_retrieve_default_workhours|bookingpress_global_options|bookingpress_get_currency_symbol|bookingpress_get_currency_code|bookingpress_retrieve_off_days|bookingpress_get_default_dayoff_dates)$'
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - name: Build a site with the booking plugin
        env:
          APP: bookings
          BOOKING: ${{ matrix.booking }}
          SEED: '0'
        run: tests/dev-site/setup.sh "$RUNNER_TEMP/site" > /dev/null || echo "SETUP FAILED"
      - name: Source
        env:
          DIR: ${{ runner.temp }}/site/wp-content/plugins/${{ matrix.slug }}
          LIST: ${{ matrix.list }}
          METHODS: ${{ matrix.methods }}
          GREP: ${{ matrix.grep }}
          AROUND: ${{ matrix.around }}
        run: |
          if [ -n "$LIST" ]; then echo "== list"; php tests/dev-site/describe-methods.php "$DIR" "$LIST" --list; fi
          for range in $AROUND; do
            IFS=: read -r file from to <<<"$range"
            echo "== $file:$from-$to"
            if [ ! -f "$DIR/$file" ]; then
              echo "(no such file; files nearby:)"
              find "$DIR/$(dirname "$file")/.." -name '*.php' 2>/dev/null | sed "s#^$DIR/##" | head -n 60
              continue
            fi
            sed -n "${from},${to}p" "$DIR/$file" | cat -n | sed "s/^ *\([0-9]*\)/$((from - 1))+\1/"
          done
          if [ -n "$GREP" ]; then echo "== grep"; grep -rnE --include='*.php' --exclude-dir=vendor "$GREP" "$DIR" | sed "s#^$DIR/##" | cut -c1-300 | head -n 200 || true; fi
          php tests/dev-site/describe-methods.php "$DIR" "$METHODS"

  build-pipeline:
    name: Build pipeline scripts
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - name: Unit tests
        run: python -m unittest discover build/tests -v
      - name: Shell scripts
        run: shellcheck build/scripts/*.sh build/runner/*.sh wp-plugin/yallapp/tests/integration/run.sh
      - name: Files host
        run: php -l build/files-host/index.php
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - name: Fastfile loads
        working-directory: build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          LC_ALL: C.UTF-8
        run: bundle exec fastlane lanes
