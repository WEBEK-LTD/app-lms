name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" runs every check, whatever changed.
  workflow_dispatch:

# 69 Our own runners (LINUX_RUNNER, build/runner) also build clients' apps with the pipeline's
# secrets, so a pull request from a fork (anyone's code, in a public repository) always runs on
# GitHub's runners: `runs-on` below picks them for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed files
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      plugin: ${{ steps.files.outputs.plugin }}
      pipeline: ${{ steps.files.outputs.pipeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: files
        name: Files this push changed
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull requests check only what their latest push changed, to save
          # Actions minutes; main, manual runs, new pull requests and force
          # pushes check all.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git cat-file -e "$HEAD^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$HEAD")"
          else
            files=all
          fi
          printf '%s\n' "$files"
          match() { [ "$files" = all ] || grep -qE "$1" <<<"$files"; }
          {
            if match '^(wp-plugin/|\.github/workflows/ci\.yml$)'; then echo plugin=true; else echo plugin=false; fi
            if match '^(build/|business/store/|brand/stores/|\.github/workflows/business-release\.yml$|wp-plugin/yallapp/tests/integration/run\.sh$|wp-plugin/yallapp/bin/plugin-check\.sh$|\.github/workflows/ci\.yml$)'; then echo pipeline=true; else echo pipeline=false; fi
          } >> "$GITHUB_OUTPUT"

  api-contract:
    name: API contract
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Lint the API contracts
        run: npx --yes @redocly/cli@2.54.2 lint docs/api/openapi.yaml docs/api/platform.yaml docs/api/pipeline.yaml docs/api/owner.yaml

  plugin-syntax:
    name: Plugin syntax (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every plugin file
        run: find wp-plugin -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l

  plugin-standards:
    name: Plugin coding standards
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: WordPress coding standards and PHP 7.4 compatibility
        run: composer lint

  plugin-package:
    name: Plugin zip
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the installable zip
        id: zip
        run: echo "path=$(bin/build-zip.sh "$RUNNER_TEMP/dist")" >> "$GITHUB_OUTPUT"
      - name: Only runtime files are packaged
        run: |
          unzip -Z1 "${{ steps.zip.outputs.path }}" > files.txt
          grep -qx "yallapp/yallapp.php" files.txt
          ! grep -E "^yallapp/(tests|vendor|bin)/|composer|phpcs|phpunit" files.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yallapp-plugin
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

  plugin-check:
    # 76 WordPress.org's Plugin Check on the installable zip: the checks the plugin directory runs on an upload.
    name: Plugin Check (WordPress.org)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-sqlite3.1.0-cli2.12.0-plugin-check2.1.0
      - name: Plugin Check on the zip
        run: bin/plugin-check.sh "$RUNNER_TEMP/plugin-check"

  plugin-unit:
    name: Plugin unit tests (PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer test

  plugin-integration:
    name: Plugin end-to-end (WordPress + Tutor LMS)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-tutor4.1.1-sqlite3.1.0-cli2.12.0
      - name: Build the dev site and run the API checks
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  access-integration:
    # 39 Tutor LMS with WooCommerce (most academies): every way a student gets a course
    # opens it in the app; and an update from plugin 0.3.8 (the Phase 30 merge) keeps
    # settings, sign-ins and devices.
    name: Plugin end-to-end (Tutor LMS + WooCommerce, ${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: course access
            woo: '1'
            upgrade_from: ''
          - suite: update from 0.3.8
            woo: '1'
            upgrade_from: 34d734f
          # 90.3 Paid Memberships Pro: a course that needs a membership.
          - suite: memberships
            woo: '0'
            memberships: '1'
            upgrade_from: ''
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-tutor-woo-${{ matrix.memberships || '0' }}-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build the dev site and run the checks
        env:
          WOO: ${{ matrix.woo }}
          MEMBERSHIPS: ${{ matrix.memberships || '0' }}
          UPGRADE_FROM: ${{ matrix.upgrade_from }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"
      - name: PHP log
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/site/wp-content/debug.log" || true

  adapter-integration:
    name: Plugin end-to-end (${{ matrix.lms }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        lms: [learnpress, lifterlms, masterstudy, masteriyo, sensei]
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-${{ matrix.lms }}-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build the dev site with ${{ matrix.lms }} and run the API checks
        env:
          LMS: ${{ matrix.lms }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  store-integration:
    name: Plugin end-to-end (WooCommerce store)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-store-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build a WooCommerce shop and run the store checks
        env:
          APP: store
        run: tests/integration/run.sh "$RUNNER_TEMP/site"

  news-integration:
    name: Plugin end-to-end (News & blog)
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yallapp-dev
          key: yallapp-dev-wp7.1.3-news-${{ hashFiles('wp-plugin/yallapp/tests/dev-site/setup.sh') }}
      - name: Build a news site and run the News checks
        env:
          APP: news
        run: tests/integration/run.sh "$RUNNER_TEMP/site"
      - name: PHP log
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/site/wp-content/debug.log" || true

  bookings-integration:
    name: Plugin end-to-end (bookings on ${{ matrix.booking }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        booking: [amelia, bookingpress, latepoint]
    defaults:
      run:
        working-directory: wp-plugin/yallapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_sqlite, sqlite3, curl, mbstring, dom, zip
          tools: composer:v2
      - name: Build a site with ${{ matrix.booking }} and run the bookings checks
        env:
          APP: bookings
          BOOKING: ${{ matrix.booking }}
        run: tests/integration/run.sh "$RUNNER_TEMP/site"
      - name: PHP log
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/site/wp-content/debug.log" || true

  build-pipeline:
    name: Build pipeline scripts
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - name: Unit tests
        run: python -m unittest discover build/tests -v
      - name: Shell scripts
        run: shellcheck build/scripts/*.sh build/runner/*.sh wp-plugin/yallapp/tests/integration/run.sh wp-plugin/yallapp/bin/plugin-check.sh
      - name: Files host
        run: php -l build/files-host/index.php
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - name: Fastfile loads
        working-directory: build
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          LC_ALL: C.UTF-8
        run: bundle exec fastlane lanes
