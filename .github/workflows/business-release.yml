name: Yallapp Business release

# 65 Yallapp Business (business/) to Google Play and the App Store under
# Yallapp's own accounts. Run it from Actions › "Yallapp Business release" ›
# Run workflow. It builds the signed App Bundle and IPA, uploads them to a
# Google Play testing track and to TestFlight with the store listings,
# screenshots and images, and never publishes: production on Google Play and
# "Add for Review" on the App Store stay a click in the consoles.
#
# Secrets and variables: docs/LAUNCH-CHECKLIST.md 7l and business/README.md ›
# Releases. A store whose secrets are missing is skipped and the run's summary
# says what to add. Secrets are only written to $RUNNER_TEMP and deleted.

on:
  workflow_dispatch:
    inputs:
      stores:
        description: Which stores
        type: choice
        options: [both, android, ios]
        default: both
      track:
        description: Google Play track (production is promoted in Play Console)
        type: choice
        options: [internal, alpha, beta]
        default: internal
      version:
        description: Version name, like 1.0.1 (empty = the one in business/pubspec.yaml). A new one is needed once a version is live on the App Store.
        type: string
        required: false
        default: ''
      play_check:
        description: Only check the Google Play sign-in (Workload Identity Federation); builds and uploads nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: business-release
  cancel-in-progress: false

env:
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
  FASTLANE_OPT_OUT_USAGE: '1'

jobs:
  prepare:
    name: Version and what's set up
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: business/pubspec.yaml
          sparse-checkout-cone-mode: false
      - id: plan
        name: Version, build number and the secrets each store needs
        env:
          STORES: ${{ inputs.stores }}
          PLAY_CHECK: ${{ inputs.play_check }}
          TRACK: ${{ inputs.track }}
          VERSION_INPUT: ${{ inputs.version }}
          OFFSET: ${{ vars.YB_BUILD_NUMBER_OFFSET }}
          # Only whether each one is set, never its value.
          HAS_YB_ANDROID_UPLOAD_KEYSTORE: ${{ secrets.YB_ANDROID_UPLOAD_KEYSTORE != '' }}
          HAS_YB_SECRETS_TOKEN: ${{ secrets.YB_SECRETS_TOKEN != '' }}
          HAS_YB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YB_ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_YB_ANDROID_KEY_ALIAS: ${{ secrets.YB_ANDROID_KEY_ALIAS != '' }}
          HAS_YB_ANDROID_KEY_PASSWORD: ${{ secrets.YB_ANDROID_KEY_PASSWORD != '' }}
          HAS_YB_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_YB_PLAY_SERVICE_ACCOUNT: ${{ vars.YB_PLAY_SERVICE_ACCOUNT != '' }}
          HAS_YB_ASC_KEY_ID: ${{ secrets.YB_ASC_KEY_ID != '' }}
          HAS_YB_ASC_ISSUER_ID: ${{ secrets.YB_ASC_ISSUER_ID != '' }}
          HAS_YB_ASC_PRIVATE_KEY: ${{ secrets.YB_ASC_PRIVATE_KEY != '' }}
          HAS_YB_IOS_DISTRIBUTION_P12: ${{ secrets.YB_IOS_DISTRIBUTION_P12 != '' }}
          HAS_YB_APP_REVIEW_DEMO_USER: ${{ secrets.YB_APP_REVIEW_DEMO_USER != '' }}
          HAS_YB_APP_REVIEW_DEMO_PASSWORD: ${{ secrets.YB_APP_REVIEW_DEMO_PASSWORD != '' }}
          HAS_YB_APP_REVIEW_FIRST_NAME: ${{ vars.YB_APP_REVIEW_FIRST_NAME != '' }}
          HAS_YB_APP_REVIEW_LAST_NAME: ${{ vars.YB_APP_REVIEW_LAST_NAME != '' }}
          HAS_YB_APP_REVIEW_PHONE: ${{ vars.YB_APP_REVIEW_PHONE != '' }}
          HAS_YB_FIREBASE_PROJECT_ID: ${{ vars.YB_FIREBASE_PROJECT_ID != '' }}
          HAS_YB_FIREBASE_SENDER_ID: ${{ vars.YB_FIREBASE_SENDER_ID != '' }}
          HAS_YB_FIREBASE_APP_ID_ANDROID: ${{ vars.YB_FIREBASE_APP_ID_ANDROID != '' }}
          HAS_YB_FIREBASE_API_KEY_ANDROID: ${{ vars.YB_FIREBASE_API_KEY_ANDROID != '' }}
          HAS_YB_FIREBASE_APP_ID_IOS: ${{ vars.YB_FIREBASE_APP_ID_IOS != '' }}
          HAS_YB_FIREBASE_API_KEY_IOS: ${{ vars.YB_FIREBASE_API_KEY_IOS != '' }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' business/pubspec.yaml)
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.0.1, not \"$version\"."
            echo "The version must look like 1.0.1 (three numbers with dots)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Google Play and the App Store need a build number that only goes up: this
          # workflow's run number, with room for re-runs of the same run.
          attempt=$(( GITHUB_RUN_ATTEMPT > 9 ? 9 : GITHUB_RUN_ATTEMPT ))
          build=$(( ${OFFSET:-0} + GITHUB_RUN_NUMBER * 10 + attempt ))

          set_or_missing() { for name in "$@"; do v="HAS_$name"; if [ "${!v}" = true ]; then echo "| \`$name\` | set |"; else echo "| \`$name\` | **missing** |"; fi; done; }
          all_set() { for name in "$@"; do v="HAS_$name"; [ "${!v}" = true ] || return 1; done; }

          android=no; ios=no
          if [ "$PLAY_CHECK" = true ]; then STORES=none; fi
          if [ "$STORES" != ios ] && [ "$STORES" != none ]; then android=yes; fi
          if [ "$STORES" != android ] && [ "$STORES" != none ]; then
            if all_set YB_ASC_KEY_ID YB_ASC_ISSUER_ID YB_ASC_PRIVATE_KEY; then ios=yes; else ios=missing; fi
          fi
          {
            echo "version=$version"
            echo "build=$build"
            echo "android=$android"
            echo "ios=$([ "$ios" = yes ] && echo yes || echo no)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Yallapp Business $version (build $build)"
            echo
            if [ "$PLAY_CHECK" = true ]; then
              echo "**Only checking the Google Play sign-in**: nothing is built or uploaded."
            else
              echo "Stores: **$STORES**. Google Play track: **$TRACK**."
            fi
            echo
            if [ "$android" = yes ]; then
              echo "### Google Play"
              echo
              echo "| Secret or variable | |"
              echo "|---|---|"
              set_or_missing YB_ANDROID_UPLOAD_KEYSTORE YB_ANDROID_KEYSTORE_PASSWORD YB_ANDROID_KEY_ALIAS YB_ANDROID_KEY_PASSWORD YB_GCP_WORKLOAD_IDENTITY_PROVIDER YB_PLAY_SERVICE_ACCOUNT YB_FIREBASE_PROJECT_ID YB_FIREBASE_SENDER_ID YB_FIREBASE_APP_ID_ANDROID YB_FIREBASE_API_KEY_ANDROID
              echo
              if ! all_set YB_ANDROID_UPLOAD_KEYSTORE YB_ANDROID_KEYSTORE_PASSWORD && all_set YB_SECRETS_TOKEN; then
                echo "**First run**: the upload key is made in this run and saved as the four \`YB_ANDROID_*\` secrets with \`YB_SECRETS_TOKEN\`."
              elif ! all_set YB_ANDROID_UPLOAD_KEYSTORE YB_ANDROID_KEYSTORE_PASSWORD; then
                echo "**No upload key**: the Android part stops until \`YB_ANDROID_UPLOAD_KEYSTORE\`, \`YB_ANDROID_KEYSTORE_PASSWORD\`, \`YB_ANDROID_KEY_ALIAS\` and \`YB_ANDROID_KEY_PASSWORD\` are added."
              fi
              if ! all_set YB_GCP_WORKLOAD_IDENTITY_PROVIDER YB_PLAY_SERVICE_ACCOUNT; then
                echo "Without the variables \`YB_GCP_WORKLOAD_IDENTITY_PROVIDER\` and \`YB_PLAY_SERVICE_ACCOUNT\` (Google Play sign-in through Workload Identity Federation) the App Bundle is built and put on the \"Yallapp Business test build\" pre-release as **yallapp-business.aab** (and attached to this run) but not uploaded to Google Play."
              fi
              echo
            fi
            if [ "$STORES" != android ] && [ "$STORES" != none ]; then
              echo "### App Store"
              echo
              echo "| Secret or variable | |"
              echo "|---|---|"
              set_or_missing YB_ASC_KEY_ID YB_ASC_ISSUER_ID YB_ASC_PRIVATE_KEY YB_IOS_DISTRIBUTION_P12 YB_APP_REVIEW_DEMO_USER YB_APP_REVIEW_DEMO_PASSWORD YB_APP_REVIEW_FIRST_NAME YB_APP_REVIEW_LAST_NAME YB_APP_REVIEW_PHONE YB_FIREBASE_PROJECT_ID YB_FIREBASE_SENDER_ID YB_FIREBASE_APP_ID_IOS YB_FIREBASE_API_KEY_IOS
              echo
              if [ "$ios" = missing ]; then
                echo "**The iOS app is skipped**: add the App Store Connect key as \`YB_ASC_KEY_ID\`, \`YB_ASC_ISSUER_ID\` and \`YB_ASC_PRIVATE_KEY\` (docs/LAUNCH-CHECKLIST.md 7l)."
              fi
              if ! all_set YB_IOS_DISTRIBUTION_P12; then
                echo "No \`YB_IOS_DISTRIBUTION_P12\`: a distribution certificate is made for this run and revoked at its end (optional secret, nothing to do)."
              fi
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The listing's screenshots, drawn from the demo's sample apps in English,
  # Arabic and Turkish (business/test/store/store_screenshots_test.dart).
  screenshots:
    name: Store screenshots
    if: ${{ !inputs.play_check }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: business
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        run: flutter pub get --enforce-lockfile
      - name: Draw the screenshots
        run: YB_SCREENSHOTS_DIR="$RUNNER_TEMP/screenshots" flutter test test/store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 14

  # Google Play signs in without a key file: GitHub's OIDC token is exchanged through the
  # Workload Identity Federation provider for the release service account
  # (google-github-actions/auth writes a credentials file with no secret in it), which
  # fastlane supply uses. Run with "play_check" to try it before the first release.
  play-check:
    name: Google Play sign-in
    needs: prepare
    if: ${{ inputs.play_check }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The two variables
        env:
          WIF_PROVIDER: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_ACCOUNT: ${{ vars.YB_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$PLAY_ACCOUNT" ]; then
            echo "Add the repository variables \`YB_GCP_WORKLOAD_IDENTITY_PROVIDER\` and \`YB_PLAY_SERVICE_ACCOUNT\` (docs/LAUNCH-CHECKLIST.md 7l), then run this check again." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.YB_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - name: Sign in to Google Play and open the app
        working-directory: build
        env:
          CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: bundle exec fastlane android business_play_check json_key:"$CREDENTIALS" summary:"$GITHUB_STEP_SUMMARY"

  android:
    name: Google Play
    needs: [prepare, screenshots]
    # The App Bundle comes first: it is built even when the screenshots couldn't be drawn.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.android == 'yes' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    # Puts the App Bundle on the "Yallapp Business test build" pre-release (below), and
    # signs in to Google Play with GitHub's OIDC token (Workload Identity Federation).
    permissions:
      contents: write
      id-token: write
    env:
      LC_ALL: C.UTF-8
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
      TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (own runners)
        if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        working-directory: business
        run: flutter pub get --enforce-lockfile

      # Pushes: the Firebase project's Android options, as in the Mobile workflow.
      - name: Firebase options
        env:
          YB_FIREBASE_PROJECT_ID: ${{ vars.YB_FIREBASE_PROJECT_ID }}
          YB_FIREBASE_SENDER_ID: ${{ vars.YB_FIREBASE_SENDER_ID }}
          YB_FIREBASE_APP_ID_ANDROID: ${{ vars.YB_FIREBASE_APP_ID_ANDROID }}
          YB_FIREBASE_API_KEY_ANDROID: ${{ vars.YB_FIREBASE_API_KEY_ANDROID }}
        run: |
          python3 build/scripts/business_store.py firebase android "$RUNNER_TEMP/yb-firebase.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # The upload key from the four YB_ANDROID_* secrets. The repository is public: the key
      # is only written to $RUNNER_TEMP, never printed nor attached, and deleted below.
      # On the first run, without those secrets but with YB_SECRETS_TOKEN (a fine-grained
      # token allowed to write this repository's secrets), the key is made here and saved
      # as the four secrets, so nobody ever holds it. Lost later? Play Console can reset
      # an upload key (Play App Signing).
      - id: key
        name: Upload key
        env:
          SECRETS_TOKEN: ${{ secrets.YB_SECRETS_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.YB_ANDROID_UPLOAD_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.YB_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YB_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YB_ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/yb-upload.jks"
          # Pasted values may end with a line break; the alias has no spaces.
          trim_end() { local v="$1"; while [[ "$v" == *$'\n' || "$v" == *$'\r' ]]; do v="${v%?}"; done; printf '%s' "$v"; }
          STORE_PASSWORD=$(trim_end "$STORE_PASSWORD")
          KEY_PASSWORD=$(trim_end "$KEY_PASSWORD")
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          if [ -z "$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')" ] && [ -n "$SECRETS_TOKEN" ]; then
            echo "::add-mask::$SECRETS_TOKEN"
            STORE_PASSWORD=$(openssl rand -hex 24)
            echo "::add-mask::$STORE_PASSWORD"
            KEY_PASSWORD=$STORE_PASSWORD
            KEY_ALIAS=upload
            rm -f "$keystore"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Yallapp Business, O=Yallapp, C=TR" > /dev/null 2>&1
            KEYSTORE_BASE64=$(base64 -w0 "$keystore")
            # Values go to gh on stdin, never on the command line.
            save() { printf '%s' "$2" | GH_TOKEN="$SECRETS_TOKEN" gh secret set "$1" -R "$GITHUB_REPOSITORY" > /dev/null; }
            if ! { save YB_ANDROID_UPLOAD_KEYSTORE "$KEYSTORE_BASE64" &&
                   save YB_ANDROID_KEYSTORE_PASSWORD "$STORE_PASSWORD" &&
                   save YB_ANDROID_KEY_ALIAS "$KEY_ALIAS" &&
                   save YB_ANDROID_KEY_PASSWORD "$KEY_PASSWORD"; }; then
              rm -f "$keystore"
              echo "YB_SECRETS_TOKEN can't save repository secrets: it needs this repository and the permission Secrets: Read and write. Nothing was signed; fix the token and run the workflow again." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "A new upload key was made and saved as the four \`YB_ANDROID_*\` secrets. \`YB_SECRETS_TOKEN\` isn't needed any more: delete it (Settings › Secrets and variables › Actions) and the token itself on GitHub." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')" ] || [ -z "$STORE_PASSWORD" ]; then
            {
              echo "### Google Play: no upload key"
              echo
              echo "The App Bundle is signed with Yallapp Business's upload key. Either add \`YB_SECRETS_TOKEN\` (a fine-grained token for this repository with Secrets: Read and write; the next run makes the key and saves it, docs/LAUNCH-CHECKLIST.md 7l) or add these repository secrets (Settings › Secrets and variables › Actions), then run the workflow again:"
              echo
              echo "- \`YB_ANDROID_UPLOAD_KEYSTORE\`: the PKCS12 keystore file in base64 (line breaks are fine)"
              echo "- \`YB_ANDROID_KEYSTORE_PASSWORD\`: its password"
              echo "- \`YB_ANDROID_KEY_ALIAS\`: \`upload\`"
              echo "- \`YB_ANDROID_KEY_PASSWORD\`: the key's password (the same as the keystore's)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No upload key: add the YB_ANDROID_* secrets (see the run's summary)."
            exit 1
          fi
          KEY_ALIAS=${KEY_ALIAS:-upload}
          KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          # base64 with or without line breaks and spaces.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore" 2>/dev/null || true
          if ! keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "The upload key can't be opened: YB_ANDROID_UPLOAD_KEYSTORE must be the keystore file in base64, with the YB_ANDROID_KEYSTORE_PASSWORD and YB_ANDROID_KEY_ALIAS (upload) that go with it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The upload certificate's SHA-256 fingerprint is public (Play Console shows it).
          sha256=$(keytool -exportcert -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | python3 build/scripts/fingerprint.py || true)
          echo "Upload certificate SHA-256: \`${sha256:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > business/android/key.properties

      - id: build
        name: Build the App Bundle
        working-directory: business
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define-from-file="$RUNNER_TEMP/yb-firebase.json"
          mkdir -p "$RUNNER_TEMP/out"
          mv build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/yallapp-business-$VERSION-$BUILD.aab"

      - name: Remove the upload key from the runner
        if: always()
        run: rm -f business/android/key.properties "$RUNNER_TEMP/yb-upload.jks"

      - name: Attach the App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-business-aab
          path: ${{ runner.temp }}/out/*.aab
          if-no-files-found: error
          retention-days: 30

      # The same App Bundle on the pre-release of the Mobile workflow's test APKs, with a
      # plain link, for the first upload by hand in Play Console (and whenever the upload
      # below can't run). Replaced by every run.
      - name: Publish the App Bundle on the "Yallapp Business test build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=yallapp-business-test
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --prerelease --target main \
              --title "Yallapp Business test build" \
              --notes "Debug-signed APKs to try on a phone, replaced by every build (they can't go to Google Play). yallapp-business.apk works against yallapp.com.tr; yallapp-business-demo.apk runs on sample data (owner@example.com / yallapp-demo). yallapp-business.aab is the release App Bundle signed with the upload key, from the Yallapp Business release workflow, for Google Play."
          fi
          cp "$RUNNER_TEMP"/out/*.aab "$RUNNER_TEMP/yallapp-business.aab"
          gh release upload "$tag" "$RUNNER_TEMP/yallapp-business.aab" -R "$GITHUB_REPOSITORY" --clobber
          echo "- App Bundle $VERSION (build $BUILD): **yallapp-business.aab** on the [Yallapp Business test build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) pre-release." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/screenshots

      - name: Store listing, icon, feature graphic and screenshots
        run: python3 build/scripts/business_store.py play "$RUNNER_TEMP/play-metadata" "$RUNNER_TEMP/screenshots"

      # No key file: GitHub's OIDC token through Workload Identity Federation (play-check above).
      - id: auth
        if: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.YB_PLAY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.YB_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.YB_PLAY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: false

      - id: play
        name: Upload to Google Play
        env:
          CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          if [ -z "$CREDENTIALS" ]; then
            echo "uploaded=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd build
          bundle exec fastlane android business_play \
            aab:"$(ls "$RUNNER_TEMP"/out/*.aab)" track:"$TRACK" \
            json_key:"$CREDENTIALS" metadata:"$RUNNER_TEMP/play-metadata"
          echo "uploaded=yes" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          KEY_OUTCOME: ${{ steps.key.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOADED: ${{ steps.play.outputs.uploaded }}
          PLAY_OUTCOME: ${{ steps.play.outcome }}
        run: |
          {
            echo "### Google Play"
            echo
            if [ "$KEY_OUTCOME" != success ]; then
              echo "- **No App Bundle**: the upload key is missing or can't be opened (above)."
            elif [ "$BUILD_OUTCOME" != success ]; then
              echo "- **The App Bundle couldn't be built.** The log of \"Build the App Bundle\" says why."
            elif [ "$UPLOADED" = yes ]; then
              echo "- Version $VERSION (build $BUILD) is on the **$TRACK** track with the store listing, icon, feature graphic and screenshots in English, Arabic and Turkish."
              echo "- To publish: Play Console › Yallapp Business › Test and release › promote the release to Production."
            elif [ "$PLAY_OUTCOME" = failure ]; then
              echo "- **The upload to Google Play didn't work.** The App Bundle is on the \"Yallapp Business test build\" pre-release as **yallapp-business.aab** and attached below. Usual reasons: the app's first App Bundle wasn't uploaded by hand yet (Play Console › Yallapp Business › Test and release › Testing › Internal testing › Create new release, with **yallapp-business.aab**), the Google Play sign-in doesn't work (run the workflow with **play_check**), the service account isn't invited in Play Console › Users and permissions with Release rights, or this App Bundle isn't signed with the app's upload key. The log of \"Upload to Google Play\" says which."
            else
              echo "- The App Bundle is on the \"Yallapp Business test build\" pre-release as **yallapp-business.aab** (and attached below). The first one goes by hand: Play Console › Yallapp Business › Test and release › Testing › Internal testing › Create new release. Add the variables \`YB_GCP_WORKLOAD_IDENTITY_PROVIDER\` and \`YB_PLAY_SERVICE_ACCOUNT\` (Workload Identity Federation, docs/LAUNCH-CHECKLIST.md 7l) to upload the next ones by themselves."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: App Store
    needs: [prepare, screenshots]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.ios == 'yes' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Apple takes uploads built with the iOS 26 SDK, and packages such as
      # device_info_plus 13 need it: use the newest Xcode 26 on the runner.
      - name: Use Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -Eiv 'beta|release_candidate' | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no Xcode 26."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.0.0
      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Install packages
        working-directory: business
        run: flutter pub get --enforce-lockfile

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.YB_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.YB_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.YB_ASC_PRIVATE_KEY }}
        run: |
          umask 077
          python3 - "$RUNNER_TEMP/yb-asc.json" <<'PY'
          import json, os, sys
          json.dump({"app_store_connect": {
              "key_id": os.environ["ASC_KEY_ID"].strip(),
              "issuer_id": os.environ["ASC_ISSUER_ID"].strip(),
              "private_key": os.environ["ASC_PRIVATE_KEY"],
          }}, open(sys.argv[1], "w"))
          PY
          if ! python3 build/scripts/p8_key.py "$RUNNER_TEMP/yb-asc.json"; then
            echo "The App Store Connect key in YB_ASC_PRIVATE_KEY can't be read. Paste the whole content of the .p8 file from App Store Connect › Users and Access › Integrations, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Firebase options
        env:
          YB_FIREBASE_PROJECT_ID: ${{ vars.YB_FIREBASE_PROJECT_ID }}
          YB_FIREBASE_SENDER_ID: ${{ vars.YB_FIREBASE_SENDER_ID }}
          YB_FIREBASE_APP_ID_IOS: ${{ vars.YB_FIREBASE_APP_ID_IOS }}
          YB_FIREBASE_API_KEY_IOS: ${{ vars.YB_FIREBASE_API_KEY_IOS }}
        run: |
          python3 build/scripts/business_store.py firebase ios "$RUNNER_TEMP/yb-firebase.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # The iOS project's settings with the version, build number and Firebase options;
      # signing happens in fastlane, as for the clients' apps (build/scripts/ios.sh).
      - name: Prepare the iOS project
        working-directory: business
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-name="$VERSION" --build-number="$BUILD" \
            --dart-define-from-file="$RUNNER_TEMP/yb-firebase.json"

      - name: Sign and export the IPA
        working-directory: build
        env:
          YB_IOS_DISTRIBUTION_P12: ${{ secrets.YB_IOS_DISTRIBUTION_P12 }}
          YB_IOS_DISTRIBUTION_PASSWORD: ${{ secrets.YB_IOS_DISTRIBUTION_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"
          bundle exec fastlane ios business_ipa \
            asc:"$RUNNER_TEMP/yb-asc.json" business:"$GITHUB_WORKSPACE/business" \
            out:"$RUNNER_TEMP/ipa" status:"$RUNNER_TEMP/yb-ios-status.txt" cert_out:"$RUNNER_TEMP/yb-cert-id.txt"
          mv "$RUNNER_TEMP/ipa/YallappBusiness.ipa" "$RUNNER_TEMP/ipa/yallapp-business-$VERSION-$BUILD.ipa"
          rm -f "$RUNNER_TEMP"/ipa/*.mobileprovision "$RUNNER_TEMP"/ipa/*.cer "$RUNNER_TEMP"/ipa/*.p12

      - name: Attach the IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yallapp-business-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        working-directory: build
        run: |
          bundle exec fastlane ios business_testflight \
            asc:"$RUNNER_TEMP/yb-asc.json" ipa:"$RUNNER_TEMP/ipa/yallapp-business-$VERSION-$BUILD.ipa"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/screenshots

      - name: App Store listing
        env:
          YB_APP_REVIEW_FIRST_NAME: ${{ vars.YB_APP_REVIEW_FIRST_NAME }}
          YB_APP_REVIEW_LAST_NAME: ${{ vars.YB_APP_REVIEW_LAST_NAME }}
          YB_APP_REVIEW_PHONE: ${{ vars.YB_APP_REVIEW_PHONE }}
          YB_APP_REVIEW_EMAIL: ${{ vars.YB_APP_REVIEW_EMAIL }}
          YB_APP_REVIEW_DEMO_USER: ${{ secrets.YB_APP_REVIEW_DEMO_USER }}
          YB_APP_REVIEW_DEMO_PASSWORD: ${{ secrets.YB_APP_REVIEW_DEMO_PASSWORD }}
        run: |
          python3 build/scripts/business_store.py appstore "$RUNNER_TEMP/asc-store" "$RUNNER_TEMP/screenshots"
          cd build
          bundle exec fastlane ios business_appstore \
            asc:"$RUNNER_TEMP/yb-asc.json" store:"$RUNNER_TEMP/asc-store" version:"$VERSION" build:"$BUILD"

      # The certificate made for this run (none with YB_IOS_DISTRIBUTION_P12), also when
      # the run stopped halfway; then the secrets' files.
      - name: Revoke this run's certificate
        if: always()
        working-directory: build
        run: |
          if [ -s "$RUNNER_TEMP/yb-cert-id.txt" ] && [ -f "$RUNNER_TEMP/yb-asc.json" ]; then
            bundle exec fastlane ios business_revoke asc:"$RUNNER_TEMP/yb-asc.json" cert_file:"$RUNNER_TEMP/yb-cert-id.txt"
          fi
      - name: Remove the keys from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/yb-asc.json" "$RUNNER_TEMP/asc-store/review.json" "$RUNNER_TEMP/yb-cert-id.txt"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          status=$(cat "$RUNNER_TEMP/yb-ios-status.txt" 2>/dev/null || true)
          {
            echo "### App Store"
            echo
            case "$status" in
              no_app)
                echo "- **The app doesn't exist in App Store Connect yet.** The App ID \`tr.com.yallapp.business\` is registered now: in App Store Connect › Apps › + › New App choose iOS, the name Yallapp Business, a primary language (English (U.S.)), the bundle ID **tr.com.yallapp.business** and the SKU \`yallapp-business\`, then run this workflow again." ;;
              certificate_limit)
                echo "- **Apple's limit of distribution certificates is reached.** In developer.apple.com › Certificates, revoke a Distribution certificate nobody uses, then run this workflow again." ;;
              *)
                if [ "$OUTCOME" = success ]; then
                  echo "- Version $VERSION (build $BUILD) is in TestFlight, with the listing, screenshots (iPhone and iPad) and age rating in English, Arabic and Turkish, and chosen for the version."
                  echo "- To publish: App Store Connect › Yallapp Business › the version › Add for Review, then Submit to App Review."
                else
                  echo "- **The iOS app didn't go through.** The failed step's log says why. When the IPA was made it is attached below (**yallapp-business-ipa**)."
                fi ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
