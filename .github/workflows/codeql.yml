name: Code scanning

# 79.4 CodeQL on the platform's TypeScript and the workflows themselves (not the generated
# app preview), on every
# pull request, on main, and weekly (new queries find old code). Findings show in
# Security › Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - '**/vendor/**'
              - platform/web/tests/**
              - wp-plugin/yallapp/tests/**
              # The app preview: generated by Flutter from mobile/ (minified dart2js, CanvasKit),
              # not hand-written; its Dart source is checked by the Mobile workflow.
              - platform/web/public/preview-app/**
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: List results (temporary)
        if: always()
        run: jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text | .[0:120])"' sarif-results/*.sarif | grep -v '^$' | head -200
