# 231 community.yallapp.com.tr (Yallapp Community) through host.webek.org, as
# yallapp.com.tr is (apache-proxy.conf): visitors reach this server, which fetches
# every page from Netlify. Netlify sees its own host, so this server names the
# visitor's host in X-Yallapp-Host; the platform believes it only with the shared
# secret (src/proxy.ts) and serves the community's pages (src/app/community/).
# See README.md › "community.yallapp.com.tr through host.webek.org".
#
# Install as /etc/apache2/conf.d/userdata/ssl/2_4/CPANEL_USER/community.yallapp.com.tr/community-proxy.conf
# Replace TRUSTED_PROXY_SECRET_VALUE with the value of TRUSTED_PROXY_SECRET in Netlify
# (the same value as in yallapp-proxy.conf).

ProxyRequests Off
ProxyPreserveHost Off
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
SSLProxyCheckPeerExpire On
SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt

# AutoSSL renews this domain's certificate through /.well-known on this server.
ProxyPass /.well-known/ !

ProxyPass / https://yallapp.netlify.app/ timeout=120 keepalive=On
ProxyPassReverse / https://yallapp.netlify.app/

# The host the visitor asked for, the visitor's real IP and the shared secret.
# "set" replaces anything a visitor sends in these headers.
RequestHeader set X-Yallapp-Host "community.yallapp.com.tr"
RequestHeader set X-Yallapp-Client-Ip "%{REMOTE_ADDR}s"
RequestHeader set X-Yallapp-Proxy-Secret "TRUSTED_PROXY_SECRET_VALUE"
RequestHeader set X-Forwarded-Proto "https"

# The visitor's country (see apache-proxy.conf); without the module, none is sent.
RequestHeader unset X-Yallapp-Client-Country
<IfModule mod_maxminddb.c>
  MaxMindDBEnable On
  MaxMindDBFile COUNTRY_DB /usr/share/GeoIP/GeoLite2-Country.mmdb
  MaxMindDBEnv MM_COUNTRY_CODE COUNTRY_DB/country/iso_code
  RequestHeader set X-Yallapp-Client-Country "%{MM_COUNTRY_CODE}e" env=MM_COUNTRY_CODE
</IfModule>

# Netlify functions accept request bodies up to 6 MB (README.md › "Limits to know").
LimitRequestBody 7340032
