# http://yallapp.com.tr → https://yallapp.com.tr, except AutoSSL's checks.
# 67 http://www.yallapp.com.tr goes straight to https://yallapp.com.tr (one 301,
# no second hop through https://www).
# Install as /etc/apache2/conf.d/userdata/std/2_4/CPANEL_USER/yallapp.com.tr/yallapp-https.conf
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteCond %{HTTP_HOST} ^www\.yallapp\.com\.tr(:80)?$ [NC]
RewriteRule ^ https://yallapp.com.tr%{REQUEST_URI} [R=301,L]
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
