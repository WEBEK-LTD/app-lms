# yallapp.com.tr through host.webek.org: visitors reach this server, which fetches
# every page from Netlify. Netlify's addresses never reach the visitor, so the site
# works where netlify.app is blocked. See README.md › "yallapp.com.tr through host.webek.org".
#
# Install as /etc/apache2/conf.d/userdata/ssl/2_4/CPANEL_USER/yallapp.com.tr/yallapp-proxy.conf
# Replace TRUSTED_PROXY_SECRET_VALUE with the value of TRUSTED_PROXY_SECRET in Netlify.

ProxyRequests Off
ProxyPreserveHost Off
SSLProxyEngine On
SSLProxyVerify require
SSLProxyCheckPeerName On
SSLProxyCheckPeerExpire On
SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt

# 46 The link files phones read (App Links, Universal Links) come from the platform;
# the first matching ProxyPass wins, so these stay above the line after them.
ProxyPass /.well-known/assetlinks.json https://yallapp.netlify.app/.well-known/assetlinks.json timeout=30
ProxyPass /.well-known/apple-app-site-association https://yallapp.netlify.app/.well-known/apple-app-site-association timeout=30

# AutoSSL renews this domain's certificate through /.well-known on this server.
ProxyPass /.well-known/ !

ProxyPass / https://yallapp.netlify.app/ timeout=120 keepalive=On
ProxyPassReverse / https://yallapp.netlify.app/

# The visitor's real IP, trusted by the platform only with the shared secret.
# "set" replaces anything a visitor sends in these headers.
RequestHeader set X-Yallapp-Client-Ip "%{REMOTE_ADDR}s"
RequestHeader set X-Yallapp-Proxy-Secret "TRUSTED_PROXY_SECRET_VALUE"
RequestHeader set X-Forwarded-Proto "https"

# Plugin release uploads go up to 6 MB.
LimitRequestBody 7340032
