name: yallapp_business
description: "Yallapp Business: the app for the people who run an app on Yallapp."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 59 The new-order chime of Kitchen mode.
  audioplayers: 6.7.1
  device_info_plus: 13.2.0
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  # 59 Pictures and videos for Media, from the camera or the gallery.
  image_picker: 1.2.3
  intl: ^0.20.2
  # 59 Unlock with fingerprint or face.
  local_auth: 3.0.2
  material_symbols_icons: ^4.2960.0
  # 59 The ticket scanner.
  mobile_scanner: 7.4.2
  package_info_plus: 10.2.1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  webview_flutter: ^4.14.1
  webview_flutter_android: 4.14.1
  webview_flutter_wkwebview: 3.26.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Interface strings: lib/l10n/app_*.arb (English is the template).
  generate: true

  assets:
    - assets/sounds/

  fonts:
    # From github.com/google/fonts (SIL OFL 1.1, licence files next to each
    # font). Bundled so the app never downloads fonts at runtime.
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/bricolagegrotesque/BricolageGrotesque-Variable.ttf
    # Arabic letters (docs/BRAND.md): the theme's fallback after Bricolage
    # Grotesque, which has Latin only, so Latin words stay in Bricolage.
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/ibmplexsansarabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibmplexsansarabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf
          weight: 700

# Transitive packages held back to releases that are at least two weeks old
# (project rule). Remove an entry once its newer release has aged.
dependency_overrides:
  file_selector_macos: 0.9.5+1
  image_picker_ios: 0.8.13+9
  image_picker_platform_interface: 2.11.1
  jni: 1.0.3
  jni_flutter: 1.0.3
  local_auth_android: 2.2.0
  local_auth_darwin: 2.0.4
  shared_preferences_android: 2.4.28
  synchronized: 3.4.2
  vm_service: 15.3.0
