# Two runners on one server. Each runs one job at a time; add or remove
# services to match the server (about 2 CPU cores and 4 GB of memory each).
x-runner: &runner
  build: .
  image: yallapp-runner
  restart: unless-stopped
  env_file: .env
  shm_size: 2gb
  init: true

services:
  runner-1:
    <<: *runner
    hostname: yallapp-runner-1
    volumes:
      - runner-1-home:/home/runner
      - runner-1-tools:/opt/hostedtoolcache
  runner-2:
    <<: *runner
    hostname: yallapp-runner-2
    volumes:
      - runner-2-home:/home/runner
      - runner-2-tools:/opt/hostedtoolcache

volumes:
  runner-1-home:
  runner-1-tools:
  runner-2-home:
  runner-2-tools:
