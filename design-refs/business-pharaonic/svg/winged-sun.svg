    <mask id="feathers" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="64">
      <rect width="240" height="64" fill="#000"/>
      <g id="w" fill="#fff">
        <path d="M134 21C166 12 202 7 238 9C206 16 170 22 134 29Z"/>
        <path d="M134 31C167 24 199 20 229 20C201 27 169 33 134 39Z"/>
